# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-connection-callback
title: "Craft exact fictional native callback conditions and target"
requires: enterprise
strict: true
locale: en
viewport: [ 1440, 900 ]
overlays:
  - edition-enterprise
steps:
  - goto: "/app"
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-mcp-admin--demo-user-craft.yaml
      overlays:
        - edition-enterprise
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = (await (await fetch('/api/__mockshop/state')).json()).overlays;
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
    id: eval-script
  - goto: "/craft/v1/apps"
    id: goto-craft-v1-apps
  - wait: { "placeholder": "Search apps..." }
    id: wait
  - fill: { "placeholder": "Search apps...", "value": "Campus GitHub (fictional receipt)" }
    id: fill
  - click: { "role": "button", "name": "Disconnect", "exact": true }
    id: click-disconnect
  - wait: { "role": "button", "name": "Connect", "exact": true }
    id: wait-connect
  - goto: /craft/v1/apps/oauth/callback?error=access_denied
    id: goto-craft-v1-apps-oauth-callback-error-access-denied
  - wait: { text: Connecting your app, exact: true }
    id: wait-connecting-your-app
  - wait: { "text": "OAuth was cancelled or denied: access_denied", "exact": true }
    id: wait-oauth-was-cancelled-or-denied-access-denied
  - shot: craft-native-callback-error
    id: shot-craft-native-callback-error
  - goto: /craft/v1/apps/oauth/callback
    id: goto-craft-v1-apps-oauth-callback
  - wait: { "text": "Missing code or state in callback URL.", "exact": true }
    id: wait-missing-code-or-state-in-callback-url
  - shot: craft-native-callback-missing-params
    id: shot-craft-native-callback-missing-params
  - goto: /craft/v1/apps/oauth/callback?code=mockshop-craft-only&state=7002
    id: goto-craft-v1-apps-oauth-callback-code-mockshop-craft-only-state
  - wait: { text: Exchanging authorization code…, exact: true }
    id: wait-exchanging-authorization-code
  - shot: craft-native-callback-exchanging
    id: shot-craft-native-callback-exchanging
  - wait: { placeholder: Search apps... }
    id: wait-2
  - shot: craft-native-callback-target
    id: shot-craft-native-callback-target
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
    id: eval-script-2
  - goto: "/craft/v1/apps"
    id: goto-craft-v1-apps-2
  - wait: { "text": "Clinic Learning API", "exact": true }
    id: wait-clinic-learning-api
  - fill: { "placeholder": "Search apps...", "value": "Campus GitHub (fictional receipt)" }
    id: fill-2
  - wait: { "role": "button", "name": "Disconnect", "exact": true }
    id: wait-disconnect
  - shot: "craft-unit-connection-callback-reset"
    id: shot-craft-unit-connection-callback-reset
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-mcp-admin.yaml
    - ../../../worlds/onyx-overrides/demo-user-craft.yaml
