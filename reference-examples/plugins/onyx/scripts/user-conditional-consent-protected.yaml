# #34 EDITONLY prepared native unit; no execution/acceptance claim. CE/other locales unverified.
# Fictional LOCAL inputs only. Every run independently resets the same sole Auth owner.
name: user-conditional-consent-protected
title: User Conditional Consent Protected
requires: enterprise
strict: true
locale: en
viewport:
  - 1440
  - 900
overlays:
  - edition-enterprise
known_errors:
  - match: /^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
steps:
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
    id: eval-script
  - eval: (async () => { const r=await fetch('/api/mockshop/auth-anonymous/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'logged-out'})}); if(!r.ok) throw new Error('Sole Auth logged-out staging failed'); })()
    id: eval-script-2
  - goto: /oauth-provider/authorize?request=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    id: goto-oauth-provider-authorize-request-bbbbbbbbbbbbbbbbbbbbbbbbbb
  - wait:
      testid: email
    id: wait
  - eval: if (location.pathname !== '/auth/login' || new URL(location.href).searchParams.get('next') !== '/oauth-provider/authorize?request=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB') throw new Error('Native protected consent did not preserve login return');
    id: eval-script-3
  - shot:
      name: conditional-consent-protected-login
      delay: 0
    id: shot-conditional-consent-protected-login
  - goto: /oauth-provider/authorize
    id: goto-oauth-provider-authorize
  - wait: { testid: email }
    id: wait-2
  - eval: |
      if (location.pathname !== '/auth/login' || new URL(location.href).searchParams.has('next')) throw new Error('Native missing-request notFound did not follow source login fallback');
    id: eval-script-4
  - shot: { name: conditional-consent-missing-request-source-login, delay: 0 }
    id: shot-conditional-consent-missing-request-source-login
  - goto: /oauth-provider/authorize?request=short
    id: goto-oauth-provider-authorize-request-short
  - wait: { testid: email }
    id: wait-3
  - eval: |
      if (location.pathname !== '/auth/login' || new URL(location.href).searchParams.has('next')) throw new Error('Native invalid-request notFound did not follow source login fallback');
    id: eval-script-5
  - shot: { name: conditional-consent-invalid-request-source-login, delay: 0 }
    id: shot-conditional-consent-invalid-request-source-login
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.consents).length === 0)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-6
  - id: eval-script-7-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
    id: eval-script-7
  - goto: /oauth-provider/authorize?request=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    id: goto-oauth-provider-authorize-request-bbbbbbbbbbbbbbbbbbbbbbbbbb-2
  - wait:
      text: Allow access
      exact: true
    id: wait-allow-access
  - shot:
      name: conditional-consent-protected-reset
      delay: 0
    id: shot-conditional-consent-protected-reset
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-user-conditional.yaml
