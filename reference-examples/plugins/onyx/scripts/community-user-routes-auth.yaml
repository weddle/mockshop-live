    id: wait-6
  - eval: (async()=>{const b=await (await fetch('/api/mockshop/auth-anonymous/messages')).json(); if(!b.simulated||!b.reset_complete||!b.messages.some(m=>m.kind==='reset')) throw new Error('Native Community Forgot/Reset did not persist the sole fake mailbox/result');})()
    id: eval-script-4
  - shot:
      name: ce-auth-reset-native-success-login
      full_page: true
    id: shot-ce-auth-reset-native-success-login
  - goto: /auth/signup?email=robin.guest%40workshop.example
    id: goto-auth-signup-email-robin-guest-40workshop-example
  - wait:
      testid: email
    id: wait-7
  - fill:
      testid: password
      value: MockOnly-Workshop1!
    id: fill-2
  - click:
      role: button
      name: Create Account
      exact: true
    id: click-create-account
  - wait:
