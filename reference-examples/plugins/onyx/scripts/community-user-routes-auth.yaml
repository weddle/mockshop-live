    id: wait-a-new-verification-email-has-been-sent
  - shot:
      name: ce-auth-waiting-native-resend
      full_page: true
    id: shot-ce-auth-waiting-native-resend
  - goto: /auth/verify-email
    id: goto-auth-verify-email
  - wait:
      text: Missing verification token. Try requesting a new verification email.
    id: wait-missing-verification-token-try-requesting-a-new-verificatio
  - shot:
      name: ce-auth-verify-direct-token-guard
      full_page: true
    id: shot-ce-auth-verify-direct-token-guard
  - eval: location.assign('/api/mockshop/auth-anonymous/email-link/verify')
    id: eval-script-5
  - wait:
      text: Your email has been verified! Please sign in to continue.
    id: wait-your-email-has-been-verified-please-sign-in-to-continue
  - eval: (async()=>{const b=await (await fetch('/api/mockshop/auth-anonymous/messages')).json(); if(!b.verified||b.mode!=='logged-out'||(await fetch('/api/me')).status!==401) throw new Error('Native fake verification did not persist/clear unverified session');})()
    id: eval-script-6
  - shot:
      name: ce-auth-verify-native-success-login
      full_page: true
    id: shot-ce-auth-verify-native-success-login
  - fill:
      testid: email
      value: "{{people.alex-learner.email}}"
    id: fill-3
  - fill:
      testid: password
      value: MockOnly-Workshop1!
    id: fill-4
  - click:
      role: button
      name: Sign In
      exact: true
    id: click-sign-in-2
  - wait:
      selector: '#onyx-chat-input-textbox'
    id: wait-onyx-chat-input-textbox
  - eval: (async()=>{const m=await (await fetch('/api/me')).json(); if(m.email!=='{{people.alex-learner.email}}'||!m.is_verified||m.role!=='basic') throw new Error('Native Community sign-in did not enter sole fake member');})()
    id: eval-script-7
  - shot:
      name: ce-auth-login-native-member-return
      full_page: true
    id: shot-ce-auth-login-native-member-return
  - goto: /auth/login
    id: goto-auth-login-3
  - wait:
      selector: '#onyx-chat-input-textbox'
    id: wait-onyx-chat-input-textbox-2
  - eval: if(location.pathname!=="/app") throw new Error('Native route/guard reached the wrong canonical URL');
    id: eval-script-8
  - shot:
      name: ce-auth-login-verified-member-guard
      full_page: true
    id: shot-ce-auth-login-verified-member-guard
  - state:
      world: ../../../worlds/snapshots/seaside--demo-auth-anonymous--demo-community-user-route-shell.yaml
    id: state
  - goto: /auth/login
