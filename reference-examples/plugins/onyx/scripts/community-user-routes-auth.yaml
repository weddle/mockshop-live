      exact: false
    id: wait-it-looks-like-you-haven-t-verified-your-email-yet
  - shot:
      name: ce-auth-signup-native-unverified-return
      full_page: true
    id: shot-ce-auth-signup-native-unverified-return
  - goto: /auth/waiting-on-verification
    id: goto-auth-waiting-on-verification
  - wait:
      role: button
      name: here
      exact: true
    id: wait-here
  - shot:
      name: ce-auth-waiting-direct-unverified
      full_page: true
    id: shot-ce-auth-waiting-direct-unverified
  - click:
      role: button
      name: here
      exact: true
    id: click-here
  - wait:
