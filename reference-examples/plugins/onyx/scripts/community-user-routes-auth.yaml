  - eval: '(async()=>{const r=await fetch(''/api/mockshop/auth-anonymous/stage'',{method:''POST'',headers:{''Content-Type'':''application/json''},body:JSON.stringify({"mode": "logged-out"})}); if(!r.ok) throw new Error(''Existing sole fake Auth stage failed'');const me=await fetch(''/api/me''); if(me.status!==401||document.cookie.includes(''fastapiusersauth='')) throw new Error(''Required fake logged-out cookie/401 boundary missing'');})()'
