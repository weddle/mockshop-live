      full_page: true
    id: shot-ce-auth-forgot-native-link
  - goto: /auth/forgot-password
    id: goto-auth-forgot-password
  - wait:
      selector: input[name="email"]
    id: wait-input-name-email
  - fill:
      selector: input[name="email"]
      value: "{{people.alex-learner.email}}"
    id: fill-input-name-email
  - click:
      role: button
      name: Reset Password
      exact: true
    id: click-reset-password
  - wait:
      text: Password reset email sent. Please check your inbox.
    id: wait-password-reset-email-sent-please-check-your-inbox
  - shot:
      name: ce-auth-forgot-native-fake-mailbox-issued
      full_page: true
    id: shot-ce-auth-forgot-native-fake-mailbox-issued
  - goto: /auth/reset-password
    id: goto-auth-reset-password
  - wait:
      selector: input[name="password"]
    id: wait-input-name-password
  - shot:
      name: ce-auth-reset-direct-native-form
      full_page: true
    id: shot-ce-auth-reset-direct-native-form
  - click:
      role: button
      name: Reset Password
      exact: true
    id: click-reset-password-2
  - wait:
      text: Password is required
      exact: true
    id: wait-password-is-required
  - wait:
      text: Confirm Password is required
      exact: true
    id: wait-confirm-password-is-required
  - shot:
      name: ce-auth-reset-native-required-guard
      full_page: true
    id: shot-ce-auth-reset-native-required-guard
  - eval: location.assign('/api/mockshop/auth-anonymous/email-link/reset')
    id: eval-script-3
  - wait:
      selector: input[name="password"]
    id: wait-input-name-password-2
  - fill:
      selector: input[name="password"]
      value: MockOnly-Workshop1!
    id: fill-input-name-password
  - fill:
      selector: input[name="confirmPassword"]
      value: MockOnly-Workshop1!
    id: fill-input-name-confirmpassword
  - click:
      role: button
      name: Reset Password
      exact: true
    id: click-reset-password-3
  - wait:
