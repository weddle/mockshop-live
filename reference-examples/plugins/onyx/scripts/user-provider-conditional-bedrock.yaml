# EDITONLY prepared; unexecuted/unaccepted. Fictional local inputs only.
# Existing #33 first-run/name prerequisite and sole #3 provider store; no real provider calls.
# Saved-form edit is NOT available in onboarding: connected card navigates /admin/language-models.
# Cancel reopens a pristine NEW form; saved conditional ADMIN edit remains separate/unverified.
# BedrockModal96–119 clears inactive auth fields and gates model refetch on complete method data.
# IAM notice and Long-term API Key are the conditional alternatives to accepted default Access Key.
# Source Yup303–309 requires REGION only, not credential strings: do not invent a missing-key Save guard.
# Re-picking committed region clears it (native select has no defaultOption), making canceled draft invalid.
# Final native save uses long_term_api_key/us-west-2; sole owner redacts bearer value, inactive keys absent.
