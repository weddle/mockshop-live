# #34 EDITONLY prepared native unit; no execution/acceptance claim. CE/other locales unverified.
# Fictional LOCAL inputs only. Every run independently resets the same sole Auth owner.
name: user-conditional-password
title: User Conditional Password
requires: enterprise
strict: true
locale: en
viewport:
  - 1440
  - 900
overlays:
  - edition-enterprise
known_errors:
  - match: /^http 400 POST http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/password\/change-password$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/password\/change-password\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
  - match: '/^console: \[Toast\] LOCAL FAKE DEMO — fictional password change rejected; demo state unchanged\. \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/_next\/static\/chunks\/[A-Za-z0-9_.-]+\.js\]$/'
    reason: Exact required staged native Toast only; visible same message and protected finite state asserted. Parent must anchor observed compiled source URL before acceptance.
steps:
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
    id: eval-script
  - goto: /app/settings/general
    id: goto-app-settings-general
  - click:
      selector: a[href="/app/settings/accounts-access"]
    id: click-a-href-app-settings-accounts-access
  - wait:
      text: Change Password
      exact: true
    id: wait-change-password
  - shot:
      name: conditional-password-native-entry
      delay: 0
    id: shot-conditional-password-native-entry
  - click:
      role: button
      name: Change Password
      exact: true
    id: click-change-password
  - wait:
      selector: input[name="currentPassword"]
    id: wait-input-name-currentpassword
  - eval: if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native untouched password submit was not disabled');
    id: eval-script-2
  - shot:
      name: conditional-password-empty-disabled
      delay: 0
    id: shot-conditional-password-empty-disabled
  - click: { selector: 'input[name="currentPassword"]' }
    id: click-input-name-currentpassword
  - press: Tab
    id: press-tab
  - click: { selector: 'input[name="newPassword"]' }
    id: click-input-name-newpassword
  - press: Tab
    id: press-tab-2
  - click: { selector: 'input[name="confirmPassword"]' }
    id: click-input-name-confirmpassword
  - press: Tab
    id: press-tab-3
  - eval: |
      if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native required-field submit guard missing');
    id: eval-script-3
  - shot: { name: conditional-password-required-fields, delay: 0 }
    id: shot-conditional-password-required-fields
  - click:
      selector: '[role="dialog"] button[aria-label="Close"]'
    id: click-role-dialog-button-aria-label-close
  - wait_gone:
      role: dialog
    id: wait-gone
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(!r.passwordChanged)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-4
  - shot:
      name: conditional-password-cancel-protected
      delay: 0
    id: shot-conditional-password-cancel-protected
  - click:
      role: button
      name: Change Password
      exact: true
    id: click-change-password-2
  - fill:
      selector: input[name="currentPassword"]
      value: MockOnly-Rejected-Password
    id: fill-input-name-currentpassword
  - fill:
      selector: input[name="newPassword"]
      value: short
    id: fill-input-name-newpassword
  - fill:
      selector: input[name="confirmPassword"]
      value: short
    id: fill-input-name-confirmpassword
  - press: Tab
    id: press-tab-4
  - eval: if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native minimum-length validation did not disable submit');
    id: eval-script-5
  - shot:
      name: conditional-password-minimum-validation
      delay: 0
    id: shot-conditional-password-minimum-validation
  - fill:
      selector: input[name="newPassword"]
      value: MockOnly-Workshop2!
    id: fill-input-name-newpassword-2
  - fill:
      selector: input[name="confirmPassword"]
      value: MockOnly-Mismatch2!
    id: fill-input-name-confirmpassword-2
  - press: Tab
    id: press-tab-5
  - eval: if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native mismatch validation did not disable submit');
    id: eval-script-6
  - shot:
      name: conditional-password-mismatch
      delay: 0
    id: shot-conditional-password-mismatch
  - fill:
      selector: input[name="confirmPassword"]
      value: MockOnly-Workshop2!
    id: fill-input-name-confirmpassword-3
  - click:
      role: button
      name: Update
      exact: true
    id: click-update
  - wait:
      text: Updating...
      exact: true
    id: wait-updating
  - shot:
      name: conditional-password-rejected-pending
      delay: 0
    id: shot-conditional-password-rejected-pending
  - wait:
      text: LOCAL FAKE DEMO — fictional password change rejected; demo state unchanged.
      exact: true
    id: wait-local-fake-demo-fictional-password-change-rejected-demo-sta
  - wait:
      selector: input[name="currentPassword"]
    id: wait-input-name-currentpassword-2
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(!r.passwordChanged)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-7
  - shot:
      name: conditional-password-error-protected
      delay: 0
    id: shot-conditional-password-error-protected
  - fill:
      selector: input[name="currentPassword"]
      value: MockOnly-Workshop1!
    id: fill-input-name-currentpassword-2
  - click:
      role: button
      name: Update
      exact: true
    id: click-update-2
  - wait:
      text: Updating...
      exact: true
    id: wait-updating-2
  - shot:
      name: conditional-password-pending
      delay: 0
    id: shot-conditional-password-pending
  - wait:
      text: Password updated successfully
      exact: true
    id: wait-password-updated-successfully
  - wait_gone:
      role: dialog
    id: wait-gone-2
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.passwordChanged)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-8
  - shot:
      name: conditional-password-success
      delay: 0
    id: shot-conditional-password-success
  - goto: /app/settings/general
    id: goto-app-settings-general-2
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access-2
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.passwordChanged)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-9
  - shot:
      name: conditional-password-navigation-receipt
      delay: 0
    id: shot-conditional-password-navigation-receipt
  - eval: location.reload()
    id: eval-script-10
  - wait:
      text: Change Password
      exact: true
    id: wait-change-password-2
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.passwordChanged)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-11
  - shot:
      name: conditional-password-reload
      delay: 0
    id: shot-conditional-password-reload
  - eval: (async () => { const r=await fetch('/api/mockshop/auth-anonymous/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'anonymous'})}); if(!r.ok) throw new Error('Sole Auth conditional staging failed'); })()
    id: eval-script-12
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access-3
  - eval: (async () => { const me=await (await fetch('/api/me')).json(); if(me.email!=="{{people.alex-learner.email}}") throw new Error('Sole Auth identity mismatch'); })()
    id: eval-script-13
  - eval: if ([...document.querySelectorAll('button')].some(x=>x.textContent.trim()==='Change Password')) throw new Error('Native password_configured=false section remained visible');
    id: eval-script-14
  - shot:
      name: conditional-password-not-configured
      delay: 0
    id: shot-conditional-password-not-configured
  - id: eval-script-15-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
    id: eval-script-15
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access-4
  - wait:
      text: Change Password
      exact: true
    id: wait-change-password-3
  - shot:
      name: conditional-password-fresh-reset
      delay: 0
    id: shot-conditional-password-fresh-reset
world: ../../../worlds/seaside/world.yaml
content:
