steps:
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
