# #30: pin-native controls, not an invented /search route or Auto menu option.
# Parent composes handlers-user-search callbacks before exercising this inventory.
name: user-search
title: Native Search and Chat modes, source filters, time and tags, results and reset
requires: enterprise
strict: true
locale: en
viewport: [ 1440, 900 ]
known_errors:
