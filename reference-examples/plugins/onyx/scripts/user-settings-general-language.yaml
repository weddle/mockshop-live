# #34 native coverage witness; author development is not acceptance.
# Existing base en preference and sole #31 owner; no new overlay/backend/Auth writes.
# SettingsPage854–868 and InputSingleSelect: nine native endonyms, Escape cancel,
# source defaultOption re-selection no-op; one English→Spanish product-control witness,
# NOT a nine-locale page-rendering matrix. PATCH {language}, backend NEXT_LOCALE cookie,
# native router.refresh; readback GET /me. Original steps1–59 end dirty Spanish.
# Run user-settings-general-language-fresh-start immediately next: its existing runner
# reset/new-context/locale prelude replaces original60; original61–66 remain there.
# Backend-only same-browser reset does not reset native HttpOnly NEXT_LOCALE.
name: user-settings-general-language
title: Native General Display Language menu, saved selection and reset
requires: enterprise
strict: true
locale: en
overlays:
  - edition-enterprise
viewport:
  - 1440
  - 1000
steps:
  - goto: /app
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const r = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:\"en\",keep:false,resetChats:true})});

      \  if (!r.ok) throw new Error('Independent General preference fresh reset failed');

      })()"
    id: eval-script
  - goto: /app
    id: goto-app-2
  - wait:
      selector: '#onyx-user-dropdown'
    id: wait-onyx-user-dropdown
  - click:
      selector: '#onyx-user-dropdown'
    id: click-onyx-user-dropdown
  - wait:
      selector: a[href="/app/settings"]
    id: wait-a-href-app-settings
  - shot: general-language-settings-menu-entry
    id: shot-general-language-settings-menu-entry
  - click:
      selector: a[href="/app/settings"]
    id: click-a-href-app-settings
  - wait:
      selector: a[href="/app/settings/general"]
    id: wait-a-href-app-settings-general
  - eval: if(location.pathname !== '/app/settings/general') throw new Error('Native Settings menu did not enter General');
    id: eval-script-2
  - wait:
      selector: label:has-text("Display Language") input
    id: wait-label-has-text-display-language-input
  - scroll:
      selector: label:has-text("Display Language") input
    id: scroll-label-has-text-display-language-input
  - eval: |
      const control = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Display Language'))?.querySelector('input');
      if (control?.value !== 'English') throw new Error('Native General language field label/value mismatch');
    id: eval-script-3
  - eval: (async () => { const r=await fetch('/api/me'); if (!r.ok) throw new Error('General preference readback failed'); const p=(await r.json()).preferences; if (p.language !== "en" || document.documentElement.lang !== "en") throw new Error('Native General UI/readback preference mismatch'); })()
    id: eval-script-4
  - shot: general-language-initial-english
    id: shot-general-language-initial-english
  - click:
      selector: label:has-text("Display Language") input
    id: click-label-has-text-display-language-input
  - wait:
      selector: '[role="option"]:has-text("Español")'
    id: wait-role-option-has-text-espa-ol
  - eval: const names=['English','Español','Português','Français','Deutsch','日本語','简体中文','한국어','العربية']; const rows=[...document.querySelectorAll('[role=option]')]; if(rows.length!==names.length || names.some(name=>!rows.some(row=>row.textContent.includes(name)))) throw new Error('Native language option inventory missing');
    id: eval-script-5
  - shot: general-language-options-open
    id: shot-general-language-options-open
  - scroll:
