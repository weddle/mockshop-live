# #58 EDITONLY prepared, unexecuted/unaccepted. 68 operations / 12 named images.
# Existing native saved Portkey ModelsField ONLY: mixed visibility, real checkbox and
# row selection, Select All/Deselect All, Update/reopen, Cancel, dirty keep/reload/reset.
# shared.tsx766–779 derives test_model_name from the first visible model; utils.ts121
# requires it and shared.tsx1145 disables Update when invalid. Thus zero-selected Update
# is disabled by the SOURCE, not an invented minimum or mock error.
# Portkey hides Auto Update; no Add Model/settings/default-changing or other-family replay.
# All product writes are native Update. Supplementary GETs protect saved provider/default
# metadata; only existing reset controls receive direct writes. Witness snapshots in
# sessionStorage are not product state. Public DOM scrolling keeps both rows readable.
