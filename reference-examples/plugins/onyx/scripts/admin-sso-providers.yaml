# #65 route-sized native proof: SSO Providers.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-sso-providers
title: SSO Providers - fictional local configuration
strict: true
requires: enterprise
locale: en
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/sso-providers
    id: goto-admin-sso-providers
  - shot: inventory-sso-providers
    id: shot-inventory-sso-providers
  - goto: /admin/security
    id: goto-admin-security
  - click: { selector: 'a[href="/admin/sso-providers"]' }
    id: click-a-href-admin-sso-providers
  - wait: { text: No SSO providers yet, exact: true }
    id: wait-no-sso-providers-yet
