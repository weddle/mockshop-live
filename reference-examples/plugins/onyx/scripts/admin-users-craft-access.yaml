        if (!user || user.craft_enabled !== null || me.craft_enabled !== null) throw new Error('Accepted Users/current-user Craft override did not preserve null');
      })()
    id: eval-script-3
  - shot: users-craft-default-null
    id: shot-users-craft-default-null
