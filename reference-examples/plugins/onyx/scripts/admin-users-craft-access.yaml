    id: shot-users-craft-before-reset
  - id: eval-script-8-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays: []
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,strict:true,locale:'en'})});
        if (!res.ok) throw new Error('Mock reset failed');
        location.reload();
      })()
