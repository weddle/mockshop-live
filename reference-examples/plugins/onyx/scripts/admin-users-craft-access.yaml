  - goto: /admin/craft/access
    id: goto-admin-craft-access-2
  - wait: { text: Per-user access, exact: true }
    id: wait-per-user-access-3
  - fill: { selector: 'input[placeholder="Search users..."]', value: maya.chen }
    id: fill-input-placeholder-search-users-5
  - wait: { selector: 'tr:has-text("{{people.maya.email}}") button[role="switch"][aria-checked="false"]' }
    id: wait-tr-has-text-maya-chen-seasidecollection-example-button-role-7
  - click: { selector: 'tr:has-text("{{people.maya.email}}") button[role="switch"]' }
    id: click-tr-has-text-maya-chen-seasidecollection-example-button-rol-4
  - wait: { text: Craft enabled for user, exact: true }
    id: wait-craft-enabled-for-user-2
  - wait: { selector: 'tr:has-text("{{people.maya.email}}") button[role="switch"][aria-checked="true"]' }
    id: wait-tr-has-text-maya-chen-seasidecollection-example-button-role-8
  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Native Craft join readback failed');
        const user = (await usersRes.json()).find(row => row.email === '{{people.maya.email}}'), me = await meRes.json();
        if (!user || user.craft_enabled !== null || me.craft_enabled !== null) throw new Error('Accepted Users/current-user Craft override did not preserve null');
      })()
    id: eval-script-6
  - shot: users-craft-enabled-default-null
    id: shot-users-craft-enabled-default-null
  # Leave default true AND explicit false dirty, then reset the actual joined factories.
  - click: { selector: 'tr:has-text("{{people.maya.email}}") button[role="switch"]' }
    id: click-tr-has-text-maya-chen-seasidecollection-example-button-rol-5
  - wait: { text: Craft disabled for user, exact: true }
    id: wait-craft-disabled-for-user-3
  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Native Craft join readback failed');
