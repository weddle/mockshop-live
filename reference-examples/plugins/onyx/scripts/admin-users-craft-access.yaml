    id: wait-tr-has-text-maya-chen-seasidecollection-example-button-role-3
  - shot: users-craft-direct-persisted
    id: shot-users-craft-direct-persisted
  # Matching the workspace default clears the override to null; it is not a fabricated Default menu.
  - click: { selector: 'tr:has-text("{{people.maya.email}}") button[role="switch"]' }
    id: click-tr-has-text-maya-chen-seasidecollection-example-button-rol-2
  - wait: { text: Craft disabled for user, exact: true }
