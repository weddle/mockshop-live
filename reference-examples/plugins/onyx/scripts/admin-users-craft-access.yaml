  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Native Craft join readback failed');
        const user = (await usersRes.json()).find(row => row.email === '{{people.maya.email}}'), me = await meRes.json();
        if (!user || user.craft_enabled !== false || me.craft_enabled !== false) throw new Error('Accepted Users/current-user Craft override did not preserve false');
      })()
    id: eval-script-4
