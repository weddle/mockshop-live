# EDITONLY prepared; unexecuted/unaccepted. Fictional local inputs only.
# Existing #33 first-run/name prerequisite and sole #3 provider store; no real provider calls.
# Saved-form edit is NOT available in onboarding: connected card navigates /admin/language-models.
# Cancel reopens a pristine NEW form; saved conditional ADMIN edit remains separate/unverified.
# VertexAIModal70–79: method changes clear inactive fields;79–85 hooks_enabled gates selector.
# Required Workload project; service-account upload remains the native FILE control, not a textarea.
# This conditional slice saves Workload Identity only, not the previously accepted default form.
# Filtered custom_config contains method/project/location and omits empty vertex_credentials.
name: user-provider-conditional-vertex
title: Native onboarding Vertex auth-method conditional project/region controls
requires: enterprise
strict: true
locale: en
viewport:
  - 1440
  - 1000
