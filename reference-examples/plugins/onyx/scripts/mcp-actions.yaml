  - wait: { role: button, name: "Reconnect to {{company.name}} PMS (internal MCP)", exact: true }
    id: wait-reconnect-to-seaside-pms-internal-mcp
  - goto: /admin/mcp-actions
    id: goto-admin-mcp-actions-4
  - wait: { role: button, name: "Reconnect to {{company.name}} PMS (internal MCP)", exact: true }
    id: wait-reconnect-to-seaside-pms-internal-mcp-2
  - shot: mcp-disconnected-persisted
    id: shot-mcp-disconnected-persisted
  - click: { role: button, name: "Reconnect to {{company.name}} PMS (internal MCP)", exact: true }
    id: click-reconnect-to-seaside-pms-internal-mcp
  - wait: { role: button, name: "View tools for {{company.name}} PMS (internal MCP)", exact: true }
    id: wait-view-tools-for-seaside-pms-internal-mcp
  - click: { role: button, name: "View tools for {{company.name}} PMS (internal MCP)", exact: true }
    id: click-view-tools-for-seaside-pms-internal-mcp-3
  - click: { selector: '[aria-label="tool-toggle-Group block status"]' }
    id: click-aria-label-tool-toggle-group-block-status-2
  - wait: { selector: '[aria-label="tool-toggle-Group block status"][aria-checked="false"]' }
    id: wait-aria-label-tool-toggle-group-block-status-aria-checked-fals-3
  - hover: { text: "{{company.name}} PMS (internal MCP)", exact: true }
    id: hover-seaside-pms-internal-mcp-2
  - click: { role: button, name: "Disconnect {{company.name}} PMS (internal MCP) server", exact: true }
    id: click-disconnect-seaside-pms-internal-mcp-server-2
  - click: { role: button, name: "Disconnect & Delete", exact: true }
