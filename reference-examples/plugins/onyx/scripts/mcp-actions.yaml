  - click: { role: button, name: Save Changes, exact: true }
    id: click-save-changes
  - wait_gone: { text: Manage MCP Server, exact: true }
    id: wait-gone-manage-mcp-server
  - goto: /admin/mcp-actions
    id: goto-admin-mcp-actions-3
  - wait: { text: "Mock-only read-only PMS tools for education program room blocks and rooming lists.", exact: true }
    id: wait-mock-only-read-only-pms-tools-for-education-program-room-bl
  - shot: mcp-manage-persisted
