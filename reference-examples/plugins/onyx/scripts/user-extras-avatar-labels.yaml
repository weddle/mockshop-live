# #33 independent route proof; scoped DEVELOPMENT only, parent acceptance/publication pending.

name: user-extras-avatar-labels
title: Native Extras - avatar labels
requires: enterprise
strict: true
locale: en
viewport: [ 1440, 1000 ]
steps:
  # Independent native setup replay; deliberately no duplicate evidence shots.
  - goto: /app
    id: goto-app
  - wait: { text: Welcome to Lakeshore Learning, exact: true }
    id: wait-welcome-to-lakeshore-learning
  - click: { label: Consent checkbox }
    id: click
  - click: { role: button, name: Start, exact: true }
    id: click-start
  - wait_gone: { selector: '[role="dialog"]' }
    id: wait-gone-role-dialog
  - goto: /app/agents/edit/11
    id: goto-app-agents-edit-11
  - wait: { selector: 'input[name="name"]' }
    id: wait-input-name-name
  # Lossless primary operations from the former monolithic proof.
  - fill: { placeholder: Add labels..., value: Inclusive Learning }
    id: fill
  - press: Enter
    id: press-enter
  - wait: { text: Inclusive Learning, exact: true }
    id: wait-inclusive-learning
  - shot: { name: extras-49-agent-new-label, full_page: true }
    id: shot-extras-49-agent-new-label
  - click: { role: button, name: Save, exact: true }
    id: click-save
  - goto: /app/agents/edit/11
    id: goto-app-agents-edit-11-2
  - wait: { text: Inclusive Learning, exact: true }
    id: wait-inclusive-learning-2
  - shot: { name: extras-50-agent-label-reload, full_page: true }
    id: shot-extras-50-agent-label-reload
  - hover: { selector: '.h-30.w-30' }
    id: hover-h-30-w-30
  - click: { selector: '.h-30.w-30' }
    id: click-h-30-w-30
  - wait: { text: Upload Image, exact: true }
    id: wait-upload-image
  - shot: { name: extras-51-agent-avatar-native-menu, full_page: true }
    id: shot-extras-51-agent-avatar-native-menu
  - click: { selector: '[role="menuitem"].grid button', nth: 1 }
    id: click-role-menuitem-grid-button
  - click: { role: button, name: Save, exact: true }
    id: click-save-2
  - goto: /app/agents/edit/11
    id: goto-app-agents-edit-11-3
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if (!a.icon_name || a.uploaded_image_id) throw new Error('Native avatar icon did not persist');
      })()
    id: eval-script
  - shot: { name: extras-52-agent-avatar-icon-reload, full_page: true }
    id: shot-extras-52-agent-avatar-icon-reload
  - click: { selector: '.h-30.w-30' }
    id: click-h-30-w-30-2
  - click: { text: Upload Image, exact: true }
    id: click-upload-image
  - eval: |
      (async () => {
        const config = await (await fetch('/api/mockshop/user-extras')).json();
        const bytes = Uint8Array.from(atob(config.avatar_png_base64), c=>c.charCodeAt(0));
        const transfer = new DataTransfer(); transfer.items.add(new File([bytes], 'fictional-education-avatar.png', {type:'image/png'}));
        const input = document.querySelector('input[type="file"][accept="image/*"]');
        input.files = transfer.files; input.dispatchEvent(new Event('change', {bubbles:true}));
      })()
    id: eval-script-2
  - settle: 700
    id: settle
  - shot: { name: extras-53-agent-avatar-fake-upload-preview, full_page: true }
    id: shot-extras-53-agent-avatar-fake-upload-preview
  - click: { role: button, name: Save, exact: true }
    id: click-save-3
  - goto: /app/agents/edit/11
    id: goto-app-agents-edit-11-4
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if (!a.uploaded_image_id?.startsWith('mock-user-extras-avatar-')) throw new Error('Native avatar upload marker did not persist');
      })()
    id: eval-script-3
  - shot: { name: extras-54-agent-avatar-upload-reload, full_page: true }
    id: shot-extras-54-agent-avatar-upload-reload
  - goto: /app/agents
    id: goto-app-agents
  - fill: { placeholder: Search agents..., value: Inclusive Learning }
    id: fill-2
  - wait: { text: Campus Learning Guide, exact: true }
    id: wait-campus-learning-guide
  - shot: { name: extras-55-agent-label-gallery-search, full_page: true }
    id: shot-extras-55-agent-label-gallery-search
  - hover: { selector: '.radial-00:has-text("Campus Learning Guide")' }
    id: hover-radial-00-has-text-campus-learning-guide
  - click: { selector: '.radial-00:has-text("Campus Learning Guide") .h-24 button', nth: 0 }
    id: click-radial-00-has-text-campus-learning-guide-h-24-button
  - wait: { testid: admin-date-range-selector }
    id: wait
  - wait: { text: "95", exact: true }
    id: wait-95
  - shot: { name: extras-56-analytics-card-entry-populated, full_page: true }
    id: shot-extras-56-analytics-card-entry-populated
  - click: { role: button, name: Back, exact: true }
    id: click-back
  - wait: { testid: AgentsPage/container }
    id: wait-2
  - shot: { name: extras-56a-analytics-native-back, full_page: true }
    id: shot-extras-56a-analytics-native-back
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-user-extras.yaml
