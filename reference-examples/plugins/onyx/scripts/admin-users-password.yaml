# Independent #59 native unit. Runner starts fresh base state; no preceding unit is required.
name: admin-users-password
title: Native Users nonfunctional password reset result and copy
strict: true
requires: enterprise
locale: en
steps:
  - goto: /admin/users
    id: goto-admin-users
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users
  - click: { role: button, name: User actions, exact: true }
    id: click-user-actions
  - click: { text: Reset Password, exact: true }
    id: click-reset-password
  - shot: users-password-dialog
    id: shot-users-password-dialog
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password-2
  - wait: { text: Password Reset, exact: true }
    id: wait-password-reset
  - shot: users-password-fake-result
    id: shot-users-password-fake-result
  - wait: { selector: 'input[value="DEMO-ONLY-NOT-A-CREDENTIAL"]' }
    id: wait-input-value-demo-only-not-a-credential
  - click: { role: button, name: Copy password, exact: true }
    id: click-copy-password
  - click: { role: button, name: Done, exact: true }
    id: click-done
  - goto: /admin/users
    id: goto-admin-users-2
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users-2
  - wait: { text: "{{people.devon.name}}", exact: true }
    id: wait-devon-ortiz
  - shot: users-password-done
    id: shot-users-password-done
world: ../../../worlds/seaside/world.yaml
