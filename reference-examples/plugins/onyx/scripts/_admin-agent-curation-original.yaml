        if (JSON.stringify(me.preferences.pinned_assistants) !== sessionStorage.getItem('admin-curation-pins')) throw new Error('Fresh reset did not restore seed pins');
        const ids = [...document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]')].map(e => e.dataset.testid);
        if (ids.join(',') !== 'agent-row-actions-11,agent-row-actions-12,agent-row-actions-13,agent-row-actions-14') throw new Error('Fresh reset left dirty visible admin order');
      })()
    id: eval-script-14
  - shot: fresh-reset-admin-seeds
    id: shot-fresh-reset-admin-seeds
  - goto: /app/agents
    id: goto-app-agents-8
  - wait: { selector: '.radial-00:has-text("Guest Ops Copilot")' }
    id: wait-radial-00-has-text-guest-ops-copilot-2
  - eval: |
      const cards = [...document.querySelectorAll('[data-testid="AgentsPage/container"] .radial-00')];
      const names = cards.map(card => ['{{teams.training.name}} & Onboarding Desk','Guest Ops Copilot','{{teams.training.name}} Analyst','IT Helpdesk'].find(name => card.textContent.includes(name)));
      if (names.join(',') !== '{{teams.training.name}} & Onboarding Desk,Guest Ops Copilot,{{teams.training.name}} Analyst,IT Helpdesk') throw new Error('Fresh reset left dirty visible gallery order');
      for (const card of cards) {
        const featured = card.closest('.grid')?.parentElement?.textContent.includes('Featured');
        const expected = card.textContent.includes('{{teams.training.name}} & Onboarding Desk') || card.textContent.includes('Guest Ops Copilot');
        if (Boolean(featured) !== expected) throw new Error('Fresh reset left dirty gallery Featured section');
      }
    id: eval-script-15
  - shot: fresh-reset-gallery-seeds
    id: shot-fresh-reset-gallery-seeds
