  - eval: |
      (async () => {
        const id = new URL(location.href).searchParams.get('chatId');
        if (!id) throw new Error('Project composer did not create chat');
        sessionStorage.setItem('project-new-chat-id', id);
        const projectId = Number(sessionStorage.getItem('created-project-id'));
        const details = await (await fetch(`/api/user/projects/${projectId}/details`)).json();
        if (!details.project.chat_sessions.some(s => s.id === id && s.project_id === projectId)) throw new Error('New chat lost project membership');
      })()
    id: eval-script-4
