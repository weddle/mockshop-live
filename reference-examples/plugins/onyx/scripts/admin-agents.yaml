name: admin-agents
title: Admin Agents - native list, search, filters, sort and existing editor entry
strict: true
locale: en
steps:
  - goto: /admin/documents/sets
    id: goto-admin-documents-sets
  - click: { selector: 'a[href="/admin/agents"]' }
    id: click-a-href-admin-agents
  - wait: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-data-testid-agent-row-actions-11
  - wait: { selector: '[data-testid="agent-row-actions-14"]' }
    id: wait-data-testid-agent-row-actions-14
  - shot: admin-agents-menu
    id: shot-admin-agents-menu
  - goto: /admin/agents
    id: goto-admin-agents
  - wait: { selector: '[data-testid="agent-row-actions-14"]' }
    id: wait-data-testid-agent-row-actions-14-2
  - eval: |
      (async () => {
        const get = async path => {
          const r = await fetch('/api' + path);
          if (!r.ok) throw new Error('Missing native agent fixture: ' + path);
          return r.json();
        };
        const catalog = await get('/persona/labels');
        const lists = [await get('/persona'), await get('/admin/persona?include_deleted=false&get_editable=false'), (await get('/admin/agents')).items];
        const expected = {11: [1], 12: [2], 13: [1, 2], 14: [3, 2]};
        for (const [id, ids] of Object.entries(expected)) {
          const detail = await get('/persona/' + id);
          for (const agent of [...lists.map(list => list.find(a => a.id === Number(id))), detail]) {
            if (!agent || JSON.stringify(agent.labels.map(l => l.id)) !== JSON.stringify(ids) ||
                agent.labels.some(l => !catalog.some(c => c.id === l.id && c.name === l.name)))
              throw new Error('Catalog/list/detail label mismatch for ' + id);
          }
        }
        if (document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]').length !== 4)
          throw new Error('Expected four non-builtin agents, not the default Assistant');
        const footer = document.querySelector('.table-footer');
        if (!footer || !footer.textContent.includes('1~4') || !footer.textContent.includes('4'))
          throw new Error('Expected the native one-page four-record pagination summary');
      })()
    id: eval-script
  - shot: admin-agents-direct-pagination
    id: shot-admin-agents-direct-pagination
  - fill: { selector: 'input[placeholder="Search agents..."]', value: IT Helpdesk }
    id: fill-input-placeholder-search-agents
  - wait: { selector: '[data-testid="agent-row-actions-14"]' }
    id: wait-data-testid-agent-row-actions-14-3
  - wait_gone: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-gone-data-testid-agent-row-actions-11
  - shot: admin-agents-search
    id: shot-admin-agents-search
  - fill: { selector: 'input[placeholder="Search agents..."]', value: no-such-learning-agent }
    id: fill-input-placeholder-search-agents-2
  - wait: { text: No agents found, exact: true }
    id: wait-no-agents-found
  - shot: admin-agents-search-empty
    id: shot-admin-agents-search-empty
  - fill: { selector: 'input[placeholder="Search agents..."]', value: '' }
    id: fill-input-placeholder-search-agents-3
  - click: { role: button, name: All Actions, exact: true }
    id: click-all-actions
  - click: { role: option, name: Code Interpreter, exact: true }
    id: click-code-interpreter
  - press: Escape
    id: press-escape
  - wait: { selector: '[data-testid="agent-row-actions-13"]' }
    id: wait-data-testid-agent-row-actions-13
  - wait_gone: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-gone-data-testid-agent-row-actions-11-2
  - wait_gone: { selector: '[data-testid="agent-row-actions-14"]' }
    id: wait-gone-data-testid-agent-row-actions-14
  - shot: admin-agents-action-filter
    id: shot-admin-agents-action-filter
  - goto: /admin/agents
    id: goto-admin-agents-2
  - wait: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-data-testid-agent-row-actions-11-2
  - click: { role: button, name: All Actions, exact: true }
    id: click-all-actions-2
  - click: { role: option, name: Image Generation, exact: true }
    id: click-image-generation
  - press: Escape
    id: press-escape-2
  - wait: { text: No agents found, exact: true }
    id: wait-no-agents-found-2
  - shot: admin-agents-action-empty
    id: shot-admin-agents-action-empty
  - goto: /admin/agents
    id: goto-admin-agents-3
  - wait: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-data-testid-agent-row-actions-11-3
  - click: { role: button, name: Everyone, exact: true }
    id: click-everyone
  - click: { role: option, name: '{{people.maya.email}} Me', exact: true }
    id: click-maya-chen-seasidecollection-example-me
  - press: Escape
    id: press-escape-3
  - wait: { selector: '[data-testid="agent-row-actions-14"]' }
    id: wait-data-testid-agent-row-actions-14-4
  - shot: admin-agents-creator-filter
    id: shot-admin-agents-creator-filter
  - goto: /admin/agents
    id: goto-admin-agents-4
  - wait: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-data-testid-agent-row-actions-11-4
  - hover: { selector: 'thead th:nth-child(2)' }
    id: hover-thead-th-nth-child-2
  - click: { selector: 'thead th:nth-child(2) button' }
    id: click-thead-th-nth-child-2-button
  - eval: |
      const ids = [...document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]')].map(e => e.dataset.testid);
      if (ids.join(',') !== 'agent-row-actions-12,agent-row-actions-14,agent-row-actions-11,agent-row-actions-13')
        throw new Error('Native Name ascending sort did not order the existing agents');
    id: eval-script-2
  - shot: admin-agents-name-sort
    id: shot-admin-agents-name-sort
  - goto: /admin/agents
    id: goto-admin-agents-5
  - wait: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-data-testid-agent-row-actions-11-5
  - click: { role: button, name: Everyone, exact: true }
    id: click-everyone-2
  - click: { role: option, name: "{{people.devon.email}}", exact: true }
    id: click-devon-ortiz-seasidecollection-example
  - press: Escape
    id: press-escape-4
  - wait: { text: No agents found, exact: true }
    id: wait-no-agents-found-3
  - shot: admin-agents-creator-empty
    id: shot-admin-agents-creator-empty
  - goto: /admin/agents
    id: goto-admin-agents-6
  - wait: { selector: '[data-testid="agent-row-actions-11"]' }
    id: wait-data-testid-agent-row-actions-11-6
  - hover: { selector: '[data-testid="agent-row-actions-11"]' }
    id: hover-data-testid-agent-row-actions-11
  - click: { selector: '[data-testid="agent-row-actions-11"] button[aria-label="Agent actions"]' }
    id: click-data-testid-agent-row-actions-11-button-aria-label-agent-a
  - wait: { role: menuitem, name: Unlist Agent, exact: true }
    id: wait-unlist-agent
  - wait: { role: menuitem, name: Share, exact: true }
    id: wait-share
  - wait: { role: menuitem, name: Delete, exact: true }
    id: wait-delete
  - shot: admin-agents-row-menu
    id: shot-admin-agents-row-menu
  - press: Escape
    id: press-escape-5
  - hover: { selector: '[data-testid="agent-row-actions-11"]' }
    id: hover-data-testid-agent-row-actions-11-2
  - click: { selector: '[data-testid="edit-agent-11"]' }
    id: click-data-testid-edit-agent-11
  - wait: { selector: 'input[name="name"][value="{{teams.training.name}} & Onboarding Desk"]' }
    id: wait-input-name-name-value-training-onboarding-desk
  - eval: |
      if (location.pathname !== '/app/agents/edit/11' || new URLSearchParams(location.search).get('admin') !== 'true')
        throw new Error('Native admin edit entry opened the wrong existing record');
    id: eval-script-3
  - shot: admin-agents-existing-editor
    id: shot-admin-agents-existing-editor
  - scroll: { text: Add labels and categories to help people better discover this agent. }
    id: scroll-add-labels-and-categories-to-help-people-better-discover-
  - wait: { text: "{{teams.training.name}}", exact: true }
    id: wait-training
  - shot: admin-agents-existing-label
    id: shot-admin-agents-existing-label
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-mcp-admin.yaml
