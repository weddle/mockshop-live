# #58 native ModelSettingsPopover inventory: 100 operations / 18 named PNGs; independent execution evidence is recorded separately.
# Source15 ModelSettingsPopover178–380, setting-controls11–32/98–128:
# reasoning Low/Medium/High indices1/2/3; unset cap=highest and default=bounded Medium.
# Pointer click on the real Max slider track lowers High to Medium and clamps Default;
# Home lowers to Low; Default End remains capped. Reasoning temperature is disabled at1.
# Nonreasoning temperature is native0..2/step0.1; null parks at0. Context is read-only.
# Settings button is row-right nth1 after Rename; no invented accessible slider labels.
# Popover is a modal portal: its role=dialog/slider scope excludes the provider dialog.
# Native Update is the only product write. GETs supplement UI; direct POSTs are the
# existing keep/fresh controls. Witness snapshots in sessionStorage are not a store.
