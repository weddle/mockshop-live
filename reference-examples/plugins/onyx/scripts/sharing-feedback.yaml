# DEVELOPMENT inventory; independent parent strict/every-PNG acceptance/publication remains pending.
# Independent fresh reset uses the existing control plane; mutations under test use only native controls.

name: sharing-feedback
title: Native header and sidebar Share, cancel, create, copy and reopen
strict: true
requires: enterprise
locale: en
viewport: [ 1440, 900 ]
known_errors:
  - match: '/http 400 PATCH .*\/api\/chat\/chat-session\/61616161-0000-4000-8000-000000000001$/'
    reason: Original endpoint-specific staged native share/privacy HTTP failure; unclassified console/resource errors remain strict.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/127\.0\.0\.1:\d+\/api\/chat\/chat-session\/61616161-0000-4000-8000-000000000001\]$/'
    reason: Actual changed strict attributes the deliberately rejected create-link PATCH to this exact chat; native error shows no link and saved privacy stays private.
  - match: '/^console: \[Toast\] Failed to generate share link \[source: http:\/\/127\.0\.0\.1:\d+\/_next\/static\/chunks\/1h15gs0jly9g_\.js\]$/'
    reason: Actual pinned native Share/Opal Toast event for one-shot creation failure; visible error, absent link and authoritative private readback precede native retry success. Unknown or different-source events remain strict.
steps:
  - goto: /app
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays: []
  - eval: |
      (async () => {
        const currentResponse = await fetch('/api/__mockshop/state');
        if (!currentResponse.ok) throw new Error('Independent Sharing seed read failed');
        const current = await currentResponse.json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,locale:'en',keep:false,resetChats:true,anchor:current.demo_anchor})});
        if (!response.ok) throw new Error('Independent Sharing reset failed');
        sessionStorage.removeItem('sharing-workshop-id');
        sessionStorage.removeItem('sharing-workshop-link');
      })();
    id: eval-script
  # Primary original operations 1-48; every original interaction and named PNG is retained.
  - goto: /app?chatId=61616161-0000-4000-8000-000000000001
    id: goto-app-chatid-61616161-0000-4000-8000-000000000001
  - wait: { text: Closing reflection, exact: true }
    id: wait-closing-reflection
  - wait: { testid: 'AgentMessage/toolbar', nth: 1 }
    id: wait
  - settle: 1200
    id: settle
  - eval: |
      const toolbars = [...document.querySelectorAll('[data-testid="AgentMessage/toolbar"]')];
      if (toolbars.length !== 2 || !document.body.innerText.includes('Start with a short reading circle.')) throw new Error('Seeded workshop did not replay both saved turns');
      if (toolbars.some(t => !t.textContent.includes('GPT-5.2'))) throw new Error('Saved answer model labels did not replay');
      if ([...toolbars[1].querySelectorAll('button')].some(b => b.textContent.trim() === 'Sources')) throw new Error('No-source closing reflection invented a Sources control');
      sessionStorage.setItem('sharing-workshop-id', '61616161-0000-4000-8000-000000000001');
    id: eval-script-2
  - shot: saved-conversation-direct
    id: shot-saved-conversation-direct
  # Header entry: private seed disables submit; selecting public then cancelling must not publish.
  - click: { selector: '[aria-label="share-chat-button"]' }
    id: click-aria-label-share-chat-button
  - wait: { text: Share this chat, exact: true }
    id: wait-share-this-chat
  - eval: |
      const submit = document.querySelector('[aria-label="share-modal-submit"]');
      if (!submit || !(submit.matches(':disabled') || submit.getAttribute('data-disabled') === 'true')) throw new Error('Private unshared chat unexpectedly allows submission');
      if (document.querySelector('[aria-label="share-modal-link-input"]')) throw new Error('Private seed unexpectedly has a share link');
    id: eval-script-3
  - shot: share-header-private-disabled
    id: shot-share-header-private-disabled
  - click: { selector: '[aria-label="share-modal-option-public"]' }
    id: click-aria-label-share-modal-option-public
  - shot: share-public-draft
    id: shot-share-public-draft
  - click: { selector: '[aria-label="share-modal-cancel"]' }
    id: click-aria-label-share-modal-cancel
  - wait_gone: { text: Share this chat, exact: true }
    id: wait-gone-share-this-chat
  - click: { selector: '[aria-label="share-chat-button"]' }
    id: click-aria-label-share-chat-button-2
  - eval: |
      const submit = document.querySelector('[aria-label="share-modal-submit"]');
      if (!(submit?.matches(':disabled') || submit?.getAttribute('data-disabled') === 'true')) throw new Error('Cancelled public draft persisted');
    id: eval-script-4
  - shot: share-cancel-restores-private
    id: shot-share-cancel-restores-private
  - press: Escape
    id: press-escape
  # Sidebar menu entry identifies this saved chat, not another chat/session.
  - hover: { testid: ChatButton, has_text: Accessible library workshop }
    id: hover
  - click: { selector: '[data-testid="ChatButton"]:has-text("Accessible library workshop") button[aria-label="Chat options"]' }
    id: click-data-testid-chatbutton-has-text-accessible-library-worksho
  - shot: share-sidebar-menu
    id: shot-share-sidebar-menu
  - click: { role: menuitem, name: Share, exact: true }
    id: click-share
  - wait: { text: Share this chat, exact: true }
    id: wait-share-this-chat-2
  - click: { selector: '[aria-label="share-modal-option-public"]' }
    id: click-aria-label-share-modal-option-public-2
  - eval: |
      (async () => { const r = await fetch('/api/mockshop/sharing-feedback/outcome', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({operation:'share', fail:true})}); if (!r.ok) throw new Error('Cannot stage local share failure'); })()
    id: eval-script-5
  - click: { selector: '[aria-label="share-modal-submit"]' }
    id: click-aria-label-share-modal-submit
  - wait: { text: Failed to generate share link, exact: true }
    id: wait-failed-to-generate-share-link
  - eval: |
      (async () => {
        if (document.querySelector('[aria-label="share-modal-link-input"]')) throw new Error('Failed creation displayed a saved link');
        const response = await fetch('/api/chat/get-chat-session/61616161-0000-4000-8000-000000000001');
        if (!response.ok || (await response.json()).shared_status !== 'private') throw new Error('Failed creation changed authoritative privacy');
      })();
    id: eval-script-6
  - shot: share-create-error
    id: shot-share-create-error
  - click: { selector: '[aria-label="share-modal-submit"]' }
    id: click-aria-label-share-modal-submit-2
  - wait: { text: Chat shared, exact: true }
    id: wait-chat-shared
  - wait: { text: Share link copied to clipboard!, exact: true }
    id: wait-share-link-copied-to-clipboard
  - eval: |
      const input = document.querySelector('[aria-label="share-modal-link-input"]');
      const expected = `${location.origin}/app/shared/${sessionStorage.getItem('sharing-workshop-id')}`;
      if (input?.value !== expected || !input.readOnly) throw new Error('Native saved share link is not this exact fake conversation');
      sessionStorage.setItem('sharing-workshop-link', input.value);
    id: eval-script-7
  - shot: share-created-link-success
    id: shot-share-created-link-success
  - click: { selector: '[aria-label="share-modal-copy-link"]' }
    id: click-aria-label-share-modal-copy-link
  - wait: { selector: '[aria-label="share-modal-copy-link"] path[d="M13.5 4.5L6 12L2.5 8.5"]' }
    id: wait-aria-label-share-modal-copy-link-path-d-m13-5-4-5l6-12l2-5-
  - shot: share-input-copy-success
    id: shot-share-input-copy-success
  - click: { selector: '[aria-label="share-modal-submit"]' }
    id: click-aria-label-share-modal-submit-3
  - wait: { text: Share link copied to clipboard!, exact: true }
    id: wait-share-link-copied-to-clipboard-2
  - shot: share-footer-copy-success
    id: shot-share-footer-copy-success
  - press: Escape
    id: press-escape-2
  - eval: location.reload()
    id: eval-script-8
  - wait: { text: Closing reflection, exact: true }
    id: wait-closing-reflection-2
  - click: { selector: '[aria-label="share-chat-button"]' }
    id: click-aria-label-share-chat-button-3
  - wait: { text: Chat shared, exact: true }
    id: wait-chat-shared-2
  - eval: |
      if (document.querySelector('[aria-label="share-modal-link-input"]')?.value !== sessionStorage.getItem('sharing-workshop-link')) throw new Error('Share metadata did not survive native reload');
    id: eval-script-9
  - shot: share-reopened-public
    id: shot-share-reopened-public
  - press: Escape
    id: press-escape-3
  # Live answer CopyButton uses its actual native success icon, not an API response echo.
world: ../../../worlds/seaside/world.yaml
