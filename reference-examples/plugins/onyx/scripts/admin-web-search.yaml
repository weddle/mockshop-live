  - click: { selector: '[data-testid="content-provider-list"] [aria-label="Firecrawl"]' }
    id: click-data-testid-content-provider-list-aria-label-firecrawl
  - wait: { role: dialog }
    id: wait-2
  - shot: web-crawler-firecrawl-form
    id: shot-web-crawler-firecrawl-form
  - fill: { selector: '[role="dialog"] input[name="api_key"]', value: mock-only-crawler-not-a-secret }
    id: fill-role-dialog-input-name-api-key
  - click: { selector: '[role="dialog"] button:has-text("Connect")' }
    id: click-role-dialog-button-has-text-connect
  - wait_gone: { role: dialog }
    id: wait-gone-2
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Firecrawl"] button:has-text("Current Crawler")' }
    id: wait-data-testid-content-provider-list-aria-label-firecrawl-butt
  - shot: web-crawler-firecrawl-connected
    id: shot-web-crawler-firecrawl-connected
  - goto: /admin/security
    id: goto-admin-security-2
  - goto: /admin/web-search
    id: goto-admin-web-search-4
  - scroll: { text: Web Crawler, exact: true }
    id: scroll-web-crawler-2
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Firecrawl"] button:has-text("Current Crawler")' }
    id: wait-data-testid-content-provider-list-aria-label-firecrawl-butt-2
  - shot: web-crawler-navigation-readback
    id: shot-web-crawler-navigation-readback
  - click: { selector: '[data-testid="content-provider-list"] [aria-label="Onyx Web Crawler"]' }
    id: click-data-testid-content-provider-list-aria-label-onyx-web-craw
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Onyx Web Crawler"] button:has-text("Current Crawler")' }
    id: wait-data-testid-content-provider-list-aria-label-onyx-web-crawl-2
  - shot: web-crawler-native-default-restored
    id: shot-web-crawler-native-default-restored
