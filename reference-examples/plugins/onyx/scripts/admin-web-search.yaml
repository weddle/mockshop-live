# #65 route-sized native proof: Web Search.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-web-search
title: Web Search - fictional local configuration
strict: true
requires: enterprise
locale: en
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/web-search
    id: goto-admin-web-search
  - shot: inventory-web-search
    id: shot-inventory-web-search
  - goto: /admin/web-search
    id: goto-admin-web-search-2
  - wait: { text: Search Engine, exact: true }
    id: wait-search-engine
  - shot: web-search-direct
    id: shot-web-search-direct
  - click: { selector: 'button[aria-label="Edit Learning web search (fake)"]' }
    id: click-button-aria-label-edit-learning-web-search-fake
  - wait: { role: dialog }
    id: wait
  - fill: { selector: 'input[name="api_key"]', value: mock-only-replacement-not-a-secret }
    id: fill-input-name-api-key
  - shot: web-search-edit-dialog
    id: shot-web-search-edit-dialog
  - click: { selector: '[role="dialog"] button[type="submit"]' }
    id: click-role-dialog-button-type-submit
  - wait_gone: { role: dialog }
    id: wait-gone
  - goto: /admin/security
    id: goto-admin-security
  - goto: /admin/web-search
    id: goto-admin-web-search-3
  - shot: web-search-saved
    id: shot-web-search-saved
  - scroll: { text: Web Crawler, exact: true }
    id: scroll-web-crawler
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Onyx Web Crawler"]' }
