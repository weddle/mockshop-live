  - eval: |
      (async () => {
        const source = document.querySelector('.opal-sidebar-tab a[href="/app?chatId=11111111-0000-4000-8000-000000000001"]')?.closest('[data-testid="ChatButton"]')?.parentElement;
        const target = document.querySelector('.opal-sidebar-tab button[aria-label="Accessible Learning Lab"]');
        if (!source || !target) throw new Error('Drag source/project target missing');
        const a = source.getBoundingClientRect(), b = target.getBoundingClientRect();
        const start = {x:a.left+a.width/2,y:a.top+a.height/2}, end = {x:b.left+b.width/2,y:b.top+b.height/2};
        const event = (type,x,y,buttons) => new PointerEvent(type,{bubbles:true,cancelable:true,composed:true,isPrimary:true,pointerId:21,pointerType:'mouse',button:0,buttons,clientX:x,clientY:y});
        source.dispatchEvent(event('pointerdown',start.x,start.y,1));
        await new Promise(resolve => setTimeout(resolve,100));
        document.dispatchEvent(event('pointermove',start.x,start.y-12,1));
        await new Promise(resolve => setTimeout(resolve,250));
        document.dispatchEvent(event('pointermove',end.x,end.y,1));
        await new Promise(resolve => setTimeout(resolve,250));
        document.dispatchEvent(event('pointermove',end.x,end.y,1));
        await new Promise(resolve => setTimeout(resolve,250));
        document.dispatchEvent(event('pointerup',end.x,end.y,0));
        await new Promise(resolve => setTimeout(resolve,600));
      })()
    id: eval-script-3
