# #58 EDITONLY prepared; unexecuted/unaccepted. One independent saved ADMIN route unit.
# Source15 LanguageModelsPage ExistingProviderCard passes existingLlmProvider to BedrockModal.
# BedrockModal96–119 clears inactive credentials and conditions model discovery on complete
# active credentials. Yup303–309 requires REGION only: missing credentials must NOT be
# misrepresented as an Update validation guard. Source321–330 omits empty inactive fields.
# 93 operations / 15 named images: menu/direct saved Access edit; all native method choices;
# real IAM, Access Key and Long-term API Key Update/reopen; distinct saved regions, fake
# credential redaction, missing-credential discovery versus Update behavior; region-invalid
# canceled draft protection; dirty keep/hard navigation; fresh original-method/region reset.
# Supplementary GETs are readback, not product mutations. Only the existing reset control is
# written directly. sessionStorage contains witness snapshots, not another product store.
# RefetchButton is source-native but has no label. Its public header row also contains the
# labelled Deselect All button: count that same row's buttons to assert discovery visibility
# without inventing an aria-label, installing a selector or touching private React state.
name: admin-provider-bedrock-edit
title: Native admin Bedrock saved auth methods, regions, credentials and protected reset
requires: enterprise
strict: true
locale: en
viewport: [ 1440, 1000 ]
