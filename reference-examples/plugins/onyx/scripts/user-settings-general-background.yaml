# #34 EDITONLY prepared; no execution/acceptance claim.
# Existing base null/light preferences and sole #31 owner; no new overlay/backend/Auth writes.
# SettingsPage566–581,783–830 + named chatBackgrounds constants and AppChrome647–703.
# Five bundled image choices and None are actual native immediate buttons: no draft/cancel
# exists. Native image choices also write their LIGHT/DARK theme; None clears background
# to null but retains current theme. PATCH {chat_background}, PATCH {theme_preference};
# selected native control and real /app CSS wallpaper, navigation/reload/keep/readback,
# explicit dirty clouds→fresh null reset. No generated/copied images or source patches.
name: user-settings-general-background
title: Native General six-background choices, app consumers and saved reset
requires: enterprise
strict: true
locale: en
overlays:
  - edition-enterprise
viewport:
  - 1440
  - 1000
steps:
  - goto: /app
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const r = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:\"en\",keep:false,resetChats:true})});

      \  if (!r.ok) throw new Error('Independent General preference fresh reset failed');

      })()"
    id: eval-script
  - goto: /app
    id: goto-app-2
  - wait:
      selector: '#onyx-user-dropdown'
    id: wait-onyx-user-dropdown
  - click:
      selector: '#onyx-user-dropdown'
    id: click-onyx-user-dropdown
  - wait:
      selector: a[href="/app/settings"]
    id: wait-a-href-app-settings
  - shot: general-background-settings-menu-entry
    id: shot-general-background-settings-menu-entry
  - click:
      selector: a[href="/app/settings"]
    id: click-a-href-app-settings
  - wait:
      selector: a[href="/app/settings/general"]
    id: wait-a-href-app-settings-general
  - eval: if(location.pathname !== '/app/settings/general') throw new Error('Native Settings menu did not enter General');
    id: eval-script-2
  - wait:
      role: button
      name: None background (selected)
      exact: true
    id: wait-none-background-selected
  - scroll:
      text: Chat Background
      exact: true
    id: scroll-chat-background
  - eval: const labels=['None','Clouds','Hills','Plants','Mountains','Night']; const buttons=[...document.querySelectorAll('button[aria-label]')]; if(labels.some(label=>!buttons.some(b=>b.getAttribute('aria-label')===label+' background' || b.getAttribute('aria-label')===label+' background (selected)'))) throw new Error('Native six-background option inventory missing');
    id: eval-script-3
  - eval: (async () => { const r=await fetch('/api/me'); if (!r.ok) throw new Error('General preference readback failed'); const p=(await r.json()).preferences; if (p.language !== "en" || document.documentElement.lang !== "en" || p.chat_background !== null || p.theme_preference !== "light" || !document.documentElement.classList.contains("light")) throw new Error('Native General UI/readback preference mismatch'); })()
    id: eval-script-4
  - shot: general-background-initial-none-options
    id: shot-general-background-initial-none-options
  - click:
      role: button
      name: Clouds background
      exact: true
    id: click-clouds-background
  - wait:
      role: button
      name: Clouds background (selected)
      exact: true
    id: wait-clouds-background-selected
  - shot: general-background-clouds-selected
    id: shot-general-background-clouds-selected
  - goto: /app
    id: goto-app-3
  - wait:
      selector: div.bg-cover[style*="/chat-backgrounds/clouds.jpg"]
    id: wait-div-bg-cover-style-chat-backgrounds-clouds-jpg
  - eval: (async () => { const r=await fetch('/api/me'); if(!r.ok) throw new Error('Background readback failed'); const p=(await r.json()).preferences; const wall=document.querySelector("div.bg-cover[style*=\"/chat-backgrounds/clouds.jpg\"]"); if(p.chat_background!=="clouds" || p.theme_preference!=="light" || !document.documentElement.classList.contains("light") || !wall || wall.getBoundingClientRect().width<=0 || wall.getBoundingClientRect().height<=0 || !getComputedStyle(wall).backgroundImage.includes("/chat-backgrounds/clouds.jpg")) throw new Error('Native app wallpaper/preference/theme consumer mismatch'); })()
    id: eval-script-5
