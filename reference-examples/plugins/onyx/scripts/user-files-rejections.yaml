# Issue #28 independent native proof unit; no acceptance claim.
# Fresh runner start resets base fixtures, chats and browser; never chain unit outputs.

# Source/core/artifacts frozen; native file inputs only; no generic error allowances.
name: user-files-rejections
title: Native oversized, rejected, failed and unsupported file states
strict: true
locale: en
viewport: [ 1440, 900 ]
known_errors:
  - match: '/^console: \[Toast\] File failed and was removed: failed-demo\.txt \[source: http:\/\/127\.0\.0\.1:\d+\/_next\/static\/chunks\/1h15gs0jly9g_\.js\]$/'
    reason: 'Required fixture58 FAILED upload state; the scenario asserts this exact native toast and removal of the failed/rejected optimistic composer attachments. Other upload errors and failed steps remain strict.'
steps:
  # Original user-files step 234, source line 302.
  - goto: /app
    id: goto-app
  # Original user-files step 235, source line 303.
  - eval: location.reload()
    id: eval-script
  # Original user-files step 236, source line 304.
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox
  # Original user-files step 237, source line 305.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814
  # Original user-files step 238, source line 306.
  - click: { text: Upload Files, exact: true }
    id: click-upload-files
  # Original user-files step 239, source line 307.
  - eval: |
      const input = document.querySelector('input[type="file"][accept="*/*"]');
      const transfer = new DataTransfer();
      // The native 100 MB guard runs before FormData construction: this file never reaches the mock.
      transfer.items.add(new File([new Uint8Array(101 * 1024 * 1024)], 'oversized-demo.txt', {type: 'text/plain'}));
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', {bubbles: true}));
    id: eval-script-2
  # Original user-files step 240, source line 314.
  - wait: { text: 'Skipped 1 oversized file (>100 MB): oversized-demo.txt' }
    id: wait-skipped-1-oversized-file-100-mb-oversized-demo-txt
  # Original user-files step 241, source line 315.
  - eval: |
      if (document.querySelector('#onyx-chat-input').textContent.includes('oversized-demo.txt')) throw new Error('Oversized file entered the composer despite the native guard');
    id: eval-script-3
  # Original user-files step 242, source line 317.
  - shot: oversized-file-warning
    id: shot-oversized-file-warning
  # Original user-files step 243, source line 318.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814-2
  # Original user-files step 244, source line 319.
  - click: { text: All Recent Files, exact: true }
    id: click-all-recent-files
  # Original user-files step 245, source line 321.
  - click: { role: button, name: Add Files, exact: true }
    id: click-add-files
  # Original user-files step 246, source line 322.
  - eval: |
      const input = document.querySelector('input[type="file"]:not([accept])');
      if (!input?.multiple) throw new Error('Native library multiple-file input is missing');
      const transfer = new DataTransfer();
      for (const name of ['failed-demo.txt', 'rejected-demo.exe', 'demo-resource.bin', 'learning-example.py', 'learning-demo.json', 'learning-handout.pdf', 'learning-handout.docx', 'learning-workbook.xlsx', 'legacy-handout.doc', 'broken-demo.docx', 'unavailable-demo.txt']) transfer.items.add(new File(['Discarded synthetic caller bytes.'], name));
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', {bubbles: true}));
    id: eval-script-4
  # Original user-files step 247, source line 329.
  - wait: { text: Some files were not uploaded. }
    id: wait-some-files-were-not-uploaded
  # Original user-files step 248, source line 330.
  - shot: upload-format-rejected
    id: shot-upload-format-rejected
  # Original user-files step 249, source line 331.
  - click: { role: button, name: Done, exact: true }
    id: click-done
  # Original user-files step 250, source line 332.
  - wait: { text: 'File failed and was removed: failed-demo.txt', timeout: 20000 }
    id: wait-file-failed-and-was-removed-failed-demo-txt
  # Original user-files step 251, source line 333.
  - eval: |
      if (document.querySelector('#onyx-chat-input').textContent.includes('failed-demo.txt') || document.querySelector('#onyx-chat-input').textContent.includes('rejected-demo.exe')) throw new Error('Failed/rejected optimistic attachments were not removed');
    id: eval-script-5
  # Original user-files step 252, source line 335.
  - shot: failed-upload-removed
    id: shot-failed-upload-removed
  # Original user-files step 253, source line 336.
  - wait: { selector: '#onyx-chat-input-send-button', timeout: 20000 }
    id: wait-onyx-chat-input-send-button
  # Original user-files step 254, source line 337.
  - settle: 4000
