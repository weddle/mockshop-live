  # Original user-files step 255, source line 338.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814-3
  # Original user-files step 256, source line 339.
  - click: { text: All Recent Files, exact: true }
    id: click-all-recent-files-2
  # Original user-files step 257, source line 340.
  - hover: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("demo-resource.bin")' }
    id: hover-role-dialog-role-button-has-opal-attachment-item-button-ha
  # Original user-files step 258, source line 341.
  - click: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("demo-resource.bin") button:has(svg path[d^="M12 8.66667"])' }
    id: click-role-dialog-role-button-has-opal-attachment-item-button-ha
  # Original user-files step 259, source line 342.
  - wait: { text: This file format is not supported for preview., exact: true }
    id: wait-this-file-format-is-not-supported-for-preview
  # Original user-files step 260, source line 343.
  - wait: { role: button, name: Download File, exact: true }
    id: wait-download-file
  # Original user-files step 261, source line 344.
  - shot: unsupported-preview-download
    id: shot-unsupported-preview-download
  # Original user-files step 262, source line 345.
  - press: Escape
    id: press-escape
  - id: eval-script-6-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays: []
  # Owning dirty/reset outcome discards native upload batch.
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const result = await fetch('/api/__mockshop/state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({overlays: (await (await fetch('/api/__mockshop/state')).json()).overlays, anchor: current.demo_anchor, locale: 'en', keep: false, resetChats: true})});
        if (!result.ok) throw new Error('File state control failed');
      })()
    id: eval-script-6
  # Owning dirty/reset outcome discards native upload batch.
  - goto: /app
    id: goto-app-2
  # Owning dirty/reset outcome discards native upload batch.
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox-2
  # Owning dirty/reset outcome discards native upload batch.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814-4
  # Owning dirty/reset outcome discards native upload batch.
  - click: { text: All Recent Files, exact: true }
    id: click-all-recent-files-3
  # Owning dirty/reset outcome discards native upload batch.
  - wait: { placeholder: Search files... }
    id: wait
  # Owning dirty/reset outcome discards native upload batch.
  - wait: { text: library-reading.txt, exact: true }
    id: wait-library-reading-txt
  # Owning dirty/reset outcome discards native upload batch.
  - eval: |
      const library = document.querySelector('[role="dialog"]');
      if (['failed-demo.txt', 'demo-resource.bin', 'learning-handout.docx'].some(name => library.textContent.includes(name)) || !library.textContent.includes('attendance-demo.csv') || !library.textContent.includes('protected-reading.txt')) throw new Error('Fresh reset did not discard native uploads and restore the fictional seed library');
    id: eval-script-7
world: ../../../worlds/seaside/world.yaml
