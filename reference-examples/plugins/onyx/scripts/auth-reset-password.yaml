# #69: Enterprise, LOCAL non-cloud build with NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=true.
# Parent registration is required. All inputs below are fictional and never stored as credentials.
name: auth-reset-password
title: "Independent native #69 unit: auth-reset-password"
strict: true
requires: enterprise
locale: en
viewport: [ 1440, 900 ]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required native logged-out /me response; cookie and fake current user are deliberately cleared.
  - match: '/^http 400 POST http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/auth\/reset-password$/'
    reason: Only this unit’s deliberately staged native endpoint400; the visible error and recovery are required.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; native cleared-cookie and unauthorized identity are asserted.
  - match: '/^console: \[Toast\] Invalid or missing reset token\. \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/_next\/static\/chunks\/0se759_ajj\-mw\.js\]$/'
    reason: Exact deliberately staged native error and source; this unit asserts its visible error and recovery, never STEP/page errors.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/auth\/reset\-password\]$/'
    reason: Exact deliberately staged native error and source; this unit asserts its visible error and recovery, never STEP/page errors.
  - match: '/^console: \[Toast\] LOCAL FAKE DEMO — invalid or expired demo reset link\. \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/_next\/static\/chunks\/0se759_ajj\-mw\.js\]$/'
    reason: Exact deliberately staged native error and source; this unit asserts its visible error and recovery, never STEP/page errors.
  - match: '/^console: \[Toast\] LOCAL FAKE DEMO — use the displayed fictional demo input, not a real password\. \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/_next\/static\/chunks\/0se759_ajj\-mw\.js\]$/'
    reason: Exact deliberately staged native error and source; this unit asserts its visible error and recovery, never STEP/page errors.
# Independent prerequisites: Native Forgot form requests Alex reset link in this run before direct missing/invalid/cancel/success reset states.
steps:
  - state:
      world: ../../../worlds/snapshots/seaside--demo-auth-anonymous.yaml
    id: state
  - goto: /auth/login
    id: goto-auth-login
  - eval: |
      (async () => {
        const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'logged-out'})});
        if (!r.ok) throw new Error('Local fake logged-out staging failed');
        const me = await fetch('/api/me');
        if (me.status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Cookie or /me was not logged out');
      })()
    id: eval-script
  - goto: /auth/forgot-password
    id: goto-auth-forgot-password
  - wait: { selector: 'input[name="email"]' }
    id: wait-input-name-email
  - fill: { selector: 'input[name="email"]', value: "{{people.alex-learner.email}}" }
    id: fill-input-name-email
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password
  - wait: { text: Password reset email sent. Please check your inbox. }
    id: wait-password-reset-email-sent-please-check-your-inbox
  - goto: /auth/reset-password
    id: goto-auth-reset-password
  - wait: { selector: 'input[name="password"]' }
    id: wait-input-name-password
  - shot: auth-reset-direct-empty
    id: shot-auth-reset-direct-empty
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password-2
  - wait: { text: Password is required, exact: true }
    id: wait-password-is-required
  - wait: { text: Confirm Password is required, exact: true }
    id: wait-confirm-password-is-required
  - shot: auth-reset-required
    id: shot-auth-reset-required
  - fill: { selector: 'input[name="password"]', value: MockOnly-Workshop1! }
    id: fill-input-name-password
  - fill: { selector: 'input[name="confirmPassword"]', value: MockOnly-Other1! }
    id: fill-input-name-confirmpassword
  - press: Tab
    id: press-tab
  - wait: { text: Passwords must match, exact: true }
    id: wait-passwords-must-match
  - shot: auth-reset-mismatch
    id: shot-auth-reset-mismatch
  - fill: { selector: 'input[name="confirmPassword"]', value: MockOnly-Workshop1! }
    id: fill-input-name-confirmpassword-2
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password-3
  - wait: { text: Invalid or missing reset token. }
    id: wait-invalid-or-missing-reset-token
  - shot: auth-reset-missing-token
    id: shot-auth-reset-missing-token
  - goto: /auth/reset-password?token=mock-only-invalid
    id: goto-auth-reset-password-token-mock-only-invalid
  - fill: { selector: 'input[name="password"]', value: MockOnly-Workshop1! }
    id: fill-input-name-password-2
  - fill: { selector: 'input[name="confirmPassword"]', value: MockOnly-Workshop1! }
    id: fill-input-name-confirmpassword-3
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password-4
  - wait: { text: 'LOCAL FAKE DEMO — invalid or expired demo reset link.' }
    id: wait-local-fake-demo-invalid-or-expired-demo-reset-link
  - shot: auth-reset-invalid-token
    id: shot-auth-reset-invalid-token
  - eval: window.location.assign('/api/mockshop/auth-anonymous/email-link/reset')
    id: eval-script-2
  - wait: { selector: 'input[name="password"]' }
    id: wait-input-name-password-2
  - fill: { selector: 'input[name="password"]', value: MockOnly-Other1! }
    id: fill-input-name-password-3
  - fill: { selector: 'input[name="confirmPassword"]', value: MockOnly-Other1! }
    id: fill-input-name-confirmpassword-4
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password-5
  - wait: { text: 'LOCAL FAKE DEMO — use the displayed fictional demo input, not a real password.' }
    id: wait-local-fake-demo-use-the-displayed-fictional-demo-input-not-
  - shot: auth-reset-staged-error
    id: shot-auth-reset-staged-error
  - fill: { selector: 'input[name="password"]', value: MockOnly-Workshop1! }
    id: fill-input-name-password-4
  - fill: { selector: 'input[name="confirmPassword"]', value: MockOnly-Workshop1! }
    id: fill-input-name-confirmpassword-5
  - shot: auth-reset-ready
    id: shot-auth-reset-ready
  - click: { role: button, name: Reset Password, exact: true }
    id: click-reset-password-6
  - wait: { text: Password reset successfully. Redirecting to login... }
    id: wait-password-reset-successfully-redirecting-to-login
  - shot: { name: auth-reset-success, delay: 0 }
    id: shot-auth-reset-success
  - wait: { testid: email }
    id: wait
  - shot: auth-reset-success-login
    id: shot-auth-reset-success-login
  - eval: |
      (async () => {
        if (!(await (await fetch('/api/mockshop/auth-anonymous/messages')).json()).reset_complete) throw new Error('Fake reset result did not persist');
      })()
    id: eval-script-3
  - goto: /auth/reset-password?token=mock-only-reset-workshop
    id: goto-auth-reset-password-token-mock-only-reset-workshop
  - click: { role: link, name: Back to Login, exact: true }
    id: click-back-to-login
  - wait: { testid: email }
    id: wait-2
  - shot: auth-reset-cancel-login
    id: shot-auth-reset-cancel-login
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-auth-anonymous.yaml
