  # Positive decoded/rendered composer thumbnail witness before original shot17.
  - eval: |
      (async () => {
        const image = document.querySelector('#onyx-chat-input img[alt="learning-diagram.svg"]');
        if (!image) throw new Error('Native composer image is missing');
        await image.decode();
        await new Promise(requestAnimationFrame);
        const bounds = image.getBoundingClientRect();
        const style = getComputedStyle(image);
        if (!image.complete || image.naturalWidth !== 640 || image.naturalHeight !== 360 || bounds.width <= 0 || bounds.height <= 0 || style.visibility !== 'visible' || Number(style.opacity) === 0) throw new Error('Composer thumbnail did not decode and render the synthetic diagram');
      })()
