# #34 true-Community per-user-route witness. EDITONLY authored; UNEXECUTED/UNACCEPTED.
# Parent owns matching physical CE artifact selection, schema validation and complete strict native/image proof.
# Independent native runner prelude resets unit overlays/clock/locale. Keep uses existing state DSL;
# fresh tails use existing /api/__mockshop/state keep:false plus native full navigation.
# No continue_on_error, fixed-settle-only success, private React, clips or acceptance/closure claim.
# Original row17 /craft and all twelve existing /craft/v1 route branches.
# Necessary independent enabled ADMIN seed, not anonymous/admin login-200 success.
# /apps/manage and /apps/admin source-alias to /admin/craft/apps. Callback asserts native query guard.
# Minimal native library folder write/reopen/keep/fresh; no provider/model/job lifecycle replay.
name: community-user-routes-extras-craft
title: True Community Craft root, expanded native routes, admin aliases and small library write
requires: community
strict: true
locale: en
viewport:
  - 1440
  - 1000
known_errors:
  - match: /^http 404 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/license$/
    reason: Compiled self-hosted CE has the native absent license route (base00-core125). AdminSidebar.tsx59-67 calls useLicense.ts14-25, disables retry and derives no license; both actual native Craft ADMIN aliases assert exact404 DTO, canonical route/Add app and protected existing ADMIN/Community flags. No other URI/status is allowed.
  - match: '/^console: Failed to load resource: the server responded with a status of 404 \(Not Found\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/license\]$/'
    reason: Exact resource diagnostic of that same native CE no-license state, paired with operable native ADMIN alias and protected existing actor/edition assertions.
