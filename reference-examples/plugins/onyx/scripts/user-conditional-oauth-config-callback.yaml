# #34 EDITONLY prepared native unit; no execution/acceptance claim. CE/other locales unverified.
# Fictional LOCAL inputs only. Every run independently resets the same sole Auth owner.
name: user-conditional-oauth-config-callback
title: User Conditional Oauth Config Callback
requires: enterprise
strict: true
locale: en
viewport:
  - 1440
  - 900
overlays:
  - edition-enterprise
known_errors:
  - match: /^http 400 POST http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-config\/callback\?code=mock-only-generic&state=mock-only-conditional-state$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-config\/callback\?code=mock-only-generic&state=mock-only-conditional-state\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
  - match: '/^console: OAuth callback error: Error: LOCAL FAKE DEMO — fictional callback refused\.\n    at http:\/\/127\.0\.0\.1:3328\/_next\/static\/chunks\/3sce-5n-fcn8g\.js:2:2423 \[source: http:\/\/127\.0\.0\.1:3328\/_next\/static\/chunks\/3sce-5n-fcn8g\.js\]$/'
    reason: Exact independent8f4e6c3 native Error message/newline/stack/source from OAuthCallbackPage.tsx193. Required native refused-callback UI and unchanged callback receipt remain asserted; no other console event is allowed.
steps:
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
    id: eval-script
  - goto: /oauth-config/callback
    id: goto-oauth-config-callback
  - wait:
      text: Invalid Request
      exact: true
    id: wait-invalid-request
  - shot:
      name: conditional-oauth-config-missing
      delay: 0
    id: shot-conditional-oauth-config-missing
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length === 0)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-2
  - click:
      role: button
      name: Back to Chat
      exact: true
    id: click-back-to-chat
  - wait:
      selector: '#onyx-chat-input-textbox'
    id: wait-onyx-chat-input-textbox
  - shot:
      name: conditional-oauth-config-back
      delay: 0
    id: shot-conditional-oauth-config-back
  - goto: /oauth-config/callback?error=access_denied&error_description=LOCAL%20FAKE%20DEMO%20cancelled
    id: goto-oauth-config-callback-error-access-denied-error-description
  - wait:
      text: LOCAL FAKE DEMO cancelled
      exact: true
    id: wait-local-fake-demo-cancelled
  - shot:
      name: conditional-oauth-config-cancelled
      delay: 0
    id: shot-conditional-oauth-config-cancelled
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length === 0)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-3
  - goto: /oauth-config/callback?code=mock-only-generic&state=mock-only-conditional-state
    id: goto-oauth-config-callback-code-mock-only-generic-state-mock-onl
  - wait:
      text: LOCAL FAKE DEMO — fictional callback refused.
      exact: true
    id: wait-local-fake-demo-fictional-callback-refused
  - shot:
      name: conditional-oauth-config-generic
      delay: 0
    id: shot-conditional-oauth-config-generic
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length === 0)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-4
  - goto: /oauth-config/callback?code=mock-only-success&state=mock-only-conditional-state
    id: goto-oauth-config-callback-code-mock-only-success-state-mock-onl
  - wait:
      text: Completing Authorization...
      exact: true
    id: wait-completing-authorization
  - shot:
      name: conditional-oauth-config-processing
      delay: 0
    id: shot-conditional-oauth-config-processing
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length === 0)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-5
  - wait:
      text: Authorization Successful!
      exact: true
      timeout: 30000
    id: wait-authorization-successful
  - shot:
      name: conditional-oauth-config-fictional-receipt
      delay: 0
    id: shot-conditional-oauth-config-fictional-receipt
  - wait:
      text: "{{people.alex-learner.email}}"
      exact: true
    id: wait-alex-learner-workshop-example
  - eval: if (location.pathname !== '/app/settings/accounts-access' || new URL(location.href).searchParams.get('message') !== 'oauth_connected') throw new Error('Native callback did not follow LOCAL fixture return');
    id: eval-script-6
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.callbacks["oauth-config"] === true)) throw new Error('Native interaction receipt mismatch'); })()
    id: eval-script-7
  - shot:
      name: conditional-oauth-config-local-return
      delay: 0
    id: shot-conditional-oauth-config-local-return
  - id: eval-script-8-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
    id: eval-script-8
  - goto: /oauth-config/callback
    id: goto-oauth-config-callback-2
  - wait:
      text: Invalid Request
      exact: true
    id: wait-invalid-request-2
  - shot:
      name: conditional-oauth-config-fresh-reset
      delay: 0
    id: shot-conditional-oauth-config-fresh-reset
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-user-conditional.yaml
