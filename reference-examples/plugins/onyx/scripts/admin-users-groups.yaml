# Independent #59 native unit. Runner starts fresh base state; no preceding unit is required.
name: admin-users-groups
title: Native Users membership add, combined removal, inline editor and reset
strict: true
requires: enterprise
locale: en
steps:
  - goto: /admin/users
    id: goto-admin-users
  - wait: { text: Users & Requests, exact: true }
    id: wait-users-requests
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users
  - click: { role: button, name: User actions, exact: true }
    id: click-user-actions
  - click: { text: Groups & Roles, exact: true }
    id: click-groups-roles
  - wait: { text: "Edit User's Groups", exact: true }
    id: wait-edit-user-s-groups
  - shot: users-groups-dialog
    id: shot-users-groups-dialog
  - fill: { selector: 'input[placeholder="Search groups to join..."]', value: "{{teams.front-office.name}}" }
    id: fill-input-placeholder-search-groups-to-join
  - click: { text: "{{teams.front-office.name}}", exact: true }
    id: click-front-office
  - press: Escape
    id: press-escape
  - click: { role: button, name: Save Changes, exact: true }
    id: click-save-changes
  - wait: { text: User updated, exact: true }
    id: wait-user-updated
  - shot: users-groups-saved
    id: shot-users-groups-saved
  - goto: /admin/users
    id: goto-admin-users-2
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users-2
  - wait: { text: "{{teams.front-office.name}}", exact: true }
    id: wait-front-office
  - shot: users-groups-persisted
    id: shot-users-groups-persisted
  - click: { selector: '[aria-label="Edit groups"]' }
    id: click-aria-label-edit-groups
  - wait: { text: "Edit User's Groups", exact: true }
    id: wait-edit-user-s-groups-2
  - shot: users-inline-groups
    id: shot-users-inline-groups
  - click: { role: button, name: Cancel, exact: true }
    id: click-cancel
  - click: { role: button, name: User actions, exact: true }
    id: click-user-actions-2
  - click: { text: Groups & Roles, exact: true }
    id: click-groups-roles-2
  - click: { selector: '[role="dialog"] [role="button"]:has-text("{{teams.front-office.name}}")' }
    id: click-role-dialog-role-button-has-text-front-office
  - shot: users-groups-remove-controls
    id: shot-users-groups-remove-controls
  - click: { role: button, name: Save Changes, exact: true }
    id: click-save-changes-2
  - wait: { text: User updated, exact: true }
    id: wait-user-updated-2
  - shot: users-group-removed
    id: shot-users-group-removed
  - goto: /admin/users
    id: goto-admin-users-3
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users-3
  - wait_gone: { text: "{{teams.front-office.name}}", exact: true }
    id: wait-gone-front-office
  - wait: { text: "{{teams.training.name}}", exact: true }
    id: wait-training
  - shot: users-group-removal-persisted
    id: shot-users-group-removal-persisted
  # Training has the real seeded connector108. Removing its member must retain that connector.
  - click: { role: button, name: User actions, exact: true }
    id: click-user-actions-3
  - click: { text: Groups & Roles, exact: true }
    id: click-groups-roles-3
  - click: { selector: '[role="dialog"] [role="button"]:has-text("{{teams.training.name}}")' }
    id: click-role-dialog-role-button-has-text-training
  - click: { role: button, name: Save Changes, exact: true }
    id: click-save-changes-3
  - wait: { text: User updated, exact: true }
    id: wait-user-updated-3
  - goto: /admin/users
    id: goto-admin-users-4
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users-4
  - wait_gone: { text: "{{teams.training.name}}", exact: true }
    id: wait-gone-training
  - eval: |
      (async () => {
        const res = await fetch('/api/manage/admin/user-group');
        if (!res.ok) throw new Error('{{teams.training.name}} group read failed');
        const group = (await res.json()).find(({id}) => id === 1);
        if (!(group?.cc_pairs || []).some(pair => pair.id === 108)) throw new Error('Native member removal lost the {{teams.training.name}} connector');
      })()
    id: eval-script
  - shot: users-training-removed-connectors-retained
    id: shot-users-training-removed-connectors-retained
  - id: eval-script-2-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays: []
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,strict:true,locale:'en'})});
        if (!res.ok) throw new Error('Mock reset failed');
        location.reload();
      })()
    id: eval-script-2
  - wait: { text: Users & Requests, exact: true }
    id: wait-users-requests-2
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
    id: fill-input-placeholder-search-users-5
  - wait: { text: "{{teams.training.name}}", exact: true }
    id: wait-training-2
  - wait_gone: { text: "{{teams.front-office.name}}", exact: true }
    id: wait-gone-front-office-2
  - shot: users-membership-reset
    id: shot-users-membership-reset
world: ../../../worlds/seaside/world.yaml
