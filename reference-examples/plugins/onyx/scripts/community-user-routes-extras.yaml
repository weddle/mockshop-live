# #34 true-Community per-user-route witness. EDITONLY authored; UNEXECUTED/UNACCEPTED.
# Parent owns matching physical CE artifact selection, schema validation and complete strict native/image proof.
# Independent native runner prelude resets unit overlays/clock/locale. Keep uses existing state DSL;
# fresh tails use existing /api/__mockshop/state keep:false plus native full navigation.
# No continue_on_error, fixed-settle-only success, private React, clips or acceptance/closure claim.
# Original route rows 16,18,19: /anonymous/demo and both NRF surfaces.
# HTTP-only native settings/reading controls; no postMessage or fabricated trusted parent.
# Source15 CE lacks required NRF13 no-provider footer pointer and NRF14 regeneration/branch
# and shared multi-model attribution consumer patches. These controls plus genuine
# chrome-extension:// parent-origin interactions remain explicitly UNVERIFIED here.
# Backend fresh reset deliberately does not clear NRF's browser-local preference; restore natively.
name: community-user-routes-extras
title: True Community NRF HTTP routes and original anonymous demo entry
requires: community
strict: true
locale: en
viewport:
  - 1440
  - 1000
known_errors:
  - match: /^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/
    reason: Required source-native logged-out /me; sole fake stage clears cookie and unit positively asserts 401/login UI. No unrelated endpoint/status is allowed.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?\]$/'
    reason: Exact same required logged-out /me diagnostic, paired with positive native logged-out boundary.
  - match: /^http 404 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/enterprise-settings$/
    reason: Native CE auth-path branding probe (settings/hooks.ts70-90), with absent route404 mapped to default Onyx/no-error (37-39,116-120). Final native logged-out login shot asserts default branding, exact404 DTO and protected Community flags; no other URI/status is allowed.
  - match: '/^console: Failed to load resource: the server responded with a status of 404 \(Not Found\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/enterprise-settings\]$/'
    reason: Exact resource diagnostic of that native CE branding absence, paired with default Onyx login,404 DTO and unchanged Community flags assertion.
steps:
  - goto: /nrf
    id: goto-nrf
  - wait:
      selector: '#onyx-chat-input-textbox'
    id: wait-onyx-chat-input-textbox
  - eval: (async()=>{const r=await fetch('/api/settings'); if(!r.ok) throw new Error('Community settings prerequisite missing'); const v=await r.json(); if(v.tier!=='community'||v.ee_features_enabled!==false||v.application_status!=='active') throw new Error('Not a Community fixture/licensing state');})()
    id: eval-script
  - eval: if([...document.querySelectorAll('#onyx-chat-input button')].some(b=>b.textContent.trim()==='Read this tab')) throw new Error('New-tab route exposed side-panel-only context control');
    id: eval-script-2
  - shot:
      name: ce-nrf-new-tab
      full_page: true
    id: shot-ce-nrf-new-tab
  - click:
      selector: .absolute.top-0.end-0.p-4 button
    id: click-absolute-top-0-end-0-p-4-button
  - wait:
      text: Use Onyx as new tab page
    id: wait-use-onyx-as-new-tab-page
  - wait:
      selector: '[role="switch"][aria-checked="true"]'
    id: wait-role-switch-aria-checked-true
  - shot:
      name: ce-nrf-native-settings
      full_page: true
    id: shot-ce-nrf-native-settings
  - click:
      role: switch
    id: click
  - wait:
      role: button
      name: Turn off
      exact: true
    id: wait-turn-off
  - shot:
      name: ce-nrf-turn-off-native-confirm
      full_page: true
    id: shot-ce-nrf-turn-off-native-confirm
  - click:
      role: button
      name: Cancel
      exact: true
    id: click-cancel
  - wait:
      selector: '[role="switch"][aria-checked="true"]'
    id: wait-role-switch-aria-checked-true-2
  - eval: if(localStorage.getItem('useOnyxAsDefaultNewTab')==='false') throw new Error('Native Cancel changed new-tab preference');
    id: eval-script-3
  - shot:
      name: ce-nrf-turn-off-cancel-protected
      full_page: true
    id: shot-ce-nrf-turn-off-cancel-protected
  - click:
      role: switch
    id: click-2
  - click:
      role: button
      name: Turn off
      exact: true
    id: click-turn-off
  - wait:
      selector: '[role="switch"][aria-checked="false"]'
    id: wait-role-switch-aria-checked-false
  - eval: if(localStorage.getItem('useOnyxAsDefaultNewTab')!=='false') throw new Error('Native Turn off did not persist browser-local preference');
    id: eval-script-4
  - shot:
      name: ce-nrf-browser-preference-off
      full_page: true
    id: shot-ce-nrf-browser-preference-off
  - eval: location.reload()
