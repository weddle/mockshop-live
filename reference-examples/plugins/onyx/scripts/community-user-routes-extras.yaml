    id: eval-script-11
  - eval: (async()=>{const m=await (await fetch('/api/me')).json(); if(!m.is_anonymous_user||m.role!=='basic'||m.is_admin||m.admin_capabilities.length) throw new Error('Original anonymous/demo did not enter the genuine unprivileged fake guest consumer');})()
