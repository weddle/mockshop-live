  - id: eval-script-10-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-mcp-admin.yaml
      overlays:
        - edition-enterprise
  - eval: |
      (async () => {
        const state = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({overlays: (await (await fetch('/api/__mockshop/state')).json()).overlays, locale: state.locale, anchor: state.demo_anchor})
        });
        if (!response.ok) throw new Error('Cannot reset fictional group state');
        window.location.href = '/admin/groups';
      })()
    id: eval-script-10
  - wait: { text: "{{teams.training.name}}", exact: true }
    id: wait-training-2
  - wait_gone: { text: "{{teams.training.name}} Workshop", exact: true }
