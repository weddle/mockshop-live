    id: fill-16
  - click: { selector: '[aria-label="{{teams.property-operations.name}}"]' }
    id: click-aria-label-property-operations-2
  - press: Escape
    id: press-escape-5
  - fill: { placeholder: Add agents, value: Guest Ops }
    id: fill-17
  - click: { selector: '[aria-label="Guest Ops Copilot"]' }
    id: click-aria-label-guest-ops-copilot-2
  - press: Escape
    id: press-escape-6
  - shot: groups-create-resources
    id: shot-groups-create-resources
  - click: { role: button, name: Create, exact: true }
    id: click-create
  - wait: { text: Learning Lab, exact: true }
    id: wait-learning-lab
  - shot: groups-created-list
    id: shot-groups-created-list
  - goto: /admin/groups/4
    id: goto-admin-groups-4
  - wait: { text: "{{people.priya.name}}", exact: true }
    id: wait-priya-raman
  - shot: groups-created-detail
    id: shot-groups-created-detail
  - scroll: { text: Shared with This Group, exact: true }
    id: scroll-shared-with-this-group-7
  - shot: groups-created-resources
    id: shot-groups-created-resources
  - eval: |
      (async () => {
        const groups = await (await fetch('/api/manage/admin/user-group?include_default=true')).json();
        const g = groups.find(g => g.id === 4);
        if (!g.users.some(u => u.id === 'u3') || !g.cc_pairs.some(c => c.id === 102) ||
            !g.document_sets.some(d => d.id === 22) || !g.personas.some(a => a.id === 12))
          throw new Error('Native created group did not retain selected members/resources');
      })()
    id: eval-script-9
  - click: { role: button, name: Delete Group, exact: true }
    id: click-delete-group
  - wait: { role: button, name: Delete, exact: true }
