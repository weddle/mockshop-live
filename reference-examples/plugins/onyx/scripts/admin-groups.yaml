  - goto: /ee/admin/groups/create
    id: goto-ee-admin-groups-create
  - wait: { text: Create Group, exact: true }
    id: wait-create-group-4
  - shot: ee-groups-create
    id: shot-ee-groups-create
  # Stage the native empty list using native delete confirmations, not fixture-only screenshots.
  - goto: /admin/groups/1
    id: goto-admin-groups-1-3
  - click: { role: button, name: Delete Group, exact: true }
    id: click-delete-group-2
  - click: { role: button, name: Delete, exact: true }
    id: click-delete-2
  - goto: /admin/groups/2
    id: goto-admin-groups-2
