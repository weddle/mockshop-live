    id: wait-no-groups-found
  - shot: groups-no-results
    id: shot-groups-no-results
  - fill: { placeholder: Search groups..., value: "" }
    id: fill-3
  - click: { role: button, name: View group, exact: true, nth: 0 }
    id: click-view-group
  - wait: { placeholder: Search members... }
    id: wait
  - shot: groups-detail-members
    id: shot-groups-detail-members
  - fill: { placeholder: Search members..., value: nobody-found }
    id: fill-4
  - wait: { text: No members, exact: true }
    id: wait-no-members
  - shot: groups-members-no-results
    id: shot-groups-members-no-results
  - fill: { placeholder: Search members..., value: "" }
    id: fill-5
  - click: { role: button, name: Add, exact: true }
    id: click-add
  - fill: { placeholder: Search users and accounts..., value: lena.brooks }
    id: fill-6
  - wait: { text: "{{people.lena.name}}", exact: true }
    id: wait-lena-brooks
  - click: { selector: 'tbody [role="checkbox"]' }
    id: click-tbody-role-checkbox
  - shot: groups-member-selection
    id: shot-groups-member-selection
  - click: { role: button, name: Done, exact: true }
    id: click-done
  - scroll: { text: Group Permissions, exact: true }
    id: scroll-group-permissions
  - wait: { text: Create Agents, exact: true }
    id: wait-create-agents
  - shot: groups-permissions-loaded
    id: shot-groups-permissions-loaded
  - eval: |
      (() => {
        const label = [...document.querySelectorAll('*')].find(e => e.textContent === 'Manage Groups' && e.children.length === 0);
        let row = label;
        while (row && !row.querySelector('[role="switch"]')) row = row.parentElement;
        const control = row?.querySelector('[role="switch"]');
        if (!control) throw new Error('Native Manage Groups permission toggle not found');
        control.click();
      })()
    id: eval-script
  - scroll: { text: Shared with This Group, exact: true }
    id: scroll-shared-with-this-group
  - wait: { placeholder: "Add connectors, document sets" }
    id: wait-2
  - shot: groups-resources-loaded
    id: shot-groups-resources-loaded
  - fill: { placeholder: "Add connectors, document sets", value: nonexistent-resource }
    id: fill-7
  - wait: { text: No results found, exact: true }
    id: wait-no-results-found
  - shot: groups-resources-no-results
    id: shot-groups-resources-no-results
  - fill: { placeholder: "Add connectors, document sets", value: OPS }
    id: fill-8
  - click: { selector: '[aria-label="Confluence – OPS space"]' }
    id: click-aria-label-confluence-ops-space
  - press: Escape
    id: press-escape
  - fill: { placeholder: "Add connectors, document sets", value: "{{teams.property-operations.name}}" }
    id: fill-9
  - click: { selector: '[aria-label="{{teams.property-operations.name}}"]' }
    id: click-aria-label-property-operations
  - press: Escape
    id: press-escape-2
  - fill: { placeholder: Add agents, value: Guest Ops }
    id: fill-10
  - click: { selector: '[aria-label="Guest Ops Copilot"]' }
    id: click-aria-label-guest-ops-copilot
  - press: Escape
    id: press-escape-3
  - shot: groups-resource-selection
    id: shot-groups-resource-selection
  - scroll: { text: Token Rate Limit, exact: true }
    id: scroll-token-rate-limit
  - fill: { placeholder: Token limit (thousands), value: "120" }
    id: fill-11
  - click: { role: button, name: Add Limit, exact: true }
    id: click-add-limit
  - shot: groups-token-limit-add
    id: shot-groups-token-limit-add
  - eval: |
      (() => {
        const fields = [...document.querySelectorAll('input[placeholder="Token limit (thousands)"]')];
        let row = fields[fields.length - 1]?.parentElement;
        while (row && row.querySelectorAll('input').length < 3) row = row.parentElement;
        if (!row) throw new Error('Native token limit removal control not found');
        [...row.querySelectorAll('button')].at(-1).click();
      })()
    id: eval-script-2
  - scroll: { text: Incognito Chats, exact: true }
    id: scroll-incognito-chats
  - eval: |
      (() => {
        const label = [...document.querySelectorAll('*')].find(e => e.textContent === 'Incognito Chats' && e.children.length === 0);
        let row = label;
        while (row && !row.querySelector('[role="switch"]')) row = row.parentElement;
        if (!row) throw new Error('Native incognito toggle not found');
        row.querySelector('[role="switch"]').click();
      })()
    id: eval-script-3
  - fill: { placeholder: Name your group, value: "{{teams.training.name}} Workshop" }
    id: fill-12
  - click: { role: button, name: Save Changes, exact: true }
    id: click-save-changes
  - wait: { text: "{{teams.training.name}} Workshop", exact: true }
    id: wait-training-workshop
  - goto: /admin/groups/1
    id: goto-admin-groups-1
  - wait: { text: "{{people.lena.name}}", exact: true }
    id: wait-lena-brooks-2
  - shot: groups-saved-members
    id: shot-groups-saved-members
  - click: { selector: 'tr:has-text("{{people.lena.name}}") button[aria-label="Make manager"]' }
    id: click-tr-has-text-lena-brooks-button-aria-label-make-manager
  - wait: { selector: 'tr:has-text("{{people.lena.name}}") button[aria-label="Revoke manager"]' }
    id: wait-tr-has-text-lena-brooks-button-aria-label-revoke-manager
  - shot: groups-manager-assigned
    id: shot-groups-manager-assigned
  - scroll: { text: Group Permissions, exact: true }
    id: scroll-group-permissions-2
  - wait: { text: Manage Groups, exact: true }
    id: wait-manage-groups
  - shot: groups-saved-permissions
    id: shot-groups-saved-permissions
  - scroll: { text: Shared with This Group, exact: true }
    id: scroll-shared-with-this-group-2
  - shot: groups-saved-resources
    id: shot-groups-saved-resources
  - scroll: { text: Token Rate Limit, exact: true }
    id: scroll-token-rate-limit-2
  - shot: groups-saved-token-limit
    id: shot-groups-saved-token-limit
  - eval: |
      (async () => {
        const groups = await (await fetch('/api/manage/admin/user-group?include_default=true')).json();
        const g = groups.find(g => g.id === 1);
        const perms = await (await fetch('/api/manage/admin/user-group/1/permissions')).json();
        const limits = await (await fetch('/api/admin/token-rate-limits/user-group/1')).json();
        if (g.name !== '{{teams.training.name}} Workshop' || !g.users.some(u => u.id === 'u4') ||
            !g.cc_pairs.some(c => c.id === 102) || !g.document_sets.some(d => d.id === 22) ||
            !g.personas.some(a => a.id === 12) || !perms.includes('manage:user_groups') ||
            limits.length !== 1 || limits[0].token_budget !== 120 || !g.incognito_enabled)
          throw new Error('Saved fictional group fields were not retained');
      })()
    id: eval-script-4
  - click: { selector: 'tr:has-text("{{people.lena.name}}") button[aria-label="Revoke manager"]' }
    id: click-tr-has-text-lena-brooks-button-aria-label-revoke-manager
  - wait: { selector: 'tr:has-text("{{people.lena.name}}") button[aria-label="Make manager"]' }
    id: wait-tr-has-text-lena-brooks-button-aria-label-make-manager
  - click: { selector: 'tr:has-text("{{people.lena.name}}") button[aria-label="Remove member"]' }
    id: click-tr-has-text-lena-brooks-button-aria-label-remove-member
  - eval: |
      (() => {
        let row = document.querySelector('input[placeholder="Token limit (thousands)"]')?.parentElement;
        while (row && row.querySelectorAll('input').length < 3) row = row.parentElement;
        if (!row) throw new Error('Saved token limit removal control not found');
        [...row.querySelectorAll('button')].at(-1).click();
      })()
    id: eval-script-5
  - scroll: { text: Shared with This Group, exact: true }
    id: scroll-shared-with-this-group-3
  - eval: |
      (() => {
        for (const title of ['Confluence – OPS space', '{{teams.property-operations.name}}', 'Guest Ops Copilot']) {
          const label = [...document.querySelectorAll('*')].find(e => e.textContent === title && e.children.length === 0);
          let card = label;
          while (card && !card.classList.contains('min-w-[240px]')) card = card.parentElement;
          const button = card?.querySelector('button');
          if (!button) throw new Error(`Native resource remove control not found: ${title}`);
          button.click();
        }
      })()
    id: eval-script-6
  - shot: groups-resource-removal
    id: shot-groups-resource-removal
  - click: { role: button, name: Save Changes, exact: true }
    id: click-save-changes-2
  - goto: /admin/groups/1
    id: goto-admin-groups-1-2
  - wait_gone: { text: "{{people.lena.name}}", exact: true }
    id: wait-gone-lena-brooks
  - shot: groups-member-and-limit-removed
    id: shot-groups-member-and-limit-removed
  - scroll: { text: Shared with This Group, exact: true }
    id: scroll-shared-with-this-group-4
  - shot: groups-resources-removed-saved
    id: shot-groups-resources-removed-saved
  - eval: |
      (async () => {
        const groups = await (await fetch('/api/manage/admin/user-group?include_default=true')).json();
        const g = groups.find(g => g.id === 1);
        const limits = await (await fetch('/api/admin/token-rate-limits/user-group/1')).json();
        if (g.cc_pairs.some(c => c.id === 102) || g.document_sets.some(d => d.id === 22) ||
            g.personas.some(a => a.id === 12) || limits.length !== 0)
          throw new Error('Removed fictional resources/token limit returned after reopen');
      })()
    id: eval-script-7
  - goto: /admin/groups/3
    id: goto-admin-groups-3
  - wait: { text: "{{people.sam.name}}", exact: true }
    id: wait-sam-okafor
  - scroll: { text: Group Permissions, exact: true }
    id: scroll-group-permissions-3
  - shot: groups-empty-permissions
    id: shot-groups-empty-permissions
  - scroll: { text: Shared with This Group, exact: true }
    id: scroll-shared-with-this-group-5
  - wait: { text: No connectors or document sets added, exact: true }
    id: wait-no-connectors-or-document-sets-added
  - shot: groups-empty-resources
    id: shot-groups-empty-resources
  - goto: /admin/groups
    id: goto-admin-groups-2
  - click: { role: button, name: New Group, exact: true }
    id: click-new-group
  - wait: { text: Create Group, exact: true }
    id: wait-create-group
  - shot: groups-create-menu
    id: shot-groups-create-menu
  - eval: |
      (() => {
        const create = [...document.querySelectorAll('button')].find(b => b.textContent.trim() === 'Create');
        if (!create?.disabled) throw new Error('Native Create must require a nonblank group name');
      })()
    id: eval-script-8
  - fill: { placeholder: Name your group, value: Learning Lab }
    id: fill-13
  - fill: { placeholder: Search users and accounts..., value: priya.raman }
    id: fill-14
  - click: { selector: 'tbody [role="checkbox"]' }
    id: click-tbody-role-checkbox-2
