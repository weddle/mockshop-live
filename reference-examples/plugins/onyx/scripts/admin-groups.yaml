    id: click-delete-group-3
  - click: { role: button, name: Delete, exact: true }
    id: click-delete-3
  - goto: /admin/groups/3
    id: goto-admin-groups-3-2
  - click: { role: button, name: Delete Group, exact: true }
    id: click-delete-group-4
  - click: { role: button, name: Delete, exact: true }
    id: click-delete-4
  - wait: { text: Create groups to organize users and manage access., exact: true }
    id: wait-create-groups-to-organize-users-and-manage-access
  - shot: groups-empty-list
    id: shot-groups-empty-list
  - click: { role: button, name: New Group, exact: true }
    id: click-new-group-2
  - fill: { placeholder: Name your group, value: Empty Workshop }
    id: fill-18
  - click: { role: button, name: Create, exact: true }
    id: click-create-2
  - wait: { text: Empty Workshop, exact: true }
    id: wait-empty-workshop
  - goto: /admin/groups/5
    id: goto-admin-groups-5
  - wait: { text: No members, exact: true }
    id: wait-no-members-2
  - shot: groups-empty-members
