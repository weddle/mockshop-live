  - goto: /admin/groups
    id: goto-admin-groups
  - wait: { text: "{{teams.front-office.name}}", exact: true }
    id: wait-front-office
  - shot: groups-direct
    id: shot-groups-direct
  - fill: { placeholder: Search groups..., value: Property }
    id: fill
  - wait_gone: { text: "{{teams.training.name}}", exact: true }
    id: wait-gone-training
