  - shot: groups2-list
    id: shot-groups2-list
  - goto: /admin/groups2/2
    id: goto-admin-groups2-2
  - wait: { text: "{{people.lena.name}}", exact: true }
    id: wait-lena-brooks-3
  - shot: groups2-detail
    id: shot-groups2-detail
  - goto: /admin/groups2/create
    id: goto-admin-groups2-create
  - wait: { text: Create Group, exact: true }
    id: wait-create-group-3
  - shot: groups2-create
    id: shot-groups2-create
  - goto: /ee/admin/groups
    id: goto-ee-admin-groups
  - wait: { text: "{{teams.training.name}} Workshop", exact: true }
    id: wait-training-workshop-3
  - shot: ee-groups-list
