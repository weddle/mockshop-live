# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-task-history-error
title: "Craft native run-history read error and Try again recovery"
requires: enterprise
strict: true
locale: en
viewport: [ 1440, 900 ]
overlays:
  - edition-enterprise
known_errors:
  - match: "/^http 500 GET http:\\/\\/127\\.0\\.0\\.1:3370\\/api\\/build\\/scheduled-tasks\\/task-clinic\\/runs\\?limit=50$/"
    reason: "Only this independently staged exact seeded task run-history read500 with the actual source limit50 query; positive native Failed to load run history. before original629. Exact status, verb, loopback port field and native path/query only; all other HTTP problems, console errors and failed steps remain strict."
  - match: "/^console: Failed to load resource: the server responded with a status of 500 \\(Internal Server Error\\) \\[source: http:\\/\\/127\\.0\\.0\\.1:3370\\/api\\/build\\/scheduled-tasks\\/task-clinic\\/runs\\?limit=50\\]$/"
    reason: "Actual 7.9s scoped DEV observed this native console source URL alongside the exact staged history GET500 with limit50 and positive native history error/retry. Only this unit/status/message/owned-port/path/query; unlocated or other-source console remains strict."
steps:
  - goto: "/app"
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-mcp-admin--demo-user-craft.yaml
      overlays:
        - edition-enterprise
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = (await (await fetch('/api/__mockshop/state')).json()).overlays;
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
    id: eval-script
  - eval: |
      (async () => { await fetch('/api/mockshop/user-craft/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:'/build/scheduled-tasks/:id/runs',state:'error'})}); })()
    id: eval-script-2
  - goto: /craft/v1/tasks/task-clinic
    id: goto-craft-v1-tasks-task-clinic
  - wait: { "text": "Failed to load run history.", "exact": true }
    id: wait-failed-to-load-run-history
  - shot: craft-task-run-history-error
    id: shot-craft-task-run-history-error
  - eval: |
      (async () => { await fetch('/api/mockshop/user-craft/stage', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'/build/scheduled-tasks/:id/runs',state:'loaded'})}); })()
    id: eval-script-3
  - click: { role: button, name: Try again, exact: true }
    id: click-try-again
  - wait: { selector: '[data-run-status="FAILED"]' }
    id: wait-data-run-status-failed
  - shot: craft-task-run-history-retry-loaded
    id: shot-craft-task-run-history-retry-loaded
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
    id: eval-script-4
  - goto: "/craft/v1/tasks"
    id: goto-craft-v1-tasks
  - wait: { text: Clinic teaching checklist, exact: true }
    id: wait-clinic-teaching-checklist
  - shot: "craft-unit-task-history-error-reset"
    id: shot-craft-unit-task-history-error-reset
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-mcp-admin.yaml
    - ../../../worlds/onyx-overrides/demo-user-craft.yaml
