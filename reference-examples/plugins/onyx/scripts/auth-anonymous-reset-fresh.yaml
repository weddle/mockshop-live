# #69: Enterprise, LOCAL non-cloud Auth artifact; all inputs are fictional.
# The runner's real scenario-start reset clears prior dirty Auth/chat state.
# Run independently; parent also proves dirty auth-anonymous-reset -> this unit on the same fake server.
name: auth-anonymous-reset-fresh
title: "Independent native #69 unit: fresh Auth and anonymous chat reset"
strict: true
requires: enterprise
locale: en
viewport: [ 1440, 900 ]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required native logged-out /me response after real scenario-start reset.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; reset flags and cleared identity are asserted.
steps:
  # This is only a live overlay switch. Fresh clearing already occurred at scenario start.
  - state:
      world: ../../../worlds/snapshots/seaside--demo-auth-anonymous.yaml
    id: state
  - goto: /auth/login
    id: goto-auth-login
  - eval: |
      (async () => {
        const staged = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'logged-out'})});
        if (!staged.ok) throw new Error('Local fake logged-out staging failed');
        const box = await (await fetch('/api/mockshop/auth-anonymous/messages')).json();
        const meStatus = (await fetch('/api/me')).status;
        if (box.mode !== 'logged-out' || box.messages.length || box.verified || box.reset_complete || meStatus !== 401) throw new Error('Fresh reset leaked fake auth/email-link state: ' + JSON.stringify({mode:box.mode, messages:box.messages.length, verified:box.verified, reset_complete:box.reset_complete, me_status:meStatus}));
      })()
    id: eval-script
  - goto: /auth/login
    id: goto-auth-login-2
  - wait: { testid: email }
    id: wait
  - shot: auth-reset-isolated-login
    id: shot-auth-reset-isolated-login
  - goto: /anonymous/workshop-demo
    id: goto-anonymous-workshop-demo
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox
  - eval: |
      if (document.querySelector('[data-testid="onyx-ai-message"]')) throw new Error('Anonymous reset leaked chat content');
    id: eval-script-2
  - shot: anonymous-reset-empty-chat
    id: shot-anonymous-reset-empty-chat
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-auth-anonymous.yaml
