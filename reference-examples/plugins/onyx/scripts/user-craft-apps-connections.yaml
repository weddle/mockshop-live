# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-apps-connections
title: "Craft Apps menu, credentials, skills review and management redirects"
requires: enterprise
strict: true
locale: en
viewport: [ 1440, 900 ]
overlays:
  - edition-enterprise
steps:
  - goto: "/app"
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-mcp-admin--demo-user-craft.yaml
      overlays:
        - edition-enterprise
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = (await (await fetch('/api/__mockshop/state')).json()).overlays;
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
    id: eval-script
  - goto: "/craft/v1"
    id: goto-craft-v1
  - wait: { "selector": "[contenteditable=\"true\"][role=\"textbox\"]" }
    id: wait-contenteditable-true-role-textbox
  - click: { role: button, name: Apps, exact: true }
    id: click-apps
  - shot: craft-apps-menu-entry
    id: shot-craft-apps-menu-entry
  - goto: /craft/v1/apps
    id: goto-craft-v1-apps
  - wait: { text: Clinic Learning API, exact: true }
    id: wait-clinic-learning-api
  - shot: craft-apps-direct
    id: shot-craft-apps-direct
  - fill: { placeholder: Search apps..., value: no-matching-app }
    id: fill
  - wait: { text: No matches, exact: true }
    id: wait-no-matches
  - shot: craft-apps-search-empty
    id: shot-craft-apps-search-empty
  - fill: { placeholder: Search apps..., value: Clinic }
    id: fill-2
  - click: { role: button, name: Connect, exact: true }
    id: click-connect
  - wait: { text: Connect Clinic Learning API, exact: true }
    id: wait-connect-clinic-learning-api
  - shot: craft-apps-credentials-required
    id: shot-craft-apps-credentials-required
  - fill: { placeholder: learning_key, value: mock-craft-fictional-not-a-secret }
    id: fill-3
  - shot: craft-apps-credentials-filled
    id: shot-craft-apps-credentials-filled
  - click: { selector: '[role="dialog"] button:has-text("Connect")' }
    id: click-role-dialog-button-has-text-connect
  - wait: { role: button, name: Disconnect, exact: true }
    id: wait-disconnect
  - shot: craft-apps-connected-warning
    id: shot-craft-apps-connected-warning
  - click: { role: link, name: Review skills, exact: true }
    id: click-review-skills
  - wait: { text: 'Skills for app “Clinic Learning API”', exact: true }
    id: wait-skills-for-app-clinic-learning-api
  - shot: craft-apps-skill-review
    id: shot-craft-apps-skill-review
  - click: { selector: '[role="switch"][aria-label="Enable clinic-education for Clinic Learning API"]' }
    id: click-role-switch-aria-label-enable-clinic-education-for-clinic-
  - shot: craft-apps-skill-enabled
    id: shot-craft-apps-skill-enabled
  - click: { role: link, name: Show all skills, exact: true }
    id: click-show-all-skills
  - goto: /craft/v1/apps?tab=mcp
    id: goto-craft-v1-apps-tab-mcp
  - shot: craft-apps-mcp-tab
    id: shot-craft-apps-mcp-tab
  - goto: /craft/v1/apps
    id: goto-craft-v1-apps-2
  - fill: { placeholder: Search apps..., value: Clinic }
    id: fill-4
  - click: { role: button, name: Disconnect, exact: true }
    id: click-disconnect
  - shot: craft-apps-disconnected
    id: shot-craft-apps-disconnected
  - fill: { placeholder: Search apps..., value: "" }
    id: fill-5
  - click: { role: link, name: Manage apps, exact: true }
    id: click-manage-apps
  - wait: { role: button, name: Add app, exact: true }
    id: wait-add-app
  - shot: craft-apps-manage-entry
    id: shot-craft-apps-manage-entry
  - goto: /craft/v1/apps/manage
    id: goto-craft-v1-apps-manage
  - wait: { role: button, name: Add app, exact: true }
    id: wait-add-app-2
  - eval: if (location.pathname !== '/admin/craft/apps') throw new Error('Native manage alias must redirect to admin Craft apps');
    id: eval-script-2
  - shot: craft-apps-manage-redirect
    id: shot-craft-apps-manage-redirect
  - goto: /craft/v1/apps/admin
    id: goto-craft-v1-apps-admin
  - wait: { role: button, name: Add app, exact: true }
    id: wait-add-app-3
  - eval: if (location.pathname !== '/admin/craft/apps') throw new Error('Native admin alias must redirect to admin Craft apps');
    id: eval-script-3
  - shot: craft-apps-admin-redirect
    id: shot-craft-apps-admin-redirect
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
    id: eval-script-4
  - goto: "/craft/v1/apps"
    id: goto-craft-v1-apps-3
  - wait: { "text": "Clinic Learning API", "exact": true }
    id: wait-clinic-learning-api-2
  - shot: "craft-unit-apps-connections-reset"
    id: shot-craft-unit-apps-connections-reset
world: ../../../worlds/seaside/world.yaml
content:
  includes:
    - ../../../worlds/onyx-overrides/demo-mcp-admin.yaml
    - ../../../worlds/onyx-overrides/demo-user-craft.yaml
