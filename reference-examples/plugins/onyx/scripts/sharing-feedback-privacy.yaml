# DEVELOPMENT inventory; independent parent strict/every-PNG acceptance/publication remains pending.
# Independent fresh reset uses the existing control plane; mutations under test use only native controls.

name: sharing-feedback-privacy
title: Native Make Private rollback, revoked, missing and empty shared routes
strict: true
requires: enterprise
locale: en
viewport: [ 1440, 900 ]
known_errors:
  - match: '/http 400 PATCH .*\/api\/chat\/chat-session\/61616161-0000-4000-8000-000000000001$/'
    reason: Original endpoint-specific staged native share/privacy HTTP failure; unclassified console/resource errors remain strict.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/127\.0\.0\.1:\d+\/api\/chat\/chat-session\/61616161-0000-4000-8000-000000000001\]$/'
    reason: Actual changed strict attributes the deliberately rejected Make Private PATCH to this exact chat; visible native error retains saved public privacy and readable shared content.
  - match: '/^console: \[Toast\] Failed to make chat private \[source: http:\/\/127\.0\.0\.1:\d+\/_next\/static\/chunks\/1h15gs0jly9g_\.js\]$/'
    reason: Actual pinned native Share/Opal Toast event for one-shot privacy failure; visible error and authoritative public/shared-read protection precede native retry and revoked-link UI. Unlocated or different-source events remain strict.
steps:
  - goto: /app
    id: goto-app
  - id: eval-script-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays: []
  - eval: |
      (async () => {
        const currentResponse = await fetch('/api/__mockshop/state');
        if (!currentResponse.ok) throw new Error('Independent Sharing seed read failed');
        const current = await currentResponse.json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,locale:'en',keep:false,resetChats:true,anchor:current.demo_anchor})});
        if (!response.ok) throw new Error('Independent Sharing reset failed');
        sessionStorage.removeItem('sharing-workshop-id');
        sessionStorage.removeItem('sharing-workshop-link');
      })();
    id: eval-script
  # Native prerequisite replay only; original screenshots remain in their single primary owning unit.
  - goto: /app?chatId=61616161-0000-4000-8000-000000000001
    id: goto-app-chatid-61616161-0000-4000-8000-000000000001
  - wait: { text: Closing reflection, exact: true }
    id: wait-closing-reflection
  - wait: { testid: 'AgentMessage/toolbar', nth: 1 }
    id: wait
  - settle: 1200
    id: settle
  - eval: |
      const toolbars = [...document.querySelectorAll('[data-testid="AgentMessage/toolbar"]')];
      if (toolbars.length !== 2 || !document.body.innerText.includes('Start with a short reading circle.')) throw new Error('Seeded workshop did not replay both saved turns');
      if (toolbars.some(t => !t.textContent.includes('GPT-5.2'))) throw new Error('Saved answer model labels did not replay');
      if ([...toolbars[1].querySelectorAll('button')].some(b => b.textContent.trim() === 'Sources')) throw new Error('No-source closing reflection invented a Sources control');
      sessionStorage.setItem('sharing-workshop-id', '61616161-0000-4000-8000-000000000001');
    id: eval-script-2
  - click: { selector: '[aria-label="share-chat-button"]' }
    id: click-aria-label-share-chat-button
  - wait: { text: Share this chat, exact: true }
    id: wait-share-this-chat
  - click: { selector: '[aria-label="share-modal-option-public"]' }
    id: click-aria-label-share-modal-option-public
  - click: { selector: '[aria-label="share-modal-submit"]' }
    id: click-aria-label-share-modal-submit
  - wait: { text: Chat shared, exact: true }
    id: wait-chat-shared
  - wait: { text: Share link copied to clipboard!, exact: true }
    id: wait-share-link-copied-to-clipboard
  - eval: |
      const input = document.querySelector('[aria-label="share-modal-link-input"]');
      const expected = `${location.origin}/app/shared/${sessionStorage.getItem('sharing-workshop-id')}`;
      if (input?.value !== expected || !input.readOnly) throw new Error('Native saved share link is not this exact fake conversation');
      sessionStorage.setItem('sharing-workshop-link', input.value);
    id: eval-script-3
  - press: Escape
    id: press-escape
  # Live answer CopyButton uses its actual native success icon, not an API response echo.
  # Primary original operations 226-253; every original interaction and named PNG is retained.
  - click: { selector: '[aria-label="share-chat-button"]' }
    id: click-aria-label-share-chat-button-2
  - wait: { text: Chat shared, exact: true }
    id: wait-chat-shared-2
  - click: { selector: '[aria-label="share-modal-option-private"]' }
    id: click-aria-label-share-modal-option-private
  - shot: share-make-private-draft
    id: shot-share-make-private-draft
  - eval: |
      (async () => { const r = await fetch('/api/mockshop/sharing-feedback/outcome', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({operation:'private', fail:true})}); if (!r.ok) throw new Error('Cannot stage local privacy failure'); })()
    id: eval-script-4
  - click: { selector: '[aria-label="share-modal-submit"]' }
    id: click-aria-label-share-modal-submit-2
  - wait: { text: Failed to make chat private, exact: true }
    id: wait-failed-to-make-chat-private
  - eval: |
      (async () => {
        const response = await fetch('/api/chat/get-chat-session/61616161-0000-4000-8000-000000000001');
        if (!response.ok || (await response.json()).shared_status !== 'public') throw new Error('Failed Make Private changed authoritative privacy');
        const shared = await fetch('/api/chat/get-chat-session/61616161-0000-4000-8000-000000000001?is_shared=True');
        if (!shared.ok || !(await shared.json()).messages.some(message => message.message_type === 'assistant')) throw new Error('Failed Make Private revoked the saved shared content');
      })();
    id: eval-script-5
  - shot: share-private-error
    id: shot-share-private-error
  - click: { selector: '[aria-label="share-modal-submit"]' }
    id: click-aria-label-share-modal-submit-3
  - wait: { text: Chat is now private, exact: true }
    id: wait-chat-is-now-private
  - wait_gone: { role: dialog }
    id: wait-gone
  - shot: share-made-private-success
    id: shot-share-made-private-success
  - goto: /app/shared/61616161-0000-4000-8000-000000000001
    id: goto-app-shared-61616161-0000-4000-8000-000000000001
  - wait: { text: Shared chat not found, exact: true }
    id: wait-shared-chat-not-found
  - wait: { text: Did not find a shared chat with the specified ID., exact: true }
    id: wait-did-not-find-a-shared-chat-with-the-specified-id
  - shot: shared-private-link-unavailable
    id: shot-shared-private-link-unavailable
  - click: { role: link, name: Start a new chat, exact: true }
    id: click-start-a-new-chat
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox
  - shot: shared-not-found-new-chat
    id: shot-shared-not-found-new-chat
  - goto: /app/shared/61616161-0000-4000-8000-000000000099
    id: goto-app-shared-61616161-0000-4000-8000-000000000099
  - wait: { text: Shared chat not found, exact: true }
    id: wait-shared-chat-not-found-2
  - shot: shared-missing-direct
    id: shot-shared-missing-direct
  - goto: /app/shared/61616161-0000-4000-8000-000000000002
    id: goto-app-shared-61616161-0000-4000-8000-000000000002
  - wait: { text: No messages found in shared chat., exact: true }
    id: wait-no-messages-found-in-shared-chat
  - shot: shared-empty-direct
    id: shot-shared-empty-direct
  - click: { role: link, name: Start a new chat, exact: true }
    id: click-start-a-new-chat-2
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox-2
  - shot: shared-empty-new-chat
    id: shot-shared-empty-new-chat
  # Reset from a real selected vote/public link, then assert native seed UI rather than only API state.
world: ../../../worlds/seaside/world.yaml
