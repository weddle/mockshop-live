# Actual caller: LanguageModelsPage ExistingProviderCard -> getProvider('portkey').Modal
# with existingLlmProvider; the source registry binds PortkeyModal. Onboarding's connected
# card instead navigates here; ProviderSetupModal has no existing-provider edit prop.
# Exactly three native API tabs. No virtual-key/gateway-config UI exists at this pin.
# Every product mutation uses native fields/tabs/Update/Cancel. Supplementary GET assertions
# cannot replace the visible saved/reopened states. Only the existing runner reset control
# receives direct writes; sessionStorage below contains witness snapshots, not product state.
# 100 operations / 20 named images: menu/direct entry; seed and canceled saved edit;
# required key/base; mode-aware Restore and known-default transitions; three genuine
# saved modes/reopens; redacted replacement and unchanged-key preservation; dirty keep,
# hard navigation/reload, protected committed cancel, and meaningful fresh seed restoration.
# Sole handlers-save-controls catalog/reset/discovery; only fictional .invalid bases and keys.
