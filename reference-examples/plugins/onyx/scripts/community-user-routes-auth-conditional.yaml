    id: eval-script
  - eval: (async()=>{const m=await (await fetch('/api/me')).json(),r=await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if(m.email!=='{{people.alex-learner.email}}'||!m.is_cloud_superuser||Object.keys(r.callbacks).length||Object.keys(r.consents).length||r.impersonated) throw new Error('Existing named fictional conditional actor/clean receipts prerequisite missing');})()
    id: eval-script-2
  - goto: /oauth-config/callback
    id: goto-oauth-config-callback
  - wait:
      text: Invalid Request
      exact: true
    id: wait-invalid-request
