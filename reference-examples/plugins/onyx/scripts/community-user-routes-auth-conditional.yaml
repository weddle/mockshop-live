# #34 true-Community per-user-route witness. EDITONLY authored; UNEXECUTED/UNACCEPTED.
# Parent owns matching physical CE artifact selection, schema validation and complete strict native/image proof.
# Independent native runner prelude resets unit overlays/clock/locale. Keep uses existing state DSL;
# fresh tails use existing /api/__mockshop/state keep:false plus native full navigation.
# No continue_on_error, fixed-settle-only success, private React, clips or acceptance/closure claim.
# Existing conditional callbacks, consent and native impersonation form remain in CE scope.
# Missing-query callbacks positively exercise source guards/native return, not provider exchange.
# Source-native consent allow/pending/member return and impersonation member/superuser/required guards,
# fake success/persisted metadata/keep/fresh use existing sole Auth staging and named opt-ins.
# No global elevation, second identity, handler/source changes, real key/provider/security action.
name: community-user-routes-auth-conditional
title: True Community conditional callback guards, consent native decision and fake impersonation
requires: community
strict: true
locale: en
viewport:
  - 1440
  - 1000
known_errors:
  - match: /^http 404 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/enterprise-settings$/
    reason: Source settings/hooks.ts70-90 probes branding on /auth/impersonate even in compiled CE;37-39,116-120 normalize absent route404 to no enterprise branding/no error. Final native pristine impersonation form shot asserts exact404 DTO, Community flags and original sole fake actor/empty receipts. No other URI/status is allowed.
  - match: '/^console: Failed to load resource: the server responded with a status of 404 \(Not Found\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/enterprise-settings\]$/'
    reason: Exact resource diagnostic of that same native CE branding absence, paired with operable native form and protected actor/flags/receipt assertions.
steps:
  - goto: /app
    id: goto-app
  - wait:
      selector: '#onyx-chat-input-textbox'
    id: wait-onyx-chat-input-textbox
