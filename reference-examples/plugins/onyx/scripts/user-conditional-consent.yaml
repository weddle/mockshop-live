# #34 EDITONLY prepared native unit; no execution/acceptance claim. CE/other locales unverified.
# Fictional LOCAL inputs only. Every run independently resets the same sole Auth owner.
name: user-conditional-consent
title: User Conditional Consent
requires: enterprise
strict: true
locale: en
viewport:
  - 1440
  - 900
overlays:
  - edition-enterprise
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me$/'
    reason: Sole Auth owner deliberately clears the synthetic member before native Sign in navigation; restored immediately afterwards.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact cleared fake identity diagnostic during required native Sign in return, not an unknown-error waiver.
  - match: /^http 400 POST http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
  - match: /^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
  - match: /^http 403 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 403 \(Forbidden\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
  - match: /^http 404 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 404 \(Not Found\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
  - match: /^http 503 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG$/
    reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and unchanged receipt.
  - match: '/^console: Failed to load resource: the server responded with a status of 503 \(Service Unavailable\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-provider\/consent\?request=GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG\]$/'
    reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console waiver.
steps:
  - goto: /app/settings/accounts-access
    id: goto-app-settings-accounts-access
  - id: eval-script-world
    state:
      world: ../../../worlds/snapshots/seaside--demo-user-conditional.yaml
      overlays:
        - edition-enterprise
  - eval: "(async () => {

      \  const current = await (await fetch('/api/__mockshop/state')).json();

      \  const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:(await (await fetch('/api/__mockshop/state')).json()).overlays,anchor:current.demo_anchor,locale:'en',keep:false})});

      \  if (!response.ok) throw new Error('Conditional independent reset failed');

      \  const receipt = await (await fetch('/api/mockshop/user-conditional/receipts')).json();

      \  if (Object.keys(receipt.callbacks).length || Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered) throw new Error('Conditional reset retained dirty receipts');

      \  const me = await (await fetch('/api/me')).json();

      \  if (me.email !== '{{people.alex-learner.email}}' || !me.password_configured) throw new Error('Sole Auth owner did not restore fictional member');

      })()"
