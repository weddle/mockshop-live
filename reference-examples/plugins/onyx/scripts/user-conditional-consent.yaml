    id: eval-script-4
  - eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.consents["AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"] === "allow")) throw new Error('Native interaction receipt mismatch'); })()
