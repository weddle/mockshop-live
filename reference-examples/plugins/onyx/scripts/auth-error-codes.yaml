  - shot: "auth-error-code-login_bad_credentials"
    id: shot-auth-error-code-login-bad-credentials
  - click: { "role": "link", "name": "Return to Login Page", "exact": true }
    id: click-return-to-login-page-2
  - wait: { "testid": "email" }
    id: wait-2
