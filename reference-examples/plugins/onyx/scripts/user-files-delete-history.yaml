# Issue #28 independent native proof unit; no acceptance claim.
# Fresh runner start resets base fixtures, chats and browser; never chain unit outputs.

# Source/core/artifacts frozen; native file inputs only; no generic error allowances.
name: user-files-delete-history
title: Native selected-file deletion, reload and historic citation preview
strict: true
locale: en
viewport: [ 1440, 900 ]
steps:
  # Independent native composer entry.
  - goto: /app
    id: goto-app
  # Independent native composer entry.
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox
  # Independent native two-file upload and saved-chat seed; replay of old step 88.
  - fill: { selector: '#onyx-chat-input-textbox', value: Summarize the attached fictional workshop notes. }
    id: fill-onyx-chat-input-textbox
  # Independent native two-file upload and saved-chat seed; replay of old step 89.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814
  # Independent native two-file upload and saved-chat seed; replay of old step 90.
  - click: { text: Upload Files, exact: true }
    id: click-upload-files
  # Independent native two-file upload and saved-chat seed; replay of old step 91.
  - eval: |
      const input = document.querySelector('input[type="file"][accept="*/*"]');
      if (!input?.multiple) throw new Error('Native composer multiple-file input is missing');
      const transfer = new DataTransfer();
      transfer.items.add(new File(['Disposable fake bytes, not preview content.'], 'workshop-notes.txt', {type: 'text/plain'}));
      transfer.items.add(new File(['Disposable fictional upload.'], 'reflection.md', {type: 'text/markdown'}));
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', {bubbles: true}));
    id: eval-script
  # Independent native two-file upload and saved-chat seed; replay of old step 98.
  - wait: { selector: '#onyx-chat-input-send-button:not(:disabled)', timeout: 20000 }
    id: wait-onyx-chat-input-send-button-not-disabled
  # Independent native two-file upload and saved-chat seed; replay of old step 112.
  - click: { selector: '#onyx-chat-input-send-button' }
    id: click-onyx-chat-input-send-button
  # Independent native two-file upload and saved-chat seed; replay of old step 113.
  - wait: { text: 'This is a scripted educational demonstration, not an analysis of uploaded bytes.' }
    id: wait-this-is-a-scripted-educational-demonstration-not-an-analysi
  # Independent native two-file upload and saved-chat seed; replay of old step 114.
  - wait: { testid: 'AgentMessage/toolbar', timeout: 30000 }
    id: wait
  # Independent native two-file upload and saved-chat seed; replay of old step 115.
  - eval: |
      const id = new URL(location.href).searchParams.get('chatId');
      if (!id) throw new Error('Native send did not create a chat');
      sessionStorage.setItem('files-chat', id);
      const human = document.querySelector('#onyx-human-message');
      const answer = document.querySelector('[data-testid="onyx-ai-message"]');
      if (!human?.textContent.includes('workshop-notes.txt') || !human.textContent.includes('reflection.md')) throw new Error('Native human message lost one of its two attachment snapshots');
      if (!answer?.textContent.includes('five-minute welcome circle') || !answer.textContent.includes('one new idea and one next step')) throw new Error('Answer did not reference both synthetic attached resources');
    id: eval-script-2
  # Original user-files step 148, source line 203.
  - goto: /app
    id: goto-app-2
  # Original user-files step 149, source line 204.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814-2
  # Original user-files step 150, source line 205.
  - click: { text: All Recent Files, exact: true }
    id: click-all-recent-files
  # Original user-files step 151, source line 206.
  - wait: { text: workshop-notes.txt, exact: true }
    id: wait-workshop-notes-txt
  # Original user-files step 152, source line 207.
  - wait: { text: reflection.md, exact: true }
    id: wait-reflection-md
  # Original user-files step 153, source line 208.
  - shot: uploaded-library-reloaded
    id: shot-uploaded-library-reloaded
  # Original user-files step 154, source line 209.
  - click: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("workshop-notes.txt")' }
    id: click-role-dialog-role-button-has-opal-attachment-item-button-ha
  # Original user-files step 155, source line 210.
  - wait: { text: 1 file selected, exact: true }
    id: wait-1-file-selected
  # Original user-files step 156, source line 211.
  - hover: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("workshop-notes.txt")' }
    id: hover-role-dialog-role-button-has-opal-attachment-item-button-ha
  # Original user-files step 157, source line 212.
  - click: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("workshop-notes.txt") button:has(svg path[d^="M2 3.99998"])', settle: 0 }
    id: click-role-dialog-role-button-has-opal-attachment-item-button-ha-2
  # Original user-files step 158, source line 213.
  - wait: { text: Deleting..., exact: true }
    id: wait-deleting
  # Original user-files step 159, source line 214.
  - shot: selected-file-deleting
    id: shot-selected-file-deleting
  # Original user-files step 160, source line 215.
  - wait_gone: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("workshop-notes.txt")' }
    id: wait-gone-role-dialog-role-button-has-opal-attachment-item-butto
  # Original user-files step 161, source line 216.
  - wait: { text: 0 files selected, exact: true }
    id: wait-0-files-selected
  # Original user-files step 162, source line 217.
  - shot: selected-file-deleted
    id: shot-selected-file-deleted
  # Original user-files step 163, source line 218.
  - click: { role: button, name: Done, exact: true }
    id: click-done
  # Original user-files step 164, source line 219.
  - eval: location.reload()
    id: eval-script-3
  # Original user-files step 165, source line 220.
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox-2
  # Original user-files step 166, source line 221.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814-3
  # Original user-files step 167, source line 222.
  - click: { text: All Recent Files, exact: true }
    id: click-all-recent-files-2
  # Original user-files step 168, source line 223.
  - eval: |
      const dialog = document.querySelector('[role="dialog"]');
      if (dialog.textContent.includes('workshop-notes.txt') || !dialog.textContent.includes('reflection.md')) throw new Error('Deletion did not survive reload or removed an unrelated file');
    id: eval-script-4
  # Original user-files step 169, source line 226.
  - shot: deletion-reloaded
    id: shot-deletion-reloaded
  # Original user-files step 170, source line 227.
  - click: { role: button, name: Done, exact: true }
    id: click-done-2
  # Original user-files step 171, source line 228.
  - eval: location.assign(`/app?chatId=${sessionStorage.getItem('files-chat')}`)
    id: eval-script-5
  # Original user-files step 172, source line 229.
  - wait: { testid: 'AgentMessage/toolbar' }
    id: wait-2
  # Original user-files step 173, source line 230.
  - click: { role: button, name: Sources }
    id: click-sources
  # Original user-files step 174, source line 231.
  - wait: { text: Cited Sources }
    id: wait-cited-sources
  # Original user-files step 175, source line 232.
  - click: { selector: '#onyx-chat-sidebar button:has-text("workshop-notes.txt")' }
    id: click-onyx-chat-sidebar-button-has-text-workshop-notes-txt
  # Original user-files step 176, source line 233.
  - wait: { text: Synthetic workshop notes }
    id: wait-synthetic-workshop-notes
  # Original user-files step 177, source line 234.
  - shot: historic-citation-after-removal
    id: shot-historic-citation-after-removal
  # Original user-files step 178, source line 235.
  - press: Escape
    id: press-escape
  - id: eval-script-6-world
    state:
      world: ../../../worlds/seaside/world.yaml
      overlays: []
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const result = await fetch('/api/__mockshop/state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({overlays: (await (await fetch('/api/__mockshop/state')).json()).overlays, anchor: current.demo_anchor, locale: 'en', keep: false, resetChats: true})});
        if (!result.ok) throw new Error('File state control failed');
      })()
    id: eval-script-6
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - goto: /app
    id: goto-app-3
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - wait: { selector: '#onyx-chat-input-textbox' }
    id: wait-onyx-chat-input-textbox-3
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
    id: click-onyx-chat-input-button-has-svg-path-d-m12-0924-3-99814-4
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - click: { text: All Recent Files, exact: true }
    id: click-all-recent-files-3
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - wait: { placeholder: Search files... }
    id: wait-3
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - wait: { text: library-reading.txt, exact: true }
    id: wait-library-reading-txt
  # Owning dirty/reset outcome discards native uploads and tombstone.
  - eval: |
      const library = document.querySelector('[role="dialog"]');
      if (['workshop-notes.txt', 'reflection.md'].some(name => library.textContent.includes(name)) || !library.textContent.includes('attendance-demo.csv') || !library.textContent.includes('protected-reading.txt')) throw new Error('Fresh reset did not discard native uploads and restore the fictional seed library');
    id: eval-script-7
world: ../../../worlds/seaside/world.yaml
