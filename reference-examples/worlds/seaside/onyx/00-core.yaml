            project_id: null
            turns:
              - message: Outline a fictional library workshop with accessible reading activities.
                files:
                  - id: demo-reading
                    type: plain_text
                    name: library-reading.txt
                    user_file_id: uf-demo-reading
                  - id: demo-diagram
                    type: image
                    name: learning-diagram.svg
                    user_file_id: uf-demo-diagram
                  - id: demo-attendance
                    type: tabular
                    name: attendance-demo.csv
                    user_file_id: uf-demo-attendance
                script:
                  title: Accessible library workshop
                  chunk_delay_ms: 15
                  reasoning: Compare the fictional reading activity and attendance notes, then propose an accessible workshop.
                  queries:
                    - Accessible library reading activity
                  documents:
                    - id: "{{apps.onyx.documents.file-demo-reading.id}}"
                      title: "{{documents.file-demo-reading.title}}"
                      source: "{{sources.file.vendor}}"
                      blurb: "{{apps.onyx.documents.file-demo-reading.blurb}}"
                    - id: "{{apps.onyx.documents.file-demo-attendance.id}}"
                      title: "{{documents.file-demo-attendance.title}}"
                      source: "{{sources.file.vendor}}"
                      blurb: "{{apps.onyx.documents.file-demo-attendance.blurb}}"
                  answer: |
                    **Accessible library workshop**

                    Start with a short reading circle. Offer large-print notes, a quiet seating option, and time for each learner to respond [1].

                    | Activity | Minutes |
                    | --- | --- |
                    | Welcome and reading | 10 |
                    | Paired discussion | 15 |

                    Keep the fictional attendance sheet available to the facilitator, without requiring anyone to disclose personal health information.
              - message: Add a closing reflection for the same fictional workshop.
                script:
                  title: Accessible library workshop
                  chunk_delay_ms: 15
                  answer: |
                    **Closing reflection**

                    Invite each learner to name one useful idea, or write it privately. Finish with a two-minute quiet reflection. All names, files, and activities in this conversation are fictional.
