          **Community learning workshop**

          Invite learners to choose one topic, discuss it in pairs, and share one reflection with the group.
          This common fixture response is used when the selected model has no override.
        cites: []
      10-new-hire-training:
        match: training|new.hire|onboarding|first.aid|certification
        title: New-hire front desk training & overdue certifications
        chunk_delay_ms: 70
        reasoning: |
          The user wants the 30-day training plan for new front desk hires and who is behind on it. I should check the onboarding path for the required modules, the training-records export for completion, the train-the-trainer session and Slack for scheduling problems, and the training policy for deadlines.
        queries:
          - New-hire front desk training first 30 days
          - Overdue CPR first aid certification new hires
          - First aid class schedule Key West Carmel
        text: |
          Here's the **30-day training plan** for new front desk hires, and where the current group stands [1][2].

          **What new hires complete in their first 30 days** [1]
          1. Days 1–5: orientation, brand standards and guest privacy.
          2. By day 14: check-in/check-out systems and accessibility requests.
          3. By day 30: food-safety awareness and **CPR/First Aid with AED**.

          **Who is behind**
          - **3 of 14 hires are overdue on CPR/First Aid**: two at Key West and one at Carmel [2]. Everyone has finished guest-privacy training.
          - **Key West's class was cancelled.** The Oct 2 session was dropped when the instructor was out sick; the next open date is **Oct 23** [4]. The policy allows a one-time 14-day extension when a class is cancelled [5].

          **Suggested next steps**
          - Log the 14-day extension for the two Key West hires and book them into the Oct 23 class [4][5].
          - Until they're certified, make sure every Key West shift still has a certified first-aider on site, as the trainer asked [3], and keep the AED check on the opening checklist [6].
        cites:
          - gdrive-1xfdonboarding2026
          - gdrive-1xtrainingrecordsq4
          - zoom-rec-88123
          - slack-c04learnkw-1727712000
          - conf-hr-tp-4412
          - file-aed-opening-checklist
      98-follow-up:
        follow_up_default: true
        title: "{{vars.onyx_template_open}}prev.title}}"
        text: |
          Building on my earlier answer about **{{vars.onyx_template_open}}prev.title}}**: I don't have more detail on that in the connected sources yet. *(Placeholder follow-up text.)*
