            name: Accessible library workshop
            persona_id: 0
            owner_name: "{{people.alex-learning.name}}"
            time_created: "{{vars.onyx_template_open}}ago:2h}}"
            time_updated: "{{vars.onyx_template_open}}ago:1h}}"
