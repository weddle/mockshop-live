  gdrive-1xfdonboarding2026:
    source: policies-procedures
    title: Front Desk Onboarding Path 2026.pdf
    body: |
      # Front Desk Onboarding Path 2026

      Owner: Learning & Development. Applies to every new front desk hire, full and part time.

      ## Days 1–5: welcome

      - Property tour and safety walk (fire exits, AED location, first-aid kit)
      - Brand standards and guest greeting
      - Guest privacy and data handling (e-learning, 45 minutes)

      ## By day 14: systems and service

      - Check-in and check-out in the property system, with a buddy
      - Accessibility requests: room features, service animals, mobility equipment
      - Lost and found, key cards and late checkout requests

      ## By day 30: certifications

      - Food-safety awareness (e-learning)
      - **CPR/First Aid with AED**, classroom, run by Coastal Health {{teams.training.name}}
      - Sign-off by the front office manager

      Missed a class? Ask Learning & Development for the next open date. The training policy allows one 14-day extension when a class is cancelled.
    owners:
      - maya
  gdrive-1xtrainingrecordsq4:
    source: policies-procedures
    title: "{{teams.training.name}} records export — new hires since Aug 1.xlsx"
    body: "14 front desk hires since Aug 1. 11 on track. 3 overdue on CPR/First Aid: Key West (2), Carmel (1). All 14 have completed guest-privacy training."
    owners:
      - maya
      - devon
  zoom-rec-88123:
    source: meeting-transcripts
    title: "Zoom meeting: First aid & AED train-the-trainer (Sep 18)"
    body: "Instructor (Coastal Health {{teams.training.name}}): “Every shift needs at least one certified first-aider on site, and the AED check belongs on the opening checklist.”"
  slack-c04learnkw-1727712000:
    source: learning-ops
    title: "#learning-keywest — CPR class rescheduled"
    body: "{{people.devon.name}}: the Oct 2 CPR/First Aid class at Key West was cancelled (instructor out sick). Two new hires still need it; next open date is Oct 23."
  conf-hr-tp-4412:
    source: ops-space
    title: "{{teams.training.name}} Policy: Required certifications by role"
    body: |
      # {{teams.training.name}} Policy: Required certifications by role

      ## Front desk

      - CPR/First Aid with AED within **30 days of hire**, valid for 2 years.
      - Guest privacy training within 5 days of hire, refreshed yearly.

      ## Housekeeping and maintenance

      - Safe lifting and chemical handling within 14 days of hire.
      - CPR/First Aid for shift leads.

      ## Extensions

      A property may extend a certification deadline **once, by 14 days**, if the scheduled class is cancelled. The front office manager logs the extension and books the next open class.
  file-aed-opening-checklist:
    source: file
    title: AED & first-aid kit opening checklist.md
    body: |
      # AED & first-aid kit opening checklist

      Front desk, every property. The opening shift lead signs the shift board when every item is done.

      ## Before the lobby opens

      1. **AED status light** is green. If it is red or blinking, call Facilities and post the "AED out of service" sign.
      2. **Pads and battery** are in date (check the labels on the case).
      3. **First-aid kit** is sealed. If the seal is broken, restock it from the supply cabinet and log what was used.
      4. **Certified first-aider** is named on the shift board, with their certification expiry date.

      ## If no certified first-aider is on shift

      - Tell the duty manager right away.
      - Ask the nearest property for cover until a certified colleague arrives.
      - Record it in the incident log so Learning & Development can schedule training.

      ## Contacts

      - Learning & Development: training questions and class bookings
      - Facilities: AED faults and supply restocks
