  late-checkout-policy-for-gold-members:
    title: Late checkout policy for Gold members
    messages:
      - role: user
        text: What's our late checkout policy for {{company.name}} Rewards Gold members?
      - role: assistant
        text: |
          Gold members get **complimentary late checkout until 2 PM**, subject to availability on the day [1]. Platinum members get 4 PM [1].
        documents:
          - conf-ops-fo-210
      - role: user
        text: Can the front desk guarantee it at booking?
      - role: assistant
        text: |
          No. For Gold it can't be guaranteed at booking; the front desk confirms it the evening before departure [1].
        documents:
          - conf-ops-fo-210
  key-west-hurricane-watch-runbook:
    title: Key West hurricane-watch runbook
    messages:
      - role: user
        text: Walk me through the hurricane-watch runbook for the Key West property.
      - role: assistant
        text: |
          When a **hurricane watch** is issued (about 48 hours out) [1]:
          1. Notify guests arriving in the next 72 hours and offer flexible rebooking.
          2. Secure pool furniture and loose signage.
          3. Check generator fuel and run the weekly load test early.
          4. Confirm rooms with the inland evacuation partner hotel.
        documents:
          - conf-ops-kw-77
  q3-training-completion-by-property:
    title: Q3 training completion by property
    messages:
      - role: user
        text: Q3 training completion by property
      - role: assistant
        text: |
          Here's the **30-day training plan** for new front desk hires, and where the current group stands [1][2].

          **What new hires complete in their first 30 days** [1]
          1. Days 1–5: orientation, brand standards and guest privacy.
          2. By day 14: check-in/check-out systems and accessibility requests.
          3. By day 30: food-safety awareness and **CPR/First Aid with AED**.

          **Who is behind**
          - **3 of 14 hires are overdue on CPR/First Aid**: two at Key West and one at Carmel [2]. Everyone has finished guest-privacy training.
          - **Key West's class was cancelled.** The Oct 2 session was dropped when the instructor was out sick; the next open date is **Oct 23** [4]. The policy allows a one-time 14-day extension when a class is cancelled [5].

          **Suggested next steps**
          - Log the 14-day extension for the two Key West hires and book them into the Oct 23 class [4][5].
          - Until they're certified, make sure every Key West shift still has a certified first-aider on site, as the trainer asked [3], and keep the AED check on the opening checklist [6].
        documents:
