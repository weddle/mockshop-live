apps:
  onyx:
    fixtures:
      GET /mockshop/auth-anonymous/staging:
        enabled: true
        mode: logged-out
        requires_verification: true
      GET /auth/type:
        auth_type: basic
        multi_tenant: false
        requires_verification: true
        anonymous_user_enabled: true
        password_min_length: 8
        password_max_length: 64
        password_require_uppercase: false
        password_require_lowercase: false
        password_require_digit: false
        password_require_special_char: false
        has_users: true
        oauth_enabled: false
        password_auth_enabled: true
        sso_providers: []
      GET /tenants/anonymous-user:
        anonymous_user_enabled: true
        anonymous_user_path: workshop-demo
      GET /chat/get-user-chat-sessions:
        sessions: []
        has_more: false
      GET /user/projects: []
      GET /user/files/recent: []
      GET /notifications: []
    documents:
      mock-workshop-welcome:
        id: MOCK-WORKSHOP-WELCOME
        blurb: LOCAL FAKE DEMO — prepare accessible materials, name tags and a room checklist.
        updated: "{{vars.onyx_template_open}}ago:2d}}"
    replies:
      63-workshop:
        match: "^(local fake workshop|follow-up: workshop)"
        title: Local fake workshop conversation
        chunk_delay_ms: 90
        queries:
          - fictional community workshop welcome checklist
        regenerate:
          - |
            **LOCAL FAKE DEMO — Regenerated workshop welcome**

            Welcome learners, prepare accessible materials, and review the fictional checklist. [1]
            This alternate answer is scripted locally, not generated by a provider.
        text: |
          **LOCAL FAKE DEMO — Workshop welcome**

          Prepare accessible materials, welcome learners, and review the fictional room checklist. [1]

          This is editable staged content for an anonymous visitor. No provider, authentication, real document search or email service was contacted.
        cites:
          - mock-workshop-welcome
documents:
  mock-workshop-welcome:
    source: ops-space
    title: Workshop welcome checklist (fake demo)
    body: LOCAL FAKE DEMO — prepare accessible materials, name tags and a room checklist.
