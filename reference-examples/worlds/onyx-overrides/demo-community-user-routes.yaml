            email_error: LOCAL FAKE DEMO — staged email-link failure; no email sent.
            verify_error: LOCAL FAKE DEMO — invalid or expired demo verification link.
            reset_error: LOCAL FAKE DEMO — invalid or expired demo reset link.
            password_error: LOCAL FAKE DEMO — use the displayed fictional demo input, not a real password.
            authorize_error: LOCAL FAKE DEMO — staged provider start failure; no IdP contacted.
            discovery_error: LOCAL FAKE DEMO — staged SSO lookup failure; no workspace queried.
            verify_subject: LOCAL FAKE DEMO — verify workshop email (not sent)
            reset_subject: LOCAL FAKE DEMO — reset workshop demo input (not sent)
    fixtures:
