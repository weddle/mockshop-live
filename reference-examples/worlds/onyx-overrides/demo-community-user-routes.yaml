apps:
  onyx:
    settings:  # sparse over the base /settings
      onyx_craft_enabled: true
      onyx_craft_available: true
    state:
      auth_anonymous:
        content:
          label: LOCAL FAKE AUTH DEMO — no email sent, no real account or authentication
          email: "{{people.alex-learner.email}}"
          join_email: robin.guest@workshop.example
          error_email: staged.failure@workshop.example
          name: "{{people.alex-learner.name}}"
          guest_name: Workshop Visitor (fake demo)
          team: Community Learning (fake demo)
          demo_input: MockOnly-Workshop1!
          verify_token: mock-only-verify-workshop
          reset_token: mock-only-reset-workshop
          anonymous_path: demo
          upload_name: workshop-notes.txt
          upload_text: LOCAL FAKE DEMO — disposable fictional workshop input; not a real document.
          authorize_delay_ms: 2000
          auth_profiles:
            mixed:
              multi_tenant: false
              password_auth_enabled: true
              sso_providers:
                - name: workshop-google
                  display_name: Workshop Google (fake)
                  provider_type: GOOGLE_OAUTH
                  authorize_url: /api/mockshop/auth-anonymous/authorize/google
                - name: workshop-oidc
                  display_name: Workshop OIDC (fake)
                  provider_type: OIDC
                  authorize_url: /api/mockshop/auth-anonymous/authorize/oidc
                - name: workshop-saml
                  display_name: Workshop SAML (fake)
                  provider_type: SAML
                  authorize_url: /api/mockshop/auth-anonymous/authorize/saml
            sso-only:
              multi_tenant: false
              password_auth_enabled: false
              sso_providers:
                - name: workshop-google
                  display_name: Workshop Google (fake)
                  provider_type: GOOGLE_OAUTH
                  authorize_url: /api/mockshop/auth-anonymous/authorize/google
                - name: workshop-oidc
                  display_name: Workshop OIDC (fake)
                  provider_type: OIDC
                  authorize_url: /api/mockshop/auth-anonymous/authorize/oidc
                - name: workshop-saml
                  display_name: Workshop SAML (fake)
                  provider_type: SAML
                  authorize_url: /api/mockshop/auth-anonymous/authorize/saml
            auto-sso:
              multi_tenant: false
              password_auth_enabled: false
              sso_providers:
                - name: workshop-oidc
                  display_name: Workshop OIDC (fake)
                  provider_type: OIDC
                  authorize_url: /api/mockshop/auth-anonymous/authorize/oidc
