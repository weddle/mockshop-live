      10-new-hire-training-ops:
        match: training|new.hire|onboarding|first.aid|certification
        title: New-hire front desk training requirements
        chunk_delay_ms: 70
        reasoning: |
          The user is asking about training for new front desk hires. I can search the sources available to this user's groups, which are operations wiki pages and #ops Slack channels.
        queries:
          - New-hire front desk training first 30 days
          - First aid coverage per shift
        text: |
          From the operations sources I can see, here is what applies to **new front desk hires**:

          - **Onboarding:** new staff shadow a senior agent for their first 5 shifts and need CPR/First Aid within **30 days** of hire [1].
          - **Key West:** two new hires aren't certified yet, so the front desk is scheduling a certified first-aider on every night shift until the Oct 23 class [2].

          I don't have access to individual training records. For those, check with the Learning & Development team.
        cites:
          - conf-ops-fo-2210
          - slack-c05opskw-1728000000
