        blurb: "Replaces the static relay scorer. Rolled out behind flag relay-scorer-v2: 10% on Monday, 100% of us-east-1 on Tuesday 14:05 UTC. Missing guard: when the nearest relay pool is saturated, allocation falls back to any region."
