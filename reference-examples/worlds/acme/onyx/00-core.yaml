    replies:
      99-default:
        default: true
        title: "{{company.name}} reliability question"
        chunk_delay_ms: 50
        queries:
          - "{{company.name}} reliability knowledge"
        text: |
          This is a scripted demo. Ask about the **Tuesday join latency spike**, the **on-call schedule** or the **relay rollback runbook** to see cited answers [1].
        cites:
          - rollback
      10-join-latency-spike:
        match: join latency|latency.*spike|spike.*latency|latency spike
        title: Why meeting join latency spiked on Tuesday
        chunk_delay_ms: 55
        reasoning: |
          The user wants the cause of Tuesday's join latency spike. I should check recent merges and flag rollouts in GitHub, the incident channel in Slack, the Jira incident ticket, the relay runbook and the postmortem draft, then state impact in numbers and a next step.
        queries:
          - Meeting join latency spike Tuesday us-east-1
          - relay-scorer-v2 rollout pull request 4821
          - INC-2291 incident timeline and impact
        text: |
          Join latency spiked because **relay-scorer-v2 reached 100% of us-east-1 traffic** and started allocating TURN relays in the wrong region, which made clients retry [1][2].

          **What happened (Tuesday, UTC)**
          - **14:05** The flag hit 100% and p95 join latency climbed from **1.2s to 6.8s** [1][3].
          - **14:31** Incident declared in #inc-meetings-latency. The saturated nearby relay pool pushed allocations to eu-central-1 [1][2].
          - **14:52** {{people.sam.name}} rolled the flag back, and latency recovered within minutes [2][4].

          **Impact:** about **38,000 meetings delayed** and **2.1% join failures** over 47 minutes [3][5].

          **Next steps**
          1. Add a region-affinity guard before the scorer is re-enabled [1][5].
          2. Require the staged rollout above 25% traffic: 5%, 25%, 50%, then 100% [4][6].
          3. Alert on p95 join latency, not only p99, and review the postmortem draft on Thursday [5].
        cites:
          - scorer-pr
          - rollback-thread
          - incident
          - rollback
          - postmortem
          - rollout-checklist
      20-status-update:
        match: status update|status page
        title: Customer status update for INC-2291
        chunk_delay_ms: 45
        reasoning: |
          The user wants a customer-facing status update. I should reuse the incident facts, keep it factual, avoid blame and say what is changing.
        queries:
          - INC-2291 customer communication guidelines
        text: |
          Here's a draft status update, written for customers [1][2]:

          > **Resolved: slower joins for {{company.name}} Meetings in the US East region**
          >
          > Between **14:05 and 14:52 UTC on Tuesday**, some participants in the US East region experienced slow or failed meeting joins. About **2.1% of join attempts failed** during this window.
          >
          > The issue was caused by a recent change to how media relays are selected. We reverted the change at 14:52 UTC and joins returned to normal.
          >
          > We're adding safeguards to staged rollouts so a change like this is caught before it reaches all customers. A full summary will follow within five business days.

          I left out the internal flag name and individual names, per the runbook's guidance for customer updates [2].
        cites:
          - incident
          - rollback
