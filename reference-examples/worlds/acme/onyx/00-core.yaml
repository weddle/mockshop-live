          1. Declare the incident and name a rollback owner.
          2. In the flag console, **disable the relay-scorer flag**.
          3. Watch p95 join latency; it should recover within **10 minutes**.
          4. If it doesn't, fail over relay allocation to the secondary pool.

          **Before re-enabling:** use the staged rollout of 5%, 25%, 50%, then 100%, with a latency check at each stage [2].
