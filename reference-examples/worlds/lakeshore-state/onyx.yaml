    sources:
      sharepoint:
        visible: false
      confluence:
        visible: false
    documents:
      edu-cat-stat101:
        id: EDU-CAT-STAT101
        blurb: "Placeholder catalog entry: prerequisite MATH 095 or placement score; 4 credits; offered fall and spring."
        updated: "{{vars.onyx_template_open}}ago:40d}}"
      edu-conf-adv-12:
        id: EDU-CONF-ADV-12
        blurb: "Placeholder handbook text: advisors may approve a prerequisite waiver with department sign-off."
        updated: "{{vars.onyx_template_open}}ago:90d}}"
    conversations:
      intro-statistics-prerequisites:
        id: 44444444-0000-4000-8000-000000000001
        time_created: "{{vars.onyx_template_open}}ago:5h}}"
        time_updated: "{{vars.onyx_template_open}}ago:5h}}"
        shared_status: private
        current_alternate_model: null
        current_temperature_override: null
        current_reasoning_effort_override: null
        agent: course-catalog-helper
        turns:
          - message: "{{conversations.intro-statistics-prerequisites.messages.0.text}}"
            script:
              match: prerequisite|statistics|course|add/drop
              default: true
              title: Intro statistics prerequisites
              queries:
                - intro statistics course prerequisites
              documents:
                - id: "{{apps.onyx.documents.edu-cat-stat101.id}}"
                  title: "{{documents.edu-cat-stat101.title}}"
                  source: "{{sources.sharepoint.vendor}}"
                  link: https://catalog.{{company.domain}}/courses/STAT-101
                  blurb: "{{apps.onyx.documents.edu-cat-stat101.blurb}}"
                  updated: "{{apps.onyx.documents.edu-cat-stat101.updated}}"
                - id: "{{apps.onyx.documents.edu-conf-adv-12.id}}"
                  title: "{{documents.edu-conf-adv-12.title}}"
                  source: "{{sources.confluence.vendor}}"
                  link: https://wiki.{{company.domain}}/display/ADV/12
                  blurb: "{{apps.onyx.documents.edu-conf-adv-12.blurb}}"
                  updated: "{{apps.onyx.documents.edu-conf-adv-12.updated}}"
              answer: "{{conversations.intro-statistics-prerequisites.messages.1.text}}"
      lms-gradebook-not-syncing:
        id: 44444444-0000-4000-8000-000000000002
        time_created: "{{vars.onyx_template_open}}ago:2d}}"
        time_updated: "{{vars.onyx_template_open}}ago:2d}}"
        shared_status: private
        current_alternate_model: null
        current_temperature_override: null
        current_reasoning_effort_override: null
        agent: it-service-desk
        turns:
          - message: "{{conversations.lms-gradebook-not-syncing.messages.0.text}}"
            script:
              title: LMS gradebook not syncing
              answer: "{{conversations.lms-gradebook-not-syncing.messages.1.text}}"
    replies:
      10-university:
        match: prerequisite|statistics|course|add/drop
        default: true
        title: Intro statistics prerequisites
        queries:
