    sources:
      sharepoint:
        visible: false
      confluence:
        visible: false
    documents:
      hc-pol-0142:
        id: HC-POL-0142
        blurb: "Placeholder policy text: perform hand hygiene before and after every patient contact; alcohol-based rub unless hands are visibly soiled."
        updated: "{{vars.onyx_template_open}}ago:12d}}"
      hc-conf-edu-88:
        id: HC-CONF-EDU-88
        blurb: "Placeholder refresher outline: five moments of hand hygiene, glove use, audit schedule."
        updated: "{{vars.onyx_template_open}}ago:30d}}"
    conversations:
      hand-hygiene-policy-update:
        id: 33333333-0000-4000-8000-000000000001
        time_created: "{{vars.onyx_template_open}}ago:5h}}"
        time_updated: "{{vars.onyx_template_open}}ago:5h}}"
        shared_status: private
        current_alternate_model: null
        current_temperature_override: null
        current_reasoning_effort_override: null
        agent: clinical-policy-finder
        turns:
          - message: "{{conversations.hand-hygiene-policy-update.messages.0.text}}"
            script:
              match: hand hygiene|policy|referral
              default: true
              title: Hand hygiene policy update
              queries:
                - inpatient hand hygiene policy current version
              documents:
                - id: "{{apps.onyx.documents.hc-pol-0142.id}}"
                  title: "{{documents.hc-pol-0142.title}}"
                  source: "{{sources.sharepoint.vendor}}"
                  link: https://intranet.{{company.domain}}/policies/IC-142
                  blurb: "{{apps.onyx.documents.hc-pol-0142.blurb}}"
                  updated: "{{apps.onyx.documents.hc-pol-0142.updated}}"
                - id: "{{apps.onyx.documents.hc-conf-edu-88.id}}"
                  title: "{{documents.hc-conf-edu-88.title}}"
                  source: "{{sources.confluence.vendor}}"
                  link: https://wiki.{{company.domain}}/display/EDU/88
                  blurb: "{{apps.onyx.documents.hc-conf-edu-88.blurb}}"
                  updated: "{{apps.onyx.documents.hc-conf-edu-88.updated}}"
              answer: "{{conversations.hand-hygiene-policy-update.messages.1.text}}"
      badge-reader-not-working-on-4-west:
        id: 33333333-0000-4000-8000-000000000002
        time_created: "{{vars.onyx_template_open}}ago:2d}}"
        time_updated: "{{vars.onyx_template_open}}ago:2d}}"
        shared_status: private
        current_alternate_model: null
        current_temperature_override: null
        current_reasoning_effort_override: null
        agent: it-service-desk
        turns:
          - message: "{{conversations.badge-reader-not-working-on-4-west.messages.0.text}}"
            script:
              title: Badge reader not working on 4 West
              answer: "{{conversations.badge-reader-not-working-on-4-west.messages.1.text}}"
    replies:
      10-healthcare:
        match: hand hygiene|policy|referral
        default: true
        title: Hand hygiene policy update
        queries:
          - inpatient hand hygiene policy current version
        text: |
          The current inpatient hand hygiene policy is **IC-142**, last revised 12 days ago [1]. In short (placeholder text):

          - Clean hands before and after every patient contact, using alcohol-based rub unless hands are visibly soiled [1].
          - The infection-prevention refresher for nurse educators covers the same five moments and the audit schedule [2].
        cites:
          - hc-pol-0142
          - hc-conf-edu-88
