# End user: Recents / history (#24). Open a historic chat (fixtures/base/history/<id>.yaml) -> follow-up inside it ->
# rename another chat from its menu -> delete a third -> Search Chats finds the renamed one -> reload: all of it persists.
name: user-recents
title: Recents - open, follow up, rename, delete, search
steps:
  - goto: /app
  - click: { testid: ChatButton, has_text: "Late checkout policy" }
  - wait: { text: "front desk confirms", timeout: 30000 }
  - settle: 1000
  - shot: opened-history
  - click: { selector: "#onyx-chat-input-textbox" }
  - type: { selector: "#onyx-chat-input-textbox", value: "Follow-up: summarize that in one sentence" }
  - click: { selector: "#onyx-chat-input-send-button" }
  - wait: { text: "Follow-up to your first question", timeout: 30000 }
  - settle: 1200
  - shot: follow-up-in-history
  - hover: { testid: ChatButton, has_text: "Key West hurricane" }
  - click: { selector: "[data-testid=ChatButton]:has-text('Key West hurricane') button[aria-label='Chat options']" }
  - settle: 400
  - shot: chat-menu
  - click: { role: menuitem, name: Rename }
  - press: Control+A
  - type: { selector: "input:focus", value: "Storm prep checklist" }
  - press: Enter
  - settle: 800
  - shot: renamed
  - hover: { testid: ChatButton, has_text: "Opera PMS sync" }
  - click: { selector: "[data-testid=ChatButton]:has-text('Opera PMS sync') button[aria-label='Chat options']" }
  - click: { role: menuitem, name: Delete }
  - settle: 400
  - shot: delete-confirm
  - click: { role: button, name: Delete, last: true }
  - settle: 800
  - shot: deleted
  - click: { text: Search Chats }
  - settle: 400
  - type: { selector: "input:focus", value: "storm" }
  - settle: 1000
  - shot: search-chats
  - press: Escape
  - goto: /app
  - settle: 1000
  - shot: after-reload
