# #69 conditional native controls; declared/unverified, same minimal Auth artifact.
name: auth-referral-signup
title: "Independent native conditional #69 unit: auth-referral-signup"
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: [demo-auth-anonymous]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required fake logged-out identity; independently cleared cookie.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; native cleared-cookie and unauthorized identity are asserted.
# Fresh multi_tenant metadata (not Cloud compile flag), cleared referral cookie; every native referral choice/menu writes its real fake browser cookie, then native fictional signup reaches pending verification.
steps:
  - state: {"overlays": ["demo-auth-anonymous"]}
  - goto: "/auth/login"
  - eval: |
      (async () => { const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({"mode": "logged-out", "auth_profile": "multitenant"})}); if (!r.ok) throw new Error('Local fake staging failed'); })()
  - eval: |
      (async () => { if ((await fetch('/api/me')).status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Expected fresh fake logged-out cookie and /me401'); })()
  - eval: |
      document.cookie='referral_source=; Max-Age=0; Path=/';
  - goto: "/auth/signup"
  - wait: {"text": "Complete your sign up", "exact": true}
  - wait: {"text": "How did you hear about us?", "exact": true}
  - shot: "auth-referral-empty"
  - click: {"selector": "[aria-label=\"Select an option\"]"}
  - wait: {"text": "Search Engine (Google/Bing)", "exact": true}
  - shot: "auth-referral-menu-search"
  - click: {"text": "Search Engine (Google/Bing)", "exact": true}
  - eval: |
      if (document.querySelector('[aria-label="Select an option"]')?.value !== "Search Engine (Google/Bing)" || !document.cookie.split('; ').includes('referral_source=search')) throw new Error('Native referral selection/cookie mismatch');
  - shot: "auth-referral-selected-search"
  - click: {"selector": "[aria-label=\"Select an option\"]"}
  - wait: {"text": "Friend/Colleague", "exact": true}
