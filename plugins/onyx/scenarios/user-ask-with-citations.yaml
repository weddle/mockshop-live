# End user: chat home -> ask a question -> streamed answer with citations ->
# open the Sources panel -> preview a cited source.
# Also records as a clip (./mockshop clip onyx/user-ask-with-citations).
name: user-ask-with-citations
title: User asks about new-hire training and inspects citations
viewport: [1440, 900]
clip:
  title: { title: "Ask across your company's systems", subtitle: "Onyx · Seaside Collection demo (fictional data)" }
  title_ms: 3500
  hold_ms: 2000
  type_ms: 2600
  end_hold_ms: 4000
steps:
  - goto: /app
  - shot: chat-home
  - click: { selector: "#onyx-chat-input-textbox" }
  - type: { selector: "#onyx-chat-input-textbox", value: "What training do new front desk hires need in their first 30 days, and who is behind on it?" }
  - shot: { name: question-typed, hold: 800 }
  - click: { selector: "#onyx-chat-input-send-button" }
  - wait: 2200
  - shot: { name: streaming, delay: 0 }
  - wait: { testid: onyx-ai-message, timeout: 30000 }
  - settle: 1500
  - eval: "document.querySelector('[data-testid=chat-scroll-container]')?.scrollTo(0, 1e6)"
  - shot: answer-with-citations
  - pause: 1500
    only: clip
  - click: { text: "2 steps" }
  - settle: 600
  - shot: search-steps-expanded
  - click: { text: "2 steps" }
  # clip: route the cursor through empty margin so it never brushes a citation chip (an open chip tooltip
  # would be repositioned by the Sources panel reflow)
  - move: [1290, 420]
    only: clip
  - move: [1000, 735]
    only: clip
  - pause: 400
    only: clip
  - click: { role: button, name: Sources, fade: true, settle: 900 }
  - settle: 800
  - shot: sources-panel
  - pause: 1500
    only: clip
  - shot: { name: citation-preview, hover: { role: button, name: Zoom, exact: true }, delay: 700, hold: 3500 }
