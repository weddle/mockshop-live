# #69: Enterprise, LOCAL non-cloud build with NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=true.
# Parent registration is required. All inputs below are fictional and never stored as credentials.
name: auth-error
title: "Independent native #69 unit: auth-error"
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: [demo-auth-anonymous]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required native logged-out /me response; cookie and fake current user are deliberately cleared.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; native cleared-cookie and unauthorized identity are asserted.
# Independent prerequisites: Fresh browser storage ensures first stale-link restart, second native error; generic/raw/known/support/return states preserved.
steps:
  - state: { overlays: [demo-auth-anonymous] }
  - goto: /auth/login
  - eval: |
      (async () => {
        const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'logged-out'})});
        if (!r.ok) throw new Error('Local fake logged-out staging failed');
        const me = await fetch('/api/me');
        if (me.status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Cookie or /me was not logged out');
      })()
  - goto: /auth/error
  - wait: { text: 'Possible Issues:', exact: true }
  - shot: auth-error-generic
  - goto: /auth/error?error=LOCAL%20FAKE%20DEMO%20%E2%80%94%20staged%20sign-in%20error
  - wait: { text: LOCAL FAKE DEMO — staged sign-in error, exact: true }
  - shot: auth-error-editable-message
  - goto: /auth/error?error=LOGIN_BAD_CREDENTIALS
  - wait: { text: "This account can't sign in. It may be deactivated. Contact your workspace admin." }
  - shot: auth-error-known-code
  - goto: /auth/error?error=OAUTH_INVALID_STATE
  - wait: { testid: email }
  - shot: auth-error-stale-auto-restart
  - goto: /auth/error?error=OAUTH_INVALID_STATE
  - wait: { text: This sign-in link has expired or is no longer valid. Please sign in again. }
  - shot: auth-error-stale-link
  - click: { role: link, name: Return to Login Page, exact: true }
  - wait: { testid: email }
  - shot: auth-error-return-login
