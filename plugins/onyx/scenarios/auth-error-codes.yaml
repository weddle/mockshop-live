# #69 conditional native controls; declared/unverified, same minimal Auth artifact.
name: auth-error-codes
title: "Independent native conditional #69 unit: auth-error-codes"
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: [demo-auth-anonymous]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required fake logged-out identity; independently cleared cookie.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; native cleared-cookie and unauthorized identity are asserted.
# Fresh fake logged-out cookie; all nine native translated error codes and each of three stale codes independently first restart/second held/Return; actual self-hosted support copy.
steps:
  - state: {"overlays": ["demo-auth-anonymous"]}
  - goto: "/auth/login"
  - eval: |
      (async () => { const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({"mode": "logged-out", "auth_profile": null})}); if (!r.ok) throw new Error('Local fake staging failed'); })()
  - eval: |
      (async () => { if ((await fetch('/api/me')).status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Expected fresh fake logged-out cookie and /me401'); })()
  - goto: "/auth/error?error=OAUTH_USER_ALREADY_EXISTS"
  - wait: {"text": "An account with this email already exists under a different sign-in method. Sign in the way you first did, or ask your admin to link this provider.", "exact": true}
  - shot: "auth-error-code-oauth_user_already_exists"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=LOGIN_BAD_CREDENTIALS"
  - wait: {"text": "This account can't sign in. It may be deactivated. Contact your workspace admin.", "exact": true}
  - shot: "auth-error-code-login_bad_credentials"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=access_denied"
  - wait: {"text": "Access was denied by your identity provider.", "exact": true}
  - shot: "auth-error-code-access_denied"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=login_required"
  - wait: {"text": "You need to log in with your identity provider first.", "exact": true}
  - shot: "auth-error-code-login_required"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=consent_required"
  - wait: {"text": "Your identity provider requires consent before continuing.", "exact": true}
  - shot: "auth-error-code-consent_required"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=interaction_required"
  - wait: {"text": "Additional interaction with your identity provider is required.", "exact": true}
  - shot: "auth-error-code-interaction_required"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=invalid_scope"
  - wait: {"text": "The requested permissions are not available.", "exact": true}
  - shot: "auth-error-code-invalid_scope"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=server_error"
  - wait: {"text": "Your identity provider encountered an error. Please try again.", "exact": true}
  - shot: "auth-error-code-server_error"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error?error=temporarily_unavailable"
  - wait: {"text": "Your identity provider is temporarily unavailable. Please try again later.", "exact": true}
  - shot: "auth-error-code-temporarily_unavailable"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - eval: |
      sessionStorage.removeItem('onyx:sso-restart');
  - goto: "/auth/error?error=ACCESS_TOKEN_DECODE_ERROR"
  - wait: {"testid": "email"}
  - shot: "auth-error-restart-access_token_decode_error"
  - goto: "/auth/error?error=ACCESS_TOKEN_DECODE_ERROR"
  - wait: {"text": "This sign-in link has expired or is no longer valid. Please sign in again.", "exact": true}
  - shot: "auth-error-held-access_token_decode_error"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - eval: |
      sessionStorage.removeItem('onyx:sso-restart');
  - goto: "/auth/error?error=ACCESS_TOKEN_ALREADY_EXPIRED"
  - wait: {"testid": "email"}
  - shot: "auth-error-restart-access_token_already_expired"
  - goto: "/auth/error?error=ACCESS_TOKEN_ALREADY_EXPIRED"
  - wait: {"text": "This sign-in link has expired or is no longer valid. Please sign in again.", "exact": true}
  - shot: "auth-error-held-access_token_already_expired"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - eval: |
      sessionStorage.removeItem('onyx:sso-restart');
  - goto: "/auth/error?error=OAUTH_INVALID_STATE"
  - wait: {"testid": "email"}
  - shot: "auth-error-restart-oauth_invalid_state"
  - goto: "/auth/error?error=OAUTH_INVALID_STATE"
  - wait: {"text": "This sign-in link has expired or is no longer valid. Please sign in again.", "exact": true}
  - shot: "auth-error-held-oauth_invalid_state"
  - click: {"role": "link", "name": "Return to Login Page", "exact": true}
  - wait: {"testid": "email"}
  - goto: "/auth/error"
  - wait: {"text": "If you continue to experience problems, please reach out to your system administrator for assistance.", "exact": true}
  - shot: "auth-error-self-hosted-support"
