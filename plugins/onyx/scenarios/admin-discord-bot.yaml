# #65 route-sized native proof: Discord pending guild registration.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-discord-bot
title: Discord pending guild registration - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/discord-bot
  - shot: inventory-discord-bot
  - goto: /admin/bots/6501
  - click: { selector: 'a[href="/admin/discord-bot"]' }
  - wait: { text: Learning Workshop (fake guild), exact: true }
  - shot: discord-menu
  - goto: /admin/discord-bot
  - shot: discord-direct
  - click: { role: button, name: Add Server, exact: true }
  - wait: { role: dialog }
  - shot: discord-register-key-dialog
  - press: Escape
  - goto: /admin/voice
  - goto: /admin/discord-bot
  - wait: { text: 'Server #6502', exact: true }
  - shot: discord-pending-registration
  - click: { selector: 'tr:has-text("Server #6502") button:not(:disabled)' }
  - wait: { role: dialog }
  - shot: discord-remove-guild-confirm
  - click: { selector: '[role="dialog"] button:has-text("Delete")' }
  - wait_gone: { role: dialog }
  - wait_gone: { text: 'Server #6502', exact: true }
  - shot: discord-pending-guild-removed
