  - goto: /admin/craft/access
  - wait: { text: Per-user access, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: maya.chen }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="true"]' }
  - shot: users-craft-direct-persisted
  # Matching the workspace default clears the override to null; it is not a fabricated Default menu.
  - click: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"]' }
  - wait: { text: Craft disabled for user, exact: true }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="false"]' }
  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Native Craft join readback failed');
        const user = (await usersRes.json()).find(row => row.email === 'maya.chen@seasidecollection.example'), me = await meRes.json();
        if (!user || user.craft_enabled !== null || me.craft_enabled !== null) throw new Error('Accepted Users/current-user Craft override did not preserve null');
      })()
  - shot: users-craft-default-null
  # A native default change makes explicit false reachable (not the same as following default false).
  - click: { role: switch, nth: 0 }
  - wait: { text: Enable Craft for all users?, exact: true }
  - shot: users-craft-enable-default-confirm
  - click: { role: button, name: Enable for Everyone, exact: true }
  - wait: { text: Craft is now enabled by default, exact: true }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="true"]' }
  - click: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"]' }
  - wait: { text: Craft disabled for user, exact: true }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="false"]' }
  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Native Craft join readback failed');
        const user = (await usersRes.json()).find(row => row.email === 'maya.chen@seasidecollection.example'), me = await meRes.json();
        if (!user || user.craft_enabled !== false || me.craft_enabled !== false) throw new Error('Accepted Users/current-user Craft override did not preserve false');
      })()
