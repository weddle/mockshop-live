      })()
  - shot: users-craft-before-reset
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strict:true,locale:'en'})});
        if (!res.ok) throw new Error('Mock reset failed');
        location.reload();
      })()
  - wait: { text: Per-user access, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: maya.chen }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="false"]' }
  - wait: { text: Craft is off for everyone. Toggle individual users below., exact: true }
  - shot: users-craft-reset
  - goto: /admin/users
  - wait: { text: Users & Requests, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: maya.chen }
  - wait: { text: Maya Chen, exact: true }
  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Craft reset readback failed');
        const user = (await usersRes.json()).find(row => row.email === 'maya.chen@seasidecollection.example'), me = await meRes.json();
        if (!user || user.craft_enabled !== null || me.craft_enabled !== false) throw new Error('Fresh reset did not restore accepted null and original current-user false seeds');
      })()
  - shot: users-craft-users-reset
