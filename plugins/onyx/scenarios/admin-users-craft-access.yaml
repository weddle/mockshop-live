# #59 joined Craft/accepted-Users proof only, not certification of #65's whole route inventory.
# Native AccessCell stores null when a switch matches the default; Users has no Craft dropdown.
# Runner starts fresh base fixtures53/54/56 and existing core settings (default false).
name: admin-users-craft-access
title: Native Craft access true false null and accepted Users join reset
strict: true
requires: enterprise
locale: en
overlays: []
steps:
  - goto: /admin/users
  - wait: { text: Users & Requests, exact: true }
  - click: { selector: 'a[href="/admin/craft/access"]' }
  - wait: { text: Per-user access, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: maya.chen }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="false"]' }
  - shot: users-craft-menu-entry
  # Seed default is false. Toggling on writes explicit true through the real #65 setter.
  - click: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"]' }
  - wait: { text: Craft enabled for user, exact: true }
  - wait: { selector: 'tr:has-text("maya.chen@seasidecollection.example") button[role="switch"][aria-checked="true"]' }
  - eval: |
      (async () => {
        const usersRes = await fetch('/api/manage/users/accepted/all'), meRes = await fetch('/api/me');
        if (!usersRes.ok || !meRes.ok) throw new Error('Native Craft join readback failed');
        const user = (await usersRes.json()).find(row => row.email === 'maya.chen@seasidecollection.example'), me = await meRes.json();
        if (!user || user.craft_enabled !== true || me.craft_enabled !== true) throw new Error('Accepted Users/current-user Craft override did not preserve true');
      })()
  - shot: users-craft-enabled
  - goto: /admin/users
  - wait: { text: Users & Requests, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: maya.chen }
  - wait: { text: Maya Chen, exact: true }
  - eval: |
      (async () => {
