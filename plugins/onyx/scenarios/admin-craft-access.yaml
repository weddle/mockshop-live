# #65 route-sized native proof: Craft Access.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-craft-access
title: Craft Access - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/craft/access
  - shot: inventory-craft-access
  - goto: /admin/llm-gateway
  - click: { selector: 'a[href="/admin/craft/access"]' }
  - shot: craft-access-menu
  - goto: /admin/craft/access
  - shot: craft-access-direct
  - click: { selector: '[role="switch"]', nth: 0 }
  - wait: { role: dialog }
  - shot: craft-access-default-confirm
  - click: { role: button, name: Enable for Everyone, exact: true }
  - wait_gone: { role: dialog }
  - click: { selector: '[role="switch"]', nth: 1 }
  - goto: /admin/voice
  - goto: /admin/craft/access
  - eval: |
      const toggles = [...document.querySelectorAll('[role="switch"]')];
      if (toggles[0]?.getAttribute('aria-checked') !== 'true' || toggles[1]?.getAttribute('aria-checked') !== 'false') throw new Error('Craft workspace/per-user override did not persist');
  - shot: craft-access-saved
