# Required native Cloud Billing frontend; source-derived, not runtime accepted.
# Real Onyx controls only; external Stripe UI/purchases/portal remain unprovided.
name: admin-billing-cloud-statuses
title: Native Cloud trial cancellation and expired display states
strict: true
requires: enterprise-cloud
locale: en
overlays: [demo-mcp-admin, demo-billing-cloud-trialing]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/documents/sets
  - click: { selector: 'a[href="/admin/billing"]' }
  - wait: { role: button, name: Upgrade now, exact: true }
  - shot: billing-cloud-trial-menu
  - goto: /admin/billing
  - wait: { role: button, name: Manage Plan, exact: true }
  - shot: billing-cloud-trial-direct-handoff-visible
  - click: { role: button, name: Upgrade now, exact: true }
  - wait_gone: { role: button, name: Upgrade now, exact: true }
  - eval: |
      (async () => {
        const billing = await fetch('/api/tenants/billing-information').then(r => r.json());
        if (billing.status !== 'active' || billing.trial_end !== null) throw new Error('Native Upgrade did not update fictional display status');
      })()
  - shot: billing-cloud-trial-display-upgraded
  - goto: /admin/documents/sets
  - click: { selector: 'a[href="/admin/billing"]' }
  - wait: { role: button, name: Manage Plan, exact: true }
  - wait_gone: { role: button, name: Upgrade now, exact: true }
  - shot: billing-cloud-trial-display-navigation
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['demo-mcp-admin','demo-billing-cloud-trialing'],strict:true,locale:'en',anchor:'2026-10-09T10:00:00-04:00'})});
        if (!res.ok) throw new Error('Billing fixture reset failed');
        location.href = '/admin/billing';
      })()
  - wait: { role: button, name: Upgrade now, exact: true }
  - shot: billing-cloud-trial-dirty-reset
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['demo-mcp-admin','demo-billing-cloud-canceling'],strict:true,locale:'en',anchor:'2026-10-09T10:00:00-04:00'})});
        if (!res.ok) throw new Error('Billing fixture reset failed');
        location.href = '/admin/billing';
      })()
  - wait: { text: Your subscription is expiring in }
  - eval: |
      (async () => {
        const billing = await fetch('/api/tenants/billing-information').then(r => r.json());
        const days = Math.ceil((new Date(billing.current_period_end).getTime() - Date.now()) / 86400000);
        if (!document.body.textContent.includes('Your subscription is expiring in ' + days + ' days.')) throw new Error('Native cancellation warning does not match snapshot date');
        if (!document.body.textContent.includes('Valid until')) throw new Error('Native cancellation subtitle missing');
      })()
  - shot: billing-cloud-canceling-annual-warning
  - click: { role: button, name: View Plan Details, exact: true }
  - wait: { text: Your Current Plan, exact: true }
  - shot: billing-cloud-canceling-current-plan
  - click: { role: button, name: Cancel, exact: true }
  - wait: { text: Your subscription is expiring in }
  - shot: billing-cloud-canceling-plan-back
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['demo-mcp-admin','demo-billing-cloud-expired'],strict:true,locale:'en',anchor:'2026-10-09T10:00:00-04:00'})});
        if (!res.ok) throw new Error('Billing fixture reset failed');
        location.href = '/admin/billing';
      })()
  - wait: { text: Your subscription has expired. }
  - eval: |
      (async () => {
        const billing = await fetch('/api/tenants/billing-information').then(r => r.json());
        const deletionDays = Math.max(0, Math.ceil((new Date(billing.current_period_end).getTime() + 30 * 86400000 - Date.now()) / 86400000));
        const title = deletionDays ? 'Your subscription has expired. Data will be deleted in ' + deletionDays + ' days.' : 'Your subscription has expired.';
        if (!document.body.textContent.includes(title) || !document.body.textContent.includes('Expired on')) throw new Error('Native expired banner/subtitle missing');
      })()
  - shot: billing-cloud-expired-error-display
  - click: { role: button, name: View Plan Details, exact: true }
  - wait: { text: Your Current Plan, exact: true }
  - shot: billing-cloud-expired-current-plan
  - click: { role: button, name: Cancel, exact: true }
  - wait: { text: Your subscription has expired. }
  - shot: billing-cloud-expired-plan-back
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['demo-mcp-admin','demo-billing-cloud-none'],strict:true,locale:'en',anchor:'2026-10-09T10:00:00-04:00'})});
        if (!res.ok) throw new Error('Billing fixture reset failed');
        location.href = '/admin/billing';
      })()
  - wait: { role: button, name: Get Business Plan, exact: true }
  - shot: billing-cloud-statuses-unsubscribed-restore
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin','demo-billing-cloud-trialing'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
        window.location.href = '/admin/billing';
      })()
  - wait: { role: button, name: Manage Plan, exact: true }
  - shot: billing-cloud-portal-native-control
  - click: { role: button, name: Manage Plan, exact: true }
  - wait: { role: heading, name: LOCAL FAKE DEMO, exact: true }
  - wait: { text: 'LOCAL FAKE DEMO — billing portal handoff staged; no payment, Stripe session or live account changed', exact: true }
  - wait: { text: Native Manage Plan POST received; same-origin handoff only., exact: true }
  - shot: billing-cloud-portal-local-fake-disclosure
  - eval: |
      (async () => {
        if (location.pathname !== '/api/mockshop/admin-pages/billing-portal') throw new Error('Native portal redirect did not reach the approved same-origin disclosure');
        const receipt = await fetch('/api/mockshop/admin-pages/billing-handoffs').then(r => r.json());
        const billing = await fetch('/api/tenants/billing-information').then(r => r.json());
        if (!receipt.portal || receipt.portal.request_keys.join(',') !== 'return_url' || receipt.portal.return_path !== '/admin/billing?portal_return=true' || receipt.portal.response_path !== location.pathname || receipt.portal.provider_contacted !== false || billing.status !== 'trialing') throw new Error('Native portal request/response or protected subscription changed');
      })()
  - shot: billing-cloud-portal-request-response-boundary
  - click: { role: link, name: Back to native Billing, exact: true }
  - wait: { role: button, name: Manage Plan, exact: true }
  - wait: { role: button, name: Upgrade now, exact: true }
  - shot: billing-cloud-portal-native-return
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin','demo-billing-cloud-trialing'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
        window.location.href = '/admin/billing';
      })()
  - wait: { role: button, name: Manage Plan, exact: true }
  - eval: |
      (async () => {
        const receipt = await fetch('/api/mockshop/admin-pages/billing-handoffs').then(r => r.json());
        if (receipt.checkout !== null || receipt.portal !== null) throw new Error('Fresh reset retained portal request metadata');
      })()
  - shot: reset-billing-cloud-portal-handoff
  - wait: { text: Business Plan, exact: true }
  - click: { role: button, name: View Plan Details, exact: true }
  - wait: { selector: '[aria-label="Business plan card"]:has-text("Your Current Plan")' }
  - eval: |
      if (document.querySelector('[aria-label="Enterprise plan card"]')?.textContent.includes('Your Current Plan')) throw new Error('Subscribed trial must not mark Enterprise as current');
  - shot: billing-cloud-trial-business-current-plan
  - click: { role: button, name: Cancel, exact: true }
  - wait: { text: Business Plan, exact: true }
