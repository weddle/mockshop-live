# #34 EDITONLY prepared native unit; no execution/acceptance claim. CE/other locales unverified.
# Fictional LOCAL inputs only. Every run independently resets the same sole Auth owner.
name: user-conditional-password
title: User Conditional Password
requires: enterprise
strict: true
locale: en
viewport:
- 1440
- 900
overlays:
- edition-enterprise
- demo-user-conditional
known_errors:
- match: /^http 400 POST http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/password\/change-password$/
  reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and
    unchanged receipt.
- match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source:
    http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/password\/change-password\]$/'
  reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console
    waiver.
- match: '/^console: \[Toast\] LOCAL FAKE DEMO — fictional password change rejected; demo state unchanged\. \[source:
    http:\/\/(127\.0\.0\.1|localhost):\d+\/_next\/static\/chunks\/[A-Za-z0-9_.-]+\.js\]$/'
  reason: Exact required staged native Toast only; visible same message and protected finite state asserted. Parent
    must anchor observed compiled source URL before acceptance.
steps:
- goto: /app/settings/accounts-access
- eval: "(async () => {\n  const current = await (await fetch('/api/__mockshop/state')).json();\n  const response\
    \ = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['edition-enterprise','demo-user-conditional'],anchor:current.demo_anchor,locale:'en',keep:false})});\n\
    \  if (!response.ok) throw new Error('Conditional independent reset failed');\n  const receipt = await (await\
    \ fetch('/api/mockshop/user-conditional/receipts')).json();\n  if (Object.keys(receipt.callbacks).length ||\
    \ Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered)\
    \ throw new Error('Conditional reset retained dirty receipts');\n  const me = await (await fetch('/api/me')).json();\n\
    \  if (me.email !== 'alex.learner@workshop.example' || !me.password_configured) throw new Error('Sole Auth owner\
    \ did not restore fictional member');\n})()"
- goto: /app/settings/general
- click:
    selector: a[href="/app/settings/accounts-access"]
- wait:
    text: Change Password
    exact: true
- shot:
    name: conditional-password-native-entry
    delay: 0
- click:
    role: button
    name: Change Password
    exact: true
- wait:
    selector: input[name="currentPassword"]
- eval: if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native untouched password
    submit was not disabled');
- shot:
    name: conditional-password-empty-disabled
    delay: 0
- click: { selector: 'input[name="currentPassword"]' }
- press: Tab
- click: { selector: 'input[name="newPassword"]' }
- press: Tab
- click: { selector: 'input[name="confirmPassword"]' }
- press: Tab
- eval: |
    if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native required-field submit guard missing');
- shot: { name: conditional-password-required-fields, delay: 0 }
- click:
    selector: '[role="dialog"] button[aria-label="Close"]'
- wait_gone:
    role: dialog
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(!r.passwordChanged))
    throw new Error('Native interaction receipt mismatch'); })()
- shot:
    name: conditional-password-cancel-protected
    delay: 0
- click:
    role: button
    name: Change Password
    exact: true
- fill:
    selector: input[name="currentPassword"]
    value: MockOnly-Rejected-Password
- fill:
    selector: input[name="newPassword"]
    value: short
- fill:
    selector: input[name="confirmPassword"]
    value: short
- press: Tab
- eval: if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native minimum-length validation
    did not disable submit');
- shot:
    name: conditional-password-minimum-validation
    delay: 0
- fill:
    selector: input[name="newPassword"]
    value: MockOnly-Workshop2!
- fill:
    selector: input[name="confirmPassword"]
    value: MockOnly-Mismatch2!
- press: Tab
- eval: if (!document.querySelector('[role=dialog] button:disabled')) throw new Error('Native mismatch validation
    did not disable submit');
- shot:
    name: conditional-password-mismatch
    delay: 0
- fill:
    selector: input[name="confirmPassword"]
    value: MockOnly-Workshop2!
- click:
    role: button
    name: Update
    exact: true
- wait:
    text: Updating...
    exact: true
- shot:
    name: conditional-password-rejected-pending
    delay: 0
- wait:
    text: LOCAL FAKE DEMO — fictional password change rejected; demo state unchanged.
    exact: true
- wait:
    selector: input[name="currentPassword"]
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(!r.passwordChanged))
    throw new Error('Native interaction receipt mismatch'); })()
- shot:
    name: conditional-password-error-protected
    delay: 0
- fill:
    selector: input[name="currentPassword"]
    value: MockOnly-Workshop1!
- click:
    role: button
    name: Update
    exact: true
- wait:
    text: Updating...
    exact: true
- shot:
    name: conditional-password-pending
    delay: 0
- wait:
    text: Password updated successfully
    exact: true
- wait_gone:
    role: dialog
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.passwordChanged))
    throw new Error('Native interaction receipt mismatch'); })()
- shot:
    name: conditional-password-success
    delay: 0
- goto: /app/settings/general
- goto: /app/settings/accounts-access
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.passwordChanged))
    throw new Error('Native interaction receipt mismatch'); })()
- shot:
    name: conditional-password-navigation-receipt
    delay: 0
- eval: location.reload()
- wait:
    text: Change Password
    exact: true
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.passwordChanged))
    throw new Error('Native interaction receipt mismatch'); })()
- shot:
    name: conditional-password-reload
    delay: 0
- eval: (async () => { const r=await fetch('/api/mockshop/auth-anonymous/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'anonymous'})});
    if(!r.ok) throw new Error('Sole Auth conditional staging failed'); })()
- goto: /app/settings/accounts-access
- eval: (async () => { const me=await (await fetch('/api/me')).json(); if(me.email!=="alex.learner@workshop.example")
    throw new Error('Sole Auth identity mismatch'); })()
- eval: if ([...document.querySelectorAll('button')].some(x=>x.textContent.trim()==='Change Password')) throw new
    Error('Native password_configured=false section remained visible');
- shot:
    name: conditional-password-not-configured
    delay: 0
- eval: "(async () => {\n  const current = await (await fetch('/api/__mockshop/state')).json();\n  const response\
    \ = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['edition-enterprise','demo-user-conditional'],anchor:current.demo_anchor,locale:'en',keep:false})});\n\
    \  if (!response.ok) throw new Error('Conditional independent reset failed');\n  const receipt = await (await\
    \ fetch('/api/mockshop/user-conditional/receipts')).json();\n  if (Object.keys(receipt.callbacks).length ||\
    \ Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered)\
    \ throw new Error('Conditional reset retained dirty receipts');\n  const me = await (await fetch('/api/me')).json();\n\
    \  if (me.email !== 'alex.learner@workshop.example' || !me.password_configured) throw new Error('Sole Auth owner\
    \ did not restore fictional member');\n})()"
- goto: /app/settings/accounts-access
- wait:
    text: Change Password
    exact: true
- shot:
    name: conditional-password-fresh-reset
    delay: 0
