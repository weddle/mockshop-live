  # Owning dirty/reset outcome discards native saved-image/table chat.
  - eval: |
      const id = new URL(location.href).searchParams.get('chatId');
      if (!id) throw new Error('Saved visual attachments have no native chat');
      sessionStorage.setItem('files-visual-chat', id);
  # Owning dirty/reset outcome discards native saved-image/table chat.
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const result = await fetch('/api/__mockshop/state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({overlays: [], anchor: current.demo_anchor, locale: 'en', keep: false, resetChats: true})});
        if (!result.ok) throw new Error('File state control failed');
      })()
  # Owning dirty/reset outcome discards native saved-image/table chat.
  - goto: /app
  # Owning dirty/reset outcome discards native saved-image/table chat.
  - wait: { selector: '#onyx-chat-input-textbox' }
  # Owning dirty/reset outcome discards native saved-image/table chat.
  - eval: |
      const id = sessionStorage.getItem('files-visual-chat');
      if (document.querySelector('#onyx-human-message') || document.querySelector(`a[href="/app?chatId=${id}"]`)) throw new Error('Fresh reset retained the saved visual chat');
