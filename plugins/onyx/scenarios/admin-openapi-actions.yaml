# #65 route-sized native proof: OpenAPI Actions.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-openapi-actions
title: OpenAPI Actions - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/openapi-actions
  - shot: inventory-openapi-actions
  - goto: /admin/craft/preferences
  - click: { selector: 'a[href="/admin/openapi-actions"]' }
  - shot: openapi-actions-menu-empty
  - goto: /admin/openapi-actions
  - shot: openapi-actions-direct
  - click: { role: button, name: Add OpenAPI Action, exact: true }
  - wait: { role: dialog }
  - fill:
      selector: 'textarea[name="definition"]'
      value: '{"openapi":"3.0.0","info":{"title":"Workshop reference (fake)","version":"1.0.0","description":"Fictional educational reference; no API calls."},"servers":[{"url":"https://workshop.example.invalid"}],"paths":{"/notes":{"get":{"operationId":"workshop_notes","summary":"Read fictional workshop notes","responses":{"200":{"description":"Educational notes"}}}}}}'
  - shot: openapi-actions-add-dialog
  - click: { selector: '[role="dialog"] button:has-text("Add Action")' }
  - wait: { selector: '[role="dialog"] input[name="authorizationUrl"]' }
  - fill: { selector: 'input[name="authorizationUrl"]', value: 'https://workshop.example.invalid/authorize' }
  - fill: { selector: 'input[name="tokenUrl"]', value: 'https://workshop.example.invalid/token' }
  - fill: { selector: 'input[name="clientId"]', value: mock-only-client }
  - fill: { selector: 'input[name="clientSecret"]', value: mock-only-not-a-secret }
  - shot: openapi-actions-local-auth-dialog
  - click: { selector: '[role="dialog"] button:has-text("Connect")' }
  - wait_gone: { role: dialog }
  - goto: /admin/security
  - goto: /admin/openapi-actions
  - wait: { text: Workshop reference (fake), exact: true }
  - shot: openapi-actions-saved
