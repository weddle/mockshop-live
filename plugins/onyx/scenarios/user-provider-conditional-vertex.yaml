- &id001
  eval: (async () => { const ar=await fetch('/api/admin/llm/provider'),ur=await fetch('/api/llm/provider'); if(!ar.ok
    || !ur.ok) throw new Error('Conditional provider metadata read failed'); const a=await ar.json(),u=await ur.json(),p=a.providers[0];
    if(a.providers.length!==1 || p?.provider!=="vertex_ai" || p.custom_config?.["vertex_auth_method"]!=="workload_identity"
    || p.custom_config?.["vertex_project"]!=="mock-education-vertex-project" || p.custom_config?.["vertex_location"]!=="us-central1"
    || Object.hasOwn(p.custom_config || {},"vertex_credentials") || u.providers.length!==1 || u.providers[0].id!==p.id
    || u.default_text?.provider_id!==p.id || u.default_text?.model_name!=='learning-notes-demo' || !u.providers[0].model_configurations.some(m=>m.name==='learning-notes-demo'
    && m.is_visible)) throw new Error('Sole saved provider conditional metadata/redaction/default consumer mismatch');
    })()
