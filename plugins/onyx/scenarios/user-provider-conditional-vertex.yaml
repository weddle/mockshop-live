# EDITONLY prepared; unexecuted/unaccepted. Fictional local inputs only.
# Existing #33 first-run/name prerequisite and sole #3 provider store; no real provider calls.
# Saved-form edit is NOT available in onboarding: connected card navigates /admin/language-models.
# Cancel reopens a pristine NEW form; saved conditional ADMIN edit remains separate/unverified.
# VertexAIModal70–79: method changes clear inactive fields;79–85 hooks_enabled gates selector.
# Required Workload project; service-account upload remains the native FILE control, not a textarea.
# This conditional slice saves Workload Identity only, not the previously accepted default form.
# Filtered custom_config contains method/project/location and omits empty vertex_credentials.
name: user-provider-conditional-vertex
title: Native onboarding Vertex auth-method conditional project/region controls
requires: enterprise
strict: true
locale: en
viewport:
- 1440
- 1000
overlays:
- demo-user-extras-first-run
- demo-provider-conditional
steps:
- goto: /app
- eval: (async () => { const me=await (await fetch('/api/me')).json(); localStorage.removeItem(`onyx:onboardingCompleted:${me.id}`);
    localStorage.removeItem('allUsersInitialPopupFlowCompleted'); })()
- goto: /app
- wait:
    selector: '[aria-label="onboarding-flow"]'
- click:
    role: button
    name: Let's Go
    exact: true
- wait:
    placeholder: Your name
- fill:
    placeholder: Your name
    value: Jordan Workshop Educator
- settle: 900
- click:
    role: button
    name: Next
    exact: true
- wait:
    selector: '[aria-label="onboarding-llm-step"]'
- eval: (async () => { for(const path of ['/api/admin/llm/provider','/api/llm/provider']) { const r=await fetch(path);
    if(!r.ok) throw new Error('Provider catalog read failed'); const c=await r.json(); if(c.providers.length!==0
    || c.default_text!==null) throw new Error('Canceled draft/fresh seed mutated configured provider catalog');
    } })()
- eval: (async () => { const settings=await (await fetch('/api/settings')).json(); if(settings.hooks_enabled!==true)
    throw new Error('Native Vertex selector requires opt-in hooks_enabled'); })()
- click:
    selector: '[aria-label="onboarding-llm-step"] [role="button"]:has-text("Gemini")'
- wait:
    selector: '[role="dialog"]'
- wait:
    text: Learning Notes (local fake)
    exact: true
- click:
    selector: '[role="dialog"] input[name="custom_config.vertex_auth_method"]'
- wait:
    selector: '[role="option"]:has-text("Workload Identity (GKE)")'
- eval: |
    const rows = [...document.querySelectorAll('[role=option]')];
    if (['Service Account JSON', 'Workload Identity (GKE)'].some(text => !rows.some(row => row.textContent.includes(text)))) throw new Error('Native Vertex auth option missing');
- shot: {name: vertex-native-auth-method-menu, full_page: true}
- click:
    selector: '[role="option"]:has-text("Workload Identity (GKE)")'
- wait:
    selector: '[role="dialog"] input[name="custom_config.vertex_project"]'
- eval: if (document.querySelector("[role=\"dialog\"] input[name=\"custom_config.vertex_auth_method\"]")?.value
    !== "Workload Identity (GKE)" || document.querySelector("[role=\"dialog\"] input[name=\"custom_config.vertex_project\"]")?.value
    !== "" || document.querySelector('[role=dialog] input[type=file]')) throw new Error('Native provider conditional
    field/reset mismatch');
- fill:
