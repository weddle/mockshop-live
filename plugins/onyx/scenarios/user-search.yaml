# #30: pin-native controls, not an invented /search route or Auto menu option.
# Parent composes handlers-user-search callbacks before exercising this inventory.
name: user-search
title: Native Search and Chat modes, source filters, time and tags, results and reset
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
known_errors:
  - match: '/^console: \[Toast\] Fictional search is temporarily unavailable\. Try another workshop query\. \[source: http:\/\/127\.0\.0\.1:\d+\/_next\/static\/chunks\/1h15gs0jly9g_\.js\]$/'
    reason: 'Required staged native Search error: SearchUI calls toast.error on the fixture JSON error and the pinned toast store logs this exact message. Network misses, OAuth failures, other console errors and failed steps remain strict.'
steps:
