  # Native blocked deletion must preserve the selected protected row and the owning association.
  - eval: |
      (async () => {
        if (!document.body.textContent.includes('Cannot delete file. It is associated with projects: Revision Workshop')) throw new Error('Expected native association guard is not visible');
        const row = [...document.querySelectorAll('[role="dialog"] .opal-attachment-item-button')].find(el => el.textContent.includes('library-reading.txt'));
        if (!row) throw new Error('Blocked deletion removed the native protected file row');
        const files = await (await fetch('/api/user/files/recent')).json();
        const details = await (await fetch('/api/user/projects/2/details')).json();
        if (!files.some(file => file.id === 'uf-demo-reading') || !details.files.some(file => file.id === 'uf-demo-reading')) throw new Error('Blocked deletion changed the protected file or project association');
      })()
