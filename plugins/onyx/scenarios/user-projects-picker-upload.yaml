  # Original user-projects step 119 (source line 155): Preserved native journey.
  - eval: |
      const input = document.querySelector('.pb-2 > input[type="file"][tabindex="-1"]');
      const dropzone = input?.parentElement;
      if (!dropzone) throw new Error('Project dropzone missing');
      const transfer = new DataTransfer();
      transfer.items.add(new File(['# Fictional reflection\nWhat helped you learn today?'], 'reflection.md', {type:'text/markdown'}));
      dropzone.dispatchEvent(new DragEvent('dragenter', {bubbles:true,cancelable:true,dataTransfer:transfer}));
      dropzone.dispatchEvent(new DragEvent('dragover', {bubbles:true,cancelable:true,dataTransfer:transfer}));
      dropzone.dispatchEvent(new DragEvent('drop', {bubbles:true,cancelable:true,dataTransfer:transfer}));
