# #65 route-sized native proof: Standard Answer list/create/edit aliases.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-standard-answers
title: Standard Answer list/create/edit aliases - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/standard-answer
  - shot: inventory-standard-answer-alias
  - goto: /ee/admin/standard-answer
  - shot: inventory-standard-answer-ee
  - goto: /admin/standard-answer/new
  - shot: inventory-standard-answer-new-alias
  - goto: /ee/admin/standard-answer/new
  - shot: inventory-standard-answer-new-ee
  - goto: /admin/standard-answer/6501
  - shot: inventory-standard-answer-edit-alias
  - goto: /ee/admin/standard-answer/6501
  - shot: inventory-standard-answer-edit-ee
  - goto: /admin/standard-answer
  - wait: { text: workshop-hours, exact: true }
  - shot: standard-answer-alias
  - goto: /ee/admin/standard-answer
  - shot: standard-answer-list-ee
  - goto: /admin/standard-answer/new
  - shot: standard-answer-new-alias
  - goto: /ee/admin/standard-answer/new
  - shot: standard-answer-new-ee
  - fill: { selector: 'input[name="keyword"]', value: workshop-checklist }
  - fill: { selector: 'textarea[name="answer"]', value: Prepare fictional accessible notes and a quiet workspace. }
  - fill: { placeholder: 'Type a category and press Enter…', value: Learning operations }
  - press: Enter
  - shot: standard-answer-create-filled
  - click: { role: button, name: Create!, exact: true }
  - wait: { text: workshop-checklist, exact: true }
  - goto: /admin/security
  - goto: /admin/standard-answer
  - wait: { text: workshop-checklist, exact: true }
  - shot: standard-answer-created
  - click: { selector: 'tr:has-text("workshop-checklist") button' }
  - wait_gone: { text: workshop-checklist, exact: true }
  - shot: standard-answer-deleted
  - goto: /admin/standard-answer/6501
  - shot: standard-answer-edit-alias
  - goto: /ee/admin/standard-answer/6501
  - fill: { selector: 'textarea[name="answer"]', value: The fictional workshop is open from 10:00 to 16:00. }
  - shot: standard-answer-edit-ee
  - click: { role: button, name: Update!, exact: true }
  - goto: /admin/standard-answer
  - wait: { text: The fictional workshop is open from 10:00 to 16:00., exact: true }
  - shot: standard-answer-saved
