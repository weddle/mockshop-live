# Requires the same pinned frontend compiled with NEXT_PUBLIC_CLOUD_ENABLED=true.
# Enterprise alone and fake fixture flags cannot enable native Pending/Approve.
# Unverified gate-specific inventory; no conditional no-op steps or acceptance claim.
name: admin-users-cloud
title: Native Cloud Users requests - Pending and Approve
strict: true
requires: enterprise-cloud
locale: en
overlays: []
steps:
  - goto: /admin/documents/sets
  - click: { selector: 'a[href="/admin/users"]' }
  - wait: { text: Users & Requests, exact: true }
  - wait: { role: button, name: Filter by requests to join, exact: true }
  - shot: users-cloud-menu-entry
  - goto: /admin/users
  - wait: { role: button, name: Filter by requests to join, exact: true }
  - shot: users-cloud-direct-entry
  - click: { role: button, name: Filter by requests to join, exact: true }
  - wait: { text: robin.lee@learning-lab.example, exact: true }
  - shot: users-cloud-pending-filter
  - click: { role: button, name: User actions, exact: true }
  - wait: { text: Approve, exact: true }
  - shot: users-cloud-pending-menu
  - click: { text: Approve, exact: true }
  - wait_gone: { text: robin.lee@learning-lab.example, exact: true }
  - shot: users-cloud-approved
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: robin.lee }
  - wait: { text: robin.lee@learning-lab.example, exact: true }
  - click: { role: button, name: User actions, exact: true }
  - wait: { text: Cancel Invite, exact: true }
  - shot: users-cloud-approved-invitation-persisted
  - press: Escape
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strict:true,locale:'en'})});
        if (!res.ok) throw new Error('Mock reset failed');
        location.reload();
      })()
  - wait: { role: button, name: Filter by requests to join, exact: true }
  - click: { role: button, name: Filter by requests to join, exact: true }
  - wait: { text: robin.lee@learning-lab.example, exact: true }
  - shot: users-cloud-pending-reset
