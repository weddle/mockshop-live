  - eval: |
      const composer = document.querySelector('#onyx-chat-input');
      if ((composer.textContent.match(/pasted-notes.txt/g) || []).length !== 1) throw new Error('Pasted file was lost or uploaded twice by the dropzone');
  # Original user-files step 187, source line 249.
  - shot: paste-file-ready
  # Original user-files step 188, source line 250.
  - hover: { text: pasted-notes.txt, exact: true }
  # Original user-files step 189, source line 251.
