  - eval: |
      const transfer = new DataTransfer();
      transfer.items.add(new File(['Disposable fake pasted content.'], 'pasted-notes.txt', {type: 'text/plain'}));
      document.querySelector('#onyx-chat-input-textbox').dispatchEvent(new ClipboardEvent('paste', {clipboardData: transfer, bubbles: true, cancelable: true}));
  # Original user-files step 183, source line 243.
  - wait: { text: Processing..., exact: true }
  # Original user-files step 184, source line 244.
  - shot: paste-file-processing
  # Original user-files step 185, source line 245.
  - wait_gone: { text: Processing..., exact: true, timeout: 20000 }
