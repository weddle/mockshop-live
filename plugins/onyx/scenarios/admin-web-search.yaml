# #65 route-sized native proof: Web Search.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-web-search
title: Web Search - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/web-search
  - shot: inventory-web-search
  - goto: /admin/web-search
  - wait: { text: Search Engine, exact: true }
  - shot: web-search-direct
  - click: { selector: 'button[aria-label="Edit Learning web search (fake)"]' }
  - wait: { role: dialog }
  - fill: { selector: 'input[name="api_key"]', value: mock-only-replacement-not-a-secret }
  - shot: web-search-edit-dialog
  - click: { selector: '[role="dialog"] button[type="submit"]' }
  - wait_gone: { role: dialog }
  - goto: /admin/security
  - goto: /admin/web-search
  - shot: web-search-saved
  - scroll: { text: Web Crawler, exact: true }
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Onyx Web Crawler"]' }
  - shot: web-crawler-native-default
  - click: { selector: '[data-testid="content-provider-list"] [aria-label="Firecrawl"]' }
  - wait: { role: dialog }
  - shot: web-crawler-firecrawl-form
  - fill: { selector: '[role="dialog"] input[name="api_key"]', value: mock-only-crawler-not-a-secret }
  - click: { selector: '[role="dialog"] button:has-text("Connect")' }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Firecrawl"] button:has-text("Current Crawler")' }
  - shot: web-crawler-firecrawl-connected
  - goto: /admin/security
  - goto: /admin/web-search
  - scroll: { text: Web Crawler, exact: true }
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Firecrawl"] button:has-text("Current Crawler")' }
  - shot: web-crawler-navigation-readback
  - click: { selector: '[data-testid="content-provider-list"] [aria-label="Onyx Web Crawler"]' }
  - wait: { selector: '[data-testid="content-provider-list"] [aria-label="Onyx Web Crawler"] button:has-text("Current Crawler")' }
  - shot: web-crawler-native-default-restored
