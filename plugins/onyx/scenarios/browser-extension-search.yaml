# #71 EDITONLY declaration; actual parent build/native acceptance still pending.
# Independent existing runner seed/reset/browser; never consume predecessor unit state.

# Genuine chrome-extension ancestor/origin proof remains a separately required parent supplement.
name: browser-extension-search
title: Independent native NRF Search menu, loading, results, empty, exact staged failure and recovery
strict: true
requires: enterprise
locale: en
viewport: [1440, 1000]
overlays: []
known_errors:
  - match: '/^console: \[Toast\] Fictional search is temporarily unavailable\. Try another workshop query\. \[source: http:\/\/127\.0\.0\.1:3328\/_next\/static\/chunks\/[A-Za-z0-9_-]+\.js\]$/'
    reason: 'Exact #30 staged error Toast from the assigned native compiled chunk; SearchUI.tsx66-71 calls toast.error. Visible error/query protection and native recovery are asserted. No other Toast, URL, HTTP error or failed step is allowed.'
steps:
  - goto: /nrf
  - wait: { selector: '#onyx-chat-input-textbox' }
  - click: { role: button, name: Change app mode, exact: true }
  - shot: { name: nrf-search-chat-mode-menu, full_page: true }
  - click: { selector: '[role="option"]:has-text("Quick search for documents")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: Find learning resources }
  - click: { selector: '#onyx-chat-input-send-button', settle: 0 }
  - wait: 250
  - shot: { name: nrf-search-loading, full_page: true, delay: 0 }
  - wait: { text: 22 Results, exact: true }
  - shot: { name: nrf-search-results, full_page: true }
  - fill: { selector: '#onyx-chat-input-textbox', value: unlisted workshop }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: No results found, exact: true }
  - shot: { name: nrf-search-empty, full_page: true }
  - fill: { selector: '#onyx-chat-input-textbox', value: search unavailable }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: Search failed, exact: true }
  - wait: { text: Fictional search is temporarily unavailable. Try another workshop query., exact: true }
  - eval: |
      if (document.querySelector('#onyx-chat-input-textbox')?.textContent.trim() !== 'search unavailable' || document.querySelector('[data-testid="AgentMessage/toolbar"]')) throw new Error('Native Search error changed the query or created an assistant response');
  - shot: { name: nrf-search-error, full_page: true }
  - fill: { selector: '#onyx-chat-input-textbox', value: Find learning resources }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: 22 Results, exact: true }
  - shot: { name: nrf-search-recovered, full_page: true }
  - wait_gone: { text: Search failed, exact: true }
