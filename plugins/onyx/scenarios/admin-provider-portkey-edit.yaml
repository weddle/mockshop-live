  - eval: >-
      (async () => { const r = await fetch('/api/admin/llm/provider'); if (!r.ok) throw new Error('Seed catalog read failed');
      const c = await r.json(); const p = c.providers.find(p => p.id === 58);
      if (c.providers.length !== 1 || p?.provider !== 'portkey' || p.name !== 'Campus Portkey (local fake)' || p.custom_config?.portkey_api_mode !== 'messages' || p.api_base !== 'https://campus-portkey.invalid/seed/messages' || p.api_key !== 'mock-only-not-a-secret') throw new Error('Configured Portkey seed prerequisite missing');
      sessionStorage.setItem('mockshop-admin-portkey-seed', JSON.stringify(c)); })()
