# #65 route-sized native proof: Index Settings.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-index-settings
title: Index Settings - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/index-settings
  - shot: inventory-index-settings
  - goto: /admin/index-settings
  - wait: { text: View All Models, exact: true }
  - shot: index-settings-direct
  - click: { selector: 'a[href="/admin/index-settings"]' }
  - click: { role: button, name: View All Models, exact: true }
  - shot: index-settings-model-panel
  - click: { role: button, name: Add Custom Model, exact: true }
  - wait: { role: dialog }
  - shot: index-settings-custom-dialog
  - fill: { selector: 'input[name="modelName"]', value: educational/fake-embedding }
  - fill: { selector: 'input[name="modelDim"]', value: '768' }
  - click: { role: button, name: Connect, exact: true }
  - wait_gone: { role: dialog }
  - shot: index-settings-custom-selected
  - click: { role: button, name: Apply & Re-index, exact: true }
  - goto: /admin/security
  - goto: /admin/index-settings
  - wait: { text: educational/fake-embedding, exact: true }
  - shot: index-settings-custom-saved
  - scroll: { text: Vector Quantization, exact: true }
  - shot: index-lower-vector-quantization-loaded
  - click: { selector: 'label:has-text("Vector Quantization") button', nth: 0 }
  - wait: { text: 7-bit, exact: true }
  - shot: index-vector-quantization-options
  - click: { text: 7-bit, exact: true }
  - scroll: { text: Retrieval Optimization, exact: true }
  - wait: { selector: 'label:has-text("Multipass Indexing") [role="switch"][disabled]' }
  - shot: index-retrieval-native-disabled-multipass
  - click: { selector: 'label:has-text("Contextual Retrieval") [role="switch"]' }
  - click: { selector: 'label:has-text("Contextual Retrieval LLM") input[role="combobox"]' }
  - click: { selector: '[role="listbox"] [role="button"][aria-expanded="false"]:has-text("OpenAI")' }
  - click: { selector: '[role="listbox"] [role="option"]:has-text("GPT-5.2")' }
  - wait: { selector: 'label:has-text("Contextual Retrieval LLM") input[value="GPT-5.2"]' }
  - shot: index-contextual-native-model-selected
  - scroll: { text: Image Processing, exact: true }
  - click: { selector: 'label:has-text("Extract & Caption Images") [role="switch"]' }
  - wait: { selector: 'label:has-text("Extract & Caption Images") [role="switch"][aria-checked="false"]' }
  - click: { selector: 'label:has-text("Extract & Caption Images") [role="switch"]' }
  - wait: { selector: 'label:has-text("Extract & Caption Images") [role="switch"][aria-checked="true"]' }
  - click: { selector: 'label:has-text("Captioning LLM") input[role="combobox"]' }
  - click: { selector: '[role="listbox"] [role="option"]:has-text("GPT-4.1")' }
  - wait: { selector: 'label:has-text("Captioning LLM") input[value="GPT-4.1"]' }
  - click: { selector: 'label:has-text("Max Image Size for Analysis") button', nth: 0 }
  - click: { text: '10', exact: true }
  - shot: index-image-captioning-size-draft
  - click: { role: button, name: Revert, exact: true }
  - wait: { selector: 'label:has-text("Extract & Caption Images") [role="switch"][aria-checked="true"]' }
  - shot: index-image-native-reverted
  - scroll: { text: Retrieval Optimization, exact: true }
  - wait: { selector: 'label:has-text("Contextual Retrieval") [role="switch"][aria-checked="false"]' }
  - shot: index-retrieval-native-reverted
  - scroll: { text: Vector Quantization, exact: true }
  - wait: { selector: 'label:has-text("Vector Quantization") input[value="None"]' }
  - shot: index-vector-native-reverted
