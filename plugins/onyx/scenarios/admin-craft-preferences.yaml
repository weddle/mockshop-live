# #65 route-sized native proof: Craft Preferences.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-craft-preferences
title: Craft Preferences - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/craft/preferences
  - shot: inventory-craft-preferences
  - goto: /admin/craft/apps?tab=mcp
  - click: { selector: 'a[href="/admin/craft/preferences"]' }
  - wait: { text: Workspace instructions, exact: true }
  - shot: craft-preferences-menu
  - goto: /admin/craft/preferences
  - fill: { placeholder: 'e.g. Always follow our brand guidelines and prefer concise, formal copy.', value: Prepare accessible fictional workshop examples. }
  - click: { role: button, name: Save, exact: true }
  - goto: /admin/voice
  - goto: /admin/craft/preferences
  - eval: |
      if (![...document.querySelectorAll('textarea')].some(el => el.value === 'Prepare accessible fictional workshop examples.')) throw new Error('Craft instructions did not persist');
  - shot: craft-preferences-saved
  - click: { text: View base instructions, exact: true }
  - shot: craft-preferences-base-panel
  - click: { role: button, name: Reset to default, exact: true }
  - wait: { role: dialog }
  - shot: craft-preferences-reset-confirm
  - click: { selector: '[role="dialog"] button:has-text("Reset")' }
  - wait_gone: { role: dialog }
  - shot: craft-preferences-reset
