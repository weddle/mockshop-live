# #33 independent route proof; scoped DEVELOPMENT only, parent acceptance/publication pending.

name: user-extras-ownership
title: Native Extras - ownership
requires: enterprise
strict: true
locale: en
viewport: [1440, 1000]
overlays: [demo-user-extras]
steps:
  # Independent native setup replay; deliberately no duplicate evidence shots.
  - goto: /app
  - wait: { text: Welcome to Lakeshore Learning, exact: true }
  - click: { label: Consent checkbox }
  - click: { role: button, name: Start, exact: true }
  - wait_gone: { selector: '[role="dialog"]' }
  - goto: /app/agents/edit/11
  - wait: { selector: 'input[name="name"]' }
  - click: { role: button, name: Share, exact: true }
  - wait: { text: Learning Team, exact: true }
  - click: { role: button, name: Copy Link, exact: true }
  - wait: { text: Copied link., exact: true }
  - click: { label: Update access for Learning Team }
  - click: { selector: '[role="listbox"][aria-label="Update access for Learning Team"] [role="option"]:has(:text-is("View & Chat"))' }
  - fill: { placeholder: 'Add users, groups, and accounts', value: Clinical }
  - click: { text: Clinical Educators, exact: true }
  - click: { label: Select staged permission }
  - click: { selector: '[role="listbox"][aria-label="Select staged permission"] [role="option"]:has(:text-is("Edit"))' }
  - click: { selector: '[role="dialog"] >> role=button[name="Save"]' }
  - goto: /app/agents/edit/11
  - click: { role: button, name: Share, exact: true }
  - wait: { text: Clinical Educators, exact: true }
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if (!a.group_shares.some(s=>s.group_id===330&&s.permission==='VIEWER') || !a.group_shares.some(s=>s.group_id===331&&s.permission==='EDITOR')) throw new Error('Native group choices did not persist');
      })()
  - fill: { placeholder: 'Add users, groups, and accounts', value: DEVON }
  - click: { text: devon.ortiz@seasidecollection.example, exact: true }
  - click: { label: Select staged permission }
  - click: { selector: '[role="listbox"][aria-label="Select staged permission"] [role="option"]:has(:text-is("Edit"))' }
  - click: { selector: '[role="dialog"] >> role=button[name="Save"]' }
  - goto: /app/agents/edit/11
  - click: { role: button, name: Share, exact: true }
  - wait: { text: devon.ortiz@seasidecollection.example, exact: true }
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if (!a.user_shares.some(s=>s.user.id==='u2'&&s.permission==='EDITOR')) throw new Error('Native user sharing choice did not persist');
      })()
  - click: { role: button, name: Copy Link, exact: true }
  - wait: { text: Copied link., exact: true }
  - click: { label: Change sharing scope }
  - click: { text: Anyone in your organization, exact: true }
  - click: { label: Change public permission }
  - click: { selector: '[role="listbox"][aria-label="Change public permission"] [role="option"]:has(:text-is("Edit"))' }
  - click: { selector: '[role="dialog"] >> role=button[name="Save"]' }
  # Lossless primary operations from the former monolithic proof.
  - goto: /app/agents/edit/11
  - click: { role: button, name: Share, exact: true }
  - click: { label: Update access for Clinical Educators }
  - click: { text: Remove Access, exact: true }
  - shot: {name: extras-44-share-group-remove-draft, full_page: true}
  - click: { selector: '[role="dialog"] >> role=button[name="Cancel"]' }
  - click: { role: button, name: Share, exact: true }
  - wait: { text: Clinical Educators, exact: true }
  - shot: {name: extras-45-share-cancel-reopened, full_page: true}
  - click: { selector: '[role="dialog"] .min-h-11:has(:text-is("Owner")) button', nth: 0 }
  - wait: { placeholder: Add a user or group }
  - shot: {name: extras-46-ownership-transfer-empty, full_page: true}
  - fill: { placeholder: Add a user or group, value: Clinical }
  - click: { text: Clinical Educators, exact: true }
  - shot: {name: extras-47-ownership-transfer-group-selected, full_page: true}
  - click: { role: button, name: Back, exact: true }
  - click: { selector: '[role="dialog"] .min-h-11:has(:text-is("Owner")) button', nth: 0 }
  - fill: { placeholder: Add a user or group, value: Devon }
  - click: { text: devon.ortiz@seasidecollection.example, exact: true }
  - shot: {name: extras-47a-ownership-transfer-user-selected, full_page: true}
  - click: { selector: '[role="dialog"] >> role=button[name="Cancel"]' }
  - click: { role: button, name: Share, exact: true }
  - click: { selector: '[role="dialog"] .min-h-11:has(:text-is("Owner")) button', nth: 0 }
  - fill: { placeholder: Add a user or group, value: Clinical }
  - click: { text: Clinical Educators, exact: true }
  - click: { selector: '[role="dialog"] >> role=button[name="Transfer"]' }
  - goto: /app/agents/edit/11
  - click: { role: button, name: Share, exact: true }
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if(a.owner || a.owner_group?.id !== 331 || !a.is_public || a.public_permission !== 'EDITOR') throw new Error('Native owner/public choices did not persist');
      })()
  - shot: {name: extras-48-ownership-transferred-reload, full_page: true}
  - press: Escape
