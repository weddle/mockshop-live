- eval: |
    (async()=>{
      if(location.pathname!=="/admin/craft/apps"||!document.body.innerText.includes('Add app')) throw new Error('Native Craft ADMIN alias/control missing');
      const license=await fetch('/api/license');
      if(license.status!==404||(await license.json()).detail!=='Not Found') throw new Error('Expected native CE no-license404 boundary missing');
      const [mr,sr]=await Promise.all([fetch('/api/me'),fetch('/api/settings')]);
      if(!mr.ok||!sr.ok) throw new Error('Existing Community Craft bootstrap read failed');
      const m=await mr.json(),v=await sr.json();
      if(v.tier!=='community'||v.ee_features_enabled!==false||v.application_status!=='active'||m.role!=='admin'||!m.is_admin||m.craft_enabled!==true) throw new Error('License fallback changed protected Community/ADMIN seed');
    })()
