      const [mr,sr]=await Promise.all([fetch('/api/me'),fetch('/api/settings')]);
      if(!mr.ok||!sr.ok) throw new Error('Existing Community Craft bootstrap read failed');
      const m=await mr.json(),v=await sr.json();
