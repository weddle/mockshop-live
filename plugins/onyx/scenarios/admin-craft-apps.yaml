# #65 route-sized native proof: Craft Apps.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-craft-apps
title: Craft Apps - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/craft/apps
  - shot: inventory-craft-apps
  - goto: /admin/craft/access
  - click: { selector: 'a[href="/admin/craft/apps"]' }
  - wait: { text: Add app, exact: true }
  - shot: craft-apps-menu-empty
  - goto: /admin/craft/apps
  - click: { role: button, name: Add app, exact: true }
  - wait: { role: dialog }
  - shot: craft-apps-catalog-dialog
  - click: { role: button, name: Create, exact: true }
  - wait: { placeholder: My Custom App }
  - fill: { placeholder: My Custom App, value: Workshop notes (fake app) }
  - fill: { placeholder: 'https://api.example.com/*', value: 'https://workshop.example/notes/*' }
  - press: Enter
  - shot: craft-apps-custom-form
  - click: { role: button, name: Create, exact: true }
  - wait: { text: Add skills to Workshop notes (fake app), exact: true }
  - shot: craft-apps-optional-skills-dialog
  - click: { role: button, name: Skip for now, exact: true }
  - wait_gone: { role: dialog }
  - goto: /admin/voice
  - goto: /admin/craft/apps
  - wait: { text: Workshop notes (fake app), exact: true }
  - shot: craft-apps-created
  - click: { selector: 'button[aria-label="Workshop notes (fake app) actions"]' }
  - shot: craft-apps-row-menu
  - click: { text: Delete, exact: true }
  - wait: { role: dialog }
  - shot: craft-apps-delete-confirm
  - click: { role: button, name: Delete app, exact: true }
  - wait_gone: { role: dialog }
  - shot: craft-apps-deleted
