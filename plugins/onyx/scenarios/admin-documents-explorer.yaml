# #65 route-sized native proof: Document Explorer.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-documents-explorer
title: Document Explorer - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/documents/explorer
  - shot: inventory-documents-explorer
  - goto: /admin/documents/explorer
  - shot: documents-explorer-empty
  - goto: /admin/documents/explorer?query=workshop
  - shot: documents-explorer-search-empty
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin'], strict: true, anchor: '2026-10-09T10:00:00-04:00', admin_documents_fixture: 'loaded' }) });
        window.location.href = '/admin/documents/explorer?query=reading';
      })()
  - wait: { role: link, name: Workshop reading guide (fake), exact: true }
  - wait: { text: Fictional workshop reading guide with a short comprehension exercise., exact: true }
  - shot: documents-explorer-loaded-reading
  - click: { role: button, name: Edit, exact: true }
  - fill: { selector: 'div.text-sm.border-b:has-text("Workshop reading guide (fake)") input', value: '7' }
  - click: { role: button, name: Save, exact: true }
  - wait: { text: Updated score!, exact: true }
  - shot: documents-explorer-boost-saved
  - click: { role: button, name: Hide document, exact: true }
  - wait: { role: button, name: Unhide document, exact: true }
  - shot: documents-explorer-hidden
  - goto: /admin/security
  - goto: /admin/documents/explorer?query=reading
  - wait: { role: button, name: Unhide document, exact: true }
  - wait: { selector: 'div.text-sm.border-b:has-text("Workshop reading guide (fake)") button:has-text("7")' }
  - shot: documents-explorer-navigation-readback
  - click: { role: button, name: Unhide document, exact: true }
  - wait: { role: button, name: Hide document, exact: true }
  - shot: documents-explorer-visible-again
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
        window.location.href = '/admin/documents/explorer?query=reading';
      })()
  - wait_gone: { role: link, name: Workshop reading guide (fake), exact: true }
  - wait: { placeholder: Find documents based on title / content... }
  - wait_gone: { selector: 'svg[role="status"]' }
  - shot: reset-documents-explorer-empty
