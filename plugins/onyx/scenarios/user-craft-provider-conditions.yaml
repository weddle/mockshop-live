# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-provider-conditions
title: "Craft native provider-required admin/basic and nonadmin Manage absence"
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
steps:
  - goto: "/app"
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = ['edition-enterprise','demo-mcp-admin','demo-user-craft'];
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        await fetch('/api/__mockshop/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({overlays:[...JSON.parse(sessionStorage.getItem('craft-initial-overlays')),'demo-user-craft-no-provider'],anchor:current.demo_anchor,locale:'en',keep:false})});
      })()
  - goto: /craft/v1
  - wait: { text: Connect a model provider, exact: true }
  - shot: craft-provider-required-admin
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        await fetch('/api/__mockshop/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({overlays:[...JSON.parse(sessionStorage.getItem('craft-initial-overlays')),'demo-user-craft-no-provider','demo-user-craft-basic'],anchor:current.demo_anchor,locale:'en',keep:false})});
      })()
  - goto: /craft/v1
  - wait: { text: An LLM provider is required, exact: true }
  - shot: craft-provider-required-nonadmin
  - goto: /craft/v1/apps
  - eval: if ([...document.querySelectorAll('a,button')].some(e => e.textContent.trim() === 'Manage apps')) throw new Error('Native nonadmin Manage control unexpectedly present');
  - shot: craft-apps-nonadmin-condition
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
      })()
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
  - goto: "/craft/v1"
  - wait: {"selector": "[contenteditable=\"true\"][role=\"textbox\"]"}
  - shot: "craft-unit-provider-conditions-reset"
