# #31: real settings clicks, navigation/reload persistence, and consumer-visible reset isolation.
# All tokens and the Gmail account are fictional/local. No OAuth or outbound account actions.
name: user-settings
title: User preferences, memories, fake access tokens, personal connectors and usage
strict: true
viewport: [1440, 900]
steps:
  - goto: /app/settings
  - wait: { placeholder: Your name }
  - shot: settings-initial
  - fill: { placeholder: Your name, value: Maya Learning }
  - press: Enter
  - fill: { placeholder: Your role, value: Education coordinator }
  - press: Enter
  - click: { selector: 'label:has-text("Color Mode") input' }
  - click: { role: option, name: Aa Dark, exact: true }
  - settle: 600
  - goto: /app
  - goto: /app/settings/general
  - eval: |
      if (document.querySelector('input[placeholder="Your name"]')?.value !== 'Maya Learning' ||
          document.querySelector('input[placeholder="Your role"]')?.value !== 'Education coordinator' ||
          !document.documentElement.classList.contains('dark')) throw new Error('Profile/theme did not persist after navigation');
  - shot: general-persisted-dark
  # Use the settings navigation, then verify with a direct page load too.
  - click: { selector: 'a[href="/app/settings/chat-preferences"]' }
  - wait: { text: Default Model }
  - click: { selector: 'label:has-text("Default Model") input' }
  - click: { role: button, name: OpenAI, exact: true }
  - click: { text: GPT-5 mini, exact: true }
  - click: { selector: 'label:has-text("Chat Auto-scroll") [role="switch"]' }
  - wait: { selector: 'label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="true"]' }
  - click: { selector: 'label:has-text("Collapse Large Pastes") [role="switch"]' }
  - fill: { placeholder: Describe how you want the system to behave and the tone it should use., value: Use concise educational examples and plain language. }
  - press: Tab
  - click: { selector: 'label:has-text("Auto-Send on Pause") [role="switch"]' }
  - click: { selector: 'label:has-text("Reference Stored Memories") [role="switch"]' }
  - click: { selector: 'label:has-text("Update Memories") [role="switch"]' }
  # Both memory toggles off still leave the add control while the UI updates; turn update back on to add.
  - click: { selector: 'label:has-text("Update Memories") [role="switch"]' }
  - click: { role: button, name: Add memory, exact: true }
  - fill: { placeholder: Type or paste in a personal note or memory, value: I prepare learning materials for community workshops. }
  - press: Enter
  - settle: 600
  - shot: memory-created
  - click: { selector: '[role="dialog"] button[aria-label="Close"]' }
  - wait_gone: { role: dialog }
  - goto: /app
  - goto: /app/settings/chat-preferences
  - wait: { selector: 'label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="true"]' }
  - wait: { selector: 'label:has-text("Collapse Large Pastes") [role="switch"][aria-checked="false"]' }
  - wait: { selector: 'label:has-text("Auto-Send on Pause") [role="switch"][aria-checked="true"]' }
  - wait: { selector: 'label:has-text("Reference Stored Memories") [role="switch"][aria-checked="false"]' }
  - eval: |
      const model = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Default Model'))?.querySelector('input');
      const preferences = document.querySelector('textarea[placeholder="Describe how you want the system to behave and the tone it should use."]');
      if (model?.value !== 'GPT-5 mini' || preferences?.value !== 'Use concise educational examples and plain language.') throw new Error('Default model/personal preferences did not persist');
  - shot: chat-preferences-persisted
  - click: { text: View/Add, exact: true }
  - wait: { placeholder: Type or paste in a personal note or memory }
  - eval: |
      if (![...document.querySelectorAll('textarea')].some(el => el.value === 'I prepare learning materials for community workshops.')) throw new Error('Memory did not persist');
  # Edit the saved note, not an unsaved draft.
  - fill: { selector: 'textarea[placeholder="Type or paste in a personal note or memory"]:not(:placeholder-shown)', value: I prefer accessible workshop handouts. }
  - press: Enter
  - settle: 600
  - click: { selector: '[role="dialog"] button[aria-label="Close"]' }
  - wait_gone: { role: dialog }
  - goto: /app/settings/general
  - goto: /app/settings/chat-preferences
  - click: { text: View/Add, exact: true }
  - eval: |
      if (![...document.querySelectorAll('textarea')].some(el => el.value === 'I prefer accessible workshop handouts.')) throw new Error('Edited memory did not persist');
  - shot: memory-edited-persisted
  - click: { selector: 'button[aria-label="Remove Line"]:not(:disabled)' }
  - settle: 600
  - click: { selector: '[role="dialog"] button[aria-label="Close"]' }
  - wait_gone: { role: dialog }
  - goto: /app/settings/general
  - goto: /app/settings/chat-preferences
  - wait: { role: button, name: Add memory, exact: true }
  - click: { role: button, name: Add memory, exact: true }
  - fill: { placeholder: Type or paste in a personal note or memory, value: Keep workshop examples accessible. }
  - press: Enter
  - settle: 600
  - click: { selector: '[role="dialog"] button[aria-label="Close"]' }
  - wait_gone: { role: dialog }
  # A fake token is displayed once, then only its metadata survives navigation.
  # The preferences pane is scrolled to memories; bring navigation into view before clicking.
  - scroll: { selector: 'a[href="/app/settings/accounts-access"]' }
  - click: { selector: 'a[href="/app/settings/accounts-access"]' }
  - wait: { role: button, name: New Access Token }
  - click: { role: button, name: New Access Token }
  - fill: { placeholder: Name your token, value: Workshop notes demo }
  - click: { role: button, name: Create Token, exact: true }
  - wait: { text: mockshop-not-a-real-token-0001 }
  - shot: fake-token-created
  - click: { selector: '[role="dialog"] button[aria-label="Close"]' }
  - wait_gone: { role: dialog }
  - goto: /app
  - goto: /app/settings/accounts-access
  - wait: { text: Workshop notes demo }
  - shot: fake-token-persisted
  - click: { role: button, name: New Access Token }
  - fill: { placeholder: Name your token, value: Disposable workshop demo }
  - click: { role: button, name: Create Token, exact: true }
  - wait: { text: mockshop-not-a-real-token-0002 }
  - click: { selector: '[role="dialog"] button[aria-label="Close"]' }
  - wait_gone: { role: dialog }
  - click: { role: button, name: Delete token Disposable workshop demo, exact: true }
  - click: { role: button, name: Revoke, exact: true }
  - wait_gone: { text: Disposable workshop demo, exact: true }
  - goto: /app/settings/general
  - goto: /app/settings/accounts-access
  - wait: { text: Workshop notes demo }
  - eval: |
      if (document.body.innerText.includes('Disposable workshop demo')) throw new Error('Revoked token returned after navigation');
  - shot: fake-token-revoked
  # Gmail is the only personal (federated) card; indexed organization cards are read-only.
  - scroll: { selector: 'a[href="/app/settings/connectors"]' }
  - click: { selector: 'a[href="/app/settings/connectors"]' }
  - wait: { text: Gmail, exact: true }
  - click: { selector: '.opal-card:has-text("Gmail") button' }
  - wait: { role: button, name: Disconnect, exact: true }
  - click: { role: button, name: Disconnect, exact: true }
  - wait: { text: Not connected, exact: true }
  - goto: /app/settings/general
  - goto: /app/settings/connectors
  - wait: { text: Not connected, exact: true }
  - shot: personal-connector-disconnected-persisted
  # Follow the real Connect link in this tab for its smoke shot; its URL is a mock-only local simulation.
  - eval: |
      const link = document.querySelector('a[href="/api/mockshop/personal-connectors/901/connect"]');
      if (!link) throw new Error('Local personal connector link missing');
      link.removeAttribute('target');
  - click: { selector: 'a[href="/api/mockshop/personal-connectors/901/connect"]' }
  - wait: { role: button, name: Connect fake Gmail account, exact: true }
  - shot: local-fake-connection-confirmation
  - click: { role: button, name: Connect fake Gmail account, exact: true }
  - wait: { selector: '.opal-card:has-text("Gmail"):has-text("Connected")' }
  - wait_gone: { text: Not connected, exact: true }
  - goto: /app/settings/general
  - goto: /app/settings/connectors
  - wait: { selector: '.opal-card:has-text("Gmail"):has-text("Connected")' }
  - eval: |
      if (document.querySelector('a[href="/api/mockshop/personal-connectors/901/connect"]')) throw new Error('Personal connection did not persist');
  - shot: personal-connector-reconnected-persisted
  - scroll: { selector: 'a[href="/app/settings/usage"]' }
  - click: { selector: 'a[href="/app/settings/usage"]' }
  - wait: { text: Usage this period, exact: true }
  - wait: { text: '$0.42 spent', exact: true }
  - wait: { text: '$9.58 remaining', exact: true }
  - wait: { text: Model prices, exact: true }
  - shot: usage-models-budget-prices
  - goto: /app/settings/usage
  - wait: { text: '$0.42 spent', exact: true }
  - shot: usage-direct-link
  # Same pinned tier policy in both editions: gateway settings on Business+, General on Community.
  - goto: /app/settings/llm-gateway
  - settle: 800
  - eval: |
      (async () => {
        const settings = await (await fetch('/api/settings')).json();
        if (['business', 'enterprise'].includes(settings.tier)) {
          if (!document.body.innerText.includes('Gateway URL') || !document.body.innerText.includes('Models')) throw new Error('Gateway settings did not render');
        } else if (!location.pathname.endsWith('/general') || !document.querySelector('input[placeholder="Your name"]')) {
          throw new Error('Community gateway tier redirect did not render General');
        }
      })()
  - shot: gateway-tier-policy
  # Leave the connector different from its seed so reset proves isolation, not a coincidental Connected state.
  - goto: /app/settings/connectors
  - wait: { text: Gmail, exact: true }
  - click: { selector: '.opal-card:has-text("Gmail") button' }
  - click: { role: button, name: Disconnect, exact: true }
  - wait: { text: Not connected, exact: true }
  # Fresh-run reset: same API the runner uses before each scenario; preserve fixed demo time and English UI.
  - eval: |
      (async () => {
        const response = await fetch('/api/__mockshop/state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({overlays: [], locale: 'en', anchor: '2026-10-09T10:00:00-04:00'})});
        if (!response.ok) throw new Error('Fresh-run reset failed');
      })()
  - goto: /app/settings/general
  - eval: |
      if (document.querySelector('input[placeholder="Your name"]')?.value !== 'Maya Chen' ||
          document.querySelector('input[placeholder="Your role"]')?.value !== 'Director of Learning & Development' ||
          !document.documentElement.classList.contains('light')) throw new Error('Reset leaked profile/theme from the previous run');
  - shot: reset-general-isolated
  - goto: /app/settings/chat-preferences
  - wait: { selector: 'label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="false"]' }
  - wait: { selector: 'label:has-text("Collapse Large Pastes") [role="switch"][aria-checked="true"]' }
  - wait: { selector: 'label:has-text("Auto-Send on Pause") [role="switch"][aria-checked="false"]' }
  - wait: { selector: 'label:has-text("Reference Stored Memories") [role="switch"][aria-checked="true"]' }
  - wait: { role: button, name: Add memory, exact: true }
  - eval: |
      const preferences = document.querySelector('textarea[placeholder="Describe how you want the system to behave and the tone it should use."]');
      const model = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Default Model'))?.querySelector('input');
      if (preferences?.value !== '' || model?.value !== 'Global Default') throw new Error('Reset leaked personal preferences/default model');
  - shot: reset-chat-preferences-isolated
  - goto: /app/settings/accounts-access
  - wait: { text: No access tokens created., exact: true }
  - shot: reset-tokens-isolated
  - goto: /app/settings/connectors
  - wait: { text: Gmail, exact: true }
  - eval: |
      if (document.body.innerText.includes('Not connected') || document.querySelector('a[href="/api/mockshop/personal-connectors/901/connect"]')) throw new Error('Reset did not restore personal connector fixture');
  - shot: reset-connectors-isolated
