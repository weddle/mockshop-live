# #61: native picker only; never Save, invite, transfer ownership or change permissions.
# Exact pinned f858083d6 runtime; base Maya already has the fake admin role.
name: share-agent-users
title: Share Agent fictional user search and staged selection
requires: enterprise
strict: true
viewport: [1440, 900]
steps:
  # Menu -> gallery -> card Edit Agent is the native editor entry point.
  - goto: /app
  - click: { text: More Agents, exact: true }
  - wait: { text: Featured Agents }
  - hover: { selector: 'div.radial-00:has-text("Training & Onboarding Desk")' }
  # Icon-only Edit has a tooltip, not an aria-label, at this pin; scope its SVG to this card.
  - click: { selector: 'div.radial-00:has-text("Training & Onboarding Desk") button:has(path[d^="M8 13.3333H14"])' }
  - wait: { placeholder: Name your agent }
  - eval: |
      if (location.pathname !== '/app/agents/edit/11') throw new Error('Gallery edit did not open agent 11');
  - shot: editor-from-gallery
  - scroll: { text: Share Agent }
  - click: { role: button, name: Share, exact: true }
  - wait: { placeholder: "Add users, groups, and accounts" }
  - shot: share-picker-empty-query
  # The pinned picker deliberately shows suggestions only for a nonempty query.
  - fill: { placeholder: "Add users, groups, and accounts", value: seasidecollection.example }
  - wait: { text: devon.ortiz@seasidecollection.example, exact: true }
  - wait: { text: priya.raman@seasidecollection.example, exact: true }
  - shot: share-picker-loaded-users
  - fill: { placeholder: "Add users, groups, and accounts", value: DEVON }
  - wait: { text: devon.ortiz@seasidecollection.example, exact: true }
  - wait_gone: { text: priya.raman@seasidecollection.example, exact: true }
  - shot: share-picker-filtered
  - click: { text: devon.ortiz@seasidecollection.example, exact: true }
  - wait: { selector: '[role="dialog"] div.rounded-08:has-text("devon.ortiz@seasidecollection.example") button' }
  - eval: |
      const input = document.querySelector('[role="dialog"] input[placeholder="Add users, groups, and accounts"]');
      if (input?.value !== '') throw new Error('Selecting a user did not clear the native search');
  - shot: share-picker-user-selected
  - click: { selector: '[role="dialog"] div.rounded-08:has-text("devon.ortiz@seasidecollection.example") button' }
  - wait_gone: { text: devon.ortiz@seasidecollection.example, exact: true }
  - shot: share-picker-user-cleared
  - click: { role: button, name: Cancel, exact: true }
  - wait_gone: { role: dialog }
  - click: { role: button, name: Share, exact: true }
  - wait: { placeholder: "Add users, groups, and accounts" }
  - fill: { placeholder: "Add users, groups, and accounts", value: priya }
  - wait: { text: priya.raman@seasidecollection.example, exact: true }
  - shot: share-picker-reopened
  - click: { role: button, name: Cancel, exact: true }
  - wait_gone: { role: dialog }
  # Direct route independently reaches the same native modal and editable users.
  - goto: /app/agents/edit/11
  - wait: { placeholder: Name your agent }
  - shot: editor-direct-link
  - scroll: { text: Share Agent }
  - click: { role: button, name: Share, exact: true }
  - wait: { placeholder: "Add users, groups, and accounts" }
  - fill: { placeholder: "Add users, groups, and accounts", value: priya }
  - wait: { text: priya.raman@seasidecollection.example, exact: true }
  - click: { text: priya.raman@seasidecollection.example, exact: true }
  - wait: { selector: '[role="dialog"] div.rounded-08:has-text("priya.raman@seasidecollection.example") button' }
  - shot: share-picker-direct-selected
  - click: { selector: '[role="dialog"] div.rounded-08:has-text("priya.raman@seasidecollection.example") button' }
  - wait_gone: { text: priya.raman@seasidecollection.example, exact: true }
  - click: { role: button, name: Cancel, exact: true }
  - wait_gone: { role: dialog }
