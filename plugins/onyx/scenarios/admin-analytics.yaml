# #65 route-sized native proof: Analytics aliases.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-analytics
title: Analytics aliases - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/performance/analytics
  - shot: inventory-analytics-alias
  - goto: /ee/admin/performance/analytics
  - shot: inventory-analytics-ee
  - goto: /admin/performance/analytics
  - shot: analytics-menu-route
  - click: { selector: 'a[href="/admin/performance/analytics"]' }
  - shot: analytics-sidebar
  - goto: /ee/admin/performance/analytics
  - shot: analytics-ee-direct
  - scroll: { text: Slack Channel, exact: true }
  - shot: analytics-slack-native-lower-chart
  - scroll: { text: Agent Analytics, exact: true }
  - wait: { text: Select an agent to view analytics., exact: true }
  - shot: analytics-agent-native-unselected
  - click: { role: button, name: Select an agent to display, exact: true }
  - fill: { placeholder: Search agents..., value: Assistant }
  - shot: analytics-agent-native-picker
  - click: { text: Assistant, exact: true }
  - wait: { text: No data found for the selected agent in this time range., exact: true }
  - shot: analytics-agent-selected-empty-data
  - scroll: { text: Usage reports, exact: true }
  - wait: { text: No reports yet. Pick a period and generate your first one., exact: true }
  - shot: analytics-usage-reports-empty
  - click: { role: button, name: Generate report, exact: true }
  - shot: analytics-usage-report-native-period-options
  - click: { text: All time, exact: true }
  - wait: { role: link, name: Download report for All time, exact: true }
  - shot: analytics-usage-report-ready
  - click: { role: link, name: Download report for All time, exact: true }
  - goto: /admin/security
  - goto: /ee/admin/performance/analytics
  - scroll: { text: Usage reports, exact: true }
  - wait: { role: link, name: Download report for All time, exact: true }
  - shot: analytics-usage-report-navigation-readback
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
        window.location.href = '/ee/admin/performance/analytics';
      })()
  - scroll: { text: Usage reports, exact: true }
  - wait: { text: No reports yet. Pick a period and generate your first one., exact: true }
  - shot: reset-analytics-usage-reports-empty
