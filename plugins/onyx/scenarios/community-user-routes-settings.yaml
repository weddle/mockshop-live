# #34 true-Community per-user-route witness. EDITONLY authored; UNEXECUTED/UNACCEPTED.
# Parent owns matching physical CE artifact selection, schema validation and complete strict native/image proof.
# Independent native runner prelude resets unit overlays/clock/locale. Keep uses existing state DSL;
# fresh tails use existing /api/__mockshop/state keep:false plus native full navigation.
# No continue_on_error, fixed-settle-only success, private React, clips or acceptance/closure claim.
# Original route rows 8-14, including canonical /settings -> /general.
# CE removes Business Default App Mode/Gateway tab; direct Gateway redirects to General.
# Minimal native auto-scroll/eligible fake token writes, metadata reload, keep and fresh reset.
name: community-user-routes-settings
title: True Community settings routes, edition guards and minimal native preferences/token writes
requires: community
strict: true
locale: en
viewport:
- 1440
- 1000
overlays: []
steps:
- goto: /app
- wait:
    selector: '#onyx-chat-input-textbox'
- click:
    selector: '#onyx-user-dropdown'
- click:
    text: Settings
    exact: true
- wait:
    placeholder: Your name
- eval: if(location.pathname!=="/app/settings/general") throw new Error('Native route/guard reached the wrong canonical
    URL');
- eval: (async()=>{const r=await fetch('/api/settings'); if(!r.ok) throw new Error('Community settings prerequisite
    missing'); const v=await r.json(); if(v.tier!=='community'||v.ee_features_enabled!==false||v.application_status!=='active')
    throw new Error('Not a Community fixture/licensing state');})()
- shot:
    name: ce-settings-native-menu
    full_page: true
- goto: /app/settings
- wait:
    placeholder: Your name
- eval: if(location.pathname!=="/app/settings/general") throw new Error('Native route/guard reached the wrong canonical
    URL');
- shot:
    name: ce-settings-default-general
    full_page: true
- goto: /app/settings/general
- wait:
    placeholder: Your name
- eval: if(document.querySelector('a[href="/app/settings/llm-gateway"]')) throw new Error('Community exposes Business
    LLM Gateway sidebar entry');
- shot:
    name: ce-settings-general-community-navigation
    full_page: true
- click:
    selector: a[href="/app/settings/chat-preferences"]
- wait:
    text: Default Model
    exact: true
- wait:
    selector: label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="false"]
- eval: if([...document.querySelectorAll('label')].some(l=>l.textContent.includes('Default App Mode'))) throw new
    Error('Community exposed Business-only Default App Mode');
- shot:
    name: ce-settings-chat-preferences-community-guard
    full_page: true
- click:
    selector: label:has-text("Chat Auto-scroll") [role="switch"]
- wait:
    selector: label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="true"]
- goto: /app/settings/chat-preferences
- wait:
    selector: label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="true"]
- eval: (async()=>{if(!(await (await fetch('/api/me')).json()).preferences.auto_scroll) throw new Error('Native
    Community auto-scroll write did not persist');})()
- shot:
    name: ce-settings-chat-preferences-written-reloaded
    full_page: true
- click:
    selector: a[href="/app/settings/accounts-access"]
- wait:
    text: No access tokens created.
    exact: true
- shot:
    name: ce-settings-accounts-access-menu
    full_page: true
- goto: /app/settings/accounts-access
- wait:
    role: button
    name: New Access Token
    exact: true
- click:
    role: button
    name: New Access Token
    exact: true
- fill:
    placeholder: Name your token
    value: Community workshop token (fake)
- click:
    placeholder: Select permissions
- click:
    text: Limited access
    exact: true
- wait:
    role: checkbox
    name: Chat Read
    exact: true
- eval: (async()=>{const scopes=await (await fetch('/api/user/pats/scopes')).json(),d=document.querySelector('[role=dialog]'),labels=[...d.querySelectorAll('[role=checkbox]')].map(c=>c.getAttribute('aria-label'));
    for(const scope of scopes) if(scope.min_tier!=='community'&&labels.includes(scope.label)) throw new Error('Community
    exposes paid-only token scope '+scope.label);})()
- click:
    role: checkbox
    name: Chat Read
    exact: true
- shot:
    name: ce-settings-community-eligible-token-scope
    full_page: true
- click:
    role: button
    name: Create Token
    exact: true
- wait:
    text: mockshop-not-a-real-token-0001
    exact: true
- shot:
    name: ce-settings-fictional-token-created
    full_page: true
- click:
    selector: '[role="dialog"] button[aria-label="Close"]'
- goto: /app/settings/accounts-access
- wait:
    text: Community workshop token (fake)
    exact: true
- eval: (async()=>{const rows=await (await fetch('/api/user/pats')).json(),p=rows.find(p=>p.name==='Community workshop
    token (fake)'); if(!p||p.scopes.join(',')!=='read:chat'||Object.hasOwn(p,'token')) throw new Error('Community
    scoped fake token metadata/one-time boundary not persisted');})()
- shot:
    name: ce-settings-token-metadata-reopened
    full_page: true
- click:
    selector: a[href="/app/settings/connectors"]
- wait:
    text: Connectors
    exact: true
    nth: 0
- eval: if(location.pathname!=="/app/settings/connectors") throw new Error('Native route/guard reached the wrong
    canonical URL');
- shot:
    name: ce-settings-connectors-menu
    full_page: true
- goto: /app/settings/connectors
- wait:
    # IndexedConnectorCard displays getSourceMetadata(source).displayName, not ccPair.name.
    text: Google Drive
    exact: true
- shot:
    name: ce-settings-connectors-direct
    full_page: true
- goto: /app/settings/llm-gateway
- wait:
    placeholder: Your name
- eval: if(location.pathname!=="/app/settings/general") throw new Error('Native route/guard reached the wrong canonical
    URL');
- eval: if(document.querySelector('a[href="/app/settings/llm-gateway"]')) throw new Error('Community gateway guard
    retained forbidden tab');
- shot:
    name: ce-settings-llm-gateway-community-redirect
    full_page: true
- click:
    selector: a[href="/app/settings/usage"]
- wait:
    testid: usage-model-tokens
    nth: 0
- wait:
    text: Model prices
    exact: true
- shot:
    name: ce-settings-usage-menu
    full_page: true
- goto: /app/settings/usage
- wait:
    testid: usage-model-tokens
    nth: 0
- shot:
    name: ce-settings-usage-direct
    full_page: true
- state:
    overlays: []
- goto: /app/settings/chat-preferences
- wait:
    selector: label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="true"]
- goto: /app/settings/accounts-access
- wait:
    text: Community workshop token (fake)
    exact: true
- shot:
    name: ce-settings-written-state-kept
    full_page: true
- eval: (async()=>{const current=await (await fetch('/api/__mockshop/state')).json(); const response=await fetch('/api/__mockshop/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:[],anchor:current.demo_anchor,locale:'en',keep:false})});
    if(!response.ok) throw new Error('Independent Community dirty-state reset failed');})()
- goto: /app/settings/chat-preferences
- wait:
    selector: label:has-text("Chat Auto-scroll") [role="switch"][aria-checked="false"]
- goto: /app/settings/accounts-access
- wait:
    text: No access tokens created.
    exact: true
- shot:
    name: ce-settings-fresh-preferences-token-restored
    full_page: true
demo_anchor: '2026-10-09T10:00:00-04:00'
