# Live org/persona switch (#36): base (Maya, Seaside) -> placeholder healthcare org -> placeholder university -> base,
# one running instance, overlays swapped with the `state` step (same as `./mockshop switch onyx <overlay>`), page reloaded.
# Org names and branding come from /enterprise-settings, so they show on the Enterprise runtime only.
name: org-switch
title: Switch personas/orgs live via named overlays
steps:
  - goto: /app
  - wait: { text: Maya Chen }
  - shot: base-maya
  - state: { overlays: [org-healthcare] }
  - goto: /app
  - wait: { text: Sam Rivera }
  - settle: 800
  - shot: healthcare-home
  - click: { selector: "#onyx-chat-input-textbox" }
  - type: { selector: "#onyx-chat-input-textbox", value: "What is the current hand hygiene policy?" }
  - click: { selector: "#onyx-chat-input-send-button" }
  - wait: { text: "IC-142", timeout: 30000 }
  - settle: 1500
  - shot: healthcare-answer
  - state: { overlays: [org-university] }
  - goto: /app
  - wait: { text: Jordan Lee }
  - settle: 800
  - shot: university-home
  - click: { selector: "#onyx-chat-input-textbox" }
  - type: { selector: "#onyx-chat-input-textbox", value: "What are the prerequisites for intro statistics?" }
  - click: { selector: "#onyx-chat-input-send-button" }
  - wait: { text: "MATH 095", timeout: 30000 }
  - settle: 1500
  - shot: university-answer
  - state: { overlays: [] }
  - goto: /app
  - wait: { text: Maya Chen }
  - shot: back-to-base
