# #65 route-sized native proof: Chat Preferences.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-chat-preferences
title: Chat Preferences - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/chat-preferences
  - shot: inventory-chat-preferences
  - goto: /admin/code-interpreter
  - click: { selector: 'a[href="/admin/chat-preferences"]' }
  - wait: { text: Team Name, exact: true }
  - shot: chat-preferences-menu
  - goto: /admin/chat-preferences
  - fill: { placeholder: Enter team name, value: Learning Workshop }
  - press: Tab
  - click: { selector: 'label:has-text("Chat Auto-Scroll") [role="switch"]' }
  - click: { role: button, name: Modify Prompt, exact: true }
  - wait: { role: dialog }
  - fill: { placeholder: Enter your system prompt..., value: Use accessible examples for fictional learning workshops. }
  - shot: chat-preferences-prompt-dialog
  - click: { selector: '[role="dialog"] button:has-text("Save")' }
  - wait_gone: { role: dialog }
  - goto: /admin/code-interpreter
  - goto: /admin/chat-preferences
  - eval: |
      if (document.querySelector('input[placeholder="Enter team name"]')?.value !== 'Learning Workshop') throw new Error('Admin team name did not persist');
  - shot: chat-preferences-saved
