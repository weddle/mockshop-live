# Independent #59 native unit. Runner starts fresh base state; no preceding unit is required.
name: admin-users-invitations
title: Native Users invite validation, duplicate counts, revoke and dirty reset
strict: true
requires: enterprise
locale: en
overlays: []
steps:
  - goto: /admin/users
  - wait: { text: Users & Requests, exact: true }
  # Cancel and Escape discard modal-local input; neither creates an invitation.
  - click: { role: button, name: Invite Users, exact: true }
  - fill: { selector: 'input[placeholder="Add emails to invite, space or comma separated"]', value: discard.reader@learning-lab.example }
  - click: { role: button, name: Cancel, exact: true }
  - click: { role: button, name: Invite Users, exact: true }
  - eval: |
      if (document.querySelector('input[placeholder="Add emails to invite, space or comma separated"]').value !== '') throw new Error('Cancelled invite draft survived reopen');
  - shot: users-invite-cancel-reopened
  - press: Escape
  - wait_gone: { selector: 'input[placeholder="Add emails to invite, space or comma separated"]' }
  - goto: /admin/users
  - click: { role: button, name: Invite Users, exact: true }
  - shot: users-invite-dialog
  - fill: { selector: 'input[placeholder="Add emails to invite, space or comma separated"]', value: 'not-an-email ' }
  - wait: { text: Some email addresses are invalid and will be skipped., exact: true }
  - shot: users-invite-invalid
  - eval: |
      const invite = [...document.querySelectorAll('button')].find(button => button.textContent.trim() === 'Invite');
      if (!invite?.disabled) throw new Error('Invalid-only invitation is not disabled');
  - fill: { selector: 'input[placeholder="Add emails to invite, space or comma separated"]', value: 'taylor.park@learning-lab.example' }
  - shot: users-invite-ready
  - click: { role: button, name: Invite, exact: true }
  - wait: { text: Invited 1 user, exact: true }
  - shot: users-invite-feedback
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: taylor.park }
  - wait: { text: taylor.park@learning-lab.example, exact: true }
  - shot: users-invite-persisted
  # Native tags de-duplicate case-insensitively. The toast counts submitted valid tags (2), not new rows (0).
  - click: { role: button, name: Invite Users, exact: true }
  - fill: { selector: 'input[placeholder="Add emails to invite, space or comma separated"]', value: 'taylor.park@learning-lab.example, TAYLOR.PARK@LEARNING-LAB.EXAMPLE, devon.ortiz@seasidecollection.example ' }
  - wait: { text: 2 emails to invite, exact: true }
  - shot: users-invite-duplicate-accepted-ready
  - click: { role: button, name: Invite, exact: true }
  - wait: { text: Invited 2 users, exact: true }
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: taylor.park }
  - wait: { text: taylor.park@learning-lab.example, exact: true }
  - eval: |
      (async () => {
        const invitedRes = await fetch('/api/manage/users/invited');
        const acceptedRes = await fetch('/api/manage/users/accepted/all');
        if (!invitedRes.ok || !acceptedRes.ok) throw new Error('Post-invitation readback failed');
        const invitations = await invitedRes.json(), accepted = await acceptedRes.json();
        if (invitations.length !== 3 || invitations.filter(user => user.email === 'taylor.park@learning-lab.example').length !== 1 || invitations.some(user => user.email === 'devon.ortiz@seasidecollection.example')) throw new Error('Duplicate or accepted email inflated invitation rows');
        if (accepted.length !== 10 || accepted.filter(user => user.is_active).length !== 9) throw new Error('Invitation changed accepted User counts');
      })()
  - shot: users-invite-duplicate-accepted-counts
  - click: { role: button, name: User actions, exact: true }
  - shot: users-invited-menu
  - click: { text: Cancel Invite, exact: true }
  - shot: users-cancel-invite-dialog
  - click: { role: button, name: Cancel Invite, exact: true }
  - wait: { text: Invite cancelled, exact: true }
  - shot: users-cancel-invite-feedback
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: taylor.park }
  - wait_gone: { text: taylor.park@learning-lab.example, exact: true }
  - shot: users-cancel-invite-persisted
  # Leave an actual new invitation outstanding before this unit's reset.
  - click: { role: button, name: Invite Users, exact: true }
  - fill: { selector: 'input[placeholder="Add emails to invite, space or comma separated"]', value: reset.reader@learning-lab.example }
  - click: { role: button, name: Invite, exact: true }
  - wait: { text: Invited 1 user, exact: true }
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: reset.reader }
  - wait: { text: reset.reader@learning-lab.example, exact: true }
  - shot: users-invite-before-reset
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strict:true,locale:'en'})});
        if (!res.ok) throw new Error('Mock reset failed');
        location.reload();
      })()
  - wait: { text: Users & Requests, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: reset.reader }
  - wait_gone: { text: reset.reader@learning-lab.example, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: iris.ward }
  - wait: { text: iris.ward@learning-lab.example, exact: true }
  - shot: users-invitations-reset
