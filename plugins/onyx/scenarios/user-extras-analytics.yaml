# #33 independent route proof; partial/unverified, no worker execution.

name: user-extras-analytics
title: Native Extras - analytics
requires: enterprise
strict: true
locale: en
viewport: [1440, 1000]
overlays: [demo-user-extras]
steps:
  # Independent native setup replay; deliberately no duplicate evidence shots.
  - goto: /app
  - wait: { text: Welcome to Lakeshore Learning, exact: true }
  - click: { label: Consent checkbox }
  - click: { role: button, name: Start, exact: true }
  - wait_gone: { selector: '[role="dialog"]' }
  - goto: /app/agents/edit/11
  - wait: { selector: 'input[name="name"]' }
  - click: { selector: '.h-30.w-30' }
  - click: { text: Upload Image, exact: true }
  - eval: |
      (async () => {
        const config = await (await fetch('/api/mockshop/user-extras')).json();
        const bytes = Uint8Array.from(atob(config.avatar_png_base64), c=>c.charCodeAt(0));
        const transfer = new DataTransfer(); transfer.items.add(new File([bytes], 'fictional-education-avatar.png', {type:'image/png'}));
        const input = document.querySelector('input[type="file"][accept="image/*"]');
        input.files = transfer.files; input.dispatchEvent(new Event('change', {bubbles:true}));
      })()
  - settle: 700
  - click: { role: button, name: Save, exact: true }
  - goto: /app/agents/edit/11
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if (!a.uploaded_image_id?.startsWith('mock-user-extras-avatar-')) throw new Error('Native avatar upload marker did not persist');
      })()
  # Lossless primary operations from the former monolithic proof.
  - goto: /ee/agents/stats/11
  - wait: { testid: admin-date-range-selector }
  - click: { role: button, name: 7D, exact: true }
  - settle: 500
  - eval: "if(!/Total Messages\\s*9/.test(document.body.textContent)) throw new Error('Seven-day native summary did not change to seeded nine messages')"
  - shot: {name: extras-57-analytics-seven-day-filter, full_page: true}
  - click: { role: button, name: 1D, exact: true }
  - settle: 500
  - eval: "if(!/Total Messages\\s*0/.test(document.body.textContent)) throw new Error('One-day native summary did not become empty')"
  - wait: { text: No data found for this agent in the selected date range., exact: true }
  - shot: {name: extras-58-analytics-one-day-empty, full_page: true}
  - click: { role: button, name: 1M, exact: true }
  - settle: 500
  - eval: "if(!/Total Messages\\s*95/.test(document.body.textContent)) throw new Error('Month native summary did not return seeded 95 messages')"
  - shot: {name: extras-59-analytics-month-populated, full_page: true}
  - settle: 1200
  - hover: { selector: '.recharts-wrapper' }
  - shot: { name: extras-59a-analytics-native-hover-tooltip, full_page: true, hover: { selector: '.recharts-wrapper' } }
  - click: { role: button, name: 3M, exact: true }
  - settle: 500
  - shot: {name: extras-60-analytics-three-month-filter, full_page: true}
  - click: { testid: admin-date-range-selector-button }
  - shot: {name: extras-61-analytics-custom-calendar, full_page: true}
  - click: { selector: '.opal-calendar-nav button', nth: 0 }
  - click: { selector: '.opal-calendar-nav button', nth: 1 }
  - click: { selector: '.opal-calendar-cell--today button' }
  - click: { selector: '.opal-calendar-cell--today button' }
  - settle: 500
  - wait: { text: No data found for this agent in the selected date range., exact: true }
  - shot: {name: extras-62-analytics-custom-empty-result, full_page: true}
  - goto: /ee/agents/stats/12
  - wait: { testid: admin-date-range-selector }
  - wait: { text: No data found for this agent in the selected date range., exact: true }
  - shot: {name: extras-63-analytics-empty-agent-direct, full_page: true}
