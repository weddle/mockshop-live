# End user: browse agents -> pick an agent -> open the model picker -> switch model
# -> ask a starter question with the new model.
name: user-agent-and-model
title: User picks an agent and switches model
viewport: [1440, 900]
steps:
  - goto: /app
  - click: { text: More Agents }
  - wait: { text: Featured Agents }
  - shot: agent-gallery
  - click: { text: Start Chat, nth: 1 }       # "Training & Onboarding Desk" card
  - settle: 800
  - shot: agent-selected
  - click: { role: button, name: GPT-5.2 }
  - settle: 500
  - shot: model-picker-open
  - click: { text: Anthropic }
  - settle: 400
  - shot: model-picker-anthropic
  - click: { text: Claude Sonnet 4.5 }
  - settle: 500
  - shot: model-switched
  - click: { text: "What training do new front desk hires need" }
  - wait: { testid: onyx-ai-message, timeout: 30000 }
  - settle: 1500
  - eval: "document.querySelector('[data-testid=chat-scroll-container]')?.scrollTo(0, 1e6)"
  - shot: answer-from-agent
