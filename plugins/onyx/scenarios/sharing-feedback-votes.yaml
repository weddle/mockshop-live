# DEVELOPMENT inventory; independent parent strict/every-PNG acceptance/publication remains pending.
# Independent fresh reset uses the existing control plane; mutations under test use only native controls.

name: sharing-feedback-votes
title: Native answer copy and optional/required feedback lifecycle
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: []
known_errors:
  - match: '/http 400 (POST|DELETE) .*\/api\/chat\/(create|remove)-chat-message-feedback(\?chat_message_id=\d+)?$/'
    reason: Original endpoint-specific staged native feedback/removal HTTP failures; unclassified console/resource errors remain strict.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/127\.0\.0\.1:\d+\/api\/chat\/create-chat-message-feedback\]$/'
    reason: Actual changed strict witness attributes the one-shot rejected native Submit to this exact endpoint; visible error/draft and prior like plus saved vote remain protected.
  - match: '/^console: \[Toast\] Failed to submit feedback - Fictional feedback submission failed for this attempt\. \[source: http:\/\/127\.0\.0\.1:\d+\/_next\/static\/chunks\/1h15gs0jly9g_\.js\]$/'
    reason: Actual pinned Opal Toast source event from failed native Submit; controller rollback and saved like readback accompany the visible retained error modal. Unlocated or different-source events remain strict.
  - match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source: http:\/\/127\.0\.0\.1:\d+\/api\/chat\/remove-chat-message-feedback\?chat_message_id=1004\]$/'
    reason: Actual changed strict witness attributes the one-shot rejected native removal to this exact saved answer endpoint; selected dislike and saved vote remain protected.
  - match: '/^console: \[Toast\] Failed to remove feedback - Fictional feedback removal failed for this attempt\. \[source: http:\/\/127\.0\.0\.1:\d+\/_next\/static\/chunks\/1h15gs0jly9g_\.js\]$/'
    reason: Actual pinned Opal Toast source event from native removal rollback; visible error, selected dislike and authoritative saved dislike readback are asserted. Unlocated or different-source events remain strict.
steps:
  - goto: /app
  - eval: |
      (async () => {
        const currentResponse = await fetch('/api/__mockshop/state');
        if (!currentResponse.ok) throw new Error('Independent Sharing seed read failed');
        const current = await currentResponse.json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:[],locale:'en',keep:false,resetChats:true,anchor:current.demo_anchor})});
        if (!response.ok) throw new Error('Independent Sharing reset failed');
        sessionStorage.removeItem('sharing-workshop-id');
        sessionStorage.removeItem('sharing-workshop-link');
      })();
  # Native prerequisite replay only; original screenshots remain in their single primary owning unit.
  - goto: /app?chatId=61616161-0000-4000-8000-000000000001
  - wait: { text: Closing reflection, exact: true }
  - wait: { testid: 'AgentMessage/toolbar', nth: 1 }
  - settle: 1200
  - eval: |
      const toolbars = [...document.querySelectorAll('[data-testid="AgentMessage/toolbar"]')];
      if (toolbars.length !== 2 || !document.body.innerText.includes('Start with a short reading circle.')) throw new Error('Seeded workshop did not replay both saved turns');
      if (toolbars.some(t => !t.textContent.includes('GPT-5.2'))) throw new Error('Saved answer model labels did not replay');
      if ([...toolbars[1].querySelectorAll('button')].some(b => b.textContent.trim() === 'Sources')) throw new Error('No-source closing reflection invented a Sources control');
      sessionStorage.setItem('sharing-workshop-id', '61616161-0000-4000-8000-000000000001');
  # Primary original operations 49-107; every original interaction and named PNG is retained.
  - click: { testid: 'AgentMessage/copy-button', nth: 1 }
  - wait: { selector: '[data-testid="AgentMessage/copy-button"] >> nth=1 >> path[d="M13.5 4.5L6 12L2.5 8.5"]' }
  - shot: live-answer-copy-success
  - click: { testid: 'AgentMessage/like-button', nth: 1 }
  - wait: { role: dialog }
  - wait: { placeholder: What did you like about this response? }
  - shot: like-feedback-optional-empty
  - click: { role: button, name: Cancel, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/like-button"][data-interactive-state="empty"]', nth: 1 }
  - shot: like-cancel-no-vote
  - click: { testid: 'AgentMessage/like-button', nth: 1 }
  - click: { role: button, name: Submit, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/like-button"][data-interactive-state="selected"]' }
  - shot: like-submitted-empty-optional
  - eval: location.reload()
  - wait: { selector: '[data-testid="AgentMessage/like-button"][data-interactive-state="selected"]' }
  - shot: like-persists-reload
  - click: { testid: 'AgentMessage/dislike-button', nth: 1 }
  - wait: { placeholder: What did you dislike about this response? }
  - eval: |
      const submit = [...document.querySelectorAll('[role="dialog"] button')].find(b => b.textContent === 'Submit');
      if (!submit?.disabled) throw new Error('Negative feedback allows empty submission');
      if (document.querySelector('[role="dialog"] select') || document.querySelector('[role="dialog"] [role="combobox"]')) throw new Error('Unexpected reason picker; pinned native modal is text-only');
  - shot: dislike-required-empty
  - fill: { placeholder: What did you dislike about this response?, value: '   ' }
  - press: Tab
  - eval: |
      const submit = [...document.querySelectorAll('[role="dialog"] button')].find(b => b.textContent === 'Submit');
      if (!submit?.disabled) throw new Error('Negative feedback accepts whitespace-only details');
  - shot: dislike-whitespace-invalid
  - fill: { placeholder: What did you dislike about this response?, value: Please include a large-print reflection option. }
  - shot: dislike-details-draft
  - click: { role: button, name: Cancel, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/like-button"][data-interactive-state="selected"]' }
  - shot: dislike-cancel-preserves-like
  - click: { testid: 'AgentMessage/dislike-button', nth: 1 }
  - eval: |
      if (document.querySelector('[role="dialog"] textarea')?.value !== '') throw new Error('Cancelled feedback draft leaked into reopened modal');
  - shot: dislike-reopened-empty
  - fill: { placeholder: What did you dislike about this response?, value: Please include a large-print reflection option. }
  - eval: |
      (async () => { const r = await fetch('/api/mockshop/sharing-feedback/outcome', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({operation:'feedback', fail:true})}); if (!r.ok) throw new Error('Cannot stage local feedback failure'); })()
  - click: { role: button, name: Submit, exact: true }
  - wait: { text: Failed to submit feedback - Fictional feedback submission failed for this attempt., exact: true }
  - wait: { placeholder: What did you dislike about this response? }
  - eval: |
      (async () => {
        if (document.querySelector('[role="dialog"] textarea')?.value !== 'Please include a large-print reflection option.') throw new Error('Failed feedback discarded the native draft');
        const toolbar = document.querySelectorAll('[data-testid="AgentMessage/toolbar"]')[1];
        if (!toolbar?.querySelector('[data-testid="AgentMessage/like-button"][data-interactive-state="selected"]')) throw new Error('Failed feedback did not restore the prior native like');
        const response = await fetch('/api/chat/get-chat-session/61616161-0000-4000-8000-000000000001');
        if (!response.ok) throw new Error('Cannot read saved feedback after native submission failure');
        const session = await response.json();
        const closing = session.messages.filter(message => message.message_type === 'assistant').at(-1);
        if (closing?.current_feedback !== 'like') throw new Error('Failed submission changed the authoritative saved vote');
      })();
  - shot: feedback-error-retains-modal
  - click: { role: button, name: Submit, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="selected"]' }
  - eval: |
      if (document.querySelectorAll('[data-testid="AgentMessage/like-button"][data-interactive-state="selected"]').length) throw new Error('Dislike did not replace like');
  - shot: dislike-submitted-replaces-like
  - eval: location.reload()
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="selected"]' }
  - shot: dislike-persists-reload
  - eval: |
      (async () => { const r = await fetch('/api/mockshop/sharing-feedback/outcome', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({operation:'remove', fail:true})}); if (!r.ok) throw new Error('Cannot stage local removal failure'); })()
  - click: { testid: 'AgentMessage/dislike-button', nth: 1 }
  - wait: { text: Failed to remove feedback - Fictional feedback removal failed for this attempt., exact: true }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="selected"]' }
  - eval: |
      (async () => {
        const response = await fetch('/api/chat/get-chat-session/61616161-0000-4000-8000-000000000001');
        if (!response.ok) throw new Error('Cannot read saved feedback after native removal failure');
        const session = await response.json();
        const closing = session.messages.filter(message => message.message_type === 'assistant').at(-1);
        if (closing?.current_feedback !== 'dislike') throw new Error('Failed removal changed the authoritative saved vote');
      })();
  - shot: feedback-remove-error-rolls-back
  - click: { testid: 'AgentMessage/dislike-button', nth: 1 }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="empty"]', nth: 1 }
  - shot: dislike-toggle-off
