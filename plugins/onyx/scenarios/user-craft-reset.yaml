# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-reset
title: "Craft non-vacuous composed dirty reset through real native creators"
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
steps:
  - goto: "/app"
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = ['edition-enterprise','demo-mcp-admin','demo-user-craft'];
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
  - goto: "/craft/v1/skills"
  - wait: {"placeholder": "Search skills..."}
  - click: { role: button, name: Create skill, exact: true }
  - click: { text: Start from scratch, exact: true }
  - wait: { selector: 'input[name="name"]' }
  - fill: { selector: 'input[name="name"]', value: accessible-workshop }
  - fill: { selector: 'textarea[name="description"]', value: A fictional inclusive workshop handout guide. }
  - fill: { selector: 'textarea[name="instructions_markdown"]', value: "# Accessible workshop\n\nOffer clear headings, large-print notes and quiet reflection time." }
  - click: { role: button, name: Rendered markdown, exact: true }
  - click: { role: button, name: Raw markdown, exact: true }
  - click: { role: button, name: Save, exact: true }
  - eval: |
      (async () => {
        const skills = await (await fetch('/api/skills')).json();
        const skill = skills.customs.find(s => s.name === 'accessible-workshop');
        if (!skill?.instructions_markdown.includes('quiet reflection')) throw new Error('Native skill create did not retain editable content');
        sessionStorage.setItem('craft-created-skill', skill.id);
        location.href = '/craft/v1/skills/edit/' + skill.id;
      })()
  - wait: { selector: 'textarea[name="description"]' }
  - fill: { selector: 'textarea[name="description"]', value: Updated fictional learning guide. }
  - click: { role: button, name: Save, exact: true }
  - eval: location.href = '/craft/v1/skills/edit/' + sessionStorage.getItem('craft-created-skill')
  - wait: { selector: 'textarea[name="description"]' }
  - goto: "/admin/craft/apps"
  - wait: {"role": "button", "name": "Add app", "exact": true}
  - click: { role: button, name: Add app, exact: true }
  - click: { role: button, name: Create, exact: true }
  - wait: { text: Create custom app, exact: true }
  - fill: { placeholder: My Custom App, value: Campus Reflection API }
  - fill: { placeholder: 'https://api.example.com/*', value: 'https://campus-reflection.example/*' }
  - press: Enter
  - fill: { placeholder: Authorization, value: Authorization }
  - fill: { placeholder: 'Bearer {api_key}', value: 'Bearer {learning_key}' }
  - click: { selector: '[role="dialog"] button:has-text("Create")' }
  - wait: { text: Add skills to Campus Reflection API, exact: true }
  - click: { role: button, name: Skip for now, exact: true }
  - goto: /craft/v1/tasks/new
  - wait: { selector: '[data-testid="task-name-input"]' }
  - fill: { selector: '[data-testid="task-name-input"]', value: Fictional workshop reminder }
  - fill: { selector: '[data-testid="task-prompt-input"]', value: Prepare a fictional accessible workshop checklist. }
  - click: { selector: '[data-testid="save-and-run-now"]' }
  # Native create-and-run returns to the list; open the actual created row.
  - click: { selector: '.table-footer button:has(svg path[d="M6 12L10 8L6 4"])' }
  - click: { text: Fictional workshop reminder, exact: true }
  - wait: { selector: '[data-testid="run-now-button"]' }
  - eval: sessionStorage.setItem('craft-created-task', location.pathname.split('/').pop())
  - goto: "/craft/v1"
  - wait: {"selector": "[contenteditable=\"true\"][role=\"textbox\"]"}
  - click: { role: button, name: Open add menu, exact: true }
  - click: { text: Library, exact: true }
  - click: { text: Manage library…, exact: true }
  - wait: { text: Library, exact: true }
  - eval: |
      const input = document.querySelector('[role="dialog"] input[type="file"]');
      if (!input) throw new Error('Native library upload input missing');
      const files = new DataTransfer();
      files.items.add(new File(['Synthetic workshop notes.'], 'workshop-notes.txt', {type:'text/plain'}));
      input.files = files.files; input.dispatchEvent(new Event('change', {bubbles:true}));
  - wait: { text: workshop-notes.txt, exact: true }
  - eval: |
      (async () => {
        const skills = await (await fetch('/api/skills')).json();
        const tasks = await (await fetch('/api/build/scheduled-tasks')).json();
        const apps = await (await fetch('/api/build/admin/apps')).json();
        const library = await (await fetch('/api/build/user-library/tree')).json();
        if (!skills.customs.some(s => s.name === 'accessible-workshop')) throw new Error('Reset prerequisite native skill creation missing');
        if (!tasks.items.some(t => t.name.startsWith('Fictional workshop reminder'))) throw new Error('Reset prerequisite native task creation missing');
        if (!apps.some(a => a.name === 'Campus Reflection API')) throw new Error('Reset prerequisite native app creation missing');
        if (!library.some(f => f.name === 'workshop-notes.txt')) throw new Error('Reset prerequisite native library upload missing');
      })()
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')), anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Craft composed reset failed');
      })()
  - goto: /craft/v1/skills
  - wait: { text: campus-study-plan, exact: true }
  - eval: |
      (async () => {
        const skills = await (await fetch('/api/skills')).json();
        const tasks = await (await fetch('/api/build/scheduled-tasks')).json();
        const apps = await (await fetch('/api/build/admin/apps')).json();
        const library = await (await fetch('/api/build/user-library/tree')).json();
        if (skills.customs.some(s => s.name === 'accessible-workshop' || s.name === 'study-circle')) throw new Error('Craft skill reset retained creations');
        if (tasks.items.some(t => t.name.startsWith('Fictional workshop reminder'))) throw new Error('Craft task reset retained creations');
        if (apps.some(a => a.name === 'Campus Reflection API')) throw new Error('#65 app reset retained creation');
        if (library.some(f => f.name === 'workshop-notes.txt')) throw new Error('Craft library reset retained upload');
      })()
  - shot: craft-reset-skills-restored
  - goto: /craft/v1/tasks
  - wait: { text: Clinic teaching checklist, exact: true }
  - shot: craft-reset-tasks-restored
  - goto: /craft/v1/apps
  - wait: {"text": "Clinic Learning API", "exact": true}
  - shot: craft-reset-apps-restored
