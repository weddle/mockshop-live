# #69: Enterprise, LOCAL non-cloud build with NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=true.
# Parent registration is required. All inputs below are fictional and never stored as credentials.
name: auth-anonymous-composer
title: "Independent native #69 unit: auth-anonymous-composer"
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: [demo-auth-anonymous]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required native logged-out /me response; cookie and fake current user are deliberately cleared.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; native cleared-cookie and unauthorized identity are asserted.
# Independent prerequisites: Native anonymous entry in this run; empty/send guard, upload lifecycle/remove, actions/search, source toggles and selected-model send.
steps:
  - state: { overlays: [demo-auth-anonymous] }
  - goto: /auth/login
  - eval: |
      (async () => {
        const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'logged-out'})});
        if (!r.ok) throw new Error('Local fake logged-out staging failed');
        const me = await fetch('/api/me');
        if (me.status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Cookie or /me was not logged out');
      })()
  - goto: /anonymous/workshop-demo
  - wait: { selector: '#onyx-chat-input-textbox' }
  - eval: |
      (async () => {const me = await (await fetch('/api/me')).json(); if (!me.is_anonymous_user || location.pathname !== '/app') throw new Error('Native anonymous redirect/session did not complete');})()
  - goto: /app
  - wait: { selector: '#onyx-chat-input-textbox' }
  - eval: |
      if (!document.querySelector('#onyx-chat-input-send-button')?.disabled) throw new Error('Empty anonymous composer can submit');
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
  - wait: { text: Upload Files, exact: true }
  - shot: anonymous-attachment-menu
  - click: { text: Upload Files, exact: true }
  - eval: |
      (async () => {
        const demo = await (await fetch('/api/mockshop/auth-anonymous/content')).json();
        const input = document.querySelector('input[type="file"][accept="*/*"]');
        if (!input?.multiple) throw new Error('Native anonymous upload input missing');
        const transfer = new DataTransfer();
        transfer.items.add(new File([demo.upload_text], demo.upload_name, {type:'text/plain'}));
        input.files = transfer.files;
        input.dispatchEvent(new Event('change', {bubbles:true}));
      })()
  - wait: { text: Uploading..., exact: true }
  - shot: anonymous-file-uploading
  - wait: { text: Processing..., exact: true }
  - shot: anonymous-file-processing
  - wait_gone: { text: Processing..., exact: true, timeout: 20000 }
  - wait: { text: workshop-notes.txt, exact: true }
  - shot: anonymous-file-ready
  - hover: { text: workshop-notes.txt, exact: true }
  - click: { selector: '#onyx-chat-input button[aria-label="Remove"]' }
  - wait_gone: { selector: '#onyx-chat-input div.relative:has-text("workshop-notes.txt")' }
  - shot: anonymous-file-removed
  - click: { testid: action-management-toggle }
  - wait: { placeholder: Search actions... }
  - shot: anonymous-actions-menu
  - fill: { placeholder: Search actions..., value: No matching fictional action }
  - shot: anonymous-actions-empty-search
  - fill: { placeholder: Search actions..., value: '' }
  - click: { role: button, name: Select Search Sources, exact: true }
  - wait: { placeholder: Search Filters }
  - shot: anonymous-source-filters
  - click: { role: button, name: Disable All Sources, exact: true }
  - shot: anonymous-sources-disabled
  - click: { role: button, name: Enable All Sources, exact: true }
  - shot: anonymous-sources-enabled
  - press: Escape
  - click: { role: button, name: GPT-5.2, exact: true }
  - shot: anonymous-model-menu
  - click: { text: Anthropic, exact: true }
  - click: { text: Claude Sonnet 4.5, exact: true }
  - shot: anonymous-model-selected
  - type: { selector: '#onyx-chat-input-textbox', value: 'Local fake workshop welcome' }
  - shot: anonymous-composer-ready
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: 'No provider, authentication, real document search or email service was contacted.', exact: false }
  - wait: { testid: AgentMessage/toolbar, timeout: 30000 }
  - settle: 600
  - shot: anonymous-scripted-answer
