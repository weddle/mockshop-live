# End user opens cited sources (#25). Link sources open the mock's local document viewer
# (/api/mockshop/source/<id>) instead of a dead external URL; a "file" source opens in Onyx's own preview modal.
# Onyx opens links in a new tab; the eval below makes window.open navigate this tab so the shot can show it.
name: user-open-cited-source
title: User opens a cited source (file preview, citation chip, Sources panel, direct link)
viewport: [1440, 900]
strict: true
steps:
  - goto: /app
  - click: { selector: "#onyx-chat-input-textbox" }
  - type: { selector: "#onyx-chat-input-textbox", value: "What training do new front desk hires need in their first 30 days, and who is behind on it?" }
  - click: { selector: "#onyx-chat-input-send-button" }
  - wait: { testid: onyx-ai-message, timeout: 30000 }
  - wait: { text: "opening checklist", timeout: 30000 }
  - settle: 1500
  - eval: "document.querySelector('[data-testid=chat-scroll-container]')?.scrollTo(0, 1e6)"
  - shot: answer-with-citations
  # citation chip of a file source -> Onyx's preview modal (GET /chat/file/aed-opening-checklist)
  - click: { role: button, name: File, exact: true }
  - wait: { text: "Before the lobby opens", timeout: 15000 }
  - settle: 600
  - shot: file-preview-from-chip
  - press: Escape
  - wait_gone: { text: "Before the lobby opens" }
  # citation chip of a link source -> local viewer
  - eval: "window.open = (u) => { location.href = u; return null; }"
  - click: { role: button, name: Confluence, exact: true }
  - wait: { testid: mockshop-source }
  - shot: source-viewer-from-chip
  # Sources panel entry -> local viewer (the chat is the first one created in this run)
  - goto: /app?chatId=00000000-0000-4000-8000-000000000001
  - wait: { testid: onyx-ai-message, timeout: 30000 }
  - settle: 800
  - click: { role: button, name: Sources }
  - wait: { text: "Cited Sources" }
  - settle: 600
  - shot: sources-panel
  - eval: "window.open = (u) => { location.href = u; return null; }"
  - click: { role: button, has_text: "Front Desk Onboarding Path 2026.pdf" }
  - wait: { testid: mockshop-source }
  - shot: source-viewer-from-sources-panel
  # direct link (the validator only accepts page routes in goto, so navigate by URL)
  - eval: "location.href = '/api/mockshop/source/SLACK-C04LEARNKW-1727712000'"
  - wait: { testid: mockshop-source }
  - shot: source-viewer-direct-link
