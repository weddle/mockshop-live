# #65 route-sized native proof: Security and Hardening.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-security
title: Security and Hardening - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/security
  - shot: inventory-security
  - goto: /admin/scim
  - click: { selector: 'a[href="/admin/security"]' }
  - wait: { text: Password Policy, exact: true }
  - shot: security-menu
  - goto: /admin/security
  - click: { selector: 'label:has-text("Require Uppercase Letter") [role="switch"]' }
  - goto: /admin/scim
  - goto: /admin/security
  - wait: { selector: 'label:has-text("Require Uppercase Letter") [role="switch"][aria-checked="true"]' }
  - shot: security-fake-policy-saved
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
        window.location.href = '/admin/security';
      })()
  - wait: { selector: 'label:has-text("Require Uppercase Letter") [role="switch"][aria-checked="false"]' }
  - shot: reset-security-seed
  # Parent inspection: the original four shots expose only the JWT heading.
  # Pinned SecurityHardeningPage.tsx:91–153,561–605 commits these fields on blur/Enter.
  - wait: { selector: 'input[placeholder="https://idp.example.com/.well-known/jwks.json"]' }
  - wait: { selector: 'input[placeholder="onyx"]' }
  - wait: { selector: 'input[placeholder="https://idp.example.com"]' }
  - scroll: { selector: 'input[placeholder="https://idp.example.com"]' }
  - eval: |
      (() => {
        for (const placeholder of ['https://idp.example.com/.well-known/jwks.json', 'onyx', 'https://idp.example.com']) {
          if (document.querySelector(`input[placeholder="${placeholder}"]`).value !== '') throw new Error('JWT seed input is not empty');
        }
      })()
  - shot: security-jwt-loaded-empty
  - fill: { selector: 'input[placeholder="https://idp.example.com/.well-known/jwks.json"]', value: 'https://workshop-idp.example.invalid/.well-known/jwks.json' }
  - press: Enter
  - fill: { selector: 'input[placeholder="onyx"]', value: workshop-audience }
  - press: Enter
  - fill: { selector: 'input[placeholder="https://idp.example.com"]', value: 'https://workshop-idp.example.invalid' }
  - press: Enter
  - shot: security-jwt-edited
  - goto: /admin/scim
  - goto: /admin/security
  - wait: { selector: 'input[placeholder="https://idp.example.com/.well-known/jwks.json"][value="https://workshop-idp.example.invalid/.well-known/jwks.json"]' }
  - wait: { selector: 'input[placeholder="onyx"][value="workshop-audience"]' }
  - wait: { selector: 'input[placeholder="https://idp.example.com"][value="https://workshop-idp.example.invalid"]' }
  - scroll: { selector: 'input[placeholder="https://idp.example.com"]' }
  - shot: security-jwt-navigation-readback
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
        window.location.href = '/admin/security';
      })()
  - wait: { selector: 'input[placeholder="https://idp.example.com/.well-known/jwks.json"][value=""]' }
  - wait: { selector: 'input[placeholder="onyx"][value=""]' }
  - wait: { selector: 'input[placeholder="https://idp.example.com"][value=""]' }
  - scroll: { selector: 'input[placeholder="https://idp.example.com"]' }
  - shot: reset-security-jwt-seed
