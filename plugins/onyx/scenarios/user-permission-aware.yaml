# The same new-hire training question as user-ask-with-citations, asked by Lena Brooks (Property Operations).
# Her answer is shorter and cites only the operations sources she can see. Scripted illustration: Onyx enforces access
# in the backend at query time (Mockshop doesn't run that), so don't present this as proof.
name: user-permission-aware
title: Same question, a Property Operations user
viewport: [1440, 900]
overlays: [demo-property-ops-user]
clip:
  title: { title: "Same question, different person", subtitle: "Onyx · Seaside Collection demo (fictional data)" }
steps:
  - goto: /app
  - shot: chat-home
  - click: { selector: "#onyx-chat-input-textbox" }
  - type: { selector: "#onyx-chat-input-textbox", value: "What training do new front desk hires need in their first 30 days, and who is behind on it?" }
  - click: { selector: "#onyx-chat-input-send-button" }
  - wait: { testid: onyx-ai-message, timeout: 30000 }
  - settle: 1500
  - shot: answer-ops-sources
  - click: { role: button, name: Sources }
  - settle: 800
  - shot: sources-panel
