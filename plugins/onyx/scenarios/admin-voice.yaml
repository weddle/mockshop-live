# #65 route-sized native proof: Voice.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-voice
title: Voice - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/voice
  - shot: inventory-voice
  - goto: /admin/image-generation
  - click: { selector: 'a[href="/admin/voice"]' }
  - wait: { text: Speech to Text, exact: true }
  - shot: voice-menu-empty
  - goto: /admin/voice
  - click: { selector: '[aria-label="voice-stt-whisper"]' }
  - wait: { role: dialog }
  - shot: voice-setup-dialog
  - fill: { selector: '[role="dialog"] input[name="api_key"]', value: mock-only-not-a-secret }
  - click: { selector: '[role="dialog"] button[type="submit"]' }
  - wait_gone: { role: dialog }
  - goto: /admin/web-search
  - goto: /admin/voice
  - wait: { text: Current Default, exact: true }
  - shot: voice-saved
  - hover: { selector: '[aria-label="voice-stt-whisper"]' }
  - click: { role: button, name: Disconnect Whisper, exact: true }
  - wait: { role: dialog }
  - shot: voice-disconnect-confirm
  - click: { selector: '[role="dialog"] button:has-text("Disconnect")' }
  - wait_gone: { role: dialog }
  - shot: voice-disconnected
  - scroll: { selector: '[aria-label="voice-tts-tts-1"]' }
  - shot: voice-tts-native-empty
  - click: { selector: '[aria-label="voice-tts-tts-1"]' }
  - wait: { role: dialog }
  - wait: { selector: '[role="dialog"] input[name="default_voice"][value="Alloy"]' }
  - shot: voice-tts-model-voice-form
  - fill: { selector: '[role="dialog"] input[name="api_key"]', value: mock-only-tts-not-a-secret }
  - click: { selector: '[role="dialog"] button[type="submit"]' }
  - wait_gone: { role: dialog }
  - wait: { selector: '[aria-label="voice-tts-tts-1"] button:has-text("Current Default")' }
  - shot: voice-tts-connected
  - click: { selector: '[aria-label="voice-tts-tts-1-hd"]' }
  - wait: { selector: '[aria-label="voice-tts-tts-1-hd"] button:has-text("Current Default")' }
  - shot: voice-tts-hd-default
  - goto: /admin/security
  - goto: /admin/voice
  - scroll: { selector: '[aria-label="voice-tts-tts-1-hd"]' }
  - wait: { selector: '[aria-label="voice-tts-tts-1-hd"] button:has-text("Current Default")' }
  - shot: voice-tts-navigation-readback
  - hover: { selector: '[aria-label="voice-tts-tts-1-hd"]' }
  - click: { role: button, name: Disconnect TTS-1 HD, exact: true }
  - wait: { role: dialog }
  - click: { selector: '[role="dialog"] button:has-text("Disconnect")' }
  - wait_gone: { role: dialog }
  - shot: voice-tts-disconnected
