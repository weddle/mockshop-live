# Source prerequisites: user.temperature_override_enabled=true (named overlay), reasoning_override_enabled=true (base).
# Voice controls are unconditionally present at SettingsPage:1648–1713. Smooth Streaming is an upstream cookie, not backend state.
name: user-settings-controls-defaults
title: Native Smooth Streaming, temperature, reasoning and voice playback
strict: true
locale: en
overlays: [demo-user-settings-preferences]
steps:
  - goto: /app/settings/general
  - click: { selector: 'a[href="/app/settings/chat-preferences"]' }
  - wait: { selector: 'label:has-text("Default Temperature") [role="slider"]' }
  - wait: { selector: 'label:has-text("Default Reasoning Level") [role="slider"][aria-valuenow="2"]' }
  - wait: { selector: 'label:has-text("Playback Speed") input[type="range"][value="1"]' }
  - wait: { selector: 'label:has-text("Smooth Streaming") [role="switch"][aria-checked="true"]' }
  - shot: { name: defaults-native-source-prerequisites, full_page: true }
  - wait: { selector: 'label:has-text("Auto-Playback") [role="switch"][aria-checked="false"]' }
  - scroll: { selector: 'label:has-text("Playback Speed")' }
  - eval: |
      const playback = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Auto-Playback'))?.querySelector('[role="switch"]');
      const speed = document.querySelector('input[type="range"]');
      if ([playback, speed].some(el => !el || el.getBoundingClientRect().top < 0 || el.getBoundingClientRect().bottom > innerHeight - 32)) throw new Error('Baseline voice controls must be inside the visible viewport');
  - shot: { name: defaults-voice-source-prerequisites, full_page: true }
  - click: { selector: 'label:has-text("Smooth Streaming") [role="switch"]' }
  # Focus only uses the public DOM; actual value changes/commits use native keyboard events.
  - scroll: { selector: 'label:has-text("Default Temperature") [role="slider"]' }
  - click: { selector: 'label:has-text("Default Temperature") [role="slider"]' }
  - press: End
  - press: ArrowLeft
  - wait: { selector: 'label:has-text("Default Temperature") [role="slider"][aria-valuenow="1.9"]' }
  - click: { selector: 'label:has-text("Default Reasoning Level") [role="slider"]' }
  - press: Home
  - press: ArrowRight
  - wait: { selector: 'label:has-text("Default Reasoning Level") [role="slider"][aria-valuenow="1"]' }
  - click: { selector: 'label:has-text("Auto-Playback") [role="switch"]' }
  - click: { selector: 'label:has-text("Playback Speed") input[type="range"]' }
  - press: End
  - press: ArrowLeft
  - wait: { selector: 'label:has-text("Playback Speed") input[type="range"][value="1.9"]' }
  - shot: { name: defaults-native-changed, full_page: true }
  - goto: /app/settings/chat-preferences
  - wait: { selector: 'label:has-text("Smooth Streaming") [role="switch"][aria-checked="false"]' }
  - wait: { selector: 'label:has-text("Default Temperature") [role="slider"][aria-valuenow="1.9"]' }
  - wait: { selector: 'label:has-text("Default Reasoning Level") [role="slider"][aria-valuenow="1"]' }
  - wait: { selector: 'label:has-text("Auto-Playback") [role="switch"][aria-checked="true"]' }
  - wait: { selector: 'label:has-text("Playback Speed") input[type="range"][value="1.9"]' }
  - eval: |
      (async () => {
        const user = await (await fetch('/api/me')).json();
        if (user.preferences.temperature_default !== 1.9 || user.preferences.reasoning_effort_default !== 'low' ||
            user.preferences.voice_playback_speed !== 1.9 || !user.preferences.voice_auto_playback ||
            !document.cookie.split('; ').includes('smoothStreamingEnabled=false')) throw new Error('Native preference DTO/cookie readback mismatch');
        const response = await fetch('/api/__mockshop/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({overlays:['demo-user-settings-preferences'], keep:true, resetChats:false})});
        if (!response.ok) throw new Error('Keep reset failed');
      })()
  - goto: /app/settings/chat-preferences
  - wait: { selector: 'label:has-text("Default Temperature") [role="slider"][aria-valuenow="1.9"]' }
  - wait: { selector: 'label:has-text("Default Reasoning Level") [role="slider"][aria-valuenow="1"]' }
  - wait: { selector: 'label:has-text("Playback Speed") input[type="range"][value="1.9"]' }
  - wait: { selector: 'label:has-text("Smooth Streaming") [role="switch"][aria-checked="false"]' }
  - shot: { name: defaults-native-reloaded-kept, full_page: true }
  - wait: { selector: 'label:has-text("Auto-Playback") [role="switch"][aria-checked="true"]' }
  - scroll: { selector: 'label:has-text("Playback Speed")' }
  - eval: |
      const playback = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Auto-Playback'))?.querySelector('[role="switch"]');
      const speed = document.querySelector('input[type="range"]');
      if ([playback, speed].some(el => !el || el.getBoundingClientRect().top < 0 || el.getBoundingClientRect().bottom > innerHeight - 32)) throw new Error('Kept voice controls must be inside the visible viewport');
  - shot: { name: defaults-voice-reloaded-kept, full_page: true }
  - eval: |
      (async () => {
        const response = await fetch('/api/__mockshop/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({overlays:['demo-user-settings-preferences'], locale:'en', anchor:'2026-10-09T10:00:00-04:00'})});
        if (!response.ok) throw new Error('Fresh reset failed');
      })()
  - goto: /app/settings/chat-preferences
  - wait: { selector: 'label:has-text("Default Temperature") [role="slider"][aria-valuenow="0"]' }
  - wait: { selector: 'label:has-text("Default Reasoning Level") [role="slider"][aria-valuenow="2"]' }
  - wait: { selector: 'label:has-text("Playback Speed") input[type="range"][value="1"]' }
  - wait: { selector: 'label:has-text("Auto-Playback") [role="switch"][aria-checked="false"]' }
  # Backend reset must not counterfeit a browser-cookie reset. Native toggle restores the default explicitly.
  - wait: { selector: 'label:has-text("Smooth Streaming") [role="switch"][aria-checked="false"]' }
  - shot: { name: defaults-backend-reset-cookie-retained, full_page: true }
  - scroll: { selector: 'label:has-text("Playback Speed")' }
  - eval: |
      const playback = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Auto-Playback'))?.querySelector('[role="switch"]');
      const speed = document.querySelector('input[type="range"]');
      if ([playback, speed].some(el => !el || el.getBoundingClientRect().top < 0 || el.getBoundingClientRect().bottom > innerHeight - 32)) throw new Error('Reset voice controls must be inside the visible viewport');
  - shot: { name: defaults-voice-backend-reset, full_page: true }
  - click: { selector: 'label:has-text("Smooth Streaming") [role="switch"]' }
  - goto: /app/settings/chat-preferences
  - wait: { selector: 'label:has-text("Smooth Streaming") [role="switch"][aria-checked="true"]' }
  - shot: { name: defaults-streaming-restored-native, full_page: true }
  - wait: { selector: 'label:has-text("Auto-Playback") [role="switch"][aria-checked="false"]' }
  - wait: { selector: 'label:has-text("Playback Speed") input[type="range"][value="1"]' }
  - scroll: { selector: 'label:has-text("Playback Speed")' }
  - eval: |
      const playback = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Auto-Playback'))?.querySelector('[role="switch"]');
      const speed = document.querySelector('input[type="range"]');
      if ([playback, speed].some(el => !el || el.getBoundingClientRect().top < 0 || el.getBoundingClientRect().bottom > innerHeight - 32)) throw new Error('Restored voice controls must be inside the visible viewport');
  - shot: { name: defaults-voice-streaming-restored, full_page: true }
