# Bring-your-own-model walkthrough. Admin: providers (OpenAI, Anthropic, on-prem Ollama) -> self-hosted group ->
# on-prem provider modal. End user: Training & Onboarding Desk -> model picker -> on-prem Llama -> starter -> cited answer.
# Records as a clip too (./mockshop clip onyx/byo-model-on-prem).
name: byo-model-on-prem
title: Bring your own model, including an on-prem one
viewport: [1440, 900]
clip:
  title: { title: "Bring your own model, including on-prem", subtitle: "Onyx · Seaside Collection demo (fictional data)" }
  title_ms: 3500
  hold_ms: 1800
  after_click_ms: 300
  pre_click_ms: 160
  end_hold_ms: 4000
steps:
  - goto: /admin/language-models
  - shot: { name: providers, hold: 1200 }
  - scroll: { text: "Self-hosted & Custom" }
  - settle: 600
  - shot: { name: add-provider-groups, hold: 1600 }
  - scroll: { text: Available Providers }
  - settle: 600
  - click: { role: button, name: "Edit On-prem GPU cluster" }
  - wait: { text: "Self-hosted Ollama" }
  - settle: 800
  - shot: { name: onprem-provider-modal, hold: 2600 }
  - press: Escape
  - settle: 500
  # screenshots go through the agent gallery; the clip cuts from a title card straight to the agent's chat
  - card: { title: "Now, as an end user", subtitle: "Users pick from the models the admin allows", ms: 2000, keep: true }
    only: clip
  - goto: /app?agentId=11
    only: clip
  - goto: /app
    only: shot
  - click: { text: More Agents }
    only: shot
  - wait: { text: Featured Agents }
    only: shot
  - click: { text: Start Chat, nth: 1 }       # "Training & Onboarding Desk" card
    only: shot
  - settle: 800
  - shot: { name: agent-selected, hold: 1000 }
  - click: { role: button, name: GPT-5.2 }
  - settle: 500
  - shot: { name: model-picker-open, hold: 700 }
  - click: { text: On-prem GPU cluster }
  - settle: 400
  - shot: { name: model-picker-onprem, hold: 1100 }
  - click: { text: Llama 3.3 70B }
  - settle: 500
  - shot: { name: model-switched, hold: 700 }
  - click: { text: "What training do new front desk hires need" }
  - wait: { testid: onyx-ai-message, timeout: 40000 }
  - settle: 1500
  - eval: "document.querySelector('[data-testid=chat-scroll-container]')?.scrollTo(0, 1e6)"
  - move: [1300, 380]     # park the cursor off the answer text
    only: clip
  - shot: answer-with-citations
