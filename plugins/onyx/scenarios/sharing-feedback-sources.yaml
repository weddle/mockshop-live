# DEVELOPMENT inventory; independent parent strict/every-PNG acceptance/publication remains pending.
# Independent fresh reset uses the existing control plane; mutations under test use only native controls.

name: sharing-feedback-sources
title: Native live Sources sidebar and saved file row previews
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: []
steps:
  - goto: /app
  - eval: |
      (async () => {
        const currentResponse = await fetch('/api/__mockshop/state');
        if (!currentResponse.ok) throw new Error('Independent Sharing seed read failed');
        const current = await currentResponse.json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:[],locale:'en',keep:false,resetChats:true,anchor:current.demo_anchor})});
        if (!response.ok) throw new Error('Independent Sharing reset failed');
        sessionStorage.removeItem('sharing-workshop-id');
        sessionStorage.removeItem('sharing-workshop-link');
      })();
  # Primary original operations 169-187; every original interaction and named PNG is retained.
  - goto: /app?chatId=61616161-0000-4000-8000-000000000001
  - wait: { text: Closing reflection, exact: true }
  - click: { role: button, name: Sources, exact: true }
  - wait: { text: Cited Sources, exact: true }
  - wait: { text: More, exact: true }
  - wait: { text: User Files, exact: true }
  - shot: live-native-sources-sidebar
  - click: { selector: '#onyx-chat-sidebar button', has_text: library-reading.txt, nth: 0 }
  - wait: { role: dialog }
  - wait: { text: Synthetic demo reading note, exact: false }
  - shot: live-source-row-preview
  - press: Escape
  - click: { selector: '#onyx-chat-sidebar button', has_text: attendance-demo.csv, nth: 0 }
  - wait: { role: dialog }
  - wait: { selector: '[role="dialog"]', has_text: Reading circle }
  - shot: live-tabular-source-preview
  - press: Escape
  - click: { selector: '#onyx-chat-sidebar button', nth: 0 }
  - wait_gone: { selector: '.w-100 #onyx-chat-sidebar' }
  - shot: live-sources-closed
  # Typed optional positive feedback, same-vote removal and navigation reuse the real live-chat store and assistant IDs.
