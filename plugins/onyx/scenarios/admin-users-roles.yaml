# Independent #59 native unit. Runner starts fresh base state; no preceding unit is required.
name: admin-users-roles
title: Native accepted User admin access and independent reset
strict: true
requires: enterprise
locale: en
overlays: []
steps:
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
  - click: { role: button, name: User actions, exact: true }
  - shot: users-active-menu
  - click: { text: Make Admin, exact: true }
  - wait: { text: User is now an admin, exact: true }
  - shot: users-admin-feedback
  - click: { role: button, name: User actions, exact: true }
  - click: { text: Remove Admin Access, exact: true }
  - wait: { text: Admin access removed, exact: true }
  - shot: users-admin-removed
  # The original grant/removal lifecycle ends clean. Grant again before reset so reset is meaningful.
  - click: { role: button, name: User actions, exact: true }
  - click: { text: Make Admin, exact: true }
  - wait: { text: User is now an admin, exact: true }
  - goto: /admin/users
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
  - click: { role: button, name: User actions, exact: true }
  - wait: { text: Remove Admin Access, exact: true }
  - shot: users-admin-persisted
  - press: Escape
  - eval: |
      (async () => {
        const res = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strict:true,locale:'en'})});
        if (!res.ok) throw new Error('Mock reset failed');
        location.reload();
      })()
  - wait: { text: Users & Requests, exact: true }
  - fill: { selector: 'input[placeholder="Search users..."]', value: devon.ortiz }
  - click: { role: button, name: User actions, exact: true }
  - wait: { text: Make Admin, exact: true }
  - shot: users-role-reset
