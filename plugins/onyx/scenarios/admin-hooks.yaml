# #65 route-sized native proof: Hook Extensions.
# Runner fresh-run reset seeds this unit independently; no prior scenario required.

name: admin-hooks
title: Hook Extensions - fictional local configuration
strict: true
requires: enterprise
locale: en
overlays: [demo-mcp-admin]
demo_anchor: '2026-10-09T10:00:00-04:00'
steps:
  - goto: /admin/hooks
  - shot: inventory-hooks
  - goto: /admin/hooks
  - wait: { text: Query Processing, exact: true }
  - shot: hooks-direct-empty
  - click: { selector: 'a[href="/admin/hooks"]' }
  - click: { role: button, name: Connect, exact: true, nth: 0 }
  - wait: { role: dialog }
  - fill: { selector: 'input[name="name"]', value: Workshop query notes (fake hook) }
  - fill: { selector: 'input[name="endpoint_url"]', value: 'https://workshop.example/hooks/query' }
  - fill: { selector: 'input[name="api_key"]', value: mock-only-not-a-secret }
  - shot: hooks-connect-dialog
  - click: { selector: '[role="dialog"] button[type="submit"]' }
  - wait_gone: { role: dialog }
  - goto: /admin/voice
  - goto: /admin/hooks
  - wait: { text: Workshop query notes (fake hook), exact: true }
  - shot: hooks-created
  - hover: { text: Workshop query notes (fake hook), exact: true }
  - click: { role: button, name: Configure hook, exact: true }
  - wait: { role: dialog }
  - shot: hooks-manage-dialog
  - press: Escape
  - click: { role: button, name: Re-validate hook, exact: true }
  - shot: hooks-validated-local
  - click: { role: button, name: Deactivate hook, exact: true }
  - wait: { role: dialog }
  - shot: hooks-disconnect-confirm
  - click: { role: button, name: Disconnect, exact: true }
  - wait_gone: { role: dialog }
  - shot: hooks-disconnected
  - click: { role: button, name: Reconnect, exact: true }
  - shot: hooks-reconnected
  - hover: { text: Workshop query notes (fake hook), exact: true }
  # The native trash action exists only while the hook is disconnected.
  - click: { role: button, name: Deactivate hook, exact: true }
  - wait: { role: dialog }
  - click: { role: button, name: Disconnect, exact: true }
  - wait_gone: { role: dialog }
  - click: { role: button, name: Delete hook, exact: true }
  - wait: { role: dialog }
  - shot: hooks-delete-confirm
  - click: { selector: '[role="dialog"] button:has-text("Delete")' }
  - wait_gone: { role: dialog }
  - shot: hooks-deleted
  - click: { role: button, name: Connect, exact: true, nth: 0 }
  - wait: { role: dialog }
  - fill: { selector: 'input[name="name"]', value: Workshop query notes (fake hook) }
  - fill: { selector: 'input[name="endpoint_url"]', value: 'https://workshop.example/hooks/query' }
  - fill: { selector: 'input[name="api_key"]', value: mock-only-not-a-secret }
  - shot: hooks-connect-dialog
  - click: { selector: '[role="dialog"] button[type="submit"]' }
  - wait_gone: { role: dialog }
  - wait: { text: Workshop query notes (fake hook), exact: true }
  - shot: hooks-reset-dirty-precondition
  - eval: |
      (async () => {
        await fetch('/api/__mockshop/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ overlays: ['demo-mcp-admin'], strict: true, anchor: '2026-10-09T10:00:00-04:00' }) });
      })()
  - goto: /admin/hooks
  - wait_gone: { text: Workshop query notes (fake hook), exact: true }
  - shot: reset-hooks-seed
