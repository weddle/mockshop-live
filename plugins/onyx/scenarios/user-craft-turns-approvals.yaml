# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-turns-approvals
title: "Craft finite turns, queued messages, approvals and created-session deletion"
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
steps:
  - goto: "/app"
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = ['edition-enterprise','demo-mcp-admin','demo-user-craft'];
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
  - goto: "/craft/v1"
  - wait: {"selector": "[contenteditable=\"true\"][role=\"textbox\"]"}
  - fill: { selector: '[contenteditable="true"][role="textbox"]', value: /campus }
  - shot: craft-slash-picker-filtered
  - press: Escape
  - fill: { selector: '[contenteditable="true"][role="textbox"]', value: Prepare a fictional accessible workshop handout. }
  - eval: |
      const input = document.querySelector('input[type="file"][multiple]');
      if (!input) throw new Error('Native Craft attachment input missing');
      const files = new DataTransfer();
      files.items.add(new File(['Synthetic teaching notes.'], 'clinic-notes.txt', {type:'text/plain'}));
      input.files = files.files; input.dispatchEvent(new Event('change', {bubbles:true}));
  - wait: { text: clinic-notes.txt, exact: true }
  - shot: craft-composer-attachment
  - click: { role: button, name: Send, exact: true }
  - wait: { role: button, name: Stop generating, exact: true }
  - shot: craft-turn-running
  - fill: { selector: '[contenteditable="true"][role="textbox"]', value: A second fictional instruction for later. }
  - click: { role: button, name: Queue message, exact: true }
  - shot: craft-turn-queued
  - click: { selector: '[data-testid="queued-message-bar"] button' }
  - wait: { text: 'Fictional Craft output: prepare accessible workshop notes', exact: false }
  - settle: 3000
  - shot: craft-turn-output-and-subagent
  - click: { selector: '[aria-label="Switch agent"]' }
  - shot: craft-subagent-menu
  - click: { text: Review accessibility, exact: true }
  - shot: craft-subagent-read-only
  - click: { selector: '[aria-label="Switch agent"]' }
  - click: { text: Accessible workshop plan, exact: true }
  - shot: craft-subagent-returned
  - eval: |
      (async () => {
        const id = new URL(location.href).searchParams.get('sessionId');
        if (!id) throw new Error('Native session URL missing');
        sessionStorage.setItem('craft-created-session', id);
        const messages = await (await fetch('/api/build/sessions/' + id + '/messages')).json();
        if (!messages.messages.some(m => m.type === 'user' && m.content.includes('accessible workshop'))) throw new Error('Prompt was not persisted');
      })()
  - click: { selector: ':nth-match([aria-label="Show details"], 1)' }
  - shot: craft-approval-details
  - click: { selector: ':nth-match([aria-label="Approve this action once"], 1)' }
  - settle: 1200
  - click: { selector: ':nth-match(button:has-text("Approve for session"), 1)' }
  - settle: 1200
  - click: { selector: ':nth-match([aria-label="Reject this action"], 1)' }
  - shot: craft-approval-decisions
  - eval: location.reload()
  - wait: { text: 'Fictional Craft output: prepare accessible workshop notes', exact: false }
  - shot: craft-turn-reopened
  - fill: { selector: '[contenteditable="true"][role="textbox"]', value: Start another fictional handout draft. }
  - click: { role: button, name: Send, exact: true }
  - wait: { role: button, name: Stop generating, exact: true }
  - click: { role: button, name: Stop generating, exact: true }
  - shot: craft-turn-interrupted
  - click: { selector: '.opal-sidebar-tab:has-text("Accessible workshop plan") button[aria-label="Session options"]' }
  - click: { text: Delete, exact: true }
  - shot: craft-session-delete-confirmation
  - click: { selector: '[role="dialog"] button:has-text("Delete")' }
  - eval: |
      (async () => {
        const sessions = await (await fetch('/api/build/sessions')).json();
        if (sessions.sessions.some(s => s.id === sessionStorage.getItem('craft-created-session'))) throw new Error('Native session delete did not persist');
      })()
  - shot: craft-session-deleted
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
  - goto: "/craft/v1"
  - wait: {"selector": "[contenteditable=\"true\"][role=\"textbox\"]"}
  - shot: "craft-unit-turns-approvals-reset"
