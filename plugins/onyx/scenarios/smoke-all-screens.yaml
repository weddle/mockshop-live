title: Native admin, Craft, educational Projects, Files, Users, Groups, Search and model screens
requires: enterprise
strict: true
locale: en
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
# Use the individual user-craft-* and auth-* scenarios for focused interactions.
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: The appended auth inventory deliberately stages logged-out native forms with /me401.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact source-labelled diagnostic for required logged-out /me401; unrelated resource failures remain strict.
