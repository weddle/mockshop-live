# Admin view of a permission-synced connector (Confluence – Training space, access type "sync"):
# status card (permission syncing + last synced) -> Advanced -> Document Permissions tab -> Group Membership tab.
name: admin-permission-sync
requires: enterprise            # permission sync (access type "sync") is a Business+ feature
title: Admin checks permission sync on a connector
viewport: [1440, 900]
steps:
  - goto: /admin/indexing-status
  - type: { placeholder: Search connectors..., value: Training }
  - settle: 800
  - click: { text: Expand All }
  - settle: 600
  - shot: indexing-status-synced
  - click: { text: "Confluence – Training space" }
  - wait: { text: Connector Configuration }
  - settle: 800
  - shot: connector-detail-permissions
  - click: { text: Advanced }
  - settle: 800
  - scroll: { selector: "table", last: true }
  - shot: advanced-indexing-tab
  - click: { role: tab, name: Document Permission Sync }
  - settle: 800
  - shot: doc-permission-sync
  - click: { role: tab, name: Group Membership Sync }
  - settle: 800
  - shot: group-membership-sync
  # Not shown: /admin/connector/101 (Salesforce) renders, but Onyx pulls Salesforce ACLs inline while indexing, so its
  # Permission Syncing badge reads "Not Started" and both sync tabs say "not applicable". Demo Confluence instead.
