# #71 EDITONLY declaration; actual parent build/native acceptance still pending.
# Independent existing runner seed/reset/browser; never consume predecessor unit state.

# Genuine chrome-extension ancestor/origin proof remains a separately required parent supplement.
name: browser-extension-chat
title: Independent no-attachment native stream, feedback, edited questions, answer branches, history and sharing
strict: true
requires: enterprise
locale: en
viewport: [1440, 1000]
overlays: []
steps:
  - goto: /nrf
  - wait: { selector: '#onyx-chat-input-textbox' }
  - click: { selector: '[data-testid="model-selector"] button:has-text("GPT-5.2")' }
  - wait: { placeholder: Search models... }
  - fill: { placeholder: Search models..., value: GPT-5 mini }
  - click: { text: GPT-5 mini, exact: true }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-5 mini")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'extension: outline a fictional workshop' }
  - click: { selector: '#onyx-chat-input-send-button', settle: 0 }
  - wait: 700
  - shot: { name: nrf-answer-streaming, full_page: true, delay: 0 }
  - wait: { testid: 'AgentMessage/toolbar', timeout: 30000 }
  - settle: 1200
  - wait: { text: No tab context was supplied. }
  - shot: { name: nrf-answer-without-tab-context, full_page: true }
  - click: { testid: 'AgentMessage/copy-button', last: true }
  - shot: { name: nrf-answer-copied, full_page: true }
  - click: { testid: 'AgentMessage/like-button', last: true }
  - wait: { role: dialog }
  - shot: { name: nrf-feedback-modal, full_page: true }
  - press: Escape
  - click: { testid: 'AgentMessage/like-button', last: true }
  - wait: { placeholder: What did you like about this response? }
  - fill: { placeholder: What did you like about this response?, value: The fictional accessibility outline is clear. }
  - click: { role: button, name: Submit, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/like-button"][data-interactive-state="selected"]' }
  - shot: { name: nrf-feedback-saved, full_page: true }
  - click: { testid: 'AgentMessage/dislike-button', last: true }
  - wait: { placeholder: What did you dislike about this response? }
  - fill: { placeholder: What did you dislike about this response?, value: Add a large-print reflection option. }
  - click: { role: button, name: Submit, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="selected"]' }
  - shot: { name: nrf-feedback-replaced, full_page: true }
  - click: { testid: 'AgentMessage/dislike-button', last: true }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="empty"]' }
  - shot: { name: nrf-feedback-removed, full_page: true }
  - hover: { selector: '#onyx-human-message' }
  - click: { testid: 'HumanMessage/edit-button', last: true }
  - fill: { selector: 'textarea', value: 'extension: revise the fictional workshop outline' }
  - shot: { name: nrf-question-edit-draft, full_page: true }
  - click: { role: button, name: Cancel, exact: true }
  - hover: { selector: '#onyx-human-message' }
  - click: { testid: 'HumanMessage/edit-button', last: true }
  - fill: { selector: 'textarea', value: 'extension: revise the fictional workshop outline' }
  - click: { role: button, name: Submit, exact: true }
  - wait: { text: No tab context was supplied. }
  - settle: 2000
  - shot: { name: nrf-question-edited, full_page: true }
  # Approved0006 forwards the SAME native session-controller branch callback as AppPage.
  - click: { selector: '[data-testid="MessageSwitcher/container"] button', nth: 0 }
  - wait: { text: 'extension: outline a fictional workshop', exact: true }
  - shot: { name: nrf-question-previous-branch, full_page: true }
  - click: { selector: '[data-testid="MessageSwitcher/container"] button', nth: 1 }
  - wait: { text: 'extension: revise the fictional workshop outline', exact: true }
  - shot: { name: nrf-question-next-branch, full_page: true }
  - click: { selector: '[data-testid="AgentMessage/regenerate"] button', last: true }
  - click: { selector: '[role="dialog"] :text-is("GPT-5 mini")' }
  - wait: { text: 'Alternative outline without reading a browser tab:' }
  - settle: 1200
  - shot: { name: nrf-answer-regenerated, full_page: true }
  - click: { selector: '[data-testid="AgentMessage/toolbar"] [data-testid="MessageSwitcher/container"] button', nth: 0 }
  - wait: { text: No tab context was supplied. }
  - shot: { name: nrf-answer-previous-branch, full_page: true }
  - click: { selector: '[data-testid="AgentMessage/toolbar"] [data-testid="MessageSwitcher/container"] button', nth: 1 }
  - wait: { text: 'Alternative outline without reading a browser tab:' }
  - shot: { name: nrf-answer-next-branch, full_page: true }
  - eval: |
      (async () => {
        const {sessions} = await (await fetch('/api/chat/get-user-chat-sessions')).json();
        const session = sessions.find(s => s.name === 'Fictional browser learning conversation');
        if (!session) throw new Error('NRF conversation was not in the existing sidebar engine');
        sessionStorage.setItem('nrf-conversation', session.id);
        location.assign(`/app?chatId=${session.id}`);
      })()
  - wait: { text: 'Alternative outline without reading a browser tab:' }
  - shot: { name: nrf-conversation-reopened-in-onyx, full_page: true }
  - hover: { testid: ChatButton, has_text: Fictional browser learning conversation }
  - click: { selector: '[data-testid="ChatButton"]:has-text("Fictional browser learning conversation") button[aria-label="Chat options"]' }
  - click: { role: menuitem, name: Share }
  - wait: { role: dialog }
  - shot: { name: nrf-conversation-share, full_page: true }
  - press: Escape
