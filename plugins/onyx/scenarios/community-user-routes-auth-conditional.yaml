    throw new Error('Keep discarded native conditional writes');})()
- shot:
    name: ce-conditional-dirty-decisions-member-kept
    full_page: true
- eval: (async()=>{const current=await (await fetch('/api/__mockshop/state')).json(); const response=await fetch('/api/__mockshop/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:["demo-user-conditional",
    "demo-user-conditional-impersonate","demo-community-user-route-shell"],anchor:current.demo_anchor,locale:'en',keep:false})}); if(!response.ok)
    throw new Error('Independent Community dirty-state reset failed');})()
- goto: /auth/impersonate
- wait:
    selector: input[name="apiKey"]
- eval: |
    (async()=>{
      const m=await (await fetch('/api/me')).json(),r=await (await fetch('/api/mockshop/user-conditional/receipts')).json();
      if(m.email!=='alex.learner@workshop.example'||!m.is_cloud_superuser||Object.keys(r.callbacks).length||Object.keys(r.consents).length||r.impersonated||document.querySelector('input[name="apiKey"]').value!==''||document.querySelector('input[name="email"]').value!=='') throw new Error('Fresh conditional reset retained decisions/target member/form draft');
      const branding=await fetch('/api/enterprise-settings');
      if(branding.status!==404||(await branding.json()).detail!=='Not Found') throw new Error('Native CE absent enterprise branding boundary missing');
      const settings=await fetch('/api/settings');
      if(!settings.ok) throw new Error('Community settings prerequisite missing');
      const v=await settings.json();
      if(v.tier!=='community'||v.ee_features_enabled!==false||v.application_status!=='active') throw new Error('Native auth fallback changed protected Community flags');
      const analytics=await fetch('/api/enterprise-settings/custom-analytics-script');
      if(!analytics.ok||await analytics.json()!==null) throw new Error('Native empty analytics configuration prerequisite missing');
    })()
- shot:
    name: ce-conditional-fresh-original-named-actor-empty-form
    full_page: true
demo_anchor: '2026-10-09T10:00:00-04:00'
