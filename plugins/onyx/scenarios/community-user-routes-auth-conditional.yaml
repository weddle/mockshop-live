- eval: (async()=>{const r=await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if(Object.keys(r.callbacks).length)
    throw new Error('Native missing-query guards wrote a callback receipt');})()
- goto: /oauth-provider/authorize?request=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
- wait:
    text: Allow Workshop Reader (fictional app) to search Onyx?
    exact: true
    timeout: 30000
- wait:
    text: Signed in as alex.learner@workshop.example
    exact: true
- eval: 'if(!document.body.innerText.includes(''App address: ''+location.origin)) throw new Error(''Consent disclosed
    an external origin'');'
