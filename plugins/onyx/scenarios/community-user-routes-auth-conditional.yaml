- eval: (async()=>{const r=await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if(new URL(location.href).searchParams.get('conditional_decision')!=='allow'||r.consents['AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA']!=='allow')
    throw new Error('Native consent did not persist/follow same-origin LOCAL fake receipt');})()
- shot:
