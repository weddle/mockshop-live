# #69: Enterprise, LOCAL non-cloud build with NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=true.
# Parent registration is required. All inputs below are fictional and never stored as credentials.
name: auth-anonymous-feedback
title: "Independent native #69 unit: auth-anonymous-feedback"
strict: true
requires: enterprise
locale: en
viewport: [1440, 900]
overlays: [demo-auth-anonymous]
known_errors:
  - match: '/^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Required native logged-out /me response; cookie and fake current user are deliberately cleared.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out /me401 source diagnostic; native cleared-cookie and unauthorized identity are asserted.
# Independent prerequisites: Native guest entry and Claude welcome answer independently provide real saved message IDs; copy, modal cancel/required/save/reload/clear and Sources.
steps:
  - state: { overlays: [demo-auth-anonymous] }
  - goto: /auth/login
  - eval: |
      (async () => {
        const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'logged-out'})});
        if (!r.ok) throw new Error('Local fake logged-out staging failed');
        const me = await fetch('/api/me');
        if (me.status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Cookie or /me was not logged out');
      })()
  - goto: /anonymous/workshop-demo
  - wait: { selector: '#onyx-chat-input-textbox' }
  - eval: |
      (async () => {const me = await (await fetch('/api/me')).json(); if (!me.is_anonymous_user || location.pathname !== '/app') throw new Error('Native anonymous redirect/session did not complete');})()
  - click: { role: button, name: GPT-5.2, exact: true }
  - click: { text: Anthropic, exact: true }
  - click: { text: Claude Sonnet 4.5, exact: true }
  - type: { selector: '#onyx-chat-input-textbox', value: 'Local fake workshop welcome' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: 'No provider, authentication, real document search or email service was contacted.', exact: false }
  - wait: { testid: AgentMessage/toolbar, timeout: 30000 }
  - settle: 600
  - click: { testid: AgentMessage/copy-button }
  - wait: { selector: '[data-testid="AgentMessage/copy-button"] path[d="M13.5 4.5L6 12L2.5 8.5"]' }
  - shot: anonymous-answer-copied
  - hover: { text: Local fake workshop welcome, exact: true }
  - click: { testid: HumanMessage/copy-button }
  - wait: { selector: '[data-testid="HumanMessage/copy-button"] path[d="M13.5 4.5L6 12L2.5 8.5"]' }
  - shot: anonymous-question-copied
  - click: { testid: AgentMessage/like-button }
  - wait: { placeholder: What did you like about this response? }
  - shot: anonymous-like-feedback-modal
  - click: { role: button, name: Cancel, exact: true }
  - wait_gone: { role: dialog }
  - shot: anonymous-feedback-cancelled
  - click: { testid: AgentMessage/dislike-button }
  - wait: { placeholder: What did you dislike about this response? }
  - eval: |
      if (![...document.querySelectorAll('[role="dialog"] button')].find(b => b.textContent.trim() === 'Submit')?.disabled) throw new Error('Empty negative feedback must not submit');
  - shot: anonymous-feedback-required
  - fill: { placeholder: What did you dislike about this response?, value: LOCAL FAKE DEMO — please add an accessible workshop example. }
  - click: { role: button, name: Submit, exact: true }
  - wait_gone: { role: dialog }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="selected"]' }
  - shot: anonymous-feedback-saved
  - eval: location.reload()
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="selected"]' }
  - shot: anonymous-feedback-reloaded
  - click: { testid: AgentMessage/dislike-button }
  - wait: { selector: '[data-testid="AgentMessage/dislike-button"][data-interactive-state="empty"]' }
  - shot: anonymous-feedback-cleared
  - click: { role: button, name: Sources, exact: true }
  - wait: { text: Workshop welcome checklist (fake demo), exact: false }
  - shot: anonymous-native-sources
  - click: { role: button, name: Sources, exact: true }
