# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-tasks-lifecycle
title: "Craft complete task schedule, preapproval, lifecycle and run-history inventory"
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
steps:
  - goto: "/app"
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = ['edition-enterprise','demo-mcp-admin','demo-user-craft'];
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
  - goto: "/admin/craft/apps?tab=mcp"
  - click: { selector: '[aria-label="Enable Seaside PMS (internal MCP)"]' }
  - wait: {"selector": "[aria-label=\"Disable Seaside PMS (internal MCP)\"]"}
  - goto: "/craft/v1/skills"
  - wait: {"placeholder": "Search skills..."}
  - click: { role: button, name: Scheduled Tasks, exact: true }
  - wait: { selector: '[data-testid="new-task-button"]' }
  - shot: craft-tasks-menu-entry
  - goto: /craft/v1/tasks
  - wait: { selector: '[data-testid="new-task-button"]' }
  - shot: craft-tasks-direct
  - click: { selector: '.table-footer button:has(svg path[d="M6 12L10 8L6 4"])' }
  - shot: craft-tasks-pagination-next
  - click: { selector: '.table-footer button:has(svg path[d="M10 12L6 8L10 4"])' }
  - shot: craft-tasks-pagination-return
  - goto: /craft/v1/tasks/new
  - wait: { selector: '[data-testid="task-name-input"]' }
  - shot: craft-task-new-pristine
  - click: { selector: '[data-testid="task-name-input"]' }
  - click: { selector: '[data-testid="task-prompt-input"]' }
  - click: { selector: '[data-testid="task-name-input"]' }
  - shot: craft-task-required-errors
  - fill: { selector: '[data-testid="task-name-input"]', value: Fictional workshop reminder }
  - fill: { selector: '[data-testid="task-prompt-input"]', value: /campus }
  - shot: craft-task-skill-picker
  - press: Escape
  - fill: { selector: '[data-testid="task-prompt-input"]', value: Prepare a fictional accessible workshop checklist. }
  - click: { selector: '[role="combobox"]' }
  - click: { text: minutes, exact: true }
  - fill: { selector: '[data-testid="interval-every"]', value: '60' }
  - shot: craft-task-interval-invalid
  - fill: { selector: '[data-testid="interval-every"]', value: '15' }
  - shot: craft-task-interval-minutes
  - click: { selector: '[role="combobox"]' }
  - click: { text: hours, exact: true }
  - fill: { selector: '[data-testid="interval-every"]', value: '2' }
  - shot: craft-task-interval-hours
  - click: { text: Daily / Weekly, exact: true }
  - fill: { selector: '[data-testid="daily-weekly-time"]', value: '09:30' }
  - click: { selector: '[data-testid="weekday-1"]' }
  - click: { selector: '[data-testid="weekday-2"]' }
  - click: { selector: '[data-testid="weekday-3"]' }
  - click: { selector: '[data-testid="weekday-4"]' }
  - click: { selector: '[data-testid="weekday-5"]' }
  - shot: craft-task-daily-all-days
  - click: { selector: '[data-testid="weekday-1"]' }
  - click: { selector: '[data-testid="weekday-3"]' }
  - click: { selector: '[data-testid="pre-approval-app-7001"] label' }
  - shot: craft-task-weekly-preapproved
  - click: { selector: '[data-testid="save-and-run-now"]' }
  # Native create-and-run returns to the list, not the detail. The appended
  # created row is on page2 of the existing twenty-row native table.
  - click: { selector: '.table-footer button:has(svg path[d="M6 12L10 8L6 4"])' }
  - click: { text: Fictional workshop reminder, exact: true }
  - wait: { selector: '[data-testid="run-now-button"]' }
  - eval: sessionStorage.setItem('craft-created-task', location.pathname.split('/').pop())
  - shot: craft-task-created-run-result
  - click: { role: button, name: Pause, exact: true }
  - shot: craft-task-paused
  # The native created/paused toast stack covers the toolbar's Resume pointer target until expiry.
  - wait: { selector: 'body:not(:has([data-testid="toast-container"] .opal-toast)) button[data-testid="status-toggle"]:has-text("Resume"):enabled:not([data-disabled="true"])' }
  - click: { role: button, name: Resume, exact: true }
  - wait: { text: Active, exact: true }
  - shot: craft-task-resumed
  - click: { role: link, name: Edit, exact: true }
  - wait: { selector: '[data-testid="task-name-input"]' }
  - shot: craft-task-edit-existing
  - fill: { selector: '[data-testid="task-name-input"]', value: Fictional workshop reminder revised }
  - fill: { selector: '[data-testid="task-prompt-input"]', value: Offer plain-language notes and quiet reflection time. }
  - click: { selector: '[data-testid="save-task"]' }
  - wait: { text: Fictional workshop reminder revised, exact: true }
  - eval: location.href = '/craft/v1/tasks/' + sessionStorage.getItem('craft-created-task') + '/edit'
  - wait: { selector: '[data-testid="task-name-input"]' }
  - eval: if (document.querySelector('[data-testid="task-name-input"]').value !== 'Fictional workshop reminder revised') throw new Error('Task edit did not survive reload');
  - shot: craft-task-edit-reopened
  - eval: location.href = '/craft/v1/tasks/' + sessionStorage.getItem('craft-created-task')
  - wait: { selector: '[data-testid="run-now-button"]' }
  - click: { selector: '[data-testid="run-now-button"]' }
  - shot: craft-task-manual-run
  - click: { selector: ':nth-match([data-run-status="SUCCEEDED"], 1)' }
  # Keep the original scheduled-session banner visible after the native queued-run toast expires.
  - wait: { selector: 'body:not(:has([data-testid="toast-container"] .opal-toast)) [data-testid="scheduled-run-banner"] [data-testid="back-to-task-button"][aria-label*="Fictional workshop reminder revised"]' }
  - shot: craft-task-scheduled-session-banner
  - goto: /craft/v1/tasks/task-clinic
  - wait: { selector: '[data-run-status="FAILED"]' }
  - shot: craft-task-run-status-inventory
  - hover: { selector: '[data-run-status="SKIPPED"]' }
  - shot: craft-task-skipped-not-openable
  - click: { role: button, name: Load more, exact: true }
  - shot: craft-task-run-history-more
  - eval: location.href = '/craft/v1/tasks/' + sessionStorage.getItem('craft-created-task')
  - wait: { selector: '[data-testid="delete-button"]' }
  - click: { selector: '[data-testid="delete-button"]' }
  - shot: craft-task-delete-confirmation
  - click: { selector: '[data-testid="confirm-delete-task"]' }
  - wait: { selector: '[data-testid="new-task-button"]' }
  - eval: |
      (async () => {
        const tasks = await (await fetch('/api/build/scheduled-tasks')).json();
        if (tasks.items.some(t => t.id === sessionStorage.getItem('craft-created-task'))) throw new Error('Task delete did not persist');
      })()
  - shot: craft-task-deleted
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
  - goto: "/craft/v1/tasks"
  - wait: { text: Clinic teaching checklist, exact: true }
  - shot: "craft-unit-tasks-lifecycle-reset"
