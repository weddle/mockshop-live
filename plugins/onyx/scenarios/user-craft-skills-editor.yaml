# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-skills-editor
title: "Craft skill catalog, preview, switch, editor, files and own deletion"
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
steps:
  - goto: "/app"
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = ['edition-enterprise','demo-mcp-admin','demo-user-craft'];
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
  - goto: /craft/v1
  - click: { role: button, name: Skills, exact: true }
  - shot: craft-skills-menu-entry
  - goto: /craft/v1/skills
  - wait: { text: campus-study-plan, exact: true }
  - shot: craft-skills-direct
  - fill: { placeholder: Search skills..., value: unmatched-learning-skill }
  - wait: { text: No matching skills, exact: true }
  - shot: craft-skills-search-empty
  - fill: { placeholder: Search skills..., value: campus-study-plan }
  - click: { text: campus-study-plan, exact: true }
  - shot: craft-skill-preview
  - click: { role: button, name: Close, exact: true }
  - fill: { placeholder: Search skills..., value: "" }
  - click: { selector: '[role="switch"][aria-label="Enable accessible-notes"]' }
  - wait: { text: 'Switch “accessible-notes” skill?', exact: true }
  - shot: craft-skill-switch-confirmation
  - click: { role: button, name: Switch skill, exact: true }
  - shot: craft-skill-switch-saved
  - click: { role: button, name: Create skill, exact: true }
  - click: { text: Start from scratch, exact: true }
  - wait: { selector: 'input[name="name"]' }
  - shot: craft-skill-new-pristine
  - fill: { selector: 'input[name="name"]', value: accessible-workshop }
  - fill: { selector: 'textarea[name="description"]', value: A fictional inclusive workshop handout guide. }
  - fill: { selector: 'textarea[name="instructions_markdown"]', value: "# Accessible workshop\n\nOffer clear headings, large-print notes and quiet reflection time." }
  - click: { role: button, name: Rendered markdown, exact: true }
  - shot: craft-skill-new-rendered
  - click: { role: button, name: Raw markdown, exact: true }
  - click: { role: button, name: Save, exact: true }
  - eval: |
      (async () => {
        const skills = await (await fetch('/api/skills')).json();
        const skill = skills.customs.find(s => s.name === 'accessible-workshop');
        if (!skill?.instructions_markdown.includes('quiet reflection')) throw new Error('Native skill create did not retain editable content');
        sessionStorage.setItem('craft-created-skill', skill.id);
        location.href = '/craft/v1/skills/edit/' + skill.id;
      })()
  - wait: { selector: 'textarea[name="description"]' }
  - shot: craft-skill-created-editor
  - fill: { selector: 'textarea[name="description"]', value: Updated fictional learning guide. }
  - click: { role: button, name: Cancel, exact: true }
  - shot: craft-skill-unsaved-confirmation
  - click: { selector: '[role="dialog"] button:has-text("Cancel")' }
  - click: { role: button, name: Save, exact: true }
  - eval: location.href = '/craft/v1/skills/edit/' + sessionStorage.getItem('craft-created-skill')
  - wait: { selector: 'textarea[name="description"]' }
  - eval: if (document.querySelector('textarea[name="description"]').value !== 'Updated fictional learning guide.') throw new Error('Skill edit did not survive reload');
  - shot: craft-skill-edited-reopened
  - eval: |
      const input = document.querySelector('input[type="file"][aria-label="Add supporting files"]');
      if (!input) throw new Error('Native supporting-file input missing');
      const files = new DataTransfer(); files.items.add(new File(['Synthetic accessible teaching reference.'], 'reference.txt', {type:'text/plain'}));
      input.files = files.files; input.dispatchEvent(new Event('change', {bubbles:true}));
  - wait: { text: reference.txt, exact: true }
  - shot: craft-skill-supporting-file-added
  - click: { role: button, name: Remove reference.txt, exact: true }
  - shot: craft-skill-supporting-file-removed
  - eval: location.href = '/craft/v1/skills/edit/' + sessionStorage.getItem('craft-created-skill')
  - wait: { role: button, name: Delete skill, exact: true }
  - click: { role: button, name: Delete skill, exact: true }
  - shot: craft-skill-delete-confirmation
  - click: { selector: '[role="dialog"] button:has-text("Delete")' }
  - wait: { placeholder: Search skills... }
  - eval: |
      (async () => {
        const skills = await (await fetch('/api/skills')).json();
        if (skills.customs.some(s => s.id === sessionStorage.getItem('craft-created-skill'))) throw new Error('Native skill delete did not persist');
      })()
  - shot: craft-skill-deleted
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
  - goto: "/craft/v1/skills"
  - wait: {"text": "campus-study-plan", "exact": true}
  - shot: "craft-unit-skills-editor-reset"
