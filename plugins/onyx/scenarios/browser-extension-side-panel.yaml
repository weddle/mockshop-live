# #71 EDITONLY declaration; actual parent build/native acceptance still pending.
# Independent existing runner seed/reset/browser; never consume predecessor unit state.

# Genuine chrome-extension ancestor/origin proof remains a separately required parent supplement.
name: browser-extension-side-panel
title: Independent native side-panel waiting, untrusted message, stop, answer error, recovery and reset
strict: true
requires: enterprise
locale: en
viewport: [1440, 1000]
overlays: []
steps:
  - goto: /nrf/side-panel
  - wait: { text: Read this tab, exact: true }
  - eval: |
      if (document.querySelector('.absolute.top-0.end-0.p-4 button')) throw new Error('Side panel wrongly exposes new-tab Settings panel');
  - shot: { name: nrf-side-panel-direct-empty, full_page: true }
  - click: { role: button, name: Read this tab, exact: true }
  - wait: { text: Reading tab..., exact: true }
  # A REAL HTTP-origin postMessage must NOT pass the extension trust guard.
  - eval: window.postMessage({type:'TAB_URL_UPDATED',url:'https://campus.example/learning/accessible-workshop'}, location.origin)
  - wait: 300
  - eval: |
      if (document.body.textContent.includes('campus.example')) throw new Error('HTTP-origin message crossed the trusted-parent boundary');
  - shot: { name: nrf-side-panel-untrusted-url-rejected, full_page: true }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'extension: outline the selected fictional tab' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: No tab context was supplied. }
  - settle: 1200
  - shot: { name: nrf-side-panel-waiting-context-answer, full_page: true }
  - click: { role: button, name: Reading tab..., exact: true }
  - wait: { text: Read this tab, exact: true }
  - shot: { name: nrf-side-panel-tab-reading-disabled, full_page: true }
  - click: { selector: 'header .flex.items-center.gap-1 button', nth: 0 }
  - wait_gone: { testid: 'AgentMessage/toolbar' }
  - wait: { text: Read this tab, exact: true }
  - shot: { name: nrf-side-panel-new-chat-reset, full_page: true }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'extension: stream a fictional workshop outline' }
  - click: { selector: '#onyx-chat-input-send-button', settle: 0 }
  - wait: 700
  - click: { selector: '#onyx-chat-input-send-button' }
  - settle: 500
  - shot: { name: nrf-side-panel-stream-stopped, full_page: true }
  - click: { selector: 'header .flex.items-center.gap-1 button', nth: 0 }
  - eval: |
      (async () => {
        const response = await fetch('/api/mockshop/browser-extension/outcome', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fail:true})});
        if (!response.ok) throw new Error('Missing #71 error staging callback');
      })()
  - fill: { selector: '#onyx-chat-input-textbox', value: 'extension: show the fictional answer error' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { text: Fictional extension answer is temporarily unavailable. Try again. }
  - shot: { name: nrf-side-panel-answer-error, full_page: true }
  - click: { role: button, name: Stack trace, exact: true }
  - wait: { text: 'Mockshop fixture65: deliberate local answer failure; no provider request.' }
  - shot: { name: nrf-side-panel-error-details, full_page: true }
  - click: { role: button, name: Regenerate, exact: true }
  - wait: { text: No tab context was supplied. }
  - settle: 1200
  - shot: { name: nrf-side-panel-error-recovered, full_page: true }
  - eval: |
      (async () => {
        const update = await fetch('/api/mockshop/browser-extension/context', {method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active_tab:'healthcare',tabs:{healthcare:{title:'Edited fictional health learning title',content:'Editable fictional healthcare learning outline.'}}})});
        if (!update.ok) throw new Error('Fictional fixture context setup failed');
        const reset = await fetch('/api/__mockshop/state', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({resetChats:true})});
        if (!reset.ok) throw new Error('Fictional context and conversation reset failed');
        localStorage.removeItem('useOnyxAsDefaultNewTab');
      })()
  - goto: /nrf/side-panel
  - wait: { text: Read this tab, exact: true }
  - shot: { name: nrf-side-panel-fresh-reset, full_page: true }
  - wait_gone: { testid: 'AgentMessage/toolbar' }
