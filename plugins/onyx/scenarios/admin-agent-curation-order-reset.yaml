# #58 derived native witness; prepared/unaccepted, parent matching-artifact proof required.
# Independent prerequisite: Fresh runner reset; direct admin seed/pin read, then real native editor Feature Save/reload for14. No previous-unit state or API curation writes.
# Source15: All hides unlisted cards; Your retains owned access; sections honor saved rank.

name: admin-agent-curation-order-reset
title: Native pointer reorder, gallery priority and protected dirty keep/fresh reset
requires: enterprise
strict: true
locale: en
overlays: [demo-mcp-admin]
viewport: [1440, 900]
steps:
  - goto: /admin/agents
  - wait: { testid: agent-row-actions-14 }
  - eval: |
      (async () => {
        const get = async path => {
          const r = await fetch('/api' + path);
          if (!r.ok) throw new Error('Missing native read: ' + path);
          return r.json();
        };
        const seeds = await Promise.all([11,12,13,14].map(id => get('/persona/' + id)));
        sessionStorage.setItem('admin-curation-seeds', JSON.stringify(seeds));
        sessionStorage.setItem('admin-curation-pins', JSON.stringify((await get('/me')).preferences.pinned_assistants));
        const ids = [...document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]')].map(e => e.dataset.testid);
        if (ids.join(',') !== 'agent-row-actions-11,agent-row-actions-12,agent-row-actions-13,agent-row-actions-14')
          throw new Error('Seeded native admin order is incorrect');
      })()
  - hover: { testid: agent-row-actions-14 }
  - click: { testid: edit-agent-14 }
  - wait: { selector: 'input[name="name"][value="IT Helpdesk"]' }
  - scroll: { text: Feature This Agent, exact: true }
  - click: { selector: 'button#is_featured' }
  - wait: { selector: 'button#is_featured[aria-checked="true"]' }
  - click: { role: button, name: Save, exact: true }
  - goto: /app/agents/edit/14?admin=true
  - wait: { selector: 'input[name="name"][value="IT Helpdesk"]' }
  - scroll: { text: Feature This Agent, exact: true }
  - wait: { selector: 'button#is_featured[aria-checked="true"]' }
  - eval: |
      (async () => {
        const r = await fetch('/api/persona/14');
        if (!r.ok) throw new Error('Saved editor detail missing');
        const saved = await r.json();
        if (!saved.is_featured || !saved.is_listed || saved.name !== 'IT Helpdesk') throw new Error('Native editor Feature save not persisted');
        sessionStorage.setItem('admin-curation-editor-saved', JSON.stringify(saved));
      })()
  - goto: /admin/agents
  - wait: { testid: agent-row-actions-14 }
  - hover: { selector: 'tr:has([data-testid="agent-row-actions-14"])' }
  # Existing runner pointer-dispatch convention, native dnd-kit public handle only.
  - eval: |
      (async () => {
        const source = document.querySelector('tr:has([data-testid="agent-row-actions-14"]) button[aria-label="Drag to reorder"]');
        const target = document.querySelector('tr:has([data-testid="agent-row-actions-11"])');
        if (!source || !target) throw new Error('Native drag handle/target missing');
        const a = source.getBoundingClientRect(), b = target.getBoundingClientRect();
        const start = {x:a.left+a.width/2,y:a.top+a.height/2}, end = {x:start.x,y:b.top+b.height/2};
        const event = (type,x,y,buttons) => new PointerEvent(type,{bubbles:true,cancelable:true,composed:true,isPrimary:true,pointerId:58,pointerType:'mouse',button:0,buttons,clientX:x,clientY:y});
        source.dispatchEvent(event('pointerdown',start.x,start.y,1));
        await new Promise(resolve => setTimeout(resolve,100));
        document.dispatchEvent(event('pointermove',start.x,start.y-12,1));
        await new Promise(resolve => setTimeout(resolve,250));
        document.dispatchEvent(event('pointermove',end.x,end.y,1));
        await new Promise(resolve => setTimeout(resolve,250));
        document.dispatchEvent(event('pointermove',end.x,end.y,1));
        await new Promise(resolve => setTimeout(resolve,250));
        document.dispatchEvent(event('pointerup',end.x,end.y,0));
      })()
  - settle: 600
  - eval: |
      const ids = [...document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]')].map(e => e.dataset.testid);
      if (ids.join(',') !== 'agent-row-actions-14,agent-row-actions-11,agent-row-actions-12,agent-row-actions-13') throw new Error('Native drag did not change visible order');
  - shot: reordered-admin
  - goto: /admin/agents
  - wait: { testid: agent-row-actions-14 }
  - eval: |
      (async () => {
        const ids = [...document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]')].map(e => e.dataset.testid);
        if (ids.join(',') !== 'agent-row-actions-14,agent-row-actions-11,agent-row-actions-12,agent-row-actions-13') throw new Error('Reload lost native drag order');
        for (const path of ['/persona','/admin/persona','/admin/agents']) {
          const r = await fetch('/api' + path);
          if (!r.ok) throw new Error('Missing native curation read: ' + path);
          const body = await r.json(), rows = Array.isArray(body) ? body : body.items;
          if (rows.filter(a => !a.builtin_persona).map(a => a.id).join(',') !== '14,11,12,13') throw new Error('Catalog/admin order mismatch: ' + path);
        }
        const rows = await Promise.all([14,11,12,13].map(async id => (await (await fetch('/api/persona/' + id)).json())));
        if (rows.map(a => a.display_priority).join(',') !== '0,1,2,3') throw new Error('Drag priorities did not persist in sole detail store');
      })()
  - shot: reordered-admin-reload-readback
  - goto: /app/agents
  - wait: { selector: '.radial-00:has-text("IT Helpdesk")' }
  - eval: |
      const names = [...document.querySelectorAll('[data-testid="AgentsPage/container"] .radial-00')].map(card => ['IT Helpdesk','Training & Onboarding Desk','Guest Ops Copilot','Training Analyst'].find(name => card.textContent.includes(name)));
      if (names.join(',') !== 'IT Helpdesk,Training & Onboarding Desk,Guest Ops Copilot,Training Analyst') throw new Error('Native gallery sections do not honor saved display priorities');
  - shot: reordered-featured-gallery
  # Dirty visibility too, then prove keep preserves all three curation dimensions.
  - goto: /admin/agents
  - wait: { testid: agent-row-actions-12 }
  - hover: { testid: agent-row-actions-12 }
  - click: { selector: '[data-testid="agent-row-actions-12"] button[aria-label="Agent actions"]' }
  - click: { role: menuitem, name: Unlist Agent, exact: true }
  - click: { selector: '[role="dialog"] button:has-text("Unlist")' }
  - wait: { selector: '[data-testid="agent-row-actions-12"] button[aria-label="Re-list Agent"]' }
  - state: { overlays: [demo-mcp-admin] }
  - goto: /app/agents
  - wait: { selector: '.radial-00:has-text("IT Helpdesk")' }
  - wait_gone: { selector: '.radial-00:has-text("Guest Ops Copilot")' }
  - wait: { selector: '.opal-sidebar-tab a[aria-label="Guest Ops Copilot"]' }
  - eval: |
      (async () => {
        const seeds = JSON.parse(sessionStorage.getItem('admin-curation-seeds'));
        const protectedFields = ['name','description','system_prompt','task_prompt','tools','document_sets','starter_messages','owner','owner_group','users','groups','user_shares','group_shares','is_public','public_permission','labels'];
        for (const seed of seeds) {
          const r = await fetch('/api/persona/' + seed.id);
          if (!r.ok) throw new Error('Keep lost agent detail');
          const saved = await r.json();
          const baseline = seed.id === 14 ? JSON.parse(sessionStorage.getItem('admin-curation-editor-saved')) : seed;
          for (const field of protectedFields) if (JSON.stringify(saved[field]) !== JSON.stringify(baseline[field])) throw new Error('Curation changed protected field ' + seed.id + ':' + field);
          if (saved.is_listed !== (seed.id !== 12) || saved.is_featured !== (seed.id !== 13) || saved.display_priority !== ({14:0,11:1,12:2,13:3})[seed.id]) throw new Error('Keep lost curation state');
        }
      })()
  - shot: keep-dirty-feature-visibility-order
  - goto: /admin/agents
  - wait: { testid: agent-row-actions-12 }
  - wait: { selector: 'tr:has([data-testid="agent-row-actions-12"]):has-text("Unlisted")' }
  - shot: keep-unlisted-admin-manageable
  # Existing control plane reset, not a substitute for native product writes.
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const r = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['demo-mcp-admin'],anchor:current.demo_anchor,locale:'en',keep:false,resetChats:true})});
        if (!r.ok) throw new Error('Fresh curation reset failed');
      })()
  - goto: /admin/agents
  - wait: { testid: agent-row-actions-14 }
  - wait_gone: { selector: '[data-testid="agent-row-actions-12"] button[aria-label="Re-list Agent"]' }
  - eval: |
      (async () => {
        const seeds = JSON.parse(sessionStorage.getItem('admin-curation-seeds'));
        for (const seed of seeds) {
          const saved = await (await fetch('/api/persona/' + seed.id)).json();
          if (JSON.stringify(saved) !== JSON.stringify(seed)) throw new Error('Fresh reset did not restore entire seed agent ' + seed.id);
        }
        const me = await (await fetch('/api/me')).json();
        if (JSON.stringify(me.preferences.pinned_assistants) !== sessionStorage.getItem('admin-curation-pins')) throw new Error('Fresh reset did not restore seed pins');
        const ids = [...document.querySelectorAll('tbody [data-testid^="agent-row-actions-"]')].map(e => e.dataset.testid);
        if (ids.join(',') !== 'agent-row-actions-11,agent-row-actions-12,agent-row-actions-13,agent-row-actions-14') throw new Error('Fresh reset left dirty visible admin order');
      })()
  - shot: fresh-reset-admin-seeds
  - goto: /app/agents
  - wait: { selector: '.radial-00:has-text("Guest Ops Copilot")' }
  - eval: |
      const cards = [...document.querySelectorAll('[data-testid="AgentsPage/container"] .radial-00')];
      const names = cards.map(card => ['Training & Onboarding Desk','Guest Ops Copilot','Training Analyst','IT Helpdesk'].find(name => card.textContent.includes(name)));
      if (names.join(',') !== 'Training & Onboarding Desk,Guest Ops Copilot,Training Analyst,IT Helpdesk') throw new Error('Fresh reset left dirty visible gallery order');
      for (const card of cards) {
        const featured = card.closest('.grid')?.parentElement?.textContent.includes('Featured');
        const expected = card.textContent.includes('Training & Onboarding Desk') || card.textContent.includes('Guest Ops Copilot');
        if (Boolean(featured) !== expected) throw new Error('Fresh reset left dirty gallery Featured section');
      }
  - shot: fresh-reset-gallery-seeds
