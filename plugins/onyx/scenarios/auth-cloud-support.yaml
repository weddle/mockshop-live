# #69 required physical Cloud branch from pinned AuthErrorContent.tsx:101-114.
# No real account, email send or identity-provider contact; existing fake anonymous state only.
# Native Cloud production CSP upgrades insecure absolute redirects (proxy.ts:51-64).
# Serve the existing physical Cloud artifact over scoped loopback TLS; callback/JSON/source/CSP stay native.
# Keep the real Google/support/ReturnLogin UI and strict resource errors; no TLS/CSP waiver.
name: auth-cloud-support
title: Native compiled Cloud auth-error support and login recovery
strict: true
requires: enterprise-cloud
locale: en
viewport: [1440, 900]
overlays: [demo-auth-anonymous]
known_errors:
  - match: '/^http 401 GET https?:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/'
    reason: Exact required native logged-out identity; cleared cookie and actual me401 are asserted before the support panel.
  - match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source: https?:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me\]$/'
    reason: Exact logged-out me401 diagnostic; native error/support and login recovery remain required, not generic suppression.
steps:
  - goto: /auth/login
  - eval: |
      (async () => {
        const r = await fetch('/api/mockshop/auth-anonymous/stage', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'logged-out'})});
        if (!r.ok) throw new Error('Local fake logged-out staging failed');
        const me = await fetch('/api/me');
        if (me.status !== 401 || document.cookie.includes('fastapiusersauth=')) throw new Error('Cloud support must start with genuinely cleared fake identity');
      })()
  - click: { role: link, name: Continue with Google, exact: true }
  - wait: { text: 'Access was denied by your identity provider.', exact: true }
  - eval: |
      (() => {
        if (location.protocol !== 'https:' || location.pathname !== '/auth/error' || new URL(location.href).searchParams.get('error') !== 'access_denied') throw new Error('Native fictional OAuth callback did not recover over assigned TLS');
        if (document.cookie.includes('fastapiusersauth=')) throw new Error('Native denied callback must not grant fake identity');
      })()
  - shot: auth-cloud-native-callback-denied
  - goto: /auth/error
  - wait: { text: 'Possible Issues:', exact: true }
  - wait: { role: link, name: 'support@onyx.app', exact: true }
  - eval: |
      (() => {
        const link = document.querySelector('a[href="mailto:support@onyx.app"]');
        if (!link || link.getBoundingClientRect().width === 0 || link.textContent.trim() !== 'support@onyx.app') throw new Error('Physical Cloud native support mailto is missing or hidden');
        if (document.body.innerText.includes('reach out to your system administrator')) throw new Error('Ordinary self-hosted fallback cannot certify Cloud support');
      })()
  - shot: auth-error-cloud-native-support
  - click: { role: link, name: Return to Login Page, exact: true }
  - wait: { testid: email }
  - shot: auth-error-cloud-return-login
