# #33 independent route proof; scoped DEVELOPMENT only, parent acceptance/publication pending.

name: user-extras-reset
title: Native Extras - reset
requires: enterprise
strict: true
locale: en
viewport: [1440, 1000]
overlays: [demo-user-extras]
steps:
  # Independent native setup replay; deliberately no duplicate evidence shots.
  - goto: /app
  - wait: { text: Welcome to Lakeshore Learning, exact: true }
  - click: { label: Consent checkbox }
  - click: { role: button, name: Start, exact: true }
  - wait_gone: { selector: '[role="dialog"]' }
  - goto: /app/agents/edit/11
  - wait: { selector: 'input[name="name"]' }
  - click: { role: button, name: Share, exact: true }
  - wait: { text: Learning Team, exact: true }
  - click: { label: Change sharing scope }
  - click: { text: Anyone in your organization, exact: true }
  - click: { label: Change public permission }
  - click: { selector: '[role="listbox"][aria-label="Change public permission"] [role="option"]:has(:text-is("Edit"))' }
  - click: { selector: '[role="dialog"] >> role=button[name="Save"]' }
  - click: { role: button, name: Share, exact: true }
  - click: { selector: '[role="dialog"] .min-h-11:has(:text-is("Owner")) button', nth: 0 }
  - fill: { placeholder: Add a user or group, value: Clinical }
  - click: { text: Clinical Educators, exact: true }
  - click: { selector: '[role="dialog"] >> role=button[name="Transfer"]' }
  - goto: /app/agents/edit/11
  - fill: { placeholder: Add labels..., value: Inclusive Learning }
  - press: Enter
  - wait: { text: Inclusive Learning, exact: true }
  - click: { role: button, name: Save, exact: true }
  - goto: /app/agents/edit/11
  - wait: { text: Inclusive Learning, exact: true }
  - click: { selector: '.h-30.w-30' }
  - click: { text: Upload Image, exact: true }
  - eval: |
      (async () => {
        const config = await (await fetch('/api/mockshop/user-extras')).json();
        const bytes = Uint8Array.from(atob(config.avatar_png_base64), c=>c.charCodeAt(0));
        const transfer = new DataTransfer(); transfer.items.add(new File([bytes], 'fictional-education-avatar.png', {type:'image/png'}));
        const input = document.querySelector('input[type="file"][accept="image/*"]');
        input.files = transfer.files; input.dispatchEvent(new Event('change', {bubbles:true}));
      })()
  - settle: 700
  - click: { role: button, name: Save, exact: true }
  - goto: /app/agents/edit/11
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        if (!a.uploaded_image_id?.startsWith('mock-user-extras-avatar-')) throw new Error('Native avatar upload marker did not persist');
      })()
  - goto: /app
  - click: { selector: '#onyx-user-dropdown' }
  - click: { text: Notifications, exact: true }
  - wait: { text: Campus Learning Guide shared with your group, exact: true }
  - wait: { text: Clinical Education Guide materials ready, exact: true }
  - click: { selector: '[role="menuitem"] .flex-row:has(> span.text-action-selection-05) button' }
  - settle: 500
  - eval: |
      (async () => {
        const summary = await (await fetch('/api/notifications/summary')).json();
        if (summary.undismissed_count !== 0) throw new Error('Mark All as Read did not persist');
      })()
  - goto: /app/agents/edit/14
  - wait: { selector: 'input[name="name"]' }
  - click: { role: button, name: Delete Agent, exact: true }
  - wait: { selector: '[role="dialog"]' }
  - press: Escape
  - click: { role: button, name: Delete Agent, exact: true }
  - click: { selector: '[role="dialog"] >> role=button[name="Delete Agent"]' }
  - goto: /app/agents
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona')).json();
        if(a.some(a=>a.id===14)) throw new Error('Native delete did not remove the agent');
      })()
  # Lossless primary operations from the former monolithic proof.
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['demo-user-extras'],anchor:current.demo_anchor,locale:'en',keep:false})});
        localStorage.removeItem('allUsersInitialPopupFlowCompleted');
        const me = await (await fetch('/api/me')).json();
        localStorage.removeItem(`onyx:onboardingCompleted:${me.id}`);
      })()
  - goto: /app
  - wait: { text: Welcome to Lakeshore Learning, exact: true }
  - shot: {name: extras-68-fresh-reset-first-visit, full_page: true}
  - click: { label: Consent checkbox }
  - click: { role: button, name: Start, exact: true }
  - goto: /app/agents
  - wait: { text: IT Helpdesk, exact: true }
  - eval: |
      (async () => {
        const a = await (await fetch('/api/persona/11')).json();
        const labels = await (await fetch('/api/persona/labels')).json();
        const summary = await (await fetch('/api/notifications/summary')).json();
        if (a.owner_group || a.is_public || a.group_shares.length !== 1 || a.group_shares[0].permission !== 'EDITOR') throw new Error('Reset did not restore shared-agent seeds');
        if (labels.some(l=>l.name==='Inclusive Learning') || a.uploaded_image_id || summary.undismissed_count!==4) throw new Error('Reset retained label/avatar/notification writes');
      })()
  - shot: {name: extras-69-fresh-reset-agent-notification-seeds, full_page: true}
