# #27: uses the composed #31 settings handlers. All mutations are real native clicks against fake run-local state.
# Expand collapsed provider groups; chat provider headers use text selectors and the selected group can already be open.
# Answer attribution assertions are scoped to answer toolbars, never just the composer label.
name: chat-model-persistence
title: Saved default and independent chat models survive reopen and reset
strict: true
viewport: [1440, 900]
steps:
  - goto: /app/settings/chat-preferences
  - wait: { text: Default Model, exact: true }
  - click: { selector: 'label:has-text("Default Model") input' }
  - click: { role: button, name: OpenAI, exact: true }
  - click: { text: GPT-5 mini, exact: true }
  - settle: 600
  - goto: /app
  - goto: /app/settings/chat-preferences
  - eval: |
      const input = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Default Model'))?.querySelector('input');
      if (input?.value !== 'GPT-5 mini') throw new Error('Saved default did not survive settings revisit; compose #31 before acceptance');
  - shot: saved-default-settings
  - goto: /app
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-5 mini")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'Cedar community workshop: outline a fictional learning session.' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { testid: 'AgentMessage/toolbar', timeout: 30000 }
  - settle: 1800
  - eval: |
      (async () => {
        const id = new URL(location.href).searchParams.get('chatId');
        if (!id) throw new Error('Cedar chat was not created');
        sessionStorage.setItem('model-chat-cedar', id);
        const detail = await (await fetch(`/api/chat/get-chat-session/${id}`)).json();
        const answers = detail.messages.filter(m => m.message_type === 'assistant');
        if (answers.length !== 1 || answers[0].model_display_name !== 'GPT-5 mini' || answers[0].overridden_model !== 'gpt-5-mini') throw new Error('New chat did not honor the saved default');
        const footer = document.querySelector('[data-testid="AgentMessage/regenerate"]');
        if (!footer?.textContent.includes('GPT-5 mini')) throw new Error('Default answer has no intended model attribution');
      })()
  - hover: { testid: 'AgentMessage/regenerate' }
  - shot: cedar-default-answer
  - hover: { testid: ChatButton, has_text: Quick question }
  - click: { selector: '[data-testid="ChatButton"]:has-text("Quick question") button[aria-label="Chat options"]' }
  - click: { role: menuitem, name: Rename }
  - press: Control+A
  - type: { selector: 'input:focus', value: Cedar workshop notes }
  - press: Enter
  - wait: { testid: ChatButton, has_text: Cedar workshop notes }
  - click: { selector: '[data-testid="model-selector"] button:has-text("GPT-5 mini")' }
  - click: { text: Anthropic, exact: true }
  - shot: anthropic-model-popup
  - click: { text: Claude Sonnet 4.5, exact: true }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("Claude Sonnet 4.5")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'Cedar workshop: add one accessible learning activity.' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("Claude Sonnet 4.5")', timeout: 30000 }
  - settle: 1800
  - eval: |
      const footers = [...document.querySelectorAll('[data-testid="AgentMessage/regenerate"]')];
      if (footers.length !== 2 || !footers[0].textContent.includes('GPT-5 mini') || !footers[1].textContent.includes('Claude Sonnet 4.5')) throw new Error('Switch relabeled an earlier Cedar answer');
  - shot: cedar-anthropic-answer
  - goto: /app
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-5 mini")' }
  - click: { selector: '[data-testid="model-selector"] button:has-text("GPT-5 mini")' }
  - shot: openai-model-popup
  - click: { text: GPT-4.1, exact: true }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-4.1")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'Maple community library: suggest a fictional reading circle agenda.' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("GPT-4.1")', timeout: 30000 }
  - settle: 1800
  - eval: |
      const id = new URL(location.href).searchParams.get('chatId');
      if (!id || id === sessionStorage.getItem('model-chat-cedar')) throw new Error('Maple did not create an independent chat');
      sessionStorage.setItem('model-chat-maple', id);
  - hover: { testid: 'AgentMessage/regenerate' }
  - shot: maple-openai-answer
  - hover: { testid: ChatButton, has_text: Quick question }
  - click: { selector: '[data-testid="ChatButton"]:has-text("Quick question") button[aria-label="Chat options"]' }
  - click: { role: menuitem, name: Rename }
  - press: Control+A
  - type: { selector: 'input:focus', value: Maple library notes }
  - press: Enter
  - wait: { testid: ChatButton, has_text: Maple library notes }
  - click: { testid: ChatButton, has_text: Cedar workshop notes }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("Claude Sonnet 4.5")' }
  - eval: location.reload()
  - wait: { selector: '[data-testid="model-selector"] button:has-text("Claude Sonnet 4.5")' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("Claude Sonnet 4.5")' }
  - eval: |
      (async () => {
        const id = sessionStorage.getItem('model-chat-cedar');
        if (new URL(location.href).searchParams.get('chatId') !== id) throw new Error('Cedar sidebar reopened the wrong chat');
        const detail = await (await fetch(`/api/chat/get-chat-session/${id}`)).json();
        const sidebar = await (await fetch('/api/chat/get-user-chat-sessions')).json();
        const expected = 'Anthropic__anthropic__claude-sonnet-4-5__mc:11';
        if (detail.current_alternate_model !== expected || sidebar.sessions.find(s => s.id === id)?.current_alternate_model !== expected) throw new Error('Cedar sidebar/detail model reconstruction failed');
        const names = detail.messages.filter(m => m.message_type === 'assistant').map(m => m.model_display_name);
        if (JSON.stringify(names) !== JSON.stringify(['GPT-5 mini', 'Claude Sonnet 4.5'])) throw new Error('Cedar answer snapshots changed after reload');
      })()
  - shot: cedar-reloaded-independent
  - click: { testid: ChatButton, has_text: Maple library notes }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-4.1")' }
  - eval: location.reload()
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-4.1")' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("GPT-4.1")' }
  - eval: |
      (async () => {
        const id = sessionStorage.getItem('model-chat-maple');
        if (new URL(location.href).searchParams.get('chatId') !== id) throw new Error('Maple sidebar reopened the wrong chat');
        const detail = await (await fetch(`/api/chat/get-chat-session/${id}`)).json();
        if (detail.current_alternate_model !== 'OpenAI__openai__gpt-4.1__mc:3' || detail.messages.filter(m => m.message_type === 'assistant')[0]?.model_display_name !== 'GPT-4.1') throw new Error('Maple inherited Cedar model metadata');
      })()
  - hover: { testid: 'AgentMessage/regenerate' }
  - shot: maple-reloaded-independent
  # Direct link, not a state write or a synthetic click.
  - eval: location.assign(`/app?chatId=${sessionStorage.getItem('model-chat-cedar')}`)
  - wait: { selector: '[data-testid="model-selector"] button:has-text("Claude Sonnet 4.5")' }
  - click: { selector: '[data-testid="model-selector"] button:has-text("Claude Sonnet 4.5")' }
  - click: { text: OpenAI, exact: true }
  - click: { text: GPT-5.2, exact: true }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-5.2")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'Cedar workshop: finish with a short reflection exercise.' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("GPT-5.2")', timeout: 30000 }
  - settle: 1800
  - eval: |
      const footers = [...document.querySelectorAll('[data-testid="AgentMessage/regenerate"]')];
      const expected = ['GPT-5 mini', 'Claude Sonnet 4.5', 'GPT-5.2'];
      if (footers.length !== 3 || !expected.every((name, i) => footers[i].textContent.includes(name))) throw new Error('Cedar switch changed previous answer semantics');
  - shot: cedar-switched-preserves-old-answers
  - eval: location.reload()
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-5.2")' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("Claude Sonnet 4.5")' }
  - eval: |
      (async () => {
        const id = sessionStorage.getItem('model-chat-cedar');
        const detail = await (await fetch(`/api/chat/get-chat-session/${id}`)).json();
        const names = detail.messages.filter(m => m.message_type === 'assistant').map(m => m.model_display_name);
        if (detail.current_alternate_model !== 'OpenAI__openai__gpt-5.2__mc:1' || JSON.stringify(names) !== JSON.stringify(['GPT-5 mini', 'Claude Sonnet 4.5', 'GPT-5.2'])) throw new Error('Switched Cedar model/answer semantics failed on revisit');
      })()
  - shot: cedar-switched-revisited
  # A later settings default affects a new chat, not either existing chat or its answer snapshots.
  - goto: /app/settings/chat-preferences
  - wait: { text: Default Model, exact: true }
  - click: { selector: 'label:has-text("Default Model") input' }
  - click: { role: button, name: Anthropic, exact: true }
  - click: { text: Claude Haiku 4.5, exact: true }
  - settle: 600
  - eval: location.reload()
  - wait: { selector: 'label:has-text("Default Model") input[value="Claude Haiku 4.5"]' }
  - shot: changed-default-settings
  - goto: /app
  - wait: { selector: '[data-testid="model-selector"] button:has-text("Claude Haiku 4.5")' }
  - fill: { selector: '#onyx-chat-input-textbox', value: 'Birch volunteer study circle: outline a fictional introductory activity.' }
  - click: { selector: '#onyx-chat-input-send-button' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("Claude Haiku 4.5")', timeout: 30000 }
  - settle: 1800
  - eval: |
      (async () => {
        const id = new URL(location.href).searchParams.get('chatId');
        if (!id || [sessionStorage.getItem('model-chat-cedar'), sessionStorage.getItem('model-chat-maple')].includes(id)) throw new Error('Changed default did not start a new chat');
        sessionStorage.setItem('model-chat-birch', id);
        const detail = await (await fetch(`/api/chat/get-chat-session/${id}`)).json();
        const answer = detail.messages.filter(m => m.message_type === 'assistant');
        if (detail.current_alternate_model !== 'Anthropic__anthropic__claude-haiku-4-5__mc:12' || answer.length !== 1 || answer[0].model_display_name !== 'Claude Haiku 4.5' || answer[0].overridden_model !== 'claude-haiku-4-5') throw new Error('New chat did not honor the changed default');
      })()
  - hover: { testid: 'AgentMessage/regenerate' }
  - shot: birch-changed-default-answer
  - click: { testid: ChatButton, has_text: Maple library notes }
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-4.1")' }
  - wait: { selector: '[data-testid="AgentMessage/regenerate"]:has-text("GPT-4.1")' }
  - eval: |
      (async () => {
        if (new URL(location.href).searchParams.get('chatId') !== sessionStorage.getItem('model-chat-maple')) throw new Error('Changed default reopened the wrong existing chat');
        const list = await (await fetch('/api/chat/get-user-chat-sessions')).json();
        const cedarId = sessionStorage.getItem('model-chat-cedar'), mapleId = sessionStorage.getItem('model-chat-maple');
        if (list.sessions.find(s => s.id === cedarId)?.current_alternate_model !== 'OpenAI__openai__gpt-5.2__mc:1' || list.sessions.find(s => s.id === mapleId)?.current_alternate_model !== 'OpenAI__openai__gpt-4.1__mc:3') throw new Error('Changed default replaced an existing chat selection');
        const cedar = await (await fetch(`/api/chat/get-chat-session/${cedarId}`)).json();
        if (JSON.stringify(cedar.messages.filter(m => m.message_type === 'assistant').map(m => m.model_display_name)) !== JSON.stringify(['GPT-5 mini', 'Claude Sonnet 4.5', 'GPT-5.2'])) throw new Error('Changed default relabeled old answers');
        const footer = document.querySelector('[data-testid="AgentMessage/regenerate"]');
        if (!footer?.textContent.includes('GPT-4.1')) throw new Error('Changed default relabeled the existing Maple answer');
      })()
  - hover: { testid: 'AgentMessage/regenerate' }
  - shot: maple-after-default-change
  # Same fresh-run reset endpoint the runner uses; no injected settings/model writes.
  - eval: |
      (async () => {
        const response = await fetch('/api/__mockshop/state', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({overlays: [], locale: 'en', resetChats: true, anchor: '2026-10-09T10:00:00-04:00'})});
        if (!response.ok) throw new Error('Fresh-run reset failed');
      })()
  - goto: /app/settings/chat-preferences
  - eval: location.reload()
  - wait: { text: Default Model, exact: true }
  - eval: |
      const input = [...document.querySelectorAll('label')].find(el => el.textContent.includes('Default Model'))?.querySelector('input');
      if (input?.value !== 'Global Default') throw new Error('Fresh reset did not restore null default seed');
  - shot: reset-default-settings
  - goto: /app
  - wait: { selector: '[data-testid="model-selector"] button:has-text("GPT-5.2")' }
  - eval: |
      (async () => {
        const list = await (await fetch('/api/chat/get-user-chat-sessions')).json();
        const ids = ['cedar', 'maple', 'birch'].map(name => sessionStorage.getItem(`model-chat-${name}`));
        if (list.sessions.some(s => ids.includes(s.id)) || document.body.innerText.includes('Cedar workshop notes') || document.body.innerText.includes('Maple library notes')) throw new Error('Fresh reset retained live chats/model selections');
      })()
  - shot: reset-chat-seeds
