# #34 true-Community per-user-route witness. EDITONLY authored; UNEXECUTED/UNACCEPTED.
# Parent owns matching physical CE artifact selection, schema validation and complete strict native/image proof.
# Independent native runner prelude resets unit overlays/clock/locale. Keep uses existing state DSL;
# fresh tails use existing /api/__mockshop/state keep:false plus native full navigation.
# No continue_on_error, fixed-settle-only success, private React, clips or acceptance/closure claim.
# Original route rows20-28: all nine intended native Auth entrypoints.
# Parent must select genuinely compiled CE artifact: paidEE=false, Cloud=false, existingForgot=true.
# Fictional local signup/reset/verification/member consumers only; no real credential/provider/session claim.
# Exact required logged-out /me401 diagnostics only, with positive native UI/status/cookie assertions.
name: community-user-routes-auth
title: True Community local auth forms, required Forgot flag, verification and reset tails
requires: community
strict: true
locale: en
viewport:
- 1440
- 1000
overlays: &id001
- demo-auth-anonymous
- demo-community-user-route-shell
known_errors:
- match: /^http 401 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?$/
  reason: Required source-native logged-out /me; sole fake stage clears cookie and unit positively asserts 401/login
    UI. No unrelated endpoint/status is allowed.
- match: '/^console: Failed to load resource: the server responded with a status of 401 \(Unauthorized\) \[source:
    http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/me(?:\?.*)?\]$/'
  reason: Exact same required logged-out /me diagnostic, paired with positive native logged-out boundary.
- match: /^http 404 GET http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/enterprise-settings$/
  reason: Source settings/hooks.ts70-90 probes branding on auth paths even in compiled CE; 404 is native absent enterprise settings (37-39,116-120), not an outage. Initial native Onyx login shot positively asserts default branding, exact404 DTO and protected Community flags. No other URI/status is allowed.
- match: '/^console: Failed to load resource: the server responded with a status of 404 \(Not Found\) \[source: http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/enterprise-settings\]$/'
  reason: Exact resource diagnostic of the same source-native CE branding absence; paired with the default Onyx login,404 DTO and unchanged Community flags assertion.
steps:
- goto: /auth/login
- eval: '(async()=>{const r=await fetch(''/api/mockshop/auth-anonymous/stage'',{method:''POST'',headers:{''Content-Type'':''application/json''},body:JSON.stringify({"mode":
    "logged-out"})}); if(!r.ok) throw new Error(''Existing sole fake Auth stage failed'');const me=await fetch(''/api/me'');
    if(me.status!==401||document.cookie.includes(''fastapiusersauth='')) throw new Error(''Required fake logged-out
    cookie/401 boundary missing'');})()'
- goto: /auth/login
- wait:
    testid: email
- eval: |
    (async()=>{
      const r=await fetch('/api/settings');
      if(!r.ok) throw new Error('Community settings prerequisite missing');
      const v=await r.json();
      if(v.tier!=='community'||v.ee_features_enabled!==false||v.application_status!=='active') throw new Error('Not a Community fixture/licensing state');
      const branding=await fetch('/api/enterprise-settings');
      if(branding.status!==404||(await branding.json()).detail!=='Not Found'||!document.body.innerText.includes('Welcome to Onyx')) throw new Error('Native CE absent-branding/default Onyx login boundary missing');
      const analytics=await fetch('/api/enterprise-settings/custom-analytics-script');
      if(!analytics.ok||await analytics.json()!==null) throw new Error('Native empty analytics configuration prerequisite missing');
    })()
