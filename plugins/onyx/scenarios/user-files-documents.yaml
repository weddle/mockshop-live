# Issue #28 independent native proof unit; no acceptance claim.
# Fresh runner start resets base fixtures, chats and browser; never chain unit outputs.

# Source/core/artifacts frozen; native file inputs only; no generic error allowances.
name: user-files-documents
title: Native Word/workbook, empty/truncated, legacy and preview errors
strict: true
locale: en
overlays: []
viewport: [1440, 900]
known_errors:
  - match: /api/chat/file/demo-unavailable
    reason: Fixture58 intentionally returns404 only for this named synthetic file to expose the native unavailable-preview screen; other HTTP errors remain strict failures.
  - match: 'Failed to load preview for chat file demo-unavailable:'
    reason: Pinned PreviewModal logs its intentional named unavailable-file error before rendering the required error/download state.
  - match: 'Failed to load resource: the server responded with a status of 404 (Not Found)'
    reason: Chromium console companion of the single deliberate unavailable-preview404; every other HTTP404 is still independently rejected by strict mode.
steps:
  # Independent native format upload seed.
  - goto: /app
  # Independent native format upload seed.
  - wait: { selector: '#onyx-chat-input-textbox' }
  # Independent native format upload seed.
  - click: { selector: '#onyx-chat-input button:has(svg path[d^="M12.0924 3.99814"])' }
  # Independent native format upload seed.
  - click: { text: All Recent Files, exact: true }
  # Independent native format upload seed.
  - wait: { placeholder: Search files... }
  # Independent native format upload seed.
  - click: { role: button, name: Add Files, exact: true }
  # Independent native format upload seed.
  - eval: |
      const input = document.querySelector('input[type="file"]:not([accept])');
      if (!input?.multiple) throw new Error('Native library multiple-file input is missing');
      const transfer = new DataTransfer();
      for (const name of ['learning-handout.docx', 'learning-workbook.xlsx', 'legacy-handout.doc', 'broken-demo.docx', 'unavailable-demo.txt']) transfer.items.add(new File(['Discarded synthetic caller bytes.'], name));
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', {bubbles: true}));
  # Independent native format upload seed.
  - wait: { selector: '[role="dialog"] [role="button"]:has(.opal-attachment-item-button):has-text("unavailable-demo.txt"):has-text("Processing...")' }
