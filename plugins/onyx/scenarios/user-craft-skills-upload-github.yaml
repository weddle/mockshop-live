# #70 independent native proof unit; parent strict/PNG acceptance pending.
# Lossless source-step dispositions and prerequisites: ../USER-CRAFT-PROOF-MAP.md
name: user-craft-skills-upload-github
title: "Craft upload duplicate confirmation and offline GitHub selection/results"
requires: enterprise
strict: true
locale: en
viewport: [1440, 900]
overlays: [edition-enterprise, demo-mcp-admin, demo-user-craft]
known_errors:
  - match: "/^http 400 POST http:\\/\\/127\\.0\\.0\\.1:3370\\/api\\/skills\\/custom\\/editor$/"
    reason: "Native SKILL_NAME_CONFLICT duplicate-create response is required before the positive original confirmation438 and retry440. Exact status, verb, loopback port field and native path/query only; all other HTTP problems, console errors and failed steps remain strict."
  - match: "/^console: Failed to load resource: the server responded with a status of 400 \\(Bad Request\\) \\[source: http:\\/\\/127\\.0\\.0\\.1:3370\\/api\\/skills\\/custom\\/editor\\]$/"
    reason: "Actual 18.3s scoped DEV observed this native console source URL alongside the exact duplicate-create POST400 and positive native duplicate confirmation/retry. Only this unit/status/message/owned-port/path; unlocated or other-source console remains strict."
steps:
  - goto: "/app"
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const overlays = ['edition-enterprise','demo-mcp-admin','demo-user-craft'];
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays,anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft seed reset failed');
        sessionStorage.setItem('craft-initial-overlays', JSON.stringify(overlays));
        for (const key of ['craft-created-session','craft-created-app','craft-created-skill','craft-created-task']) sessionStorage.removeItem(key);
        const me = await (await fetch('/api/me')).json();
        localStorage.setItem('onyx:craftOnboardingSeen:' + me.id, 'true');
      })()
  - goto: /craft/v1/skills
  - click: { role: button, name: Create skill, exact: true }
  - click: { text: Upload a skill, exact: true }
  - shot: craft-skill-upload-modal
  - eval: |
      const input = document.querySelector('[role="dialog"] input[type="file"]');
      if (!input) throw new Error('Native skill bundle input missing');
      const files = new DataTransfer();
      files.items.add(new File(['---\nname: campus-study-plan\ndescription: Fictional teaching bundle\n---\n# Teaching bundle\nOffer quiet reflection time.\n'], 'SKILL.md', {type:'text/markdown'}));
      input.files = files.files; input.dispatchEvent(new Event('change', {bubbles:true}));
  - wait: { role: button, name: Review skill, exact: true }
  - shot: craft-skill-upload-reviewed
  - click: { role: button, name: Review skill, exact: true }
  - wait: { selector: 'input[name="name"]' }
  - shot: craft-skill-imported-draft
  - click: { role: button, name: Save, exact: true }
  - wait: { text: 'Create another “campus-study-plan” skill?', exact: true }
  - shot: craft-skill-create-duplicate-confirmation
  - click: { role: button, name: Create anyway, exact: true }
  - goto: /craft/v1/skills
  - click: { role: button, name: Create skill, exact: true }
  - click: { text: Import from GitHub, exact: true }
  - shot: craft-skill-github-input
  - fill: { selector: '[role="dialog"] input', value: fictional-learning/teaching-skills }
  - click: { role: button, name: Search repository, exact: true }
  - wait: { selector: '[aria-label="Select study-circle"]' }
  - shot: craft-skill-github-selection
  - click: { selector: '[aria-label="Select study-circle"]' }
  - shot: craft-skill-github-partial-selection
  - click: { selector: '[aria-label="Select all importable skills"]' }
  - click: { role: button, name: Import 2 skills, exact: true }
  - wait: { text: GitHub import complete, exact: true }
  - shot: craft-skill-github-results
  - click: { role: button, name: Done, exact: true }
  - eval: |
      (async () => {
        const current = await (await fetch('/api/__mockshop/state')).json();
        const response = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:JSON.parse(sessionStorage.getItem('craft-initial-overlays')),anchor:current.demo_anchor,locale:'en',keep:false})});
        if (!response.ok) throw new Error('Independent Craft dirty-state reset failed');
      })()
  - goto: "/craft/v1/skills"
  - wait: {"text": "campus-study-plan", "exact": true}
  - shot: "craft-unit-skills-upload-github-reset"
