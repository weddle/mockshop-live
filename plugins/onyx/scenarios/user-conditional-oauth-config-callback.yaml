# #34 EDITONLY prepared native unit; no execution/acceptance claim. CE/other locales unverified.
# Fictional LOCAL inputs only. Every run independently resets the same sole Auth owner.
name: user-conditional-oauth-config-callback
title: User Conditional Oauth Config Callback
requires: enterprise
strict: true
locale: en
viewport:
- 1440
- 900
overlays:
- edition-enterprise
- demo-user-conditional
known_errors:
- match: /^http 400 POST http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-config\/callback\?code=mock-only-generic&state=mock-only-conditional-state$/
  reason: Only this exact deliberately seeded native error; unit asserts its visible source-authored outcome and
    unchanged receipt.
- match: '/^console: Failed to load resource: the server responded with a status of 400 \(Bad Request\) \[source:
    http:\/\/(127\.0\.0\.1|localhost):\d+\/api\/oauth-config\/callback\?code=mock-only-generic&state=mock-only-conditional-state\]$/'
  reason: Exact seeded endpoint diagnostic, paired with required native error UI; no unknown request/page/console
    waiver.
- match: '/^console: OAuth callback error: Error: LOCAL FAKE DEMO — fictional callback refused\.\n    at http:\/\/127\.0\.0\.1:3328\/_next\/static\/chunks\/3sce-5n-fcn8g\.js:2:2423 \[source: http:\/\/127\.0\.0\.1:3328\/_next\/static\/chunks\/3sce-5n-fcn8g\.js\]$/'
  reason: Exact independent8f4e6c3 native Error message/newline/stack/source from OAuthCallbackPage.tsx193. Required native refused-callback UI and unchanged callback receipt remain asserted; no other console event is allowed.
steps:
- goto: /app/settings/accounts-access
- eval: "(async () => {\n  const current = await (await fetch('/api/__mockshop/state')).json();\n  const response\
    \ = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['edition-enterprise','demo-user-conditional'],anchor:current.demo_anchor,locale:'en',keep:false})});\n\
    \  if (!response.ok) throw new Error('Conditional independent reset failed');\n  const receipt = await (await\
    \ fetch('/api/mockshop/user-conditional/receipts')).json();\n  if (Object.keys(receipt.callbacks).length ||\
    \ Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered)\
    \ throw new Error('Conditional reset retained dirty receipts');\n  const me = await (await fetch('/api/me')).json();\n\
    \  if (me.email !== 'alex.learner@workshop.example' || !me.password_configured) throw new Error('Sole Auth owner\
    \ did not restore fictional member');\n})()"
- goto: /oauth-config/callback
- wait:
    text: Invalid Request
    exact: true
- shot:
    name: conditional-oauth-config-missing
    delay: 0
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length
    === 0)) throw new Error('Native interaction receipt mismatch'); })()
- click:
    role: button
    name: Back to Chat
    exact: true
- wait:
    selector: '#onyx-chat-input-textbox'
- shot:
    name: conditional-oauth-config-back
    delay: 0
- goto: /oauth-config/callback?error=access_denied&error_description=LOCAL%20FAKE%20DEMO%20cancelled
- wait:
    text: LOCAL FAKE DEMO cancelled
    exact: true
- shot:
    name: conditional-oauth-config-cancelled
    delay: 0
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length
    === 0)) throw new Error('Native interaction receipt mismatch'); })()
- goto: /oauth-config/callback?code=mock-only-generic&state=mock-only-conditional-state
- wait:
    text: LOCAL FAKE DEMO — fictional callback refused.
    exact: true
- shot:
    name: conditional-oauth-config-generic
    delay: 0
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length
    === 0)) throw new Error('Native interaction receipt mismatch'); })()
- goto: /oauth-config/callback?code=mock-only-success&state=mock-only-conditional-state
- wait:
    text: Completing Authorization...
    exact: true
- shot:
    name: conditional-oauth-config-processing
    delay: 0
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(Object.keys(r.callbacks).length
    === 0)) throw new Error('Native interaction receipt mismatch'); })()
- wait:
    text: Authorization Successful!
    exact: true
    timeout: 30000
- shot:
    name: conditional-oauth-config-fictional-receipt
    delay: 0
- wait:
    text: alex.learner@workshop.example
    exact: true
- eval: if (location.pathname !== '/app/settings/accounts-access' || new URL(location.href).searchParams.get('message')
    !== 'oauth_connected') throw new Error('Native callback did not follow LOCAL fixture return');
- eval: (async () => { const r = await (await fetch('/api/mockshop/user-conditional/receipts')).json(); if (!(r.callbacks["oauth-config"]
    === true)) throw new Error('Native interaction receipt mismatch'); })()
- shot:
    name: conditional-oauth-config-local-return
    delay: 0
- eval: "(async () => {\n  const current = await (await fetch('/api/__mockshop/state')).json();\n  const response\
    \ = await fetch('/api/__mockshop/state', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overlays:['edition-enterprise','demo-user-conditional'],anchor:current.demo_anchor,locale:'en',keep:false})});\n\
    \  if (!response.ok) throw new Error('Conditional independent reset failed');\n  const receipt = await (await\
    \ fetch('/api/mockshop/user-conditional/receipts')).json();\n  if (Object.keys(receipt.callbacks).length ||\
    \ Object.keys(receipt.consents).length || receipt.impersonated || receipt.passwordChanged || receipt.retryRecovered)\
    \ throw new Error('Conditional reset retained dirty receipts');\n  const me = await (await fetch('/api/me')).json();\n\
    \  if (me.email !== 'alex.learner@workshop.example' || !me.password_configured) throw new Error('Sole Auth owner\
    \ did not restore fictional member');\n})()"
- goto: /oauth-config/callback
- wait:
    text: Invalid Request
    exact: true
- shot:
    name: conditional-oauth-config-fresh-reset
    delay: 0
