# Name absent + no sessions + no configured providers is the pin's exact first-run gate.
# Provider choices/saves are owned by #3 handlers-save-controls, not #33.
GET /mockshop/user-extras-options:
  enabled: true
  personalization: { name: "" }
  empty_sidebar: true
  notifications: []
  branding: { show_first_visit_notice: false }
GET /chat/get-user-chat-sessions: { sessions: [] }
GET /llm/provider: &emptyProviders
  providers: []
  default_text: null
  default_vision: null
  default_chat_naming: null
  default_craft: null
GET /llm/persona/:id/providers: *emptyProviders
GET /admin/llm/provider: *emptyProviders
GET /admin/llm/built-in/options:
  - { name: openai, known_models: [], recommended_default_model: null }
  - { name: anthropic, known_models: [], recommended_default_model: null }
  - { name: azure, known_models: [], recommended_default_model: null }
  - { name: vertex_ai, known_models: [], recommended_default_model: null }
  - { name: bedrock, known_models: [], recommended_default_model: null }
  - { name: openrouter, known_models: [], recommended_default_model: null }
  - { name: litellm_proxy, known_models: [], recommended_default_model: null }
  - { name: portkey, known_models: [], recommended_default_model: null }
  - { name: vercel_ai_gateway, known_models: [], recommended_default_model: null }
  - { name: nebius_tokenfactory, known_models: [], recommended_default_model: null }
  - { name: bifrost, known_models: [], recommended_default_model: null }
  - { name: ollama_chat, known_models: [], recommended_default_model: null }
  - { name: lm_studio, known_models: [], recommended_default_model: null }
  - { name: openai_compatible, known_models: [], recommended_default_model: null }
