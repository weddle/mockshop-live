# Opt-in stage. Module owns /me401, cookie clearing and in-run fake form transitions.
GET /mockshop/auth-anonymous/staging:
  enabled: true
  mode: logged-out
  requires_verification: true
GET /auth/type:
  auth_type: basic
  multi_tenant: false
  requires_verification: true
  anonymous_user_enabled: true
  password_min_length: 8
  password_max_length: 64
  password_require_uppercase: false
  password_require_lowercase: false
  password_require_digit: false
  password_require_special_char: false
  has_users: true
  oauth_enabled: false
  password_auth_enabled: true
  sso_providers: []
GET /tenants/anonymous-user:
  anonymous_user_enabled: true
  anonymous_user_path: workshop-demo
GET /chat/get-user-chat-sessions:
  sessions: []
  has_more: false
GET /user/projects: []
GET /user/files/recent: []
GET /notifications: []
