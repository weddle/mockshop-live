# #33 editable fake UX data. Opt-in demo-user-extras* overlays enable decoration;
# existing user, agent and provider engines keep sole ownership of writes.
GET /mockshop/user-extras-options: { enabled: false }
GET /mockshop/user-extras:
  # Original neutral two-tone artwork, not a captured vendor logo or uploaded personal image.
  avatar_png_base64: 
  branding:
    application_name: Lakeshore Learning
    use_custom_logo: true
    use_custom_logotype: false
    logo_display_style: logo_and_name
    custom_nav_items: []
    custom_lower_disclaimer_content: Fictional education workspace. Do not enter personal or clinical information.
    custom_header_content: Lakeshore learning resources
    two_lines_for_chat_header: true
    custom_popup_header: Welcome to Lakeshore Learning
    custom_popup_content: "Use this fictional workspace to plan inclusive learning sessions. **All content is editable demo data.**"
    enable_consent_screen: true
    consent_screen_prompt: I understand this is a fictional education workspace.
    show_first_visit_notice: true
    custom_greeting_message: What would you like to learn today?
    custom_login_subtitle: Fictional learning workspace
    custom_help_link_url: /app/agents
    custom_help_link_label: Learning resources
  notifications:
    - id: 3301
      notif_type: system_announcement
      severity: warning
      title: Learning workshop announcement
      description: The fictional inclusive teaching workshop materials are ready.
      dismissed: false
      first_shown: "{{ago:2h}}"
      last_shown: "{{ago:1h}}"
      additional_data: { link: /app/agents }
    - id: 3302
      notif_type: persona_shared
      severity: info
      title: Campus Learning Guide shared with your group
      description: Learning Team can edit this fictional education agent.
      dismissed: false
      first_shown: "{{ago:3h}}"
      last_shown: "{{ago:2h}}"
      additional_data: { persona_id: 11, link: "/app?agentId=11" }
    - id: 3303
      notif_type: assistant_files_ready
      severity: info
      title: Clinical Education Guide materials ready
      description: Fictional training materials contain no patient information.
      dismissed: true
      first_shown: "{{ago:2d}}"
      last_shown: "{{ago:1d}}"
      additional_data: { persona_id: 12, link: "/app?agentId=12" }
    - id: 3304
      notif_type: feature_announcement
      severity: warning
      title: Clinical education workshop reminder
      description: Review the fictional education guide before the workshop.
      dismissed: false
      first_shown: "{{ago:6h}}"
      last_shown: "{{ago:5h}}"
      additional_data: { persona_id: 12, link: "/app?agentId=12" }
    - id: 3305
      notif_type: assistant_files_ready
      severity: info
      title: Learning accessibility checklist updated
      description: Fictional inclusive workshop checklist is ready to review.
      dismissed: false
      first_shown: "{{ago:4h}}"
      last_shown: "{{ago:3h}}"
      additional_data: { persona_id: 11, link: "/app?agentId=11" }
  agent_defaults:
    11:
      name: Campus Learning Guide
      description: Plan inclusive study sessions with the fictional Learning Team.
      system_prompt: Help educators plan inclusive learning sessions using fictional materials.
      starter_messages: [{ name: Plan a study session, description: Help me plan an inclusive study session. }]
      is_public: false
      is_listed: true
      owner_group: null
      users: []
      user_shares: []
      groups: [330]
      group_shares: [{ group_id: 330, group_name: Learning Team, permission: EDITOR }]
      sharing_status: SHARED
      public_permission: VIEWER
    12:
      name: Clinical Education Guide
      description: A fictional healthcare training guide with no patient data.
      system_prompt: Explain fictional clinical education checklists without medical advice or patient data.
      is_public: false
      is_listed: true
      owner: null
      owner_group: { id: 331, name: Clinical Educators }
      users: []
      user_shares: []
      groups: [331]
      group_shares: [{ group_id: 331, group_name: Clinical Educators, permission: VIEWER }]
      sharing_status: SHARED
      public_permission: VIEWER
  daily_stats:
    11:
      - { days_ago: 28, total_messages: 12, total_unique_users: 3 }
      - { days_ago: 21, total_messages: 18, total_unique_users: 5 }
      - { days_ago: 14, total_messages: 24, total_unique_users: 6 }
      - { days_ago: 7, total_messages: 32, total_unique_users: 8 }
      - { days_ago: 1, total_messages: 9, total_unique_users: 2 }
    12: []
