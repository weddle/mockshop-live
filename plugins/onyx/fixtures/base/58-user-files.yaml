# Issue 28: synthetic educational file catalog, never uploaded caller content.
# The metadata endpoint is consumed only by handlers-user-files.mjs.
GET /mockshop/user-files:
  upload_delay_ms: 1800
  processing_delay_ms: 3600
  delete_delay_ms: 1000
  preview_delay_ms: 1200
  rejection_reason: "Offline demo accepts only the fictional filenames listed in fixture 58; no caller bytes are stored."
  answer_title: Workshop file reflection
  answer_intro: "This is a scripted educational demonstration, not an analysis of uploaded bytes. The attached synthetic files suggest:"
  seed_ids: [reading-note, study-guide, activity-diagram, protected-reading, attendance]
  catalog:
    - key: reading-note
      id: uf-demo-reading
      file_id: demo-reading
      name: library-reading.txt
      file_type: text/plain
      chat_file_type: plain_text
      token_count: 42
      chunk_count: 1
      preview: |
        Synthetic demo reading note
        Read a short passage together. Invite each learner to share one question.
        This text is editable fixture content; uploaded bytes are discarded.
      answer: Invite each learner to share one question about a short passage.
    - key: study-guide
      id: uf-demo-guide
      file_id: demo-guide
      name: study-guide.md
      file_type: text/markdown
      chat_file_type: plain_text
      token_count: 48
      chunk_count: 1
      preview: |
        # Synthetic study guide
        - Begin with an accessible warm-up.
        - Work in pairs with written and spoken instructions.
        - Finish with a reflection circle.
      answer: Provide both written and spoken instructions for paired learning.
    - key: activity-diagram
      id: uf-demo-diagram
      file_id: demo-diagram
      name: learning-diagram.svg
      file_type: image/svg+xml
      chat_file_type: image
      token_count: 0
      chunk_count: 0
      preview: '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="#e5f1f8"/><text x="40" y="70" font-size="28" fill="#16354d">Synthetic learning diagram</text><rect x="40" y="120" width="160" height="80" rx="12" fill="#bbdfc9"/><rect x="240" y="120" width="160" height="80" rx="12" fill="#f7df9e"/><rect x="440" y="120" width="160" height="80" rx="12" fill="#d7c5ed"/><text x="65" y="170" font-size="22">Read</text><text x="260" y="170" font-size="22">Discuss</text><text x="460" y="170" font-size="22">Reflect</text><text x="40" y="280" font-size="18">Fictional fixture artwork; never an uploaded image.</text></svg>'
      answer: Use the fictional Read, Discuss, Reflect learning sequence.
    - key: protected-reading
      id: uf-demo-protected
      file_id: demo-protected
      name: protected-reading.txt
      file_type: text/plain
      chat_file_type: plain_text
      token_count: 24
      chunk_count: 1
      assistant_names: [Fictional Reading Circle]
      preview: "Synthetic reading-circle resource. The demo assistant association prevents library deletion."
      answer: Keep the reading-circle resource available to the fictional assistant.
    - key: workshop-notes
      id: uf-demo-workshop
      file_id: demo-workshop
      name: workshop-notes.txt
      file_type: text/plain
      chat_file_type: plain_text
      token_count: 55
      chunk_count: 1
      preview: |
        Synthetic workshop notes
        Begin with a five-minute welcome circle.
        Offer large-print instructions and quiet reflection time.
        End with one question from each learner.
        This preview is fixture text, not uploaded content.
      answer: Begin with a five-minute welcome circle, offer large-print instructions, and end with one question from each learner.
    - key: reflection
      id: uf-demo-reflection
      file_id: demo-reflection
      name: reflection.md
      file_type: text/markdown
      chat_file_type: plain_text
      token_count: 32
      chunk_count: 1
      preview: |
        # Synthetic reflection exercise
        Ask each learner to name one new idea and one next step.
