# #30: fictional education/healthcare corpus; no indexing, model calls or real assets.
# This internal fixture is consumed by handlers-user-search, not a frontend route.
x-search-document: &document
  source: confluence
  score: 0.5
  updated: "{{ago:20d}}"
  owners: [Avery Learning]
  metadata: {}
  tags: [{ tag_key: audience, tag_value: Educators }]
  document_sets: [Learning & Development]
  blurb: Fictional workshop resource for inclusive community learning.
  content: |
    # Community learning resource
    This is an editable fictional workshop document. Plan accessible activities,
    share materials in advance, and offer several ways to participate.

# Actions mounts useToolOAuthStatus for every ToolLineItem, including Internal Search.
# OAuthTokenStatus[] is empty: existing #5 tools have no oauth_config_id and MCP
# server 1 uses NONE auth. This read does not authenticate or create fake tokens.
GET /user-oauth-token/status: []

GET /mockshop/user-search-seed:
  chat_query_match: "learning resources|workshop resources"
  search_delay_ms: 1200
  chat_title: Community learning resources
  auto_search_match: "find|search|locate|documents|resources"
  empty_query_match: "no matching workshop|unlisted workshop"
  error_query_match: "search unavailable"
  error_text: Fictional search is temporarily unavailable. Try another workshop query.
  answer_intro: Here are the fictional learning resources matching the selected sources and filters.
  empty_answer: No fictional learning resources match these filters. Enable a source or clear the filters and try again.
  tags:
    - { tag_key: audience, tag_value: Educators }
    - { tag_key: topic, tag_value: Accessibility }
    - { tag_key: topic, tag_value: Healthcare }
    - { tag_key: status, tag_value: Archived }
  documents:
    - <<: *document
      id: FILE__learning-accessibility-checklist
      title: Accessible workshop checklist.md
      source: file
      score: 0.99
      updated: "{{ago:2h}}"
      tags: [{ tag_key: audience, tag_value: Educators }, { tag_key: topic, tag_value: Accessibility }]
      blurb: Prepare captions, large-print handouts, quiet breaks and accessible workshop seating.
      content: |
        # Accessible workshop checklist
        Prepare captions and large-print handouts before the workshop.
        Offer quiet breaks, accessible seating and an alternative written activity.
        Ask participants which format helps them learn, without collecting health data.
    - <<: *document
      id: LEARNING-WORKSHOP-GUIDE
      title: Community workshop facilitator guide
      score: 0.95
      updated: "{{ago:4d}}"
      tags: [{ tag_key: audience, tag_value: Educators }, { tag_key: topic, tag_value: Accessibility }]
      blurb: Avery Learning outlines inclusive group activities and a clear workshop agenda.
      content: |
        # Community workshop facilitator guide
        Welcome participants, explain the agenda and offer an accessible activity choice.
        Use plain language and reserve time for questions at each station.
    - <<: *document
      id: LEARNING-HEALTH-HANDOUT
      title: Community health learning handout
      source: google_drive
      score: 0.9
      updated: "{{ago:20d}}"
      tags: [{ tag_key: topic, tag_value: Healthcare }]
      document_sets: [Property Operations]
      owners: [Morgan Care]
      blurb: Fictional health-education handout using plain-language examples, not patient information.
      content: |
        # Community health learning handout
        This fictional workshop covers reading a general wellbeing information sheet.
        It contains no patient records and provides no personalized medical advice.
    - <<: *document
      id: LEARNING-TEAM-NOTES
      title: Educator workshop planning notes
      source: slack
      score: 0.85
      updated: "{{ago:200d}}"
      blurb: Fictional educator team agreed to share workshop agendas and check accessible formats.
    - <<: *document
      id: LEARNING-ARCHIVED-HANDBOOK
      title: Archived community learning handbook
      score: 0.8
      updated: "{{ago:500d}}"
      tags: [{ tag_key: status, tag_value: Archived }]
      blurb: Archived fictional handbook retained to demonstrate the time and tag filter empty states.
    - { <<: *document, id: LEARNING-RESOURCE-06, title: Workshop welcome activity }
    - { <<: *document, id: LEARNING-RESOURCE-07, title: Plain-language lesson plan }
    - { <<: *document, id: LEARNING-RESOURCE-08, title: Learning station schedule }
    - { <<: *document, id: LEARNING-RESOURCE-09, title: Community reading circle guide }
    - { <<: *document, id: LEARNING-RESOURCE-10, title: Accessible discussion prompts }
    - { <<: *document, id: LEARNING-RESOURCE-11, title: Workshop reflection sheet }
    - { <<: *document, id: LEARNING-RESOURCE-12, title: Educator preparation guide }
    - { <<: *document, id: LEARNING-RESOURCE-13, title: Inclusive participation notes }
    - { <<: *document, id: LEARNING-RESOURCE-14, title: Workshop feedback questions }
    - { <<: *document, id: LEARNING-RESOURCE-15, title: Community learning agenda }
    - { <<: *document, id: LEARNING-RESOURCE-16, title: Small-group activity outline }
    - { <<: *document, id: LEARNING-RESOURCE-17, title: Handout formatting guide }
    - { <<: *document, id: LEARNING-RESOURCE-18, title: Caption preparation notes }
