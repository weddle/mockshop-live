# #69: editable fictional content only; none of these strings authenticate anywhere.
# Staging is opt-in via demo-auth-anonymous. Existing /me and auth fixtures remain untouched.
GET /mockshop/auth-anonymous/content:
  label: LOCAL FAKE AUTH DEMO — no email sent, no real account or authentication
  email: alex.learner@workshop.example
  join_email: robin.guest@workshop.example
  error_email: staged.failure@workshop.example
  name: Alex Learner (fake demo)
  guest_name: Workshop Visitor (fake demo)
  team: Community Learning (fake demo)
  demo_input: MockOnly-Workshop1!
  verify_token: mock-only-verify-workshop
  reset_token: mock-only-reset-workshop
  anonymous_path: workshop-demo
  # Filename intentionally matches the existing #28 fictional upload catalog; submitted bytes are discarded there.
  upload_name: workshop-notes.txt
  upload_text: LOCAL FAKE DEMO — disposable fictional workshop input; not a real document.
  authorize_delay_ms: 2000
  # Only native /auth/type wire fields; every authorize URL stays on the local fake proxy.
  auth_profiles:
    mixed:
      multi_tenant: false
      password_auth_enabled: true
      sso_providers: &workshopProviders
        - { name: workshop-google, display_name: Workshop Google (fake), provider_type: GOOGLE_OAUTH, authorize_url: /api/mockshop/auth-anonymous/authorize/google }
        - { name: workshop-oidc, display_name: Workshop OIDC (fake), provider_type: OIDC, authorize_url: /api/mockshop/auth-anonymous/authorize/oidc }
        - { name: workshop-saml, display_name: Workshop SAML (fake), provider_type: SAML, authorize_url: /api/mockshop/auth-anonymous/authorize/saml }
    sso-only:
      multi_tenant: false
      password_auth_enabled: false
      sso_providers: *workshopProviders
    auto-sso:
      multi_tenant: false
      password_auth_enabled: false
      sso_providers:
        - { name: workshop-oidc, display_name: Workshop OIDC (fake), provider_type: OIDC, authorize_url: /api/mockshop/auth-anonymous/authorize/oidc }
    first-user:
      multi_tenant: false
      has_users: false
    multitenant:
      multi_tenant: true
      password_auth_enabled: true
      sso_providers: []
  messages:
    login_error: LOCAL FAKE DEMO — staged sign-in failure; no authentication attempted.
    register_error: LOCAL FAKE DEMO — staged account creation failure; no account created.
    email_error: LOCAL FAKE DEMO — staged email-link failure; no email sent.
    verify_error: LOCAL FAKE DEMO — invalid or expired demo verification link.
    reset_error: LOCAL FAKE DEMO — invalid or expired demo reset link.
    password_error: LOCAL FAKE DEMO — use the displayed fictional demo input, not a real password.
    authorize_error: LOCAL FAKE DEMO — staged provider start failure; no IdP contacted.
    discovery_error: LOCAL FAKE DEMO — staged SSO lookup failure; no workspace queried.
    verify_subject: LOCAL FAKE DEMO — verify workshop email (not sent)
    reset_subject: LOCAL FAKE DEMO — reset workshop demo input (not sent)
GET /mockshop/auth-anonymous/staging:
  enabled: false
