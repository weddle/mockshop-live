x-llm-response: &llmResponse
  providers:
    - { id: 1, name: OpenAI, provider: openai, provider_display_name: OpenAI, model_configurations: *modelsOpenai, next_model_configuration_offset: null }
    - { id: 2, name: Anthropic, provider: anthropic, provider_display_name: Anthropic, model_configurations: *modelsAnthropic, next_model_configuration_offset: null }
    - { id: 3, name: "On-prem GPU cluster", provider: ollama_chat, provider_display_name: Ollama, model_configurations: *modelsOllama, next_model_configuration_offset: null }
  default_text: { provider_id: 1, model_name: gpt-5.2 }
  default_vision: { provider_id: 1, model_name: gpt-5.2 }
  default_chat_naming: { provider_id: 1, model_name: gpt-5-mini }
  default_craft: null

GET /llm/provider: *llmResponse
GET /llm/persona/:id/providers: *llmResponse

GET /admin/llm/provider:
  providers:
    - { id: 1, name: OpenAI, provider: openai, api_key: "sk-••••••••••••3f9a", api_base: null, api_version: null, custom_config: null, is_public: true, is_auto_mode: true, groups: [], personas: [], deployment_name: null, model_configurations: *modelsOpenai, next_model_configuration_offset: null }
    - { id: 2, name: Anthropic, provider: anthropic, api_key: "sk-ant-••••••••••••a71c", api_base: null, api_version: null, custom_config: null, is_public: true, is_auto_mode: true, groups: [], personas: [], deployment_name: null, model_configurations: *modelsAnthropic, next_model_configuration_offset: null }
    - { id: 3, name: "On-prem GPU cluster", provider: ollama_chat, api_key: null, api_base: "http://gpu-01.seaside.internal:11434", api_version: null, custom_config: null, is_public: true, is_auto_mode: false, groups: [], personas: [], deployment_name: null, model_configurations: *modelsOllama, next_model_configuration_offset: null }
  default_text: { provider_id: 1, model_name: gpt-5.2 }
  default_vision: { provider_id: 1, model_name: gpt-5.2 }
  default_chat_naming: { provider_id: 1, model_name: gpt-5-mini }
  default_craft: null
GET /admin/llm/custom-provider-names: []
GET /temperature-default: null
GET /reasoning-effort-default: null

# Provider modals pre-populate from the built-in descriptor (ollama has no built-in models).
GET /admin/llm/built-in/options/ollama_chat: { name: ollama_chat, known_models: [], recommended_default_model: null }
GET /admin/llm/built-in/options/openai: { name: openai, known_models: *modelsOpenai, recommended_default_model: { name: gpt-5.2, display_name: GPT-5.2 } }
GET /admin/llm/built-in/options/anthropic: { name: anthropic, known_models: *modelsAnthropic, recommended_default_model: { name: claude-sonnet-4-5, display_name: Claude Sonnet 4.5 } }
# "Fetch models" in the Ollama modal
POST /admin/llm/ollama/available-models:
  - { name: "llama3.3:70b", display_name: "Llama 3.3 70B", max_input_tokens: 128000, supports_image_input: false }
  - { name: "qwen3:32b", display_name: "Qwen3 32B", max_input_tokens: 128000, supports_image_input: false }
