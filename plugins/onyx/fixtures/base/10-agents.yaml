  auth_feedback: "Simulated authentication saved for this run only. No provider, key or external MCP server was used."
  server:
    name: Learning Lab (fake MCP)
    description: "Fictional workshop resources. Authentication and tools are simulated for this run only."
    server_url: "https://learning-lab.example/mcp"
    owner: maya.chen@seasidecollection.example
    transport: STREAMABLE_HTTP
    auth_type: OAUTH
    auth_performer: PER_USER
    oauth_provider_mode: AUTO_DISCOVERY
    auth_template:
      headers: {}
      required_fields: []
    admin_credentials: {}
    user_credentials: {}
    user_can_authenticate: true
    status: CREATED
    is_public: true
    groups: []
    users: []
    available_in_craft: false
    tool_count: 0
    last_refreshed_at: null
    permissions: { edit: true, delete: true, authenticate: true, manage_status: true }
  tools:
    - <<: *toolPmsBlock
      name: get_workshop_resources
      display_name: Workshop resources (fake)
      description: "Simulated read-only workshop resource inventory; no MCP execution."
    - <<: *toolPmsRooming
      name: get_learning_room_status
      display_name: Learning room status (fake)
