GET /persona: [*agentDefault, *agentLearning, *agentOps, *agentRev, *agentIt]
x-full: &full
  search_start_date: null
  user_shares: []
  group_shares: [{ group_id: 1, group_name: Training, permission: VIEWER }]
  public_permission: VIEWER
  sharing_status: SHARED
  admin_count: 1
  ownership_vacant: false
  hierarchy_nodes: []
  attached_documents: []

GET /persona/0: { <<: [*full, *agentDefault] }
GET /persona/11:
  <<: [*full, *agentLearning]
  is_public: false
  public_permission: null
  system_prompt: |
    You are the Training & Onboarding Desk for Seaside Collection. Answer questions about
    staff onboarding, required certifications and training schedules using the onboarding
    paths, training records, recorded sessions and #learning-* Slack.
    Always cite sources, call out overdue training explicitly, and suggest a next step.
GET /persona/12: { <<: [*full, *agentOps] }
GET /persona/13: { <<: [*full, *agentRev] }
GET /persona/14: { <<: [*full, *agentIt] }
GET /persona/labels:
  - *labelTraining
  - *labelOperations
  - *labelTechnology
GET /admin/agents:
  items: [*agentDefault, *agentLearning, *agentOps, *agentRev, *agentIt]
  total_items: 5
# AgentsTable's unpaginated hook reads this flat list; filters/sort/search are client-side.
GET /admin/persona: [*agentDefault, *agentLearning, *agentOps, *agentRev, *agentIt]
GET /tool: [*toolSearch, *toolWeb, *toolImage, *toolPython, *toolPmsBlock, *toolPmsRooming]
GET /user/pinned-assistants: [0, 11, 12]
GET /manage/document-set: [*docsetLearning, *docsetOps]
GET /tool/openapi: []
GET /mcp/servers: { mcp_servers: [*mcpPms] }
GET /mcp/servers/persona/11: { assistant_id: "11", mcp_servers: [*mcpPms] }
# Admin listing is distinct from the reachable-server listing used by the agent editor.
# Snapshots are the same two anchored tools; source=db/mcp is interpreted by handlers-mcp.
GET /admin/mcp/servers: { mcp_servers: [*mcpPms] }
GET /admin/mcp/server/1/tools/snapshots: [*toolPmsBlock, *toolPmsRooming]

# Local creation defaults, not another seeded server. Every created server gets
# this editable educational inventory when the native Connect/Refresh flow runs.
