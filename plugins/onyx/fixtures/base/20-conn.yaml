# v5.0.0-beta.2 index monitoring (indexing status page, connector detail runs card): neutral empty feeds. The status page connector list,
# and a pair's runs, index attempts and stage metrics when the world authors apps.onyx.cc_pairs/index_runs, are derived from the world
# (adapter/connectors.mjs, adapter/index-runs.mjs). handlers-index-monitoring.mjs applies the query parameters and computes throughput
# and the overview from the runs per request.
GET /manage/admin/index-attempt/:id/stage-metrics:
  __status: 404
  __body:
    detail: Index attempt not found
GET /manage/admin/cc-pair/:id/runs:
  items: []
  total_items: 0
  kinds: []
  status_counts: {running: 0, succeeded: 0, failed: 0, canceled: 0}
GET /manage/admin/cc-pair/:id/runs/resolvable-count:
