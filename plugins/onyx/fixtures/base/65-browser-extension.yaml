# #71: editable fictional tab content, never captured browser/account data.
# Only the parent-owned disposable LOCAL extension reads this metadata.
GET /mockshop/browser-extension/seed:
  active_tab: education
  tabs:
    education:
      title: Accessible workshop plan
      url: https://campus.example/learning/accessible-workshop
      content: |
        Cedar Learning Center runs a fictional ninety-minute accessible workshop.
        Start with a ten-minute orientation, use captions and large-print handouts,
        offer a quiet break halfway through, and finish with an anonymous reflection.
        This is synthetic education content, not a captured website or personal record.
    healthcare:
      title: Community health learning session
      url: https://clinic.example/education/community-session
      content: |
        Harbor Community Clinic hosts a fictional public learning session.
        Provide plain-language handouts, optional interpretation, a quiet seating area,
        and a short question period. Do not collect patient details in this exercise.
        This is synthetic healthcare education content, not medical advice or patient data.
  script:
    match: '^extension:'
    title: Fictional browser learning conversation
    chunk_delay_ms: 90
    answer: |
      **{{tab.title}}**

      The selected fictional page is {{tab.url}}.

      {{tab.content}}

      Use a short orientation, accessible materials, a scheduled break, and a reflection. [1]
    disabled_answer: |
      **No tab context was supplied.**

      Read this tab is off, waiting for a genuine extension parent, or this is the new-tab page.
      I can suggest an accessible workshop outline, but I am not claiming to read any browser tab.
    regenerate:
      - |
        Alternative outline without reading a browser tab: welcome, accessible practice, quiet break, reflection.
    error:
      error: Fictional extension answer is temporarily unavailable. Try again.
      stack_trace: 'Mockshop fixture65: deliberate local answer failure; no provider request.'
      error_code: SERVICE_UNAVAILABLE
      is_retryable: true
