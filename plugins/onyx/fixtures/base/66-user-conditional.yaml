# #34 editable fictional native conditional UI content; disabled unless named overlay is active.
# Markers are nonfunctional. Never enter a real password/key/provider authorization code.
GET /mockshop/user-conditional/staging:
  enabled: false
GET /mockshop/user-conditional/content:
  label: LOCAL FAKE CONDITIONAL DEMO — no provider, password or real identity operation
  callback_state: mock-only-conditional-state
  demo_key: MockOnly-Conditional-Key
  # Must remain one of Auth69's editable email/join_email values; Auth69 owns identity/reset.
  impersonate_email: robin.guest@workshop.example
  old_demo_input: MockOnly-Workshop1!
  new_demo_input: MockOnly-Workshop2!
  form_delay_ms: 5000
  messages:
    callback_invalid: LOCAL FAKE DEMO — incomplete fictional callback marker.
    consent_unavailable: LOCAL FAKE DEMO — fictional consent request unavailable.
    consent_failed: LOCAL FAKE DEMO — fictional consent choice could not finish.
    impersonate_failed: LOCAL FAKE DEMO — fictional impersonation rejected; identity unchanged.
    password_failed: LOCAL FAKE DEMO — fictional password change rejected; demo state unchanged.
  callbacks:
    federated:
      receipt: { source: Workshop Archive (fictional receipt), redirect_url: /app/settings/accounts-access }
      cases:
        mock-only-success: { status: 200, delay_ms: 25000 }
        mock-only-validation: { status: 400, body: { detail: 'validation errors: fictional configuration' } }
        mock-only-client-secret: { status: 400, body: { detail: 'client_secret: fictional configuration' } }
        mock-only-oauth: { status: 400, body: { detail: 'oauth: fictional refusal' } }
        mock-only-generic: { status: 400, body: { detail: LOCAL FAKE DEMO — fictional callback refused. } }
    oauth-config:
      receipt: { service_name: Workshop Tools (fictional receipt), redirect_url: /app/settings/accounts-access }
      cases:
        mock-only-success: { status: 200, delay_ms: 25000 }
        mock-only-generic: { status: 400, body: { error: LOCAL FAKE DEMO — fictional callback refused. } }
    mcp/oauth:
      receipt: { success: true, server_id: 3401, server_name: Workshop MCP (fictional receipt), message: LOCAL FAKE DEMO — no tool or token obtained, redirect_url: /app/settings/accounts-access }
      cases:
        mock-only-success: { status: 200, delay_ms: 25000 }
        mock-only-state: { status: 400, body: { detail: 'state: fictional link expired' } }
        mock-only-timeout: { status: 400, body: { detail: 'No tokens found: fictional timeout' } }
        mock-only-exchange: { status: 400, body: { detail: 'token exchange: fictional refusal' } }
        mock-only-server: { status: 400, body: { detail: 'server not configured: fictional server' } }
        mock-only-generic: { status: 400, body: { detail: LOCAL FAKE DEMO — fictional callback refused. } }
  consent:
    # Native consent's POST accepts an absolute LOCAL http URL. Handler uses the actual web port.
    return_path: /app/settings/accounts-access
    info:
      client_name: Workshop Reader (fictional app)
      redirect_origin: LOCAL current web origin
      account_email: alex.learner@workshop.example
      workspace_name: Community Learning (fake demo)
      scopes: [search:read, web:read]
      csrf_token: mock-only-conditional-csrf
    # Each key is a valid source-required43-character request; requests are finite seeded cases.
    requests:
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA: { status: 200, delay_ms: 25000, submit_delay_ms: 5000 }
      BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB: { status: 200, submit_delay_ms: 5000 }
      CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC: { status: 200, submit_failure: true }
      DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD: { status: 401 }
      EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE: { status: 403 }
      FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF: { status: 404 }
      GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG: { status: 503, retry_once: true }
