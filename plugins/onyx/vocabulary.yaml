      - shot: "search-chats-opened"
  - id: make-shared-chat-private
    title: "Share the chat, then switch the dialog back to Private and confirm (v5); a toast reports the chat is private again"
    action: share-saved-chat
    steps:
      - goto: "/app"
      - send: {reply: {use: apps.onyx.replies.planning}, text: '{{apps.onyx.replies.planning.question}}'}
      - click: {selector: '[aria-label="share-chat-button"]'}
      - click: {selector: '[aria-label="share-modal-option-public"]'}
      - click: {selector: '[aria-label="share-modal-submit"]'}
      - wait: {selector: '[aria-label="share-modal-submit"]:has-text("Copy Link")'}
      - click: {selector: '[aria-label="share-modal-option-private"]'}
      - click: {selector: '[aria-label="share-modal-submit"]'}
      - wait: {exact: true, text: Chat is now private}
      - shot: "chat-made-private"
  - id: share-chat-from-recents-menu
    title: "Share a chat from its Recents row menu (v5); the Share dialog creates the Your Organization link"
    action: share-saved-chat
    steps:
      - goto: "/app"
      - wait: {selector: '#onyx-chat-input-textbox'}
      - send: {reply: {use: apps.onyx.replies.planning}, text: '{{apps.onyx.replies.planning.question}}'}
      - hover: {has_text: '{{apps.onyx.replies.planning.title}}', testid: ChatButton}
      - click: {selector: '[data-testid="ChatButton"]:has-text("{{apps.onyx.replies.planning.title}}") button[aria-label="Chat options"]'}
      - click: {exact: true, name: Share, role: menuitem}
      - click: {selector: '[aria-label="share-modal-option-public"]'}
      - click: {selector: '[aria-label="share-modal-submit"]'}
      - wait: {selector: '[aria-label="share-modal-link-input"]'}
      - shot: "share-link-from-recents"
  - id: open-unshared-chat-link
    title: "Open the shared-page URL of a chat that was never shared (v5); the page reports Shared chat not found"
    action: share-saved-chat
    steps:
      - goto: "/app"
      - wait: {selector: '#onyx-chat-input-textbox'}
      - send: {reply: {use: apps.onyx.replies.planning}, text: '{{apps.onyx.replies.planning.question}}'}
      - eval: |
          location.href = '/app/shared/' + new URL(location.href).searchParams.get('chatId');
      - wait: {exact: true, text: Shared chat not found}
      - shot: "shared-chat-not-found"
  - id: search-mode-find-documents
    title: "Switch the composer to Quick search for documents and search (v5, Enterprise-only); the results list the world document by title"
    action: filter-user-search
    steps:
      - goto: "/app"
      - wait: {selector: '#onyx-chat-input-textbox'}
      - click: {exact: true, name: Change app mode, role: button}
      - click: {selector: '[role="option"]:has-text("Quick search for documents")'}
      - wait: {selector: 'button[aria-label="Change app mode"]:has-text("Search")'}
      - type: {selector: '#onyx-chat-input-textbox', value: '{{documents.placeholder_one.title}}'}
      - click: {selector: '#onyx-chat-input-send-button'}
      - wait: {exact: true, text: '{{documents.placeholder_one.title}}'}
      - shot: "search-results"
  - id: open-app-root
    title: "Open the bare origin / (v5); a signed-in viewer lands on chat home at /app"
    action: open-app-root
    steps:
      - goto: "/"
      - wait: {selector: '#onyx-chat-input-textbox'}
      - eval: |
          if (location.pathname !== '/app') throw new Error('/ landed on ' + location.pathname);
      - shot: "root-lands-on-app"
  - id: open-connector-form-direct
    title: "Open a source's Add Connector form directly at /admin/connectors/<source> (v5; Web shown: Base URL, Scrape Method, Create Connector)"
    action: browse-connector-catalog
    steps:
      - goto: "/admin/connectors/web"
      - wait: {exact: true, text: Base URL}
      - wait: {exact: true, text: Connector Display Name}
      - wait: {exact: true, name: Create Connector, role: button}
      - shot: {full_page: true, name: connector-form-direct}
  - id: connector-oauth-callback-guards
    title: "Open the connector OAuth callback and finalize pages without provider parameters (v5); they show their malformed-request guards"
    action: read-connector-oauth-guards
    steps:
      - goto: "/admin/connectors/web/oauth/callback"
      - wait: {exact: true, text: Missing authorization code.}
      - shot: "connector-oauth-callback-guard"
      - goto: "/admin/connectors/web/oauth/finalize"
      - wait: {exact: true, text: Invalid or missing credential id.}
      - shot: "connector-oauth-finalize-guard"
  - id: admin-plugins-list
    title: "Open the admin Plugins page (v5); search box, All/MCP filters and the Add menu (the world has no plugins yet, so the list is empty)"
    action: browse-admin-plugins
    steps:
      - goto: "/admin/plugins"
      - wait: {selector: 'input[placeholder="Search plugins"]'}
      - wait: {exact: true, text: Plugins}
      - click: {exact: true, text: MCP}
      - settle: 600
      - shot: "admin-plugins-list"
  - id: admin-mcp-new-route
    title: "Open /admin/mcp-actions/new (v5); the Plugins page opens with the Add MCP Server dialog (stop before Continue, the connection probe has no mock)"
    action: browse-admin-plugins
    steps:
      - goto: "/admin/mcp-actions/new"
      - wait: {exact: true, text: Add MCP Server}
      - wait: {selector: 'input[placeholder="https://your-mcp-server.com/mcp"]'}
      - shot: "admin-mcp-new-dialog"
  - id: user-plugins-list
    title: "Open your Plugins page from the sidebar (v5 /app/plugins); All/Connected/Needs sign-in filters and Manage workspace plugins (empty until the world has plugins)"
    action: browse-user-plugins
    steps:
      - goto: "/app"
      - click: {selector: 'a[href="/app/plugins"]'}
      - wait: {text: Connect your accounts to use workspace plugins.}
      - click: {exact: true, text: Connected}
      - wait: {exact: true, text: No plugins found}
      - shot: "user-plugins-connected"
  - id: user-plugins-oauth-complete-guard
    title: "Open the plugin OAuth completion page without a provider result (v5); it says Connection not confirmed and Return to plugins goes back to /app/plugins"
    action: browse-user-plugins
    steps:
      - goto: "/app/plugins/oauth/complete"
      - wait: {exact: true, text: Connection not confirmed}
      - shot: "plugin-oauth-not-confirmed"
      - click: {exact: true, text: Return to plugins}
      - wait: {text: Connect your accounts to use workspace plugins.}
      - shot: "plugin-oauth-returned"
  - id: craft-plugins-direct
    title: "Open Craft Plugins directly at /craft/v1/plugins (v5, Enterprise only); close the first-visit Meet Craft tour, then the plugin list with its filters"
    action: browse-craft-plugins
    steps:
      - goto: "/craft/v1/plugins"
      - wait: {exact: true, text: Meet Craft}
      - click: {exact: true, name: Close, role: button}
      - wait_gone: {exact: true, text: Meet Craft}
      - wait: {placeholder: Search plugins}
      - shot: "craft-plugins-direct"
  - id: admin-open-mcp-server
    title: "Open a world MCP server's configuration directly at /admin/plugins/mcp/<id> (v5 dialog over Plugins; Configuration shows its name and description, Tools lists its tools)"
    action: browse-admin-plugins
    steps:
      - goto: "/admin/plugins/mcp/{{mcp_servers.docs.id}}"
      - wait: {role: dialog}
      - wait: {selector: '[role="dialog"] input[value="{{apps.onyx.mcp_servers.docs.name}}"]'}
      - click: {selector: '[role="dialog"] [role="tab"]:has-text("Tools")'}
      - wait: {text: '{{apps.onyx.mcp_servers.docs.tools.0.display_name}}'}
      - shot: "mcp-server-tools"
  - id: admin-open-mcp-server-from-list
    title: "Open a world MCP server from the admin Plugins list by clicking its row (v5); its configuration dialog opens"
    action: browse-admin-plugins
    steps:
      - goto: "/admin/plugins"
      - wait: {exact: true, text: '{{apps.onyx.mcp_servers.docs.name}}'}
      - click: {exact: true, text: '{{apps.onyx.mcp_servers.docs.name}}'}
      - wait: {selector: '[role="dialog"] input[value="{{apps.onyx.mcp_servers.docs.name}}"]'}
      - shot: "mcp-server-from-list"
  - id: admin-mcp-actions-alias
    title: "Open the legacy /admin/mcp-actions/<id> route (v5); it shows the same MCP configuration dialog over Plugins"
    action: browse-admin-plugins
    steps:
      - goto: "/admin/mcp-actions/{{mcp_servers.docs.id}}"
      - wait: {role: dialog}
      - wait: {selector: '[role="dialog"] input[value="{{apps.onyx.mcp_servers.docs.name}}"]'}
      - shot: "mcp-actions-alias"
  - id: admin-open-connector-edit
    title: "Open a world connector's edit form at /admin/connectors/<vendor>/edit/<pair id> (v5; site URL and selected account prefilled; stop before Review changes, whose plan preview has no mock)"
    action: browse-connector-catalog
    steps:
      - goto: "/admin/connectors/{{sources.wiki.vendor}}/edit/{{sources.wiki.id}}"
      - wait: {selector: 'input[value="{{sources.wiki.url}}"]'}
      - wait: {exact: true, name: Review changes, role: button}
      - wait: {exact: true, text: Selected}
      - shot: {full_page: true, name: connector-edit-form}
  - id: admin-open-connector-detail
    title: "Open a world connector's detail page and its Edit Configs button (v5 /admin/connector/<pair id>; status, account, index configuration, then the edit form)"
    action: browse-connector-catalog
    steps:
      - goto: "/admin/connector/{{sources.wiki.id}}"
      - wait: {text: '{{sources.wiki.name}}'}
      - wait: {exact: true, text: Authentication Account}
      - shot: {full_page: true, name: connector-detail}
      - click: {name: Edit Configs, role: button}
      - wait: {selector: 'input[value="{{sources.wiki.url}}"]'}
      - shot: "connector-detail-to-edit"
  - id: admin-indexing-status-list
    title: "Open Connector Indexing Status (v5); every world connector is a row with its status and document count"
    action: browse-connector-catalog
    steps:
      - goto: "/admin/indexing-status"
      - wait: {exact: true, text: Connector Indexing Status}
      - wait: {text: '{{sources.wiki.name}}'}
      - wait: {text: '{{sources.knowledge.name}}'}
      - shot: {full_page: true, name: indexing-status}
