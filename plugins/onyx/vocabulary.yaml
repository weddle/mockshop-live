plugin: onyx
version: 1
summary: >
  The pinned native Onyx UI over authored worlds and local mock state. Actions and moments link to public
  operating guides; no private sample is required. Chat replies are prepared, not real provider output.
  Status describes implementation scope, not a fresh browser pass; edition, reset and unsupported boundaries are documented.
locales: [en, es, pt, fr, de, ja, zh, ko, ar]
default_locale: en

surfaces:
  - id: chat-home
    title: Chat home
    routes: [/app]
    status: works
    description: "Chat input, agent and model picker, sidebar with pinned agents and Recents."
    notes: "The authored answer streams through the native engine and is saved; optional queries/citations are authored, not live reasoning or retrieval. Operating guide: docs/script-chat.md#compose-stream-and-stop."
    group: Chat
  - id: chat-answer
    title: Chat answer with citations
    routes: [/app]
    status: works
    description: "Streamed scripted answer with a \"Thought for Ns\" step, citation chips, a Sources panel and a hover preview on a cited source."
    notes: "The authored answer streams through the native engine and is saved; optional queries/citations are authored, not live reasoning or retrieval. Operating guide: docs/script-chat.md#compose-stream-and-stop."
    group: Chat
  - id: model-answer-variants
    title: "Selected-model answer variants"
    routes: [/app]
    status: works
    description: "Authored per-model reply variants inherit common fields; native regenerate/edit/reopen preserve branch and model attribution."
    notes: "Composer selection, per-chat model and immutable answer attribution remain distinct; edited/regenerated siblings reopen from the saved tree. Operating guide: docs/script-chat.md#composer-models-answer-models-and-branches."
    group: Chat
  - id: cited-source
    title: Opened cited source
    routes: [/app]
    status: works
    description: "File-backed citations use native preview; vendor links point to an authored local viewer. Track the actual page/tab and loaded body rather than inferring success from a click."
    notes: "Cited metadata and authored local body are consumed by native panels/viewers; a click alone does not prove a new tab or completed preview. Operating guide: docs/script-chat.md#sources-citations-and-document-viewers."
    group: Chat
  - id: share-chat
    title: Share a fake chat with Your Organization
    routes: ["/app?chatId=[chatId]"]
    status: works
    description: "Native header and sidebar Share entries, Private and Your Organization drafts, disabled private submit, create/copy link, make private, cancel and reopen."
    notes: "Only submitted sharing flags change the same engine chat; local public links are read-only and revoke/missing/empty states remain native. Operating guide: docs/script-chat.md#share-links-and-privacy."
    group: Chat
  - id: shared-chat
    title: Exact shared fake conversation
    routes: ["/app/shared/[chatId]"]
    status: works
    description: "Native saved/future engine turns, owner/date/model, text-file preview, image thumbnail/zoom/download, CSV controls, citation previews, copy and Start New Session."
    notes: "Only submitted sharing flags change the same engine chat; local public links are read-only and revoke/missing/empty states remain native. Operating guide: docs/script-chat.md#share-links-and-privacy."
    group: Chat
  - id: chat-feedback
    title: Native feedback and copy
    routes: [/app, "/app/shared/[chatId]"]
    status: works
    description: "Live-chat like/dislike text-only modal, optional positive details, required trimmed negative details, cancel/reopen/submit/replace/toggle, rollback, reload/reopen after shared navigation and reset; native live Sources and shared copy controls."
    notes: "Copy uses browser permission; saved vote and modal draft follow documented success, cancel, replacement and failure rules. Operating guide: docs/script-chat.md#copy-and-feedback."
    group: Chat
  - id: user-search
    title: Native document search and mode filters
    routes: [/app, /app/settings/chat-preferences]
    status: works
    edition: enterprise
    group: Chat
    description: "Search and Chat menu, source switches, paginated fictional results, time and tag filters, native preview, empty and failure states."
    notes: "Restricted scripted document list and fallback answer demonstrate authored source availability, not a production ACL evaluation. Operating guide: docs/script-chat.md#search-mode-and-filters."
  - id: agent-gallery
    title: Agent gallery
    routes: [/app/agents]
    status: works
    description: "Opened from More Agents or direct link; native gallery cards offer edit, pin and Start Chat picker selection."
    notes: "Persona fields, starters and ordered pins persist in the local catalog and reopen through native gallery/editor/chat consumers. Operating guide: docs/script-agents-settings.md#agent-gallery-and-editor."
    group: Chat
  - id: agent-editor
    title: Agent editor
    routes: ["/app/agents/edit/[id]"]
    status: partial
    description: "Native editor saves agent name, description, instructions, starters and world-backed configuration in-run."
    notes: "Persona fields, starters and ordered pins persist in the local catalog and reopen through native gallery/editor/chat consumers. Operating guide: docs/script-agents-settings.md#agent-gallery-and-editor."
    edition: enterprise
    group: Agents
  - id: share-agent-users
