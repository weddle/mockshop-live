not_supported:
  - what: Real authentication, accounts, invitations, email and provider authorization
    why: Local auth flags, issued links and unsent mailbox entries drive native forms only; no real credential database, delivery or IdP is contacted.
    surface: auth-login
  - what: Fabricated clipboard permission or all-locale acceptance
    why: Clipboard remains a browser permission boundary. Native locale catalogs do not translate authored content or establish observed coverage in every locale.
    surface: anonymous-entry
  - what: Live extension installation, user-tab capture or trusted-context spoofing
    why: The side panel requires genuine extension-origin parent messages. HTTP postMessage and backend tab staging cannot certify the trust bridge.
    surface: browser-extension-side-panel
  - what: Public internet publishing or durable conversation storage
    why: Sharing changes local engine flags and same-origin views. There is no external publication, durable database or production authorization matrix.
    surface: share-chat
  - what: Feedback reason chips, whole-chat copy or editable shared composer
    why: This pin has a text-only feedback modal and read-only shared chat without ordinary feedback or Sources sidebar controls.
    surface: chat-feedback
  - what: Real provider, billing or security effects
    why: Native configuration writes save fictional metadata. Checkout intentionally yields a native local error; portal receipts do not contact a payment provider.
  - what: Complete server-side agent permission enforcement
    why: Native role/share controls and local persona metadata exist, including curation, but Extras routes do not implement a full production authorization model.
    surface: agent-editor
  - what: Connector workers, ingestion and universal live selector propagation
    why: Local connector saves bind metadata pairs; no indexing worker runs. Some group/document-set connector selectors still use raw seed snapshots rather than new live pairs.
    surface: connector-detail
  - what: A second history engine or persisted production chat database
    why: Shared, project, anonymous and extension chats reuse one local message tree; fresh reset restores authored histories.
    surface: chat-home
  - what: Unscripted model reasoning or live retrieval
    why: Exact turns and legacy authored reply/context/model variants produce finite packets; file and citation text is synthetic authored content.
    surface: chat-answer
  - what: Fixture-enabled compiled Custom Analytics or Cloud Billing
    why: These screens require the matching actual build and server prerequisites. A staged tier or successful API call cannot enable compiled-out UI.
    surface: admin65-enterprise
  - what: Cloud request-to-join UI on a self-hosted build
    why: NEXT_PUBLIC_CLOUD_ENABLED is compiled. Local pending approval metadata does not supply the missing native tab.
    surface: admin-users
  - what: Blanket acceptance from an admin route sweep
    why: Visiting routes does not prove native mutations, cancel behavior, persistence, downloads or current-artifact screenshots; use the feature contract and explicit evidence.
    surface: admin-other
  - what: Group RBAC, real usage metering or spending enforcement
    why: Group permissions/resource selections and token limits are local display records; no request budget engine or reset timer runs.
    surface: admin-groups
  - what: Real MCP discovery, OAuth, credentials or tool execution
    why: Auth returns locally, secrets become fake markers and refresh exposes prepared tools; native configuration is not remote execution.
    surface: admin-mcp-actions
  - what: Automatic translation of world content or generic upload parsing
    why: Names, histories, replies and source bodies retain their authored language. Arbitrary uploaded bytes do not become extracted documents or model knowledge.
snippets:
  - id: ask-authored-question
    title: Ask a world reply's question and wait for its cited answer (v5)
    action: ask-question
    steps:
      - goto: /app
      - wait: { selector: "#onyx-chat-input-textbox" }
      - send:
          text: "{{apps.onyx.replies.planning.question}}"
          reply: { use: apps.onyx.replies.planning }
      - wait: { testid: AgentMessage/toolbar, timeout: 30000 }
      - shot: answer-with-citations
  - id: open-sources-panel
    title: Open the completed answer's native Sources panel and find a cited document (v5 heading is Cited Sources)
    action: ask-question
    steps:
      - click: { role: button, name: Sources, exact: true }
      - wait: { text: Cited Sources, exact: true }
      - wait: { text: "{{documents.placeholder_one.title}}" }
      - settle: 900
      - shot: sources-panel
  - id: open-agent-gallery
    title: Open the agent gallery and find an agent by name (v5)
    action: pick-agent
    steps:
      - click: { testid: AppSidebar/more-agents }
      - wait: { testid: AgentsPage/container }
      - fill: { placeholder: Search agents..., value: "{{agents.helper.name}}" }
      - wait: { selector: '.radial-00:has-text("{{agents.helper.name}}")' }
      - shot: agent-gallery
  - id: chat-with-agent
    title: Start a chat with a world agent (v5); its name heads the empty session
    action: pick-agent
    steps:
      - goto: "/app?agentId={{agents.helper.id}}"
      - wait: { selector: "#onyx-chat-input-textbox" }
      - wait: { text: "{{agents.helper.name}}" }
      - shot: agent-selected
  - id: start-chat-from-gallery-card
    title: Start a chat from an agent's gallery card (v5 card footer Start Chat); lands on chat home with the agent selected
    action: pick-agent
    steps:
      - click: { selector: '.radial-00:has-text("{{agents.helper.name}}") button:has-text("Start Chat")' }
      - wait: { selector: "#onyx-chat-input-textbox" }
      - wait: { text: "{{agents.helper.name}}" }
      - shot: agent-chat-from-card
  - id: switch-configured-model
    title: Choose another configured model in the composer (v5; a one-provider world lists its models flat, with a search box)
    action: switch-model
    steps:
      - click: { selector: '[data-testid="model-selector"] button' }
      - click: { selector: '[role="dialog"] :text-is("{{apps.onyx.llm_providers.primary.models.fast.display_name}}")' }
      - wait: { selector: '[data-testid="model-selector"] button:has-text("{{apps.onyx.llm_providers.primary.models.fast.display_name}}")' }
      - shot: model-selected
  - id: create-project
    title: Create a new project from the sidebar (v5); lands on the project home with Instructions, Files and a project composer
    action: create-project-chat
    steps:
      - goto: /app
      - wait: { selector: "#onyx-chat-input-textbox" }
      - click: { text: New Project, exact: true }
      - wait: { selector: '[role="dialog"] input' }
      - fill: { selector: '[role="dialog"] input', value: "{{vars.new_project.name}}" }
      - click: { selector: '[role="dialog"] button:has-text("Create")' }
      - wait: { text: "{{vars.new_project.name}}", exact: true }
      - shot: { name: project-created, full_page: true }
  - id: set-project-instructions
    title: Set the open project's instructions (v5 Set Instructions dialog); the text shows under Instructions
    action: edit-project-instructions
    steps:
      - click: { text: Set Instructions }
      - wait: { selector: '[role="dialog"] textarea' }
      - fill: { selector: '[role="dialog"] textarea', value: "{{vars.new_project.instructions}}" }
      - click: { selector: '[role="dialog"] button:has-text("Save")' }
      - wait_gone: { role: dialog }
      - wait: { text: "{{vars.new_project.instructions}}" }
  - id: upload-project-file
    title: Upload a world file into the open project (v5; through the project drop zone's hidden input, no OS file dialog)
    action: associate-project-files
    steps:
      - eval: |
          const input = document.querySelector('input[type="file"][tabindex="-1"]');
          if (!input) throw new Error('Project drop zone input missing');
          const transfer = new DataTransfer();
          transfer.items.add(new File([{{vars.upload.planning_notes.text | json}}], {{vars.upload.planning_notes.name | json}}, {type: 'text/plain', lastModified: 0}));
          input.files = transfer.files;
          input.dispatchEvent(new Event('change', {bubbles: true}));
      - wait: { text: "{{vars.upload.planning_notes.name}}", exact: true }
      - shot: { name: project-file-uploaded, full_page: true }
  - id: create-user-agent-from-gallery
    title: Create your own agent from the gallery (v5 New Agent form); opens the new agent's chat with its starter
    action: create-user-agent
    steps:
      - goto: /app/agents
      - wait: { testid: AgentsPage/container }
      - click: { label: AgentsPage/new-agent-button }
      - wait: { selector: 'input[name="name"]' }
      - fill: { selector: 'input[name="name"]', value: "{{vars.new_agent.name}}" }
      - fill: { selector: 'textarea[name="description"]', value: "{{vars.new_agent.description}}" }
      - fill: { selector: 'textarea[name="instructions"]', value: "{{vars.new_agent.instructions}}" }
      - fill: { selector: 'input[name="starter_messages.0"]', value: "{{vars.new_agent.starter}}" }
      - click: { role: button, name: Create, exact: true }
      - wait: { text: "{{vars.new_agent.name}}", exact: true }
      - wait: { text: "{{vars.new_agent.starter}}" }
      - shot: agent-created
  - id: set-default-model
    title: Choose your default chat model in Settings > Chat Preferences (v5 select; it saves at once and survives reload)
    action: edit-user-memories
    steps:
      - goto: /app/settings/chat-preferences
      - wait: { text: Default Model, exact: true }
      - click: { selector: 'label:has-text("Default Model") [data-trigger="button"]' }
      - click: { text: "{{apps.onyx.llm_providers.primary.models.fast.display_name}}", exact: true, last: true }
      - eval: |
          const trigger = [...document.querySelectorAll('label')].find(l => l.textContent.includes('Default Model'))?.querySelector('[data-trigger="button"]');
          const shown = trigger?.innerText.trim() || trigger?.querySelector('input')?.value || '';
          if (!shown.includes({{apps.onyx.llm_providers.primary.models.fast.display_name | json}})) throw new Error('Default Model shows ' + JSON.stringify(shown));
      - shot: default-model-selected
  - id: set-personal-preferences
    title: Write your personal preferences and flip Chat Auto-scroll (world setting apps.onyx.settings.auto_scroll) in Chat Preferences (v5; text saves on blur)
    action: edit-user-memories
    steps:
      - goto: /app/settings/chat-preferences
      - wait: { text: Personal Preferences, exact: true }
      - click: { selector: 'label:has-text("Chat Auto-scroll") [role="switch"]' }
      - fill: { placeholder: Describe how you want the system to behave and the tone it should use., value: "{{vars.personal.instructions}}" }
      - press: Tab
      - settle: 1500
      - goto: /app/settings/chat-preferences
      - wait: { text: "{{vars.personal.instructions}}" }
      - shot: { name: personal-preferences-saved, full_page: true }
