plugin: onyx
version: 1
summary: >
  The Onyx web UI (chat, agents, model picker, admin pages) built from a pinned upstream commit, running against fixture
  and scripted responses for a fictional company, Seaside Collection. Chat answers are scripted and matched by regex;
  admin demo edits are run-local, and unsupported real integrations or build-gated screens are identified per surface.
locales: [en, es, pt, fr, de, ja, zh, ko, ar]
default_locale: en

surfaces:
  - id: chat-home
    title: Chat home
    routes: [/app]
    status: works
    description: Chat input, agent and model picker, sidebar with pinned agents and Recents (six fixture sessions).
    notes: On Community the chat header has no Search/Chat mode dropdown. Auto has no native selectable option at this pin in either edition.
    group: Chat
  - id: chat-answer
    title: Chat answer with citations
    routes: [/app]
    status: works
    description: Streamed scripted answer with a "Thought for Ns" step, citation chips, a Sources panel and a hover preview on a cited source.
    notes: Regex/layer matching chooses the base script; branch history supplies context, and optional canonical-model overrides select response fields before context expansion. Cited sources open locally through the existing source viewer.
    group: Chat
  - id: model-answer-variants
    title: Selected-model workshop answers
    routes: [/app]
    status: works
    description: Editable canonical model_variants select distinct planning and facilitation answers while omitted response fields inherit common defaults.
    notes: GPT-5.2 and GPT-4.1 same-prompt scenarios cover regenerate, edit, reopen, reload and source previews, with an unmapped-model fallback and reset. Fixture content is English; other locale rendering is not guaranteed.
    group: Chat
  - id: cited-source
    title: Opened cited source
    routes: [/app]
    status: works
    description: Clicking a citation chip or a Sources panel entry opens the document. File sources open in Onyx's own preview modal; link sources open a local viewer page (title, source, owners, blurb and text) in a new tab.
    notes: The viewer is a mock page at /api/mockshop/source/<document id>, not an Onyx screen. Document text comes from fixtures/<layer>/sources/<id>.md; without it the viewer shows the blurb only.
    group: Chat
  - id: share-chat
    title: Share a fake chat with Your Organization
    routes: ["/app?chatId=61616161-0000-4000-8000-000000000001"]
    status: works
    description: Native header and sidebar Share entries, Private and Your Organization drafts, disabled private submit, create/copy link, make private, cancel and reopen.
    notes: Simple in-run sharing flags and reset only; no real public publishing or production authorization.
    group: Chat
  - id: shared-chat
    title: Exact shared fake conversation
    routes: ["/app/shared/[chatId]", /app/shared/61616161-0000-4000-8000-000000000001, /app/shared/61616161-0000-4000-8000-000000000002, /app/shared/61616161-0000-4000-8000-000000000099]
    status: works
    description: Native saved/future engine turns, owner/date/model, text-file preview, image thumbnail/zoom/download, CSV controls, citation previews, copy and Start New Session.
    notes: Saved conversations, file previews and missing/revoked/empty states use fictional local data. Shared feedback icons and sidebar controls are not wired at the pinned frontend; use live-chat feedback.
    group: Chat
  - id: chat-feedback
    title: Native feedback and copy
    routes: [/app, "/app/shared/[chatId]"]
    status: works
    description: Live-chat like/dislike text-only modal, optional positive details, required trimmed negative details, cancel/reopen/submit/replace/toggle, rollback, reload/reopen after shared navigation and reset; native live Sources and shared copy controls.
    notes: Browser clipboard denial can show the native alert without modifying the conversation. No reason picker or whole-chat-copy control is added; locale and edition coverage is limited.
    group: Chat
  - id: user-search
    title: Native document search and mode filters
    routes: [/app, /app/settings/chat-preferences]
    status: works
    edition: enterprise
    group: Chat
    description: Search and Chat menu, source switches, paginated fictional results, time and tag filters, native preview, empty and failure states.
    notes: "Fictional results, filters, previews, errors, citations and saved default modes use the existing frontend. Auto selection and a separate search/history route are absent at the pin. No real retrieval or authentication engine."
  - id: agent-gallery
    title: Agent gallery
    routes: [/app/agents]
    status: works
    description: Opened from More Agents or direct link; native gallery cards offer edit, pin and Start Chat picker selection.
    notes: Seeded and run-created cards, ordered pins, reload and picker selection use fictional content. Additional controls retain their own limits.
    group: Chat
