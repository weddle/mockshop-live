not_supported:
  - what: Real authentication, signup, reset, invitations, email, OAuth and providers
    why: Auth leaf is LOCAL fake frontend staging only; no real credentials account email provider access or durable session engine. Native provider discovery and referral controls are declared through source-authored metadata; compile-time Cloud support remains a separate required artifact.
    surface: auth-login
  - what: Browser clipboard-denial and additional auth locales
    why: Native controls are retained; clipboard permission denial is not fabricated by backend mocks. All nine catalogs stay declared, only English scoped proof is planned and unverified.
    surface: anonymous-entry
  - what: Live browser extension installation, user-tab capture and trusted context spoofing
    why: Only fictional LOCAL metadata and native pinned routes are staged. Real extension-origin parent proof uses one disposable parent-owned fixture/profile with localhost-only permissions; direct HTTP cannot certify tab URL callbacks.
    surface: browser-extension-side-panel
  - what: Real shared-chat publishing, permissions, database, durable storage and model backend
    why: Editable fictional content and minimal run-local share/feedback flags over the existing engine; no public internet publishing, account writes, permission matrix or second engine.
    surface: share-chat
  - what: Predefined feedback reason picker, whole-chat-copy control and editable shared composer
    why: Native Feedback has one textarea, chat menu no whole-chat-copy, shared composer disabled with Start New Session. Shared display has no feedback/sidebar; use native live-chat controls, original0003 excluded.
    surface: chat-feedback
  - what: Production provider, billing, authentication, account or security-state changes
    why: Supported native demo writes persist only within the run using fictional metadata; provider execution, real keys/login/accounts, durable DB, spend enforcement and production effects are excluded.
  - what: Additional admin agent curation
    why: Feature/list/unlist/re-list/drag reorder remains open58 beyond accepted64 list/labels reads. Native user upload/labels/sharing/delete/analytics belong accepted33's94 inspected PNGs, not an unimplemented surface or additional admin curation.
    surface: agent-editor
  - what: Real connector/provider integrations beyond accepted native demo saves
    why: Actual scoped3 owns fictional provider/connector writes and current catalogs; accepted63 owns document-set writes/reset20 inspected PNGs. No real integration, provider execution, live credentials or durable backend; the new composed root remains unverified.
  - what: Real remote historic-chat backend or durable conversation storage
    why: Editable fixture histories, Sharing61 saved/future turns and run-created sessions replay through the sole existing engine; no production history service or durable database is added.
    surface: chat-home
  - what: Unscripted provider reasoning or real context-aware model execution
    why: Answers use existing regex/context/after and file/script joins on the sole engine, not a live model or understanding backend.
    surface: chat-answer
  - what: Transfer of accepted compiled Custom Analytics and Cloud Billing proof to the new Craft70 root
    why: Main65 source9/12 strict Analytics32 operations/nine inspected PNGs and genuine Cloud Billing180 operations/48 inspected PNGs retain accepted leaf proof. New70 requires matching parent artifact/input reconciliation and fresh imports before independent strict/every-PNG acceptance; no compiled-out/hidden/crashed-state/API-only certification or public-menu flag.
    surface: admin65-enterprise
  - what: Cloud-only request-to-join interface on the self-hosted pin
    why: NEXT_PUBLIC_CLOUD_ENABLED is a compile-time gate. Published Users59 admin-users-cloud passed genuine Cloud strict proof with EVERY7 PNG inspected; the native request-to-join interface remains compiled out on self-hosted builds. No invented tab, conditional no-op or fixture gate bypass; new70 requires matching parent artifact/fresh imports for its own proof.
    surface: admin-users
  - what: Other admin pages (users, analytics, bots, SSO)
    why: Remain assigned to corresponding coverage leaves; accepted Users59, Groups60 and mapped65 native proof certifies neither unowned frontend/auth inventory nor the newly joined Craft70 runtime.
    surface: admin-other
  - what: Real group authorization, RBAC or token-limit enforcement
    why: Groups uses run-local display records, selected resource rows and permission strings only; no external accounts, durable storage or authorization engine.
    surface: admin-groups
  - what: Real MCP discovery, OAuth authorization, keys and execution
    why: Creation and authentication configuration are simulated in-run; OAuth returns locally, secret values become fictional placeholders, refresh reuses editable fixture tools and reset restores seeds. No provider/account requests or durable storage. MCP locale rendering is unverified.
    surface: admin-mcp-actions
  - what: Translated fake data
    why: Agent names, chat history and scripted answers stay English in every locale.

snippets:
  - id: ask-new-hire-training-question
    title: Ask the scripted new-hire training question
    action: ask-question
    steps:
      - goto: /app
      - click: { selector: "#onyx-chat-input-textbox" }
      - type: { selector: "#onyx-chat-input-textbox", value: "What training do new front desk hires need in their first 30 days, and who is behind on it?" }
      - click: { selector: "#onyx-chat-input-send-button" }
      - wait: { testid: onyx-ai-message, timeout: 30000 }
      - settle: 1500
      - shot: answer-with-citations
  - id: open-sources-panel
    title: Open the Sources panel
    action: ask-question
    steps:
      - click: { role: button, name: Sources }
      - settle: 800
      - shot: sources-panel
  - id: switch-to-onprem-model
    title: Pick the on-prem Llama model
    action: switch-model
    steps:
      - click: { role: button, name: GPT-5.2 }
      - click: { text: On-prem GPU cluster }
      - click: { text: Llama 3.3 70B }
      - shot: model-switched
  - id: open-connector-detail
    title: Search indexing status and open a connector
    action: inspect-index-attempts
    steps:
      - goto: /admin/indexing-status
      - type: { placeholder: Search connectors..., value: Confluence }
      - settle: 800
      - click: { text: Expand All }
      - click: { text: "Confluence – OPS space" }
      - wait: { text: Connector Configuration }
      - shot: connector-detail
  - id: open-educational-project
    title: Open a seeded educational project
    action: manage-educational-projects
    steps:
      - goto: /app?projectId=1
      - wait: { text: Set Instructions, exact: true }
      - shot: { name: project-direct-loaded, full_page: true }
