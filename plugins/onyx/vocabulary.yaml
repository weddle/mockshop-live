      - eval: |
          if (document.querySelector('input[placeholder="Your name"]').value !== {{vars.personal.name | json}}) throw new Error('Full Name did not persist');
          if (!document.documentElement.classList.contains('dark')) throw new Error('Dark theme did not persist');
          const trigger = [...document.querySelectorAll('label')].find(l => l.textContent.includes('Color Mode'))?.querySelector('[data-trigger="button"]');
