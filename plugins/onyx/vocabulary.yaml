    status: partial
    description: "Navigation index for additional admin controls; each feature guide specifies exact operations and unsupported boundaries, not blanket route-sweep acceptance."
    group: Admin
    notes: "Shallow user-route readiness inventory only; does not exercise full form, persistence or permissions behavior. Operating guide: docs/script-admin.md#routes-aliases-and-locator-context."
