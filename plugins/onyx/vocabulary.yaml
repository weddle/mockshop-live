    action: save-user-preferences
    steps:
      - goto: /app/settings/general
      - fill: { placeholder: Your name, value: "{{vars.personal.name}}" }
      - press: Enter
      - click: { selector: 'label:has-text("Color Mode") [data-trigger="button"]' }
