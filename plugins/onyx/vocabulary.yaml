    action: share-saved-chat
    steps:
      - goto: "/app"
      - wait: {selector: '#onyx-chat-input-textbox'}
      - send: {reply: {use: apps.onyx.replies.planning}, text: '{{apps.onyx.replies.planning.question}}'}
      - click: {selector: '[aria-label="share-chat-button"]'}
      - click: {selector: '[aria-label="share-modal-option-public"]'}
      - click: {selector: '[aria-label="share-modal-submit"]'}
      - eval: |
          (async () => {
            const until = Date.now() + 15000;
            let input;
            while (!(input = document.querySelector('[aria-label="share-modal-link-input"]')) && Date.now() < until) await new Promise((r) => setTimeout(r, 200));
            if (!input) throw new Error('Share link never appeared');
            location.href = new URL(input.value).pathname;
          })()
      - wait: {text: '{{apps.onyx.replies.planning.question}}'}
      - wait: {exact: true, text: Start New Session}
      - shot: "shared-chat-page"
