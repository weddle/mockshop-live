entities:
  - id: company
    title: "Company and viewer"
    description: "Shared world company and people establish branding, canonical identity and viewer role; no particular organization is required."
    examples: ["{{company.name}}", "{{people.reviewer.name}}"]
    surfaces: [chat-home]
  - id: agent
    title: "Agent"
    description: "World-authored assistant metadata projected into gallery, editor, pins and chat selection."
    examples: ["Assistant", "{{teams.support.name}}"]
