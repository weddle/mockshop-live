    title: Document sets
    routes: ["/admin/documents/sets", "/admin/documents/sets/new", "/admin/documents/sets/[id]"]
    status: works
    description: "Editable fictional document sets with named connector picker, selection/removal, native create/edit/save and immediate delete."
    notes: "List/read/edit/delete native set entry; later form unit supplies complete validation/public/private association contract. Operating guide: docs/script-admin.md#document-sets."
    group: Admin
  - id: admin-mcp-actions
    title: MCP Actions
    routes: [/admin/mcp-actions]
    status: works
    description: "Native prepared MCP servers/tools, Add Server, Manage and finite auth/configuration dialogs; no remote discovery or execution."
    notes: "Server/tool/config metadata projects into native catalogs; refresh/auth are finite local receipts, not discovery or execution. Operating guide: docs/script-admin.md#mcp-and-openapi-actions."
    group: Admin
  - id: admin-users
    title: Users & Requests
    routes: [/admin/users]
    status: works
    description: "Native combined accepted, inactive and invited table with counts, search, filters, pagination, invite and status-aware row dialogs."
    notes: "Accepted/invited/pending and Craft override metadata change through their real local owners; no email, password or account provisioning occurs. The row menu's Groups & Roles entry and the Groups column are Enterprise-only (a Community build has no user groups). Operating guide: docs/script-admin.md#users-invitations-roles-and-craft-access."
    group: Admin
  - id: admin-groups
    title: Groups
    routes: [/admin/groups, /admin/groups/create, "/admin/groups/{id}", /admin/groups2, /admin/groups2/create, "/admin/groups2/{id}", /ee/admin/groups, /ee/admin/groups/create, "/ee/admin/groups/{id}"]
    status: works
    description: "Native editable fictional groups, members, permission display, shared connectors/document sets/agents, token-limit rows, incognito and delete confirmations."
    notes: "Local membership/resource/permission/limit rows persist with documented fixture-join boundaries; no authorization or budget enforcement. Enterprise-only: user groups do not exist on a Community build, so a demo using this screen (or Users > Groups & Roles) needs `requires: enterprise`. Operating guide: docs/script-admin.md#groups-memberships-resources-and-limits."
    edition: enterprise
    group: Admin
