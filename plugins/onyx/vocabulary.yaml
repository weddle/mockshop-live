plugin: onyx
version: 1
summary: >
  The pinned native Onyx UI over authored worlds and local mock state. Actions and moments link to public
  operating guides; no private sample is required. Chat replies are prepared, not real provider output.
  Status describes implementation scope, not a fresh browser pass; edition, reset and unsupported boundaries are documented.
locales: [en, es, pt, fr, de, ja, zh, ko, ar]
default_locale: en

surfaces:
  - id: chat-home
    title: Chat home
    routes: [/app]
    status: works
    description: "Chat input, agent and model picker, sidebar with pinned agents and Recents."
    notes: "The authored answer streams through the native engine and is saved; optional queries/citations are authored, not live reasoning or retrieval. Operating guide: docs/script-chat.md#compose-stream-and-stop."
    group: Chat
  - id: chat-answer
    title: Chat answer with citations
    routes: [/app]
    status: works
    description: "Streamed scripted answer with a \"Thought for Ns\" step, citation chips, a Sources panel and a hover preview on a cited source."
    notes: "The authored answer streams through the native engine and is saved; optional queries/citations are authored, not live reasoning or retrieval. Operating guide: docs/script-chat.md#compose-stream-and-stop."
    group: Chat
  - id: model-answer-variants
    title: "Selected-model answer variants"
    routes: [/app]
    status: works
    description: "Authored per-model reply variants inherit common fields; native regenerate/edit/reopen preserve branch and model attribution."
    notes: "Composer selection, per-chat model and immutable answer attribution remain distinct; edited/regenerated siblings reopen from the saved tree. Operating guide: docs/script-chat.md#composer-models-answer-models-and-branches."
    group: Chat
  - id: cited-source
    title: Opened cited source
    routes: [/app]
    status: works
    description: "File-backed citations use native preview; vendor links point to an authored local viewer. Track the actual page/tab and loaded body rather than inferring success from a click."
    notes: "Cited metadata and authored local body are consumed by native panels/viewers; a click alone does not prove a new tab or completed preview. Operating guide: docs/script-chat.md#sources-citations-and-document-viewers."
    group: Chat
  - id: share-chat
    title: Share a fake chat with Your Organization
    routes: ["/app?chatId=[chatId]"]
    status: works
    description: "Native header and sidebar Share entries, Private and Your Organization drafts, disabled private submit, create/copy link, make private, cancel and reopen."
    notes: "Only submitted sharing flags change the same engine chat; local public links are read-only and revoke/missing/empty states remain native. Operating guide: docs/script-chat.md#share-links-and-privacy."
    group: Chat
  - id: shared-chat
    title: Exact shared fake conversation
    routes: ["/app/shared/[chatId]"]
    status: works
    description: "Native saved/future engine turns, owner/date/model, text-file preview, image thumbnail/zoom/download, CSV controls, citation previews, copy and Start New Session."
    notes: "Only submitted sharing flags change the same engine chat; local public links are read-only and revoke/missing/empty states remain native. Operating guide: docs/script-chat.md#share-links-and-privacy."
    group: Chat
  - id: chat-feedback
    title: Native feedback and copy
    routes: [/app, "/app/shared/[chatId]"]
    status: works
    description: "Live-chat like/dislike text-only modal, optional positive details, required trimmed negative details, cancel/reopen/submit/replace/toggle, rollback, reload/reopen after shared navigation and reset; native live Sources and shared copy controls."
    notes: "Copy uses browser permission; saved vote and modal draft follow documented success, cancel, replacement and failure rules. Operating guide: docs/script-chat.md#copy-and-feedback."
    group: Chat
  - id: user-search
    title: Native document search and mode filters
    routes: [/app, /app/settings/chat-preferences]
    status: works
    edition: enterprise
    group: Chat
    description: "Search and Chat menu, source switches, paginated fictional results, time and tag filters, native preview, empty and failure states."
    notes: "Restricted scripted document list and fallback answer demonstrate authored source availability, not a production ACL evaluation. Operating guide: docs/script-chat.md#search-mode-and-filters."
  - id: agent-gallery
    title: Agent gallery
    routes: [/app/agents]
    status: works
    description: "Opened from More Agents or direct link; native gallery cards offer edit, pin and Start Chat picker selection."
    notes: "Persona fields, starters and ordered pins persist in the local catalog and reopen through native gallery/editor/chat consumers. Operating guide: docs/script-agents-settings.md#agent-gallery-and-editor."
    group: Chat
  - id: agent-editor
    title: Agent editor
    routes: ["/app/agents/edit/[id]"]
    status: partial
    description: "Native editor saves agent name, description, instructions, starters and world-backed configuration in-run."
    notes: "Persona fields, starters and ordered pins persist in the local catalog and reopen through native gallery/editor/chat consumers. Operating guide: docs/script-agents-settings.md#agent-gallery-and-editor."
    edition: enterprise
    group: Agents
  - id: share-agent-users
    title: Share Agent fictional user picker
    routes: ["/app/agents/edit/[id]"]
    status: works
    description: "Native Share modal email suggestions, case-insensitive search, staged user chip selection/removal and close/reopen."
    notes: "Committed shares/owner/deletion update persona access metadata; cancel preserves prior state, without claiming full production authorization. Operating guide: docs/script-agents-settings.md#agent-sharing-ownership-and-deletion."
    group: Agents
  - id: agent-create
    title: Create a user agent
    routes: [/app/agents/create]
    status: works
    description: "Native New Agent form creates an owned assistant in-run and opens its chat."
    notes: "Persona fields, starters and ordered pins persist in the local catalog and reopen through native gallery/editor/chat consumers. Operating guide: docs/script-agents-settings.md#agent-gallery-and-editor."
    group: Agents
  - id: browser-extension-new-tab
    title: Native extension new tab
    routes: [/nrf]
    status: partial
    description: "Native sidebar, welcome/composer/models/actions/files/chat and Settings with theme, six backgrounds and new-tab confirmation; existing owners supply history/search/sharing/personalization."
    notes: "Native extension surface uses shared chat/preferences and browser-local new-tab state; no live extension is installed. Operating guide: docs/script-auth-extension.md#new-tab-extension-surface."
    group: Chat
  - id: browser-extension-side-panel
    title: Native extension side panel
    routes: [/nrf/side-panel]
    status: partial
    description: "Native compact header, New chat and Open in Onyx, shared composer/answer/file/error controls, and Read this tab off/waiting/hostname/disable/reset states."
    notes: "Only genuine extension-origin parent messages pass trust checks; staged backend context is not bridge proof. Operating guide: docs/script-auth-extension.md#side-panel-trust-turns-and-reset."
    group: Chat
  - id: user-first-run
    title: First-run and name-only onboarding
    routes: [/app]
    status: works
    description: "Native admin Welcome/name/provider choices/Complete/Finish Setup plus the member name-save/edit/confirmation branch."
    notes: "Fourteen distinct provider form shapes during native onboarding; opening forms is not configuring/testing each provider. Operating guide: docs/script-agents-settings.md#onboarding-empty-states-and-branding."
    edition: enterprise
    group: Chat
  - id: user-empty-extras
    title: Empty home, sidebar, gallery and notifications
    routes: [/app, /app/agents]
    status: works
    description: "Opt-in empty seeds render native home/sidebar/gallery/notifications and admin/member NoAgentModal branches with native settings/catalog links; loaded tabs, search and Created By/Actions filters respond locally. Settings writes remain existing owner65."
    notes: "Fourteen distinct provider form shapes during native onboarding; opening forms is not configuring/testing each provider. Operating guide: docs/script-agents-settings.md#onboarding-empty-states-and-branding."
    group: Chat
  - id: user-notifications-branding
    title: Native notifications and Enterprise branding
    routes: [/app]
    status: works
    description: "Native profile Notifications new/older/pinned/empty states, individual and all read actions, open target; warning banner previous/next/View/dismiss; organization name/logo/header/greeting/disclaimer/help and required first-visit consent."
    notes: "Unread/pinned groups, row mark-read/open/dismiss, mark-all and rotating warning banner; SWR header count can remain stale until reload. Operating guide: docs/script-agents-settings.md#notifications-and-banners."
    edition: enterprise
    group: Chat
  - id: user-agent-extras
    title: Group-shared agents, sharing, labels, avatar and deletion
    routes: ["/app/agents", "/app/agents/edit/[id]", "/app?agentId=[id]"]
    status: works
    description: "Native gallery/viewer/picker and sharing access indicators; user/group editor or viewer shares, public scope/permission, save/cancel/copy/transfer/self-remove; labels, icon/default or fake image, delete confirmation."
    notes: "Committed shares/owner/deletion update persona access metadata; cancel preserves prior state, without claiming full production authorization. Operating guide: docs/script-agents-settings.md#agent-sharing-ownership-and-deletion."
    edition: enterprise
    group: Agents
  - id: user-agent-analytics
    title: Agent analytics and native date controls
    routes: ["/ee/agents/stats/[id]"]
    status: works
    description: "Gallery stats entry/direct route/Back, agent profile, summaries and two-series chart; native 1D/7D/1M/3M/custom calendar filters and empty/populated results."
    notes: "Saved labels/avatar and finite analytics rows feed native catalog/editor/date-range views; uploads and metrics remain synthetic. Operating guide: docs/script-agents-settings.md#agent-labels-avatars-and-analytics."
    edition: enterprise
    group: Agents
  - id: admin-language-models
    title: Language Models
    routes: [/admin/language-models]
    status: works
    description: "Configured provider/model catalogs and native provider-specific add/edit, test, visibility, capability and default controls."
    notes: "Saved provider IDs/models/defaults project into native catalogs; Test is local validation and credentials are fake markers. Operating guide: docs/script-admin.md#provider-setup-and-existing-provider-edits."
    group: Admin
  - id: admin-connectors
    title: Connector catalog
    routes: [/admin/connectors]
    status: works
    description: "Connector catalog grouped by category; native source forms create configuration and bind a credential into an indexing pair."
    notes: "Native connector, credential and binding writes create a local pair and indexing row; fixture-only selector joins and absence of workers remain explicit. Operating guide: docs/script-admin.md#connector-creation-credentials-and-binding."
    group: Admin
  - id: indexing-status
    title: Existing connectors (indexing status)
    routes: [/admin/indexing-status]
    status: works
    description: "Connectors grouped by source with status, search box and Expand All; permission-synced rows show Public / Permission Syncing columns on the enterprise edition."
    notes: "v5: one row per world connector (e.g. {{sources.wiki.name}}, {{sources.knowledge.name}}) with status and document count; the monitoring overview/activity panels render from base shapes. Snippet admin-indexing-status-list (verified both worlds, CE and EE). Native detail/sync/error panels show the staged source-specific records; a static receipt is not indexing or permission-sync execution. Operating guide: docs/script-admin.md#indexing-details-and-permission-sync."
    group: Admin
  - id: connector-detail
    title: Connector detail
    routes: ["/admin/connector/[id]"]
    status: partial
    description: "Pair-specific configuration, fake credential summary and Advanced indexing/document/group sync histories, including populated errors and traces."
    notes: "Native detail/sync/error panels show the staged source-specific records; a static receipt is not indexing or permission-sync execution. Operating guide: docs/script-admin.md#indexing-details-and-permission-sync."
    group: Admin
