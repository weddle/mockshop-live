    examples: ["{{content.question}}", "{{content.answer}}"]
    surfaces: [chat-answer]
  - id: personal-setting
    title: "Personal setting"
    description: "Viewer profile/preferences/memory rows and fake token metadata with documented browser versus backend lifetimes."
